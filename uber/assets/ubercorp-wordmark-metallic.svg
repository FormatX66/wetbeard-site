<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 260" role="img" aria-label="Übercorp metallic wordmark">
  <defs>
    <linearGradient id="metalA" x1="0" y1="0" x2="840" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#98a2af"/>
      <stop offset="12%" stop-color="#f7f9fb"/>
      <stop offset="26%" stop-color="#c6d0da"/>
      <stop offset="38%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#bde7ff"/>
      <stop offset="61%" stop-color="#efe3ff"/>
      <stop offset="74%" stop-color="#f8fbff"/>
      <stop offset="88%" stop-color="#a6afbc"/>
      <stop offset="100%" stop-color="#e9eef5"/>
    </linearGradient>
    <linearGradient id="metalB" x1="0" y1="130" x2="840" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity=".62"/>
      <stop offset="34%" stop-color="#c9f0ff" stop-opacity=".45"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity=".8"/>
      <stop offset="68%" stop-color="#eadcff" stop-opacity=".38"/>
      <stop offset="84%" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="outerGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.84 0 0 0 0 0.93 0 0 0 0 1 0 0 0 .50 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="specular" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="5" specularConstant="1.1" specularExponent="22" lighting-color="#ffffff" result="specOut">
        <fePointLight x="160" y="-20" z="180"/>
      </feSpecularLighting>
      <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut2"/>
      <feBlend in="SourceGraphic" in2="specOut2" mode="screen"/>
    </filter>
    <mask id="markMask">
      <image href="data:image/png;base64," x="0" y="0" width="840" height="260"/>
    </mask>
  </defs>
  <g mask="url(#markMask)">
    <rect width="840" height="260" fill="url(#metalA)" filter="url(#outerGlow)"/>
    <rect width="840" height="260" fill="url(#metalB)" opacity=".92" filter="url(#specular)"/>
    <ellipse cx="420" cy="126" rx="330" ry="90" fill="#ffffff" opacity=".08"/>
    <rect x="0" y="0" width="840" height="18" fill="#ffffff" opacity=".16"/>
    <rect x="0" y="190" width="840" height="32" fill="#0f1217" opacity=".15"/>
  </g>
</svg>