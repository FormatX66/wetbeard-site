name: Publish Aurum Generation Seed Ladder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-generation-seed-ladder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-generation-seed-ladder-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify ClusterSites canonical source, projection, and approved blob
        id: source
        shell: bash
        run: |
          set -euo pipefail
          canonical_commit='7136e05efb3a1ab30a5e7e0ca3ab1d641f136fd5'
          projection_commit='a8c27801577de21a53fc48728d1802c01e3030d8'
          projection_main_commit='dd0ffe9186d6dd856f4ba4f67525d1195bf6b556'
          expected_blob='7113e67d70061db6db76f8605e4c62a7887b0e4a'
          projection_ci_run='33639450931'
          hopper_snapshot_commit='fc6634d537f55625d20223f2912877e92decc6a3'
          hopper_semantics_commit='304e653883c12657f21ba44398c6d0a9aa5c40d5'
          hopper_semantics_snapshot_commit='4ac20ff95617698f3a893f01b5d28a6d728562a1'

          canonical="$RUNNER_TEMP/generation-seed-ladder-clustersites.js"
          projection="$RUNNER_TEMP/generation-seed-ladder-projection.js"
          projection_main="$RUNNER_TEMP/generation-seed-ladder-projection-main.js"
          api_boxbrain='https://api.github.com/repos/FormatX66/BoxBrain'
          api_cluster='https://api.github.com/repos/FormatX66/ClusterSites'

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/ClusterSites/$canonical_commit/services/aurum-arkmatx/generation-seed-ladder-v1.js" -o "$canonical"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_main_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection_main"
          test -s "$canonical"; test -s "$projection"; test -s "$projection_main"
          node --check "$canonical"
          node --check "$projection"
          cmp -s "$canonical" "$projection"
          cmp -s "$canonical" "$projection_main"
          blob="$(git hash-object "$canonical")"
          test "$blob" = "$expected_blob"

          for token in \
            'AURUM_GENERATION_SEED_LADDER_V1_CANONICAL' \
            'AURUM_GENERATION_SEED_LADDER_V1_18_CANONICAL' \
            "canonicalWebsiteRepo:'FormatX66/ClusterSites'" \
            "componentRevision:'1.18'" \
            "ACTIVE_TRUNK_COMMIT='a0780429b8a1a0372b76d1c19fe98096e5de8a30'" \
            'currentHeadFourTargetConvergencePassed:true' \
            'currentHeadRuntimePublicationPerformed:false' \
            'currentExactHeadAutobuildPassed:false' \
            "currentExactHeadBlocker:'gui-live-trial-route-contract-test-failure'" \
            "latestKnownNativeExternalEvidenceReason:'gui-live-trial-evidence-expired'" \
            'hopperStatusFreshAtInspection:true' \
            "hopperStatusRunnerHost:'LAPTOP-EBD8CG8P'" \
            'hopperStatusRunnerExecutionRecovered:true' \
            'hopperStatusEndpointCandidateFound:false' \
            "hopperStatusCurrentBlocker:'no-valid-endpoint-candidate'" \
            'hopperStatusFreshRunnerEvidenceAvailable:true' \
            'hopperStatusFreshMachineEvidenceAvailable:false' \
            'hopperStatusPowerStateInferred:false' \
            'hopperStatusNetworkStateInferred:false' \
            'hopperStatusRuntimeStateInferred:false' \
            'hopperStatusRunnerAssignmentBlockerClosed:true' \
            'humanActionInferred:false' \
            "needsWorkOwner:'aurum-system'" \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:'; do
            grep -Fq "$token" "$canonical"
          done

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "$api_boxbrain/actions/runs/$projection_ci_run" -o "$RUNNER_TEMP/projection-ci.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "$api_cluster/commits/$canonical_commit/check-runs" -H 'Accept: application/vnd.github+json' -o "$RUNNER_TEMP/canonical-checks.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$hopper_snapshot_commit/Web/Aurum-Arkmatx/hopper-status.json" -o "$RUNNER_TEMP/hopper-canonical.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$hopper_semantics_snapshot_commit/Web/Aurum-Arkmatx/hopper-status.json" -o "$RUNNER_TEMP/hopper-semantics.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "$api_boxbrain/commits/$hopper_semantics_commit" -o "$RUNNER_TEMP/hopper-semantics-commit.json"

          python3 - "$RUNNER_TEMP/projection-ci.json" "$RUNNER_TEMP/canonical-checks.json" "$RUNNER_TEMP/hopper-canonical.json" "$RUNNER_TEMP/hopper-semantics.json" "$RUNNER_TEMP/hopper-semantics-commit.json" "$projection_commit" "$canonical_commit" <<'PY'
          import json,sys
          ci,checks,hopper,corrected,semantics_commit=[json.load(open(p,encoding='utf-8')) for p in sys.argv[1:6]]
          projection,canonical=sys.argv[6:8]
          assert ci.get('id')==33639450931
          assert ci.get('name')=='BoxBrain CI'
          assert ci.get('head_sha')==projection
          assert ci.get('status')=='completed' and ci.get('conclusion')=='success'
          runs=checks.get('check_runs',[])
          assert len(runs)>=3
          assert all(r.get('head_sha')==canonical for r in runs)
          assert all(r.get('status')=='completed' and r.get('conclusion')=='success' for r in runs)
          assert any(r.get('name')=='Validate canonical Aurum Command Center' for r in runs)
          assert hopper.get('schema')=='aurum.hopper.live-status.v2'
          assert hopper.get('observed_at')=='2026-09-02T13:06:32Z'
          assert hopper.get('runner_host')=='LAPTOP-EBD8CG8P'
          assert hopper.get('endpoint') is None and hopper.get('source_kind') is None
          assert hopper.get('reachable') is False and hopper.get('report') is None
          assert corrected.get('schema')=='aurum.hopper.live-status.v2'
          assert corrected.get('observed_at')=='2026-09-02T14:01:25Z'
          assert corrected.get('runner_host')=='LAPTOP-EBD8CG8P'
          assert corrected.get('endpoint') is None and corrected.get('source_kind') is None
          assert corrected.get('reachable') is False and corrected.get('report') is None
          assert (corrected.get('summary') or {}).get('health')=='no-endpoint-candidate'
          msg=((semantics_commit.get('commit') or {}).get('message') or '')
          assert msg.startswith('Clarify Hopper no-endpoint evidence semantics')
          print('GENERATION_LADDER_V118_SOURCE_AND_EVIDENCE_OK')
          PY

          echo "file=$canonical" >> "$GITHUB_OUTPUT"
          echo "blob=$blob" >> "$GITHUB_OUTPUT"
          echo "canonical_commit=$canonical_commit" >> "$GITHUB_OUTPUT"
          echo "projection_commit=$projection_commit" >> "$GITHUB_OUTPUT"
          echo "projection_main_commit=$projection_main_commit" >> "$GITHUB_OUTPUT"
          echo "projection_ci_run=$projection_ci_run" >> "$GITHUB_OUTPUT"
          echo 'CLUSTERSITES_CANONICAL_PROJECTION_V118_OK'

      - name: Configure Bluehost SSH with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Back up current Command Center
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() { local out="$1"; shift; local n=1 tmp; tmp="$(mktemp)"; while true; do if "$@" > "$tmp"; then mv "$tmp" "$out"; return 0; fi; [ "$n" -ge 5 ] && { rm -f "$tmp"; return 1; }; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/generation-seed-ladder.js' ]; then cp -p '$remote/generation-seed-ladder.js' '$backup/generation-seed-ladder.js'; else touch '$backup/.missing-generation-seed-ladder.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject expandable generation ladder component
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./generation-seed-ladder\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          tag='<script src="./generation-seed-ladder.js?v=118"></script>'
          for pattern in (r'<script src="\./seed-lifecycle\.js(?:\?v=[^"]+)?"></script>',r'<script src="\./recovery-guardian\.js(?:\?v=[^"]+)?"></script>',r'</body>'):
              m=re.search(pattern,text)
              if m:
                  text=text[:m.start()]+tag+'\n'+text[m.start():]
                  break
          else:
              raise SystemExit('dashboard missing generation ladder injection point')
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './generation-seed-ladder.js?v=118' "$RUNNER_TEMP/index.html"

      - name: Publish with bounded retries
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 "$RUNNER_TEMP/index.html" "${{ steps.source.outputs.file }}" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mv '$remote/generation-seed-ladder-clustersites.js' '$remote/generation-seed-ladder.js'; chmod 644 '$remote/index.html' '$remote/generation-seed-ladder.js'"

      - name: Verify live Command Center
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/live-index.html"; js="$RUNNER_TEMP/live-generation-seed-ladder.js"
          final_url="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/generation-seed-ladder.js?rev=118' -o "$js"
          grep -Fq './generation-seed-ladder.js?v=118' "$page"
          cmp -s "${{ steps.source.outputs.file }}" "$js"
          for token in \
            "componentRevision:'1.18'" \
            'currentHeadFourTargetConvergencePassed:true' \
            'currentHeadRuntimePublicationPerformed:false' \
            "currentExactHeadBlocker:'gui-live-trial-route-contract-test-failure'" \
            'hopperStatusFreshAtInspection:true' \
            'hopperStatusRunnerExecutionRecovered:true' \
            'hopperStatusEndpointCandidateFound:false' \
            "hopperStatusCurrentBlocker:'no-valid-endpoint-candidate'" \
            'hopperStatusFreshRunnerEvidenceAvailable:true' \
            'hopperStatusFreshMachineEvidenceAvailable:false' \
            'hopperStatusPowerStateInferred:false' \
            'hopperStatusNetworkStateInferred:false' \
            'hopperStatusRuntimeStateInferred:false' \
            'hopperStatusRunnerAssignmentBlockerClosed:true' \
            'humanActionInferred:false' \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:'; do grep -Fq "$token" "$js"; done
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back on verification failure
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/generation-seed-ladder.js' ]; then cp -p '$backup/generation-seed-ladder.js' '$remote/generation-seed-ladder.js'; elif [ -f '$backup/.missing-generation-seed-ladder.js' ]; then rm -f '$remote/generation-seed-ladder.js'; fi"

      - name: Record verified live receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-generation-seed-ladder-live.json <<EOF_RECEIPT
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/generation-seed-ladder-v1.js",
            "canonical_component_commit": "${{ steps.source.outputs.canonical_commit }}",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx/generation-seed-ladder-v1.js",
            "deployment_carrier": "FormatX66/wetbeard-site",
            "component_revision": "1.18",
            "approved_blob": "${{ steps.source.outputs.blob }}",
            "boxbrain_projection_commit": "${{ steps.source.outputs.projection_commit }}",
            "boxbrain_projection_main_commit": "${{ steps.source.outputs.projection_main_commit }}",
            "boxbrain_ci_run": ${{ steps.source.outputs.projection_ci_run }},
            "boxbrain_ci_proven": true,
            "cluster_canonical_checks_proven": true,
            "active_trunk_commit": "a0780429b8a1a0372b76d1c19fe98096e5de8a30",
            "current_virtual_lab_run": 33418433996,
            "current_head_four_target_virtual_convergence": true,
            "current_runtime_publication_performed": false,
            "current_autobuild_run": 33400052429,
            "current_exact_head_autobuild_passed": false,
            "current_exact_head_blocker": "gui-live-trial-route-contract-test-failure",
            "current_native_completed_generations": 65,
            "current_native_external_evidence_reason": "gui-live-trial-evidence-expired",
            "current_consumer_required_route": "10.12.194.1",
            "retained_gui_live_trial_evidence_route": "192.168.0.194",
            "physical_prerequisite_watch_run": 33544610687,
            "physical_prerequisite_watch_confirms_presence_not_blocker": true,
            "hopper_status_snapshot_commit": "fc6634d537f55625d20223f2912877e92decc6a3",
            "hopper_status_observed_at": "2026-09-02T13:06:32Z",
            "hopper_status_runner_host": "LAPTOP-EBD8CG8P",
            "hopper_status_runner_execution_recovered": true,
            "hopper_status_endpoint": null,
            "hopper_status_source_kind": null,
            "hopper_status_endpoint_candidate_found": false,
            "hopper_status_reachable": false,
            "hopper_status_current_blocker": "no-valid-endpoint-candidate",
            "hopper_status_fresh_runner_evidence_available": true,
            "hopper_status_fresh_machine_evidence_available": false,
            "hopper_status_power_state_inferred": false,
            "hopper_status_network_state_inferred": false,
            "hopper_status_runtime_state_inferred": false,
            "hopper_status_runner_assignment_blocker_closed": true,
            "hopper_status_semantics_fix_commit": "304e653883c12657f21ba44398c6d0a9aa5c40d5",
            "hopper_status_semantics_proof_snapshot_commit": "4ac20ff95617698f3a893f01b5d28a6d728562a1",
            "hopper_status_semantics_proof_health": "no-endpoint-candidate",
            "human_action_inference": false,
            "major_box_added": false,
            "seed_lifecycle_remains_expandable": true,
            "frontiers_advancing_visible": true,
            "needs_work_system_owned": true,
            "needs_work_owner": "aurum-system",
            "backup_before_publish": true,
            "rollback_on_verification_failure": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF_RECEIPT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-generation-seed-ladder-live.json
          git commit -m 'Record Aurum generation seed ladder v1.18 live [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
