name: Publish Aurum Pi3 Watchdog Intake

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-pi3-watchdog-intake.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Validate Aurum Pi3 Watchdog Intake
    types: [completed]

permissions:
  contents: write

concurrency:
  group: aurum-pi3-watchdog-intake-production
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Fetch approved projection of canonical ClusterSites watchdog-intake layer
        id: source
        shell: bash
        run: |
          set -euo pipefail
          src='https://raw.githubusercontent.com/FormatX66/BoxBrain/44212aacac54a25a44a5210684c3b58ab0ce65b2/Web/Aurum-Arkmatx/pi3-watchdog-intake-v1.js'
          out="$RUNNER_TEMP/pi3-watchdog-intake-v1.js"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 "$src" -o "$out"
          test -s "$out"
          node --check "$out"
          require_marker(){ grep -Fq "$1" "$out" || { echo "Missing approved watchdog-intake marker: $1" >&2; exit 1; }; }
          require_marker 'AURUM_PI3_WATCHDOG_INTAKE_V1_0_CANONICAL'
          require_marker 'Canonical website owner: FormatX66/ClusterSites.'
          require_marker "schema:'aurum-command-center-pi3-watchdog-intake-v1.0'"
          require_marker "const SOURCE_COMMIT='9b23d84197d4659d7e2de582de86dfe5535c7c02';"
          require_marker 'physical_watchdog_receipt.py'
          require_marker 'pi3-oob-watchdog-physical.json'
          require_marker 'physicalReceiptValidated:false'
          require_marker 'physicalProofInferred:false'
          require_marker 'mutationAuthorityGranted:false'
          require_marker 'promotionAuthorityGranted:false'
          require_marker 'writeAuthority:false'
          require_marker "needsWorkOwner:'aurum-system'"
          require_marker 'humanActionInference:false'
          require_marker 'Fail-closed physical-watchdog receipt intake is implemented'
          require_marker 'fresh explicit kernel-mutation authority remains a separate gate'
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Configure existing Bluehost SSH carrier with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null && exit 0
            [ "$attempt" -eq 5 ] && { echo 'Bluehost SSH keyscan unavailable after bounded attempts' >&2; exit 1; }
            sleep $((attempt * 5))
          done

      - name: Back up and fetch current command center
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture(){ local out="$1"; shift; local n=1 tmp; tmp="$(mktemp)"; while true; do "$@" > "$tmp" && { mv "$tmp" "$out"; return 0; }; [ "$n" -ge 5 ] && { rm -f "$tmp"; return 1; }; sleep $((n*5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/pi3-watchdog-intake-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/pi3-watchdog-intake-v1.js' ]; then cp -p '$remote/pi3-watchdog-intake-v1.js' '$backup/pi3-watchdog-intake-v1.js'; else touch '$backup/.missing-pi3-watchdog-intake-v1.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          grep -Fq 'Progress is proof, not activity.' "$RUNNER_TEMP/index.html"
          grep -Fq './pi3-physical-evidence.js' "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject watchdog intake inside existing Pi3 surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./pi3-watchdog-intake-v1\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          if '</body>' not in text: raise SystemExit('dashboard missing body close')
          p.write_text(text.replace('</body>','<script src="./pi3-watchdog-intake-v1.js?v=1"></script>\n</body>',1),encoding='utf-8')
          PY
          grep -Fq './pi3-physical-evidence.js' "$RUNNER_TEMP/index.html"
          grep -Fq './pi3-watchdog-intake-v1.js?v=1' "$RUNNER_TEMP/index.html"

      - name: Publish with bounded connection count
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry(){ local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n*5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; stage="$RUNNER_TEMP/pi3-watchdog-intake-publish"; mkdir -p "$stage"
          cp "$RUNNER_TEMP/index.html" "$stage/index.html"; cp "${{ steps.source.outputs.file }}" "$stage/pi3-watchdog-intake-v1.js"
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 "$stage/index.html" "$stage/pi3-watchdog-intake-v1.js" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" "chmod 644 '$remote/index.html' '$remote/pi3-watchdog-intake-v1.js'"

      - name: Verify live watchdog-intake layer
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"; component="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/pi3-watchdog-intake-v1.js?rev=1' -o "$component"
          grep -Fq 'Progress is proof, not activity.' "$page"
          grep -Fq './pi3-physical-evidence.js' "$page"
          grep -Fq './pi3-watchdog-intake-v1.js?v=1' "$page"
          for marker in 'AURUM_PI3_WATCHDOG_INTAKE_V1_0_CANONICAL' "schema:'aurum-command-center-pi3-watchdog-intake-v1.0'" 'physical_watchdog_receipt.py' 'pi3-oob-watchdog-physical.json' 'physicalReceiptValidated:false' 'physicalProofInferred:false' 'mutationAuthorityGranted:false' 'promotionAuthorityGranted:false' 'writeAuthority:false' "needsWorkOwner:'aurum-system'" 'humanActionInference:false' 'Fail-closed physical-watchdog receipt intake is implemented' 'fresh explicit kernel-mutation authority remains a separate gate'; do grep -Fq "$marker" "$component" || { echo "Missing live watchdog-intake marker: $marker" >&2; exit 1; }; done
          cmp -s "${{ steps.source.outputs.file }}" "$component"
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back if verification fails
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry(){ local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n*5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/pi3-watchdog-intake-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/pi3-watchdog-intake-v1.js' ]; then cp -p '$backup/pi3-watchdog-intake-v1.js' '$remote/pi3-watchdog-intake-v1.js'; elif [ -f '$backup/.missing-pi3-watchdog-intake-v1.js' ]; then rm -f '$remote/pi3-watchdog-intake-v1.js'; fi"

      - name: Record verified watchdog-intake receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main; git checkout main; git reset --hard origin/main; mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-pi3-watchdog-intake-live.json <<EOF2
          {
            "site":"aurum-command-center",
            "url":"${{ steps.verify.outputs.url }}",
            "canonical_website_repo":"FormatX66/ClusterSites",
            "canonical_component":"services/aurum-arkmatx/pi3-watchdog-intake-v1.js",
            "approved_projection_commit":"44212aacac54a25a44a5210684c3b58ab0ce65b2",
            "public_projection":"FormatX66/BoxBrain:Web/Aurum-Arkmatx/pi3-watchdog-intake-v1.js",
            "deployment_carrier":"FormatX66/wetbeard-site",
            "component_revision":"1.0",
            "integrates_into":"pi3-physical-evidence",
            "new_major_box":false,
            "intake_source_commit":"9b23d84197d4659d7e2de582de86dfe5535c7c02",
            "intake_implementation_verified":true,
            "physical_receipt_validation_inferred":false,
            "watchdog_proof_inferred":false,
            "mutation_authority":false,
            "promotion_authority":false,
            "write_authority":false,
            "needs_work_system_owned":true,
            "human_action_inference":false,
            "expandable_parent_preserved":true,
            "frontiers_needs_work_actions_separation_preserved":true,
            "backup_before_publish":true,
            "rollback_on_verify_failure":true,
            "status":"verified-live",
            "verified_at_utc":"$verified_at"
          }
          EOF2
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-pi3-watchdog-intake-live.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record live Aurum Pi3 watchdog intake deployment [skip ci]'
          git push origin main
