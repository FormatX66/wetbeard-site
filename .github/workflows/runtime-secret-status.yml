name: Probe Realm Runtime Secret Availability

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/runtime-secret-status.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      OPENAI_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
      WITCH_PASSWORD_PRESENT: ${{ secrets.WITCHDIX_ADMIN_PASSWORD != '' }}
      XANDER_PASSWORD_PRESENT: ${{ secrets.XANDER_STUDIO_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record booleans only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployments
          cat > deployments/runtime-secret-status.json <<JSON
          {
            "openai_api_key": ${OPENAI_PRESENT},
            "witchdix_admin_password": ${WITCH_PASSWORD_PRESENT},
            "xander_studio_password": ${XANDER_PASSWORD_PRESENT}
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/runtime-secret-status.json
          git diff --cached --quiet && exit 0
          git commit -m "Record runtime secret availability [skip ci]"
          git push origin HEAD:main
