name: Deploy Site Builder Site

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site slug under sites/"
        required: true
        type: string
      environment:
        description: "Deployment target"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: write

concurrency:
  group: site-builder-${{ inputs.site }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate site config
        id: config
        shell: bash
        run: |
          set -euo pipefail
          SITE="${{ inputs.site }}"
          TARGET="${{ inputs.environment }}"
          DIR="sites/$SITE"
          test -f "$DIR/site.config.json" || { echo "Missing $DIR/site.config.json"; exit 1; }
          test -f "$DIR/package.json" || { echo "Missing $DIR/package.json"; exit 1; }
          PROFILE=$(jq -r '.deployProfile' "$DIR/site.config.json")
          test "$PROFILE" = "bluehost" || { echo "Unsupported deployProfile: $PROFILE"; exit 1; }
          REMOTE_PATH=$(jq -r ".${TARGET}.remotePath" "$DIR/site.config.json")
          URL=$(jq -r ".${TARGET}.url" "$DIR/site.config.json")
          [[ "$REMOTE_PATH" == public_html/* ]] || { echo "Refusing remote path outside public_html"; exit 1; }
          [[ "$REMOTE_PATH" != *".."* ]] || { echo "Refusing unsafe remote path"; exit 1; }
          [[ "$REMOTE_PATH" != *"VERIFY_BEFORE_DEPLOY"* ]] || { echo "Deployment root is not verified"; exit 1; }
          echo "remote_path=$REMOTE_PATH" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Install and build
        working-directory: sites/${{ inputs.site }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          if [ "${{ inputs.environment }}" = "staging" ]; then
            npm run build -- --base /staging/
          else
            npm run build
          fi

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.BLUEHOST_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy built site without deleting runtime state
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="${{ steps.config.outputs.remote_path }}"
          SITE="${{ inputs.site }}"
          ssh "${{ secrets.BLUEHOST_USERNAME }}@${{ secrets.BLUEHOST_HOST }}" "mkdir -p '$REMOTE'"
          FILTERS=()
          case "$SITE" in
            witchdix) FILTERS+=(--exclude 'data/') ;;
            xanderzombie) FILTERS+=(--exclude 'data/' --exclude 'generated/') ;;
            arkmatx) FILTERS+=(--exclude 'state/*.json') ;;
          esac
          rsync -az --delete "${FILTERS[@]}" \
            "sites/$SITE/dist/" \
            "${{ secrets.BLUEHOST_USERNAME }}@${{ secrets.BLUEHOST_HOST }}:$REMOTE/"

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.config.outputs.url }}"
          for attempt in 1 2 3 4 5; do
            code=$(curl -L -sS -o /tmp/site.html -w '%{http_code}' "$URL" || true)
            if [[ "$code" =~ ^2|3 ]]; then
              echo "Verified $URL ($code)"
              exit 0
            fi
            sleep 3
          done
          echo "Deployment did not return a successful HTTP response: $URL"
          exit 1

      - name: Record verified live deployment
        if: inputs.environment == 'production'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployments
          cat > "deployments/${{ inputs.site }}-live.json" <<JSON
          {
            "site": "${{ inputs.site }}",
            "url": "${{ steps.config.outputs.url }}",
            "commit_sha": "${{ github.sha }}",
            "verified_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "verified-live"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add "deployments/${{ inputs.site }}-live.json"
          git diff --cached --quiet && exit 0
          git commit -m "Record ${{ inputs.site }} live deployment [skip ci]"
          git push origin HEAD:main
