name: Publish Aurum Chat Process Tree

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-chat-process-tree.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish ClusterSites Aurum Dashboard
    types: [completed]

permissions:
  contents: write

concurrency:
  group: aurum-chat-process-tree-production
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Fetch approved public projection of ClusterSites canonical Chat Process Tree
        id: source
        shell: bash
        run: |
          set -euo pipefail
          src='https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/chat-process-tree-v1.js'
          out="$RUNNER_TEMP/chat-process-tree-v1.js"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 "$src" -o "$out"
          test -s "$out"
          node --check "$out"
          grep -Fq 'AURUM_CHAT_PROCESS_TREE_V1_CANONICAL' "$out"
          grep -Fq 'Canonical website owner: FormatX66/ClusterSites.' "$out"
          grep -Fq 'Frontiers Advancing:' "$out"
          grep -Fq 'Needs Work → Aurum/System:' "$out"
          grep -Fq 'Your Actions:' "$out"
          grep -Fq "schema:'aurum-command-center-chat-process-tree-v1.0'" "$out"
          grep -Fq 'topicRouterVisible:' "$out"
          grep -Fq 'sharedStateBusVisible:' "$out"
          grep -Fq 'gptBridgeVisible:' "$out"
          grep -Fq 'operationalFutureBranchVisible:' "$out"
          grep -Fq 'sharedRuntimeProjectionPresent:' "$out"
          grep -Fq 'treeGrantsExecutionAuthority:false' "$out"
          grep -Fq 'sharedStateGrantsExecutionAuthority:false' "$out"
          grep -Fq 'treeResolvesPhysicalBoundaries:false' "$out"
          grep -Fq "needsWorkOwner:'aurum-system'" "$out"
          grep -Fq 'humanActionInference:false' "$out"
          actual_blob="$(git hash-object "$out")"
          expected_blob='9b33c7211c86b5273b8c32119a124555d99279ad'
          if [ "$actual_blob" != "$expected_blob" ]; then
            echo "Refusing unapproved Chat Process Tree projection: expected $expected_blob got $actual_blob" >&2
            exit 1
          fi
          echo "blob=$actual_blob" >> "$GITHUB_OUTPUT"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Configure existing Bluehost SSH carrier with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"
          test -n "$BLUEHOST_USERNAME"
          test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            if [ "$attempt" -eq 5 ]; then
              echo "Bluehost SSH keyscan remained unavailable after $attempt bounded attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Back up and fetch current command center
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() {
            local outfile="$1"; shift
            local attempt=1 rc=0 tmp
            tmp="$(mktemp)"
            while true; do
              if "$@" > "$tmp"; then mv "$tmp" "$outfile"; return 0; fi
              rc=$?
              if [ "$attempt" -ge 5 ]; then rm -f "$tmp"; return "$rc"; fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/chat-process-tree-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" \
            ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/chat-process-tree.js' ]; then cp -p '$remote/chat-process-tree.js' '$backup/chat-process-tree.js'; else touch '$backup/.missing-chat-process-tree.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          grep -Fq 'Progress is proof, not activity.' "$RUNNER_TEMP/index.html"
          grep -Fq './command-center.js?v=32' "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject expandable Chat Process Tree surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1])
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./chat-process-tree\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          if '</body>' not in text:
              raise SystemExit('dashboard missing body close')
          text=text.replace('</body>','<script src="./chat-process-tree.js?v=1"></script>\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './chat-process-tree.js?v=1' "$RUNNER_TEMP/index.html"

      - name: Publish Chat Process Tree with bounded connection count
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 rc=0
            while true; do
              "$@" && return 0
              rc=$?
              if [ "$attempt" -ge 5 ]; then return "$rc"; fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          stage="$RUNNER_TEMP/aurum-chat-process-tree-publish"
          mkdir -p "$stage"
          cp "$RUNNER_TEMP/index.html" "$stage/index.html"
          cp "${{ steps.source.outputs.file }}" "$stage/chat-process-tree.js"
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 \
            "$stage/index.html" "$stage/chat-process-tree.js" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "chmod 644 '$remote/index.html' '$remote/chat-process-tree.js'"

      - name: Verify live Chat Process Tree surface
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"
          component="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' \
            'https://arkmatx.com/aurum/dashboard/chat-process-tree.js?rev=1' -o "$component"
          grep -Fq 'Progress is proof, not activity.' "$page"
          grep -Fq './command-center.js?v=32' "$page"
          grep -Fq './chat-process-tree.js?v=1' "$page"
          grep -Fq 'AURUM_CHAT_PROCESS_TREE_V1_CANONICAL' "$component"
          grep -Fq 'Canonical website owner: FormatX66/ClusterSites.' "$component"
          grep -Fq 'Frontiers Advancing:' "$component"
          grep -Fq 'Needs Work → Aurum/System:' "$component"
          grep -Fq 'Your Actions:' "$component"
          grep -Fq "schema:'aurum-command-center-chat-process-tree-v1.0'" "$component"
          grep -Fq 'topicRouterVisible:' "$component"
          grep -Fq 'sharedStateBusVisible:' "$component"
          grep -Fq 'gptBridgeVisible:' "$component"
          grep -Fq 'operationalFutureBranchVisible:' "$component"
          grep -Fq 'sharedRuntimeProjectionPresent:' "$component"
          grep -Fq 'treeGrantsExecutionAuthority:false' "$component"
          grep -Fq 'sharedStateGrantsExecutionAuthority:false' "$component"
          grep -Fq 'treeResolvesPhysicalBoundaries:false' "$component"
          grep -Fq "needsWorkOwner:'aurum-system'" "$component"
          grep -Fq 'humanActionInference:false' "$component"
          live_blob="$(git hash-object "$component")"
          if [ "$live_blob" != '${{ steps.source.outputs.blob }}' ]; then
            echo "Live Chat Process Tree component does not match approved source blob" >&2
            exit 1
          fi
          echo "url=$final_url" >> "$GITHUB_OUTPUT"
          echo "blob=$live_blob" >> "$GITHUB_OUTPUT"

      - name: Roll back if verification fails
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 rc=0
            while true; do
              "$@" && return 0
              rc=$?
              if [ "$attempt" -ge 5 ]; then return "$rc"; fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/chat-process-tree-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/chat-process-tree.js' ]; then cp -p '$backup/chat-process-tree.js' '$remote/chat-process-tree.js'; elif [ -f '$backup/.missing-chat-process-tree.js' ]; then rm -f '$remote/chat-process-tree.js'; fi"

      - name: Record verified Chat Process Tree receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-chat-process-tree-live.json <<EOF
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/chat-process-tree-v1.js",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx/chat-process-tree-v1.js",
            "deployment_carrier": "FormatX66/wetbeard-site",
            "chat_process_tree_revision": "1.0",
            "approved_component_blob": "${{ steps.source.outputs.blob }}",
            "live_component_blob": "${{ steps.verify.outputs.blob }}",
            "expandable": true,
            "topic_routing_visible": true,
            "shared_state_contract_visible": true,
            "gpt_process_bridge_visible": true,
            "operational_future_branch_visible": true,
            "runtime_shared_state_inferred": false,
            "frontiers_advancing_visible": true,
            "needs_work_system_owned": true,
            "tree_grants_execution_authority": false,
            "shared_state_grants_execution_authority": false,
            "tree_resolves_physical_boundaries": false,
            "human_action_inference": false,
            "backup_before_publish": true,
            "rollback_on_verify_failure": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-chat-process-tree-live.json
          git commit -m 'Record Aurum Chat Process Tree v1.0 live [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
