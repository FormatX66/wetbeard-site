<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Witchdix — Heather's Woods</title><style>
:root{--ink:#eadfc4;--moss:#394a35;--gold:#b79559;--black:#0b0f0b;--paper:#cdbd96}*{box-sizing:border-box}body{margin:0;background:#0b0f0b;color:var(--ink);font-family:Georgia,serif;overflow:hidden}.world{height:100svh;position:relative;background:radial-gradient(circle at 50% 35%,#42523a 0 10%,#1c2a1d 36%,#0a0e0b 80%);overflow:hidden}.trees:before,.trees:after{content:'';position:absolute;inset:-10%;background:repeating-linear-gradient(88deg,transparent 0 7%,#080b08 7.5% 10%,transparent 10.5% 17%);opacity:.75}.mist{position:absolute;inset:55% -10% -10%;background:linear-gradient(transparent,#b8c3b41c);filter:blur(14px);animation:m 8s ease-in-out infinite alternate}@keyframes m{to{transform:translateX(4%)}}.hut{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:min(74vw,650px);height:min(68vh,570px);background:linear-gradient(90deg,#2b2119,#4a3424 45%,#271d17);clip-path:polygon(18% 13%,50% 0,82% 13%,96% 36%,91% 100%,9% 100%,4% 36%);box-shadow:0 0 80px #000}.hut:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(170deg,transparent 0 18px,#56604455 19px 23px)}.door{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:30%;height:58%;border:8px solid #1d1510;border-bottom:0;border-radius:48% 48% 0 0/18% 18% 0 0;background:#4a3324;color:#d7c7a1;cursor:pointer;font:26px Georgia}.sign{position:absolute;top:18%;left:50%;transform:translateX(-50%) rotate(-2deg);padding:10px 20px;background:#34261b;border:1px solid #6b5635;font-size:20px;letter-spacing:.18em}.bookroom{display:none;position:absolute;inset:0;background:radial-gradient(circle at 50% 20%,#59482d44,transparent 40%),linear-gradient(#13140f,#0d100c);padding:4vh 4vw}.bookroom.show{display:block;animation:fade .8s both}@keyframes fade{from{opacity:0}to{opacity:1}}.desk{height:100%;display:grid;grid-template-columns:.5fr minmax(320px,880px) .5fr;gap:2vw;align-items:center}.shelf{height:72%;background:repeating-linear-gradient(#2a2017 0 14%,#16120f 14.5% 16%);border:12px solid #241a13;box-shadow:inset 0 0 40px #000}.book{position:relative;background:linear-gradient(90deg,#b9aa84,#d4c7a5 48%,#b7a77f 52%,#d2c49f);color:#302a20;height:84vh;padding:5vh 5vw;overflow:auto;box-shadow:0 30px 70px #000;border-radius:8px 18px 18px 8px}.book:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:#7d6d4d44;pointer-events:none}.book h1{font-size:clamp(42px,6vw,78px);margin:0}.book p{line-height:1.65}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0 12px}.tab{padding:12px 8px;border:1px solid #6b5c3b;background:#b7a67d77;cursor:pointer;text-align:left;font:12px Georgia}.tab b{display:block;font-size:15px}.searchbar{display:flex;gap:8px;margin:13px 0}.searchbar input{flex:1;border:0;border-bottom:1px solid #766748;background:#f4e8c533;padding:10px;color:#302a20;font:16px Georgia;outline:none}.searchbar button{border:1px solid #6b5c3b;background:#5a4a31;color:#e7dcc0;padding:8px 12px;cursor:pointer}.entrygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.entry{border:1px solid #746442;padding:13px;background:#c7b78e88;cursor:pointer}.entry:hover{background:#d6c59b}.entry small{display:block;letter-spacing:.1em;color:#665a42;font-size:9px}.entry h3{margin:5px 0;font-size:20px}.entry p{margin:6px 0}.tags{font-size:11px;color:#65583f}.safety{margin-top:8px;padding:7px;border-left:3px solid #7a3e32;color:#63382d;font-size:12px}.marginal{margin-top:18px;padding-left:18px;border-left:2px solid #6b5c3b;font-style:italic;color:#5c5039}.sigils{display:flex;gap:10px;margin-top:18px}.sigils button{width:52px;height:52px;border:1px solid #6b5c3b;background:#b8a77d;font:24px Georgia;cursor:pointer}.note{position:absolute;right:5%;bottom:5%;transform:rotate(3deg);background:#d8ccaa;padding:12px;color:#31291e;box-shadow:0 8px 20px #0007;font-size:12px}.travel{position:absolute;left:4%;bottom:4%;border:1px solid #94805a;background:#151610dd;color:#d2c29d;padding:12px 16px;cursor:pointer}.overlay{position:fixed;inset:0;display:none;place-items:center;background:#10160ff2;z-index:10;font-size:28px;letter-spacing:.18em}.overlay.show{display:grid}.alarmnote{color:#7b2f2b;font-weight:bold}.empty{padding:22px;border:1px dashed #786a4b;color:#665a42;font-style:italic}@media(max-width:800px){.desk{grid-template-columns:1fr}.shelf{display:none}.book{height:88vh;padding:4vh 6vw}.tabs{grid-template-columns:repeat(2,1fr)}.entrygrid{grid-template-columns:1fr}.note{display:none}.searchbar{position:sticky;top:-4vh;background:#cfc09b;padding-top:8px;z-index:2}}
</style></head><body><main class="world"><div class="trees"></div><div class="mist"></div><section class="hut" id="hut"><div class="sign">WITCHDIX</div><button class="door" id="enter">ENTER</button></section><section class="bookroom" id="bookroom"><div class="desk"><div class="shelf"></div><article class="book"><small>HEATHER'S FIELD REPOSITORY</small><h1>The Living Grimoire</h1><p>Heather's published field notes, catalogued without sanding off the strange parts.</p><div class="searchbar"><input id="search" placeholder="Search rosemary, moon, warding, dream…"><button id="searchBtn">FIND</button><button id="recentBtn">RECENT</button></div><div class="tabs"><button class="tab" data-category="herbs-plants"><b>Herbs & Plants</b></button><button class="tab" data-category="spells-rituals"><b>Spells & Rituals</b></button><button class="tab" data-category="moon-seasons"><b>Moon & Seasons</b></button><button class="tab" data-category="stones-tools-curiosities"><b>The Cabinet</b></button></div><div id="page"><div class="empty">The book is listening for published pages…</div></div><div class="note" id="note">“Nothing in here is finished.<br>That is the point.” — H.</div></article><div class="shelf"></div></div><button class="travel" id="travel">← follow the moss path to Morri</button></section><div class="overlay" id="overlay">THE WOODS ARE CHANGING…</div></main><script>
const key='realm-passport',api='api.php';const incoming=(new URLSearchParams(location.search).get('rp')||'').split(',').filter(Boolean);const passport=new Set([...(localStorage.getItem(key)||'').split(',').filter(Boolean),...incoming]);const save=()=>localStorage.setItem(key,[...passport].join(','));const jump=url=>{const u=new URL(url);u.searchParams.set('rp',[...passport].join(','));location.href=u.toString()};save();
const $=s=>document.querySelector(s),page=$('#page'),overlay=$('#overlay'),note=$('#note');$('#enter').onclick=()=>{$('#hut').style.display='none';$('#bookroom').classList.add('show');loadRecent()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(action,data={}){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'The archive is quiet.');return j}
function render(items,title='Published Pages'){page.innerHTML=`<h2>${esc(title)}</h2>`+(items.length?`<div class="entrygrid">${items.map(x=>`<article class="entry"><small>${esc((x.category||'other').replaceAll('-',' ').toUpperCase())} · ${esc((x.created_at||'').slice(0,10))}</small><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p><div class="tags">${(x.tags||[]).map(t=>'#'+esc(t)).join(' ')}</div>${x.safety_note?`<div class="safety">Practical note: ${esc(x.safety_note)}</div>`:''}${(x.cross_references||[]).length?`<p><small>SEE ALSO: ${x.cross_references.map(esc).join(' · ')}</small></p>`:''}</article>`).join('')}</div>`:'<div class="empty">No published pages match this part of the woods yet.</div>')}
async function loadRecent(){try{render((await call('public_recent')).items,'Recently Pressed Pages')}catch{render([], 'The Archive Is Still Growing')}}async function search(q){try{render((await call('public_search',{q})).items,q?`Search: ${q}`:'Published Pages')}catch{render([],'The Archive Is Still Growing')}}
$('#searchBtn').onclick=()=>search($('#search').value.trim());$('#search').onkeydown=e=>{if(e.key==='Enter')$('#searchBtn').click()};$('#recentBtn').onclick=loadRecent;document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>search(b.dataset.category.replaceAll('-',' ')));
const moon=`<h2>Moon & Seasons</h2><p>Eight marks circle a clasp hidden behind the catalog.</p><div class="sigils"><button data-sigil="1">☾</button><button data-sigil="2">❧</button><button data-sigil="3">♞</button><button data-sigil="4">✦</button></div><div id="moonmsg" class="marginal">“The forest bends where the knight remembers the leaves.”</div>`;document.querySelector('[data-category="moon-seasons"]').addEventListener('dblclick',()=>{page.innerHTML=moon;document.querySelectorAll('[data-sigil]').forEach(b=>b.onclick=()=>{const m=$('#moonmsg');if(b.dataset.sigil==='3'){passport.add('witch-moon');save();m.innerHTML='<b>The knight sigil warms.</b><br>A new path appears in the margin.'}else m.textContent='The ink shifts, then settles.'})});
if(passport.has('morri-chess'))note.innerHTML+=' <br><em>A rook-shaped impression dents the binding.</em>';if(passport.has('ark-red'))note.innerHTML='<span class="alarmnote">A red smear crosses this page:</span><br>“Whatever Bruce touched, put it back.” — H.';$('#travel').onclick=()=>{overlay.classList.add('show');setTimeout(()=>jump('https://madmorrigan.com/morri/?from=witchdix'),900)};if(new URLSearchParams(location.search).get('from')){overlay.classList.add('show');setTimeout(()=>overlay.classList.remove('show'),700)}
</script></body></html>
