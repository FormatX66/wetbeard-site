name: Publish Aurum Control Route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-control-route.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish ClusterSites Aurum Dashboard
    types: [completed]

permissions:
  contents: write

concurrency:
  group: aurum-control-route-production
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Fetch canonical public projections
        id: source
        shell: bash
        run: |
          set -euo pipefail
          route="$RUNNER_TEMP/control-route.js"
          seed="$RUNNER_TEMP/seed-delivery.js"
          action="$RUNNER_TEMP/action-ownership.js"
          curl --fail-with-body --silent --show-error --location \
            'https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/control-route-v1.js' -o "$route"
          curl --fail-with-body --silent --show-error --location \
            'https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/seed-delivery-v1.js' -o "$seed"
          curl --fail-with-body --silent --show-error --location \
            'https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/action-ownership-v1.js' -o "$action"
          test -s "$route"; test -s "$seed"; test -s "$action"
          grep -Fq 'AURUM_CONTROL_ROUTE_V1_3_CANONICAL' "$route"
          grep -Fq 'BBPI4 SSH unreachable' "$route"
          grep -Fq 'SSH attempts:' "$route"
          grep -Fq 'AURUM_SEED_DELIVERY_V1_CANONICAL' "$seed"
          grep -Fq 'BBPI4 Seed Delivery' "$seed"
          grep -Fq 'AURUM_ACTION_OWNERSHIP_V1_3_CANONICAL' "$action"
          grep -Fq 'BBPI4 delivery / reachability boundary' "$action"
          echo "route=$route" >> "$GITHUB_OUTPUT"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Configure existing Bluehost SSH carrier with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Bluehost SSH keyscan remained unavailable after $attempt bounded attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Back up and fetch current command center in one SSH session
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() {
            local outfile="$1"; shift
            local attempt=1 rc=0 tmp
            tmp="$(mktemp)"
            while true; do
              if "$@" > "$tmp"; then
                mv "$tmp" "$outfile"
                return 0
              fi
              rc=$?
              if [ "$attempt" -ge 5 ]; then rm -f "$tmp"; return "$rc"; fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/control-route-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" \
            ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/control-route.js' ]; then cp -p '$remote/control-route.js' '$backup/control-route.js'; else touch '$backup/.missing-control-route.js'; fi; if [ -f '$remote/seed-delivery.js' ]; then cp -p '$remote/seed-delivery.js' '$backup/seed-delivery.js'; else touch '$backup/.missing-seed-delivery.js'; fi; if [ -f '$remote/action-ownership.js' ]; then cp -p '$remote/action-ownership.js' '$backup/action-ownership.js'; else touch '$backup/.missing-action-ownership.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject control-route and seed-delivery surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          route='<script src="./control-route.js?v=13"></script>'
          seed='<script src="./seed-delivery.js?v=1"></script>'
          action='<script src="./action-ownership.js?v=13"></script>'
          text=re.sub(r'<script src="\./control-route\.js\?v=[^"]+"></script>',route,text)
          text=re.sub(r'<script src="\./seed-delivery\.js\?v=[^"]+"></script>',seed,text)
          text=re.sub(r'<script src="\./action-ownership\.js\?v=[^"]+"></script>',action,text)
          for tag in (route,seed,action):
              if tag not in text:
                  if '</body>' not in text: raise SystemExit('dashboard missing body close')
                  text=text.replace('</body>',tag+'\n</body>',1)
          # Ensure route -> seed -> action ordering for shared state events.
          text=text.replace(action+'\n'+seed,seed+'\n'+action)
          text=text.replace(seed+'\n'+route,route+'\n'+seed)
          text=text.replace(action+'\n'+route,route+'\n'+action)
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './control-route.js?v=13' "$RUNNER_TEMP/index.html"
          grep -Fq './seed-delivery.js?v=1' "$RUNNER_TEMP/index.html"
          grep -Fq './action-ownership.js?v=13' "$RUNNER_TEMP/index.html"

      - name: Publish all command surfaces with bounded connection count
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 rc=0
            while true; do
              "$@" && return 0
              rc=$?
              if [ "$attempt" -ge 5 ]; then return "$rc"; fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          stage="$RUNNER_TEMP/aurum-command-publish"
          mkdir -p "$stage"
          cp "$RUNNER_TEMP/index.html" "$stage/index.html"
          cp "${{ steps.source.outputs.route }}" "$stage/control-route.js"
          cp "${{ steps.source.outputs.seed }}" "$stage/seed-delivery.js"
          cp "${{ steps.source.outputs.action }}" "$stage/action-ownership.js"
          # One SCP session moves the complete verified set; one SSH session fixes permissions.
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 \
            "$stage/index.html" "$stage/control-route.js" "$stage/seed-delivery.js" "$stage/action-ownership.js" \
            "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "chmod 644 '$remote/index.html' '$remote/control-route.js' '$remote/seed-delivery.js' '$remote/action-ownership.js'"

      - name: Verify live control and seed surfaces
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"; route="$(mktemp)"; seed="$(mktemp)"; action="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/control-route.js?rev=13' -o "$route"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/seed-delivery.js?rev=1' -o "$seed"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/action-ownership.js?rev=13' -o "$action"
          grep -Fq './control-route.js?v=13' "$page"
          grep -Fq './seed-delivery.js?v=1' "$page"
          grep -Fq './action-ownership.js?v=13' "$page"
          grep -Fq 'AURUM_CONTROL_ROUTE_V1_3_CANONICAL' "$route"
          grep -Fq 'SSH attempts:' "$route"
          grep -Fq 'AURUM_SEED_DELIVERY_V1_CANONICAL' "$seed"
          grep -Fq 'BBPI4 Seed Delivery' "$seed"
          grep -Fq 'AURUM_ACTION_OWNERSHIP_V1_3_CANONICAL' "$action"
          grep -Fq 'BBPI4 delivery / reachability boundary' "$action"
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back if verification fails
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 rc=0
            while true; do
              "$@" && return 0
              rc=$?
              if [ "$attempt" -ge 5 ]; then return "$rc"; fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/control-route-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/control-route.js' ]; then cp -p '$backup/control-route.js' '$remote/control-route.js'; elif [ -f '$backup/.missing-control-route.js' ]; then rm -f '$remote/control-route.js'; fi; if [ -f '$backup/seed-delivery.js' ]; then cp -p '$backup/seed-delivery.js' '$remote/seed-delivery.js'; elif [ -f '$backup/.missing-seed-delivery.js' ]; then rm -f '$remote/seed-delivery.js'; fi; if [ -f '$backup/action-ownership.js' ]; then cp -p '$backup/action-ownership.js' '$remote/action-ownership.js'; elif [ -f '$backup/.missing-action-ownership.js' ]; then rm -f '$remote/action-ownership.js'; fi"

      - name: Record verified control-route receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-control-route-live.json <<EOF
          {
            "site": "aurum-control-route",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/control-route-v1.js",
            "canonical_seed_component": "services/aurum-arkmatx/seed-delivery-v1.js",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx",
            "component_revision": "1.3",
            "seed_delivery_revision": "1.0",
            "action_ownership_revision": "1.3",
            "deployment_resilience_revision": "1.2",
            "ssh_retry_attempts": 5,
            "ssh_retry_policy": "bounded-linear-backoff",
            "ssh_connection_batching": true,
            "publish_transfer_sessions": 2,
            "route_failure_boundary_detail": true,
            "pi4_seed_delivery_visible": true,
            "correlated_failures_not_merged_as_cause": true,
            "credential_carrier_repo": "FormatX66/wetbeard-site",
            "route": ["GitHub", "main-PC-runner", "SSH", "BoxBrain-Pi4", "LAN", "Hopper"],
            "read_only": true,
            "expandable": true,
            "needs_work_integration": true,
            "aged_request_stall_seconds": 1200,
            "system_failure_ownership": true,
            "human_action_inference": false,
            "canonical_deployment_owner": "FormatX66/ClusterSites",
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-control-route-live.json
          git commit -m 'Record Aurum control route live deployment [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
