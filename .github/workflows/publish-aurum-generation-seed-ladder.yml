name: Publish Aurum Generation Seed Ladder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-generation-seed-ladder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-generation-seed-ladder-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify approved ClusterSites canonical blob through BoxBrain projection
        id: source
        shell: bash
        run: |
          set -euo pipefail
          expected_canonical_blob='0f906bc0c93d0d5b134a2b4c54b9a69bd5f82867'
          canonical_commit='798e03ee90e2cac0e79b484b73b0d5564a10f5a9'
          projection_commit='122452e32245b17c881b97a3e17d805d811c1388'
          projection="$RUNNER_TEMP/generation-seed-ladder-canonical.js"
          current="$RUNNER_TEMP/generation-seed-ladder-current.js"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 \
            'https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js' -o "$current"
          test -s "$projection"; test -s "$current"
          node --check "$projection"
          cmp -s "$projection" "$current"
          blob="$(git hash-object "$projection")"
          test "$blob" = "$expected_canonical_blob"
          grep -Fq 'AURUM_GENERATION_SEED_LADDER_V1_CANONICAL' "$projection"
          grep -Fq "canonicalWebsiteRepo:'FormatX66/ClusterSites'" "$projection"
          grep -Fq "componentRevision:'1.6'" "$projection"
          grep -Fq "ACTIVE_TRUNK_COMMIT='4c1ab29487583c12cfaf791a91fb856635b2b658'" "$projection"
          grep -Fq "ACTIVE_TRUNK_PARENT='a89a70b18786b035b6d414ddf6250289c999571a'" "$projection"
          grep -Fq "ACTIVE_TRUNK_TREE='a62f7e0698e22c28059b6de1d251a8116d7c17ec'" "$projection"
          grep -Fq "HOPPER_LIVE_GUI_CONTRACT_RUN='33266139138'" "$projection"
          grep -Fq "RECOVERY_GROWTH_RUN='33266139233'" "$projection"
          grep -Fq "CURRENT_PC_IMAGE_RUN='33266139163'" "$projection"
          grep -Fq "CURRENT_AUTOBUILD_RUN='33266648944'" "$projection"
          grep -Fq 'hopperRecoveryHardeningImplemented:true' "$projection"
          grep -Fq 'hopperKeyboardPointerEventProofImplemented:true' "$projection"
          grep -Fq 'hopperBoundedRecoveryConsoleImplemented:true' "$projection"
          grep -Fq 'hopperWifiPersistenceProofImplemented:true' "$projection"
          grep -Fq 'currentExactHeadAutobuildPassed:false' "$projection"
          grep -Fq "currentExactHeadBlocker:'gui-live-trial-approved-route-contract-regression'" "$projection"
          grep -Fq 'routeContractRegressionProven:true' "$projection"
          grep -Fq 'physicalHopperKeyboardPointerProofProven:false' "$projection"
          grep -Fq 'physicalHopperRecoveryConsoleReceiptProven:false' "$projection"
          grep -Fq 'physicalHopperWifiRebootPersistenceProven:false' "$projection"
          grep -Fq 'humanActionInferred:false' "$projection"
          grep -Fq 'Frontiers Advancing:' "$projection"
          grep -Fq 'Needs Work → Aurum/System:' "$projection"
          grep -Fq 'Your Actions:' "$projection"
          echo "file=$projection" >> "$GITHUB_OUTPUT"
          echo "blob=$blob" >> "$GITHUB_OUTPUT"
          echo "canonical_commit=$canonical_commit" >> "$GITHUB_OUTPUT"
          echo "projection_commit=$projection_commit" >> "$GITHUB_OUTPUT"

      - name: Verify exact projection CI and current Aurum evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          projection_commit='122452e32245b17c881b97a3e17d805d811c1388'
          ci_run='33266953816'
          active='4c1ab29487583c12cfaf791a91fb856635b2b658'
          parent='a89a70b18786b035b6d414ddf6250289c999571a'
          restored='a4b605b50708252fa945783e619a68b706d29382'
          route_fix='6c9baefd9de4583976d99b3a90ac6a28114986bb'
          hopper_gui_run='33266139138'
          recovery_run='33266139233'
          pc_run='33266139163'
          autobuild_run='33266648944'
          for attempt in $(seq 1 18); do
            curl --fail-with-body --silent --show-error --location \
              "https://api.github.com/repos/FormatX66/BoxBrain/actions/runs/$ci_run" -o "$RUNNER_TEMP/ci.json"
            status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$RUNNER_TEMP/ci.json")"
            [ "$status" = completed ] && break
            [ "$attempt" -eq 18 ] && { echo 'exact BoxBrain CI did not reach terminal state'; exit 1; }
            sleep 10
          done
          curl --fail-with-body --silent --show-error --location "https://api.github.com/repos/FormatX66/BoxBrain/commits/$active" -o "$RUNNER_TEMP/active.json"
          curl --fail-with-body --silent --show-error --location "https://api.github.com/repos/FormatX66/BoxBrain/compare/$restored...$active" -o "$RUNNER_TEMP/compare.json"
          for spec in "$hopper_gui_run:hopper-gui" "$recovery_run:recovery" "$pc_run:pc" "$autobuild_run:autobuild"; do
            id="${spec%%:*}"; name="${spec##*:}"
            curl --fail-with-body --silent --show-error --location "https://api.github.com/repos/FormatX66/BoxBrain/actions/runs/$id" -o "$RUNNER_TEMP/$name-run.json"
            curl --fail-with-body --silent --show-error --location "https://api.github.com/repos/FormatX66/BoxBrain/actions/runs/$id/jobs?per_page=100" -o "$RUNNER_TEMP/$name-jobs.json"
          done
          curl --fail-with-body --silent --show-error --location "https://raw.githubusercontent.com/FormatX66/BoxBrain/$active/Projects/AurumPC/HOPPER_RECOVERY_HARDENING.md" -o "$RUNNER_TEMP/hardening.md"
          curl --fail-with-body --silent --show-error --location "https://raw.githubusercontent.com/FormatX66/BoxBrain/$active/Projects/Codelation/field/external_prerequisite_evidence.py" -o "$RUNNER_TEMP/current-consumer.py"
          curl --fail-with-body --silent --show-error --location "https://raw.githubusercontent.com/FormatX66/BoxBrain/$active/Projects/Codelation/autobuild/external_evidence/adaptive_shell_gui_live_trial.json" -o "$RUNNER_TEMP/current-evidence.json"
          curl --fail-with-body --silent --show-error --location "https://raw.githubusercontent.com/FormatX66/BoxBrain/$route_fix/Projects/Codelation/field/external_prerequisite_evidence.py" -o "$RUNNER_TEMP/fixed-consumer.py"
          curl --fail-with-body --silent --show-error --location "https://raw.githubusercontent.com/FormatX66/BoxBrain/$route_fix/Projects/Codelation/tests/test_adaptive_shell_gui_deployment.py" -o "$RUNNER_TEMP/fixed-tests.py"
          grep -Fq 'a real keyboard event and a real pointer event' "$RUNNER_TEMP/hardening.md"
          grep -Fq 'saved Wi-Fi profile set is on durable storage' "$RUNNER_TEMP/hardening.md"
          grep -Fq 'USB_SSH_ROUTE = "10.12.194.1"' "$RUNNER_TEMP/current-consumer.py"
          grep -Fq 'or route != USB_SSH_ROUTE' "$RUNNER_TEMP/current-consumer.py"
          grep -Fq 'or transport.get("usb_route") != USB_SSH_ROUTE' "$RUNNER_TEMP/current-consumer.py"
          grep -Fq 'GUI_LIVE_TRIAL_APPROVED_ROUTES' "$RUNNER_TEMP/fixed-consumer.py"
          grep -Fq '"192.168.0.194"' "$RUNNER_TEMP/fixed-consumer.py"
          grep -Fq 'or route not in GUI_LIVE_TRIAL_APPROVED_ROUTES' "$RUNNER_TEMP/fixed-consumer.py"
          grep -Fq 'or transport.get("usb_route") != route' "$RUNNER_TEMP/fixed-consumer.py"
          grep -Fq 'for approved_route in ("10.12.194.1", "10.42.194.1", "bbpi4.local", "192.168.0.194")' "$RUNNER_TEMP/fixed-tests.py"
          python3 - "$RUNNER_TEMP/ci.json" "$RUNNER_TEMP/active.json" "$RUNNER_TEMP/compare.json" "$RUNNER_TEMP/hopper-gui-run.json" "$RUNNER_TEMP/recovery-run.json" "$RUNNER_TEMP/pc-run.json" "$RUNNER_TEMP/pc-jobs.json" "$RUNNER_TEMP/autobuild-run.json" "$RUNNER_TEMP/autobuild-jobs.json" "$RUNNER_TEMP/current-evidence.json" "$projection_commit" "$active" "$parent" "$restored" <<'PY'
          import json,sys
          ci,active_doc,compare_doc,hopper_gui,recovery,pc_run,pc_jobs,autobuild,autobuild_jobs,evidence=[json.load(open(p,encoding='utf-8')) for p in sys.argv[1:11]]
          projection,active,parent,restored=sys.argv[11:15]
          assert ci.get('name')=='BoxBrain CI' and ci.get('head_sha')==projection
          assert ci.get('status')=='completed' and ci.get('conclusion')=='success'
          assert active_doc.get('sha')==active and active_doc.get('parents',[{}])[0].get('sha')==parent
          assert active_doc.get('commit',{}).get('tree',{}).get('sha')=='a62f7e0698e22c28059b6de1d251a8116d7c17ec'
          assert compare_doc.get('status')=='ahead' and compare_doc.get('behind_by')==0 and compare_doc.get('ahead_by')==3
          assert compare_doc.get('merge_base_commit',{}).get('sha')==restored
          for run in (hopper_gui,recovery,pc_run):
              assert run.get('head_sha')==active and run.get('status')=='completed' and run.get('conclusion')=='success'
          by={j.get('name'):j for j in pc_jobs.get('jobs',[])}
          for name in ('validate','build-image','generic-uefi-smoke','hp-twin-smoke','publish-verified-image'):
              j=by.get(name)
              assert j and j.get('status')=='completed' and j.get('conclusion')=='success', f'{name} not green'
          assert autobuild.get('head_sha')==active and autobuild.get('status')=='completed' and autobuild.get('conclusion')=='failure'
          loop=next((j for j in autobuild_jobs.get('jobs',[]) if j.get('name')=='Resume verified native growth'),None)
          assert loop and loop.get('conclusion')=='failure'
          failures=[s.get('name') for s in loop.get('steps',[]) if s.get('conclusion')=='failure']
          assert failures==['Verify native self-build contracts'], failures
          assert evidence.get('route')=='192.168.0.194'
          assert evidence.get('transport',{}).get('usb_route')=='192.168.0.194'
          assert evidence.get('verified') is True
          print('GENERATION_LADDER_V16_EVIDENCE_OK ci=%s autobuild=%s' % (ci['id'],autobuild['id']))
          PY

      - name: Configure Bluehost SSH with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Back up current Command Center
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() { local out="$1"; shift; local n=1 tmp; tmp="$(mktemp)"; while true; do if "$@" > "$tmp"; then mv "$tmp" "$out"; return 0; fi; [ "$n" -ge 5 ] && { rm -f "$tmp"; return 1; }; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" \
            ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/generation-seed-ladder.js' ]; then cp -p '$remote/generation-seed-ladder.js' '$backup/generation-seed-ladder.js'; else touch '$backup/.missing-generation-seed-ladder.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject expandable generation ladder component
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./generation-seed-ladder\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          tag='<script src="./generation-seed-ladder.js?v=7"></script>'
          markers=[r'<script src="\./seed-lifecycle\.js(?:\?v=[^"]+)?\"></script>',r'<script src="\./recovery-guardian\.js(?:\?v=[^"]+)?\"></script>',r'</body>']
          for pattern in markers:
              m=re.search(pattern,text)
              if m:
                  text=text[:m.start()]+tag+'\n'+text[m.start():]
                  break
          else:
              raise SystemExit('dashboard missing generation ladder injection point')
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './generation-seed-ladder.js?v=7' "$RUNNER_TEMP/index.html"

      - name: Publish with bounded retries
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 \
            "$RUNNER_TEMP/index.html" "${{ steps.source.outputs.file }}" \
            "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mv '$remote/generation-seed-ladder-canonical.js' '$remote/generation-seed-ladder.js'; chmod 644 '$remote/index.html' '$remote/generation-seed-ladder.js'"

      - name: Verify live Command Center
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/live-index.html"; js="$RUNNER_TEMP/live-generation-seed-ladder.js"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' \
            'https://arkmatx.com/aurum/dashboard/generation-seed-ladder.js?rev=7' -o "$js"
          grep -Fq './generation-seed-ladder.js?v=7' "$page"
          cmp -s "${{ steps.source.outputs.file }}" "$js"
          grep -Fq "componentRevision:'1.6'" "$js"
          grep -Fq "ACTIVE_TRUNK_COMMIT='4c1ab29487583c12cfaf791a91fb856635b2b658'" "$js"
          grep -Fq 'hopperRecoveryHardeningImplemented:true' "$js"
          grep -Fq 'currentExactHeadAutobuildPassed:false' "$js"
          grep -Fq "currentExactHeadBlocker:'gui-live-trial-approved-route-contract-regression'" "$js"
          grep -Fq 'physicalHopperKeyboardPointerProofProven:false' "$js"
          grep -Fq 'physicalHopperRecoveryConsoleReceiptProven:false' "$js"
          grep -Fq 'physicalHopperWifiRebootPersistenceProven:false' "$js"
          grep -Fq 'humanActionInferred:false' "$js"
          grep -Fq 'Frontiers Advancing:' "$js"
          grep -Fq 'Needs Work → Aurum/System:' "$js"
          grep -Fq 'Your Actions:' "$js"
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back on verification failure
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/generation-seed-ladder.js' ]; then cp -p '$backup/generation-seed-ladder.js' '$remote/generation-seed-ladder.js'; elif [ -f '$backup/.missing-generation-seed-ladder.js' ]; then rm -f '$remote/generation-seed-ladder.js'; fi"

      - name: Record verified live receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-generation-seed-ladder-live.json <<EOF_RECEIPT
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/generation-seed-ladder-v1.js",
            "canonical_component_commit": "${{ steps.source.outputs.canonical_commit }}",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx/generation-seed-ladder-v1.js",
            "deployment_carrier": "FormatX66/wetbeard-site",
            "component_revision": "1.6",
            "approved_blob": "${{ steps.source.outputs.blob }}",
            "boxbrain_projection_commit": "${{ steps.source.outputs.projection_commit }}",
            "boxbrain_ci_run": 33266953816,
            "boxbrain_ci_proven": true,
            "restored_lkg_head": "a4b605b50708252fa945783e619a68b706d29382",
            "active_trunk_commit": "4c1ab29487583c12cfaf791a91fb856635b2b658",
            "active_trunk_parent": "a89a70b18786b035b6d414ddf6250289c999571a",
            "active_trunk_tree": "a62f7e0698e22c28059b6de1d251a8116d7c17ec",
            "active_trunk_descends_from_restored_lkg": true,
            "hopper_recovery_hardening_implemented": true,
            "hopper_keyboard_pointer_event_proof_implemented": true,
            "hopper_bounded_recovery_console_implemented": true,
            "hopper_wifi_persistence_proof_implemented": true,
            "hopper_live_gui_contract_run": 33266139138,
            "hopper_live_gui_contract_verification_passed": true,
            "recovery_growth_run": 33266139233,
            "recovery_growth_verification_passed": true,
            "current_pc_image_run": 33266139163,
            "current_pc_image_validation_passed": true,
            "current_generic_uefi_smoke_passed": true,
            "current_hp_twin_smoke_passed": true,
            "current_verified_image_published": true,
            "current_autobuild_run": 33266648944,
            "current_exact_head_autobuild_passed": false,
            "current_exact_head_blocker": "gui-live-trial-approved-route-contract-regression",
            "route_contract_regression_proven": true,
            "gui_live_trial_evidence_route": "192.168.0.194",
            "current_consumer_required_route": "10.12.194.1",
            "historical_approved_route_fix_commit": "6c9baefd9de4583976d99b3a90ac6a28114986bb",
            "historical_approved_route_fix_contained_active_trunk": false,
            "physical_hopper_keyboard_pointer_proof_proven": false,
            "physical_hopper_recovery_console_receipt_proven": false,
            "physical_hopper_wifi_reboot_persistence_proven": false,
            "human_action_inference": false,
            "major_box_added": false,
            "seed_lifecycle_remains_expandable": true,
            "frontiers_advancing_visible": true,
            "needs_work_system_owned": true,
            "needs_work_owner": "aurum-system",
            "backup_before_publish": true,
            "rollback_on_verification_failure": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF_RECEIPT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-generation-seed-ladder-live.json
          git commit -m 'Record Aurum generation seed ladder v1.6 live [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
