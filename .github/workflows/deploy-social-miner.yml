name: Deploy Social Miner to Bluehost

on:
  push:
    branches: [main]
    paths:
      - 'social-miner/**'
      - '.github/workflows/deploy-social-miner.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-miner-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate PHP, bot scoring, queue and reviews
        shell: bash
        run: |
          set -euo pipefail
          find social-miner -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          php -r '
            require "social-miner/lib/bootstrap.php";
            require "social-miner/lib/analyzer.php";
            require "social-miner/lib/bot.php";
            require "social-miner/lib/importer.php";
            $comments=[];
            for($i=0;$i<5;$i++) $comments[]=["platform"=>"instagram","user_id"=>"1","username"=>"autobot123456","text"=>"same promo link https://example.com","created_time"=>gmdate("c",1700000000+$i*5),"risk_level"=>"none"];
            $comments[]=["platform"=>"instagram","user_id"=>"2","username"=>"otheracct","text"=>"same promo link https://example.com","created_time"=>gmdate("c",1700000100),"risk_level"=>"none"];
            $reports=build_bot_reports($comments);
            if(count($reports)!==2 || ($reports[0]["bot_percentage"]??0)<75) throw new RuntimeException("bot scoring smoke test failed");
            $tmp=tempnam(sys_get_temp_dir(),"sminer-");
            file_put_contents($tmp,json_encode([["comment"=>"queued test comment","username"=>"queue_test","timestamp"=>1700000200]]));
            $job="smoketest".bin2hex(random_bytes(5));
            queue_uploaded_export($tmp,"comments.json","instagram","","CI queue smoke",$job,"ci-test",filesize($tmp));
            $result=process_inbox_files();
            if(empty($result[0]["ok"]) || empty($result[0]["import_id"])) throw new RuntimeException("background queue smoke test failed");
            $import=import_find((string)$result[0]["import_id"]);
            if(empty($import["review_ready"]) || count(import_comments((string)$import["id"]))!==1) throw new RuntimeException("review membership smoke test failed");
            echo "Background queue/review smoke test OK\n";
          '
          find social-miner/storage -type f ! -name '.htaccess' -delete 2>/dev/null || true
          find social-miner/storage -mindepth 1 -type d -empty -delete 2>/dev/null || true

      - name: Configure Bluehost SSH
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST" && test -n "$BLUEHOST_USERNAME" && test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          ssh-keyscan -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Set Social Miner admin password
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BOOTSTRAP_ADMIN_HASH: '$2y$12$M.a9Eg1pkyUbttGaJMNU/.2J4OgpYTPCJvCRDocx2PdJnDyd3sXpa'
        shell: bash
        run: |
          set -euo pipefail
          config_b64="$(php -r 'echo base64_encode("<?php return " . var_export(["admin_password_hash" => $argv[1]], true) . ";\n");' "$BOOTSTRAP_ADMIN_HASH")"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -e; mkdir -p public_html/social-miner/storage public_html/social-miner/storage/inbox public_html/social-miner/storage/inbox/processed public_html/social-miner/storage/inbox/failed; chmod 700 public_html/social-miner/storage public_html/social-miner/storage/inbox public_html/social-miner/storage/inbox/processed public_html/social-miner/storage/inbox/failed; printf '%s' '$config_b64' | base64 -d > public_html/social-miner/config.local.php; chmod 600 public_html/social-miner/config.local.php"

      - name: Deploy Social Miner files
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          tar -C social-miner -czf - \
            index.php review.php api.php webhook.php import.php cron-import.php .htaccess .user.ini README.md lib storage/.htaccess | \
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            'set -e; mkdir -p public_html/social-miner/storage/inbox/processed public_html/social-miner/storage/inbox/failed; tar -xzf - -C public_html/social-miner; chmod 700 public_html/social-miner/storage public_html/social-miner/storage/inbox public_html/social-miner/storage/inbox/processed public_html/social-miner/storage/inbox/failed'

      - name: Install scheduled import worker
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" '
            set -e
            if command -v crontab >/dev/null 2>&1; then
              php_bin="$(command -v php)"
              cron_line="* * * * * $php_bin $HOME/public_html/social-miner/cron-import.php >> $HOME/public_html/social-miner/storage/cron.log 2>&1"
              { crontab -l 2>/dev/null | grep -v "social-miner/cron-import.php" || true; echo "$cron_line"; } | crontab -
              echo "Social Miner cron installed: $cron_line"
            else
              echo "::warning::crontab is unavailable on this Bluehost shell; cloud polling can still be run from the dashboard."
            fi
          '

      - name: Verify live health and review route
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            'https://madmorrigan.com/social-miner/api.php?action=health' | tee /tmp/health.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/health.json'))
          assert p.get('ok') is True, p
          assert p.get('storage_writable') is True, p
          assert p.get('curl_available') is True, p
          assert p.get('bot_analysis') is True, p
          assert p.get('version') == '0.4.0', p
          print('Social Miner health OK:', p)
          PY
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' 'https://madmorrigan.com/social-miner/review.php?id=healthcheck')"
          test "$code" = "302"

      - name: Record verified deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          health=json.load(open('/tmp/health.json'))
          payload={
              'deployed_commit': os.environ['GITHUB_SHA'],
              'verified_at_utc': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'health': health,
              'url': 'https://madmorrigan.com/social-miner/api.php?action=health',
          }
          os.makedirs('.deploy-status', exist_ok=True)
          with open('.deploy-status/social-miner.json','w',encoding='utf-8') as f:
              json.dump(payload,f,indent=2,sort_keys=True)
              f.write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy-status/social-miner.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Social Miner deployment [skip ci]'
          git push origin HEAD:main
