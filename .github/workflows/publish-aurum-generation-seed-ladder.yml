name: Publish Aurum Generation Seed Ladder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-generation-seed-ladder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-generation-seed-ladder-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify ClusterSites-canonical projection and approved blob
        id: source
        shell: bash
        run: |
          set -euo pipefail
          canonical_commit='b55565ada8bc3359d556b431762147653529dcfa'
          projection_commit='43e3b229f7c8d8a9fc625635d73b2bb1cea3b1e2'
          expected_blob='f36d52ee70a3e0838d9c988559bbfd0fc13f36da'
          projection="$RUNNER_TEMP/generation-seed-ladder-canonical.js"
          current="$RUNNER_TEMP/generation-seed-ladder-current.js"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            'https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js' -o "$current"
          test -s "$projection"; test -s "$current"
          node --check "$projection"
          cmp -s "$projection" "$current"
          blob="$(git hash-object "$projection")"
          test "$blob" = "$expected_blob"
          for token in \
            'AURUM_GENERATION_SEED_LADDER_V1_CANONICAL' \
            "canonicalWebsiteRepo:'FormatX66/ClusterSites'" \
            "componentRevision:'1.7'" \
            "ACTIVE_TRUNK_COMMIT='90fbe875533e1fe106928daf70b48f8aec574bad'" \
            "ACTIVE_TRUNK_PARENT='4c1ab29487583c12cfaf791a91fb856635b2b658'" \
            "CURRENT_PC_IMAGE_RUN='33267739225'" \
            "CURRENT_AUTOBUILD_RUN='33268291177'" \
            'openCoreShareImplemented:true' \
            'openCoreBootAutoSyncImplemented:true' \
            'currentExactHeadAutobuildPassed:false' \
            "currentExactHeadBlocker:'gui-live-trial-approved-route-contract-regression'" \
            'liveInstalledOpenCoreReachabilityProven:false' \
            'liveInstalledBootAutoSyncReceiptProven:false' \
            'humanActionInferred:false' \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:'; do
            grep -Fq "$token" "$projection"
          done
          echo "file=$projection" >> "$GITHUB_OUTPUT"
          echo "blob=$blob" >> "$GITHUB_OUTPUT"
          echo "canonical_commit=$canonical_commit" >> "$GITHUB_OUTPUT"
          echo "projection_commit=$projection_commit" >> "$GITHUB_OUTPUT"
          echo 'CLUSTERSITES_CANONICAL_PROJECTION_OK'

      - name: Verify exact projection CI and current Aurum evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          projection='43e3b229f7c8d8a9fc625635d73b2bb1cea3b1e2'
          ci_run='33269246843'
          active='90fbe875533e1fe106928daf70b48f8aec574bad'
          parent='4c1ab29487583c12cfaf791a91fb856635b2b658'
          restored='a4b605b50708252fa945783e619a68b706d29382'
          route_fix='6c9baefd9de4583976d99b3a90ac6a28114986bb'
          pc_run='33267739225'
          autobuild_run='33268291177'
          api='https://api.github.com/repos/FormatX66/BoxBrain'
          raw="https://raw.githubusercontent.com/FormatX66/BoxBrain/$active"
          curl -fsSL "$api/actions/runs/$ci_run" -o "$RUNNER_TEMP/ci.json"
          curl -fsSL "$api/commits/$active" -o "$RUNNER_TEMP/active.json"
          curl -fsSL "$api/compare/$restored...$active" -o "$RUNNER_TEMP/compare.json"
          for spec in "$pc_run:pc" "$autobuild_run:autobuild"; do
            id="${spec%%:*}"; name="${spec##*:}"
            curl -fsSL "$api/actions/runs/$id" -o "$RUNNER_TEMP/$name-run.json"
            curl -fsSL "$api/actions/runs/$id/jobs?per_page=100" -o "$RUNNER_TEMP/$name-jobs.json"
          done
          curl -fsSL "$raw/Projects/AurumPC/README.md" -o "$RUNNER_TEMP/readme.md"
          curl -fsSL "$raw/Projects/AurumPC/aurum_core_share.py" -o "$RUNNER_TEMP/core-share.py"
          curl -fsSL "$raw/Projects/AurumPC/runtime-assets/etc/systemd/system/aurum-auto-sync.service" -o "$RUNNER_TEMP/auto-sync.service"
          curl -fsSL "$raw/Projects/AurumPC/runtime-assets/etc/systemd/system/aurum-core-share.service" -o "$RUNNER_TEMP/core-share.service"
          curl -fsSL "$raw/Projects/Codelation/field/external_prerequisite_evidence.py" -o "$RUNNER_TEMP/current-consumer.py"
          curl -fsSL "$raw/Projects/Codelation/autobuild/external_evidence/adaptive_shell_gui_live_trial.json" -o "$RUNNER_TEMP/current-evidence.json"
          curl -fsSL "https://raw.githubusercontent.com/FormatX66/BoxBrain/$route_fix/Projects/Codelation/field/external_prerequisite_evidence.py" -o "$RUNNER_TEMP/fixed-consumer.py"
          curl -fsSL "https://raw.githubusercontent.com/FormatX66/BoxBrain/$route_fix/Projects/Codelation/tests/test_adaptive_shell_gui_deployment.py" -o "$RUNNER_TEMP/fixed-tests.py"
          grep -Fq 'Open core sharing' "$RUNNER_TEMP/readme.md"
          grep -Fq 'GET /status' "$RUNNER_TEMP/readme.md"
          grep -Fq 'POST /seed-sync' "$RUNNER_TEMP/readme.md"
          grep -Fq '"authentication_required": False' "$RUNNER_TEMP/core-share.py"
          grep -Fq '"arbitrary_command": False' "$RUNNER_TEMP/core-share.py"
          grep -Fq '"file_serving": False' "$RUNNER_TEMP/core-share.py"
          grep -Fq '"directory_listing": False' "$RUNNER_TEMP/core-share.py"
          grep -Fq '"exported": False' "$RUNNER_TEMP/core-share.py"
          grep -Fq 'aurum/trunk-v0.01' "$RUNNER_TEMP/core-share.py"
          grep -Fq 'After=network-online.target aurum-network-bootstrap.service' "$RUNNER_TEMP/auto-sync.service"
          grep -Fq 'aurum_core_share.py seed-sync' "$RUNNER_TEMP/auto-sync.service"
          grep -Fq 'aurum_core_share.py serve --bind 0.0.0.0 --port 8765' "$RUNNER_TEMP/core-share.service"
          grep -Fq 'ProtectHome=yes' "$RUNNER_TEMP/core-share.service"
          grep -Fq 'InaccessiblePaths=-/var/lib/aurum/slush' "$RUNNER_TEMP/core-share.service"
          grep -Fq 'USB_SSH_ROUTE = "10.12.194.1"' "$RUNNER_TEMP/current-consumer.py"
          grep -Fq 'GUI_LIVE_TRIAL_APPROVED_ROUTES' "$RUNNER_TEMP/fixed-consumer.py"
          grep -Fq 'for approved_route in ("10.12.194.1", "10.42.194.1", "bbpi4.local", "192.168.0.194")' "$RUNNER_TEMP/fixed-tests.py"
          python3 - "$RUNNER_TEMP/ci.json" "$RUNNER_TEMP/active.json" "$RUNNER_TEMP/compare.json" "$RUNNER_TEMP/pc-run.json" "$RUNNER_TEMP/pc-jobs.json" "$RUNNER_TEMP/autobuild-run.json" "$RUNNER_TEMP/autobuild-jobs.json" "$RUNNER_TEMP/current-evidence.json" "$projection" "$active" "$parent" "$restored" <<'PY'
          import json,sys
          ci,active_doc,compare_doc,pc_run,pc_jobs,autobuild,autobuild_jobs,evidence=[json.load(open(p,encoding='utf-8')) for p in sys.argv[1:9]]
          projection,active,parent,restored=sys.argv[9:13]
          assert ci.get('name')=='BoxBrain CI' and ci.get('head_sha')==projection
          assert ci.get('status')=='completed' and ci.get('conclusion')=='success'
          assert active_doc.get('sha')==active and active_doc.get('parents',[{}])[0].get('sha')==parent
          assert active_doc.get('commit',{}).get('tree',{}).get('sha')=='8cb50b94a22ca3ee1015bd69d62dfcedec06cdfa'
          assert compare_doc.get('status')=='ahead' and compare_doc.get('behind_by')==0
          assert compare_doc.get('merge_base_commit',{}).get('sha')==restored
          changed={f.get('filename') for f in active_doc.get('files',[])}
          assert changed and all(p.startswith('Projects/AurumPC/') for p in changed)
          assert pc_run.get('head_sha')==active and pc_run.get('conclusion')=='success'
          by={j.get('name'):j for j in pc_jobs.get('jobs',[])}
          for name in ('validate','build-image','generic-uefi-smoke','hp-twin-smoke','publish-verified-image'):
              assert by.get(name,{}).get('conclusion')=='success', name
          assert autobuild.get('head_sha')==active and autobuild.get('conclusion')=='failure'
          loop=next(j for j in autobuild_jobs.get('jobs',[]) if j.get('name')=='Resume verified native growth')
          assert [s.get('name') for s in loop.get('steps',[]) if s.get('conclusion')=='failure']==['Verify native self-build contracts']
          assert evidence.get('route')=='192.168.0.194'
          assert evidence.get('transport',{}).get('usb_route')=='192.168.0.194'
          assert evidence.get('verified') is True
          print('GENERATION_LADDER_V17_EVIDENCE_OK')
          PY

      - name: Configure Bluehost SSH with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Back up current Command Center
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() { local out="$1"; shift; local n=1 tmp; tmp="$(mktemp)"; while true; do if "$@" > "$tmp"; then mv "$tmp" "$out"; return 0; fi; [ "$n" -ge 5 ] && { rm -f "$tmp"; return 1; }; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" \
            ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/generation-seed-ladder.js' ]; then cp -p '$remote/generation-seed-ladder.js' '$backup/generation-seed-ladder.js'; else touch '$backup/.missing-generation-seed-ladder.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject expandable generation ladder component
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./generation-seed-ladder\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          tag='<script src="./generation-seed-ladder.js?v=8"></script>'
          for pattern in (r'<script src="\./seed-lifecycle\.js(?:\?v=[^"]+)?\"></script>',r'<script src="\./recovery-guardian\.js(?:\?v=[^"]+)?\"></script>',r'</body>'):
              m=re.search(pattern,text)
              if m:
                  text=text[:m.start()]+tag+'\n'+text[m.start():]
                  break
          else:
              raise SystemExit('dashboard missing generation ladder injection point')
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './generation-seed-ladder.js?v=8' "$RUNNER_TEMP/index.html"

      - name: Publish with bounded retries
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 \
            "$RUNNER_TEMP/index.html" "${{ steps.source.outputs.file }}" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mv '$remote/generation-seed-ladder-canonical.js' '$remote/generation-seed-ladder.js'; chmod 644 '$remote/index.html' '$remote/generation-seed-ladder.js'"

      - name: Verify live Command Center
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/live-index.html"; js="$RUNNER_TEMP/live-generation-seed-ladder.js"
          final_url="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' \
            'https://arkmatx.com/aurum/dashboard/generation-seed-ladder.js?rev=8' -o "$js"
          grep -Fq './generation-seed-ladder.js?v=8' "$page"
          cmp -s "${{ steps.source.outputs.file }}" "$js"
          for token in \
            "componentRevision:'1.7'" \
            "ACTIVE_TRUNK_COMMIT='90fbe875533e1fe106928daf70b48f8aec574bad'" \
            'openCoreShareImplemented:true' \
            'openCoreBootAutoSyncImplemented:true' \
            'liveInstalledOpenCoreReachabilityProven:false' \
            'liveInstalledBootAutoSyncReceiptProven:false' \
            'currentExactHeadAutobuildPassed:false' \
            "currentExactHeadBlocker:'gui-live-trial-approved-route-contract-regression'" \
            'humanActionInferred:false' \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:'; do
            grep -Fq "$token" "$js"
          done
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back on verification failure
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/generation-seed-ladder.js' ]; then cp -p '$backup/generation-seed-ladder.js' '$remote/generation-seed-ladder.js'; elif [ -f '$backup/.missing-generation-seed-ladder.js' ]; then rm -f '$remote/generation-seed-ladder.js'; fi"

      - name: Record verified live receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-generation-seed-ladder-live.json <<EOF_RECEIPT
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/generation-seed-ladder-v1.js",
            "canonical_component_commit": "${{ steps.source.outputs.canonical_commit }}",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx/generation-seed-ladder-v1.js",
            "deployment_carrier": "FormatX66/wetbeard-site",
            "component_revision": "1.7",
            "approved_blob": "${{ steps.source.outputs.blob }}",
            "boxbrain_projection_commit": "${{ steps.source.outputs.projection_commit }}",
            "boxbrain_ci_run": 33269246843,
            "boxbrain_ci_proven": true,
            "active_trunk_commit": "90fbe875533e1fe106928daf70b48f8aec574bad",
            "open_core_share_implemented": true,
            "open_core_seed_sync_fixed_forward_trunk": true,
            "open_core_boot_auto_sync_implemented": true,
            "current_pc_image_run": 33267739225,
            "current_pc_image_validation_passed": true,
            "current_generic_uefi_smoke_passed": true,
            "current_hp_twin_smoke_passed": true,
            "current_verified_image_published": true,
            "current_autobuild_run": 33268291177,
            "current_exact_head_autobuild_passed": false,
            "current_exact_head_blocker": "gui-live-trial-approved-route-contract-regression",
            "historical_approved_route_fix_commit": "6c9baefd9de4583976d99b3a90ac6a28114986bb",
            "live_installed_open_core_reachability_proven": false,
            "live_installed_boot_auto_sync_receipt_proven": false,
            "human_action_inference": false,
            "major_box_added": false,
            "seed_lifecycle_remains_expandable": true,
            "frontiers_advancing_visible": true,
            "needs_work_system_owned": true,
            "needs_work_owner": "aurum-system",
            "backup_before_publish": true,
            "rollback_on_verification_failure": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF_RECEIPT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-generation-seed-ladder-live.json
          git commit -m 'Record Aurum generation seed ladder v1.7 live [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
