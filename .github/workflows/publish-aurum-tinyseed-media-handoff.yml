name: Publish Aurum Tiny Seed Media Handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-tinyseed-media-handoff.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-tinyseed-media-handoff-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Fetch validated public projection
        id: source
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/tinyseed-media-handoff-v1.js"
          curl --fail-with-body --silent --show-error --location \
            'https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/tinyseed-media-handoff-v1.js' \
            -o "$src"
          test -s "$src"
          node --check "$src"
          grep -Fq 'AURUM_TINYSEED_MEDIA_HANDOFF_V1_6_CANONICAL' "$src"
          grep -Fq "BusType -eq 'USB'" "$src"
          grep -Fq 'SAFE_TO_PREFLIGHT_ONLY' "$src"
          grep -Fq 'AMBIGUOUS_MULTIPLE_ELIGIBLE' "$src"
          grep -Fq 'latest-tinyseed-physical-preflight.json' "$src"
          grep -Fq 'tinyseed-flash-request.json' "$src"
          grep -Fq 'latest-tinyseed-flash-receipt.json' "$src"
          grep -Fq 'Projects/Aurum/Germ/network.py' "$src"
          grep -Fq 'aurum-tiny-seed-x86.yml' "$src"
          grep -Fq 'UNIQUE_SAFE_TO_PREFLIGHT_ONLY' "$src"
          grep -Fq 'REFUSE_DISCOVERY_RELEASE' "$src"
          grep -Fq 'fresh-current-release-read-only-usb-discovery' "$src"
          grep -Fq 'WAITING_FOR_SYSTEM_DISCOVERY_REFRESH' "$src"
          grep -Fq 'CURRENT_RELEASE_DISCOVERY_REFRESH_REQUIRED' "$src"
          grep -Fq 'currentReleaseDiscoveryRefreshRequired:refreshSystem' "$src"
          grep -Fq 'systemDiscoveryRefreshCreatesHumanAction:false' "$src"
          grep -Fq 'AUTHORIZED_ONCE' "$src"
          grep -Fq 'WAITING_FOR_EXPLICIT_WRITE_AUTHORITY' "$src"
          grep -Fq 'AUTHORIZED_FLASH_PENDING' "$src"
          grep -Fq 'READY_TO_BOOT' "$src"
          grep -Fq 'recoverySchemaCompatible' "$src"
          grep -Fq 'physicalPreflightSchemaCompatible' "$src"
          grep -Fq 'receiptMatchesPreflight' "$src"
          grep -Fq 'receiptSupersedesAuthorizationCarrier' "$src"
          grep -Fq 'completionReceiptRequiresCurrentPreflightMatch:true' "$src"
          grep -Fq 'tinySeedNetworkRegrowGateEvidence' "$src"
          grep -Fq 'tinySeedNetworkBootGateEvidence' "$src"
          grep -Fq 'tinySeedNetworkCurrentReleaseProof' "$src"
          grep -Fq 'networkReadinessCreatesHumanAction:false' "$src"
          grep -Fq 'physicalNetworkProofInferred:false' "$src"
          grep -Fq 'usbCandidateDiscoveryCanWrite:false' "$src"
          grep -Fq 'usbCandidateDiscoveryCreatesHumanAction:false' "$src"
          grep -Fq 'explicitWriteAuthorityRequired:authorizeHuman' "$src"
          grep -Fq 'explicitWriteAuthorityCreatesHumanAction:authorizeHuman' "$src"
          grep -Fq 'authorizedWritePendingCreatesHumanAction:false' "$src"
          grep -Fq 'fullRawReadbackRequired:true' "$src"
          grep -Fq 'current-exact-target-preflight-needs-explicit-one-shot-write-authority' "$src"
          grep -Fq 'Regrow network gate:' "$src"
          grep -Fq 'Frontiers Advancing:' "$src"
          grep -Fq 'Needs Work → Aurum/System:' "$src"
          grep -Fq 'Your Actions:' "$src"
          echo "file=$src" >> "$GITHUB_OUTPUT"

      - name: Configure Bluehost SSH with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null && exit 0
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Back up current dashboard
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture(){ local out="$1"; shift; local n=1 tmp; tmp="$(mktemp)"; while true; do if "$@" > "$tmp"; then mv "$tmp" "$out"; return 0; fi; [ "$n" -ge 5 ] && { rm -f "$tmp"; return 1; }; sleep $((n*5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/tinyseed-media-handoff-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" \
            ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/tinyseed-media-handoff-v1.js' ]; then cp -p '$remote/tinyseed-media-handoff-v1.js' '$backup/tinyseed-media-handoff-v1.js'; else touch '$backup/.missing-tinyseed-media-handoff-v1.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject cache-busted component
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./tinyseed-media-handoff-v1\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          tag='<script src="./tinyseed-media-handoff-v1.js?v=107"></script>'
          marker=re.search(r'<script src="\./recovery-guardian\.js(?:\?v=[^"]+)?"></script>',text)
          if marker: text=text[:marker.end()]+'\n'+tag+text[marker.end():]
          elif '</body>' in text: text=text.replace('</body>',tag+'\n</body>',1)
          else: raise SystemExit('dashboard missing injection point')
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './tinyseed-media-handoff-v1.js?v=107' "$RUNNER_TEMP/index.html"

      - name: Publish with bounded retries
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry(){ local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n*5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 \
            "$RUNNER_TEMP/index.html" "${{ steps.source.outputs.file }}" \
            "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; chmod 644 '$remote/index.html' '$remote/tinyseed-media-handoff-v1.js'"

      - name: Verify live component
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"; js="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' \
            'https://arkmatx.com/aurum/dashboard/tinyseed-media-handoff-v1.js?rev=107' -o "$js"
          grep -Fq './tinyseed-media-handoff-v1.js?v=107' "$page"
          grep -Fq 'AURUM_TINYSEED_MEDIA_HANDOFF_V1_6_CANONICAL' "$js"
          grep -Fq 'UNIQUE_SAFE_TO_PREFLIGHT_ONLY' "$js"
          grep -Fq 'REFUSE_DISCOVERY_RELEASE' "$js"
          grep -Fq 'WAITING_FOR_SYSTEM_DISCOVERY_REFRESH' "$js"
          grep -Fq 'currentReleaseDiscoveryRefreshRequired:refreshSystem' "$js"
          grep -Fq 'systemDiscoveryRefreshCreatesHumanAction:false' "$js"
          grep -Fq 'AUTHORIZED_ONCE' "$js"
          grep -Fq 'WAITING_FOR_EXPLICIT_WRITE_AUTHORITY' "$js"
          grep -Fq 'AUTHORIZED_FLASH_PENDING' "$js"
          grep -Fq 'READY_TO_BOOT' "$js"
          grep -Fq 'recoverySchemaCompatible' "$js"
          grep -Fq 'physicalPreflightSchemaCompatible' "$js"
          grep -Fq 'receiptMatchesPreflight' "$js"
          grep -Fq 'receiptSupersedesAuthorizationCarrier' "$js"
          grep -Fq 'completionReceiptRequiresCurrentPreflightMatch:true' "$js"
          grep -Fq 'tinySeedNetworkRegrowGateEvidence' "$js"
          grep -Fq 'tinySeedNetworkBootGateEvidence' "$js"
          grep -Fq 'tinySeedNetworkCurrentReleaseProof' "$js"
          grep -Fq 'networkReadinessCreatesHumanAction:false' "$js"
          grep -Fq 'physicalNetworkProofInferred:false' "$js"
          grep -Fq 'usbCandidateDiscoveryCanWrite:false' "$js"
          grep -Fq 'usbCandidateDiscoveryCreatesHumanAction:false' "$js"
          grep -Fq 'explicitWriteAuthorityRequired:authorizeHuman' "$js"
          grep -Fq 'explicitWriteAuthorityCreatesHumanAction:authorizeHuman' "$js"
          grep -Fq 'authorizedWritePendingCreatesHumanAction:false' "$js"
          grep -Fq 'fullRawReadbackRequired:true' "$js"
          grep -Fq 'current-exact-target-preflight-needs-explicit-one-shot-write-authority' "$js"
          grep -Fq 'Regrow network gate:' "$js"
          grep -Fq 'Frontiers Advancing:' "$js"
          grep -Fq 'Needs Work → Aurum/System:' "$js"
          grep -Fq 'Your Actions:' "$js"
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back on verification failure
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry(){ local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n*5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/tinyseed-media-handoff-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/tinyseed-media-handoff-v1.js' ]; then cp -p '$backup/tinyseed-media-handoff-v1.js' '$remote/tinyseed-media-handoff-v1.js'; elif [ -f '$backup/.missing-tinyseed-media-handoff-v1.js' ]; then rm -f '$remote/tinyseed-media-handoff-v1.js'; fi"

      - name: Record verified live receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-tinyseed-media-handoff-live.json <<EOF
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/tinyseed-media-handoff-v1.js",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx/tinyseed-media-handoff-v1.js",
            "deployment_carrier": "FormatX66/wetbeard-site",
            "revision": "1.6",
            "read_only_usb_discovery_visible": true,
            "exact_physical_preflight_visible": true,
            "physical_preflight_schema_roll_forward_compatible": true,
            "current_release_discovery_refresh_visibility": true,
            "current_release_discovery_refresh_is_system_work": true,
            "current_release_discovery_refresh_can_create_human_action": false,
            "verified_flash_receipt_can_retire_old_authorization_carrier": true,
            "completion_receipt_requires_current_preflight_match": true,
            "end_to_end_network_regrow_gate_visible": true,
            "current_release_network_boot_proof_visible": true,
            "recovery_schema_roll_forward_compatible": true,
            "network_readiness_can_create_human_action": false,
            "physical_network_proof_inferred": false,
            "explicit_write_authority_is_human_only": true,
            "human_action_only_after_current_exact_preflight": true,
            "one_shot_write_authority_visible": true,
            "authorized_pending_is_system_work": true,
            "authorized_pending_can_create_human_action": false,
            "ready_to_boot_requires_matching_raw_readback_receipt": true,
            "ready_to_boot_boot_action_inferred": false,
            "frontiers_needs_work_your_actions_separated": true,
            "discovery_can_write": false,
            "discovery_can_create_human_action": false,
            "physical_recovery_proof_inferred": false,
            "expandable_recovery_card_preserved": true,
            "rollback_protected": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-tinyseed-media-handoff-live.json
          git commit -m 'Record Aurum Tiny Seed media handoff v1.6 live [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main