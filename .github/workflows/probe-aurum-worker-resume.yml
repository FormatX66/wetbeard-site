name: Probe Aurum Worker Resume

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-aurum-worker-resume.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: aurum-worker-resume-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read controller, node, and work state without leasing work
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          api='https://arkmatx.com/aurum/index.php'
          curl -sS -L --fail-with-body "$api" > /tmp/status.json
          curl -sS -L --fail-with-body "$api/nodes" > /tmp/nodes.json
          curl -sS -L --fail-with-body "$api/work/status?id=bbpi4-bootstrap-v1" > /tmp/work.json
          jq -e '.node == "Aurum-Arkmatx"' /tmp/status.json >/dev/null
          jq -e '.work_id == "bbpi4-bootstrap-v1"' /tmp/work.json >/dev/null

          now="$(date +%s)"
          work_status="$(jq -r '.status // "unknown"' /tmp/work.json)"
          attempts="$(jq -r '.attempts // 0' /tmp/work.json)"
          last_result="$(jq -r '.last_result_status // "none"' /tmp/work.json)"
          morris_seen="$(jq -r '[.nodes[]? | select(.node_id == "825e5a7b7d4a7aed")] | length' /tmp/nodes.json)"
          morris_last_seen="$(jq -r '[.nodes[]? | select(.node_id == "825e5a7b7d4a7aed")][0].last_seen // 0' /tmp/nodes.json)"
          if [ "$morris_last_seen" -gt 0 ]; then morris_age=$((now - morris_last_seen)); else morris_age=-1; fi
          morris_fresh=false
          if [ "$morris_age" -ge 0 ] && [ "$morris_age" -le 120 ]; then morris_fresh=true; fi

          printf 'work_status=%s\nattempts=%s\nlast_result=%s\nmorris_seen=%s\nmorris_last_seen=%s\nmorris_age=%s\nmorris_fresh=%s\n' \
            "$work_status" "$attempts" "$last_result" "$morris_seen" "$morris_last_seen" "$morris_age" "$morris_fresh" >> "$GITHUB_OUTPUT"

      - name: Record only semantic worker-state changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          current='deployments/aurum-worker-probe.json'
          semantic="$(jq -nc \
            --arg ws '${{ steps.probe.outputs.work_status }}' \
            --argjson attempts '${{ steps.probe.outputs.attempts }}' \
            --arg lr '${{ steps.probe.outputs.last_result }}' \
            --argjson present '${{ steps.probe.outputs.morris_seen }}' \
            --argjson fresh '${{ steps.probe.outputs.morris_fresh }}' \
            '{bbpi4_work_status:$ws,bbpi4_attempts:$attempts,bbpi4_last_result:$lr,morris_node_present:($present>0),morris_fresh:$fresh}')"
          previous=''
          if [ -f "$current" ]; then
            previous="$(jq -c '{bbpi4_work_status,bbpi4_attempts,bbpi4_last_result,morris_node_present:(.morris_node_present==true or .morris_node_present==1),morris_fresh:(.morris_fresh // false)}' "$current" 2>/dev/null || true)"
          fi
          if [ "$semantic" = "$previous" ]; then
            echo 'AURUM_WORKER_PROBE no-new-semantic-state'
            exit 0
          fi

          checked="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg controller 'https://arkmatx.com/aurum/index.php' \
            --arg ws '${{ steps.probe.outputs.work_status }}' \
            --argjson attempts '${{ steps.probe.outputs.attempts }}' \
            --arg lr '${{ steps.probe.outputs.last_result }}' \
            --argjson present '${{ steps.probe.outputs.morris_seen }}' \
            --argjson last_seen '${{ steps.probe.outputs.morris_last_seen }}' \
            --argjson age '${{ steps.probe.outputs.morris_age }}' \
            --argjson fresh '${{ steps.probe.outputs.morris_fresh }}' \
            --arg checked "$checked" \
            '{controller:$controller,bbpi4_work_status:$ws,bbpi4_attempts:$attempts,bbpi4_last_result:$lr,morris_node_present:($present>0),morris_last_seen_epoch:$last_seen,morris_heartbeat_age_seconds:$age,morris_fresh:$fresh,probe_mode:"read-only-state-driven",checked_at_utc:$checked}' > "$current"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$current"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Aurum worker semantic state [skip ci]'
          git push origin main
