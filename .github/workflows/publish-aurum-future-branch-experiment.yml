name: Publish Aurum Future Branch Experiment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-future-branch-experiment.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-future-branch-experiment-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact public projection of the approved ClusterSites canonical blob
        id: source
        shell: bash
        run: |
          set -euo pipefail
          # ClusterSites is canonical. Its approved main component was independently
          # validated as this exact blob before projection. This public carrier has
          # intentionally no cross-repository authority to read private canonical source.
          canonical_merge='bbaae9e379cc43a459478c47b6738b4ffb88e683'
          expected_blob='abdde5d5b52ad37e039a30b87edcf2ff03861d47'
          projection_api='https://api.github.com/repos/FormatX66/BoxBrain/contents/Web/Aurum-Arkmatx/future-branch-experiment-v1.js?ref=main'
          projection_raw='https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/future-branch-experiment-v1.js'

          projection_meta="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 "$projection_api")"
          projection_blob="$(jq -r '.sha' <<<"$projection_meta")"
          test "$projection_blob" = "$expected_blob"
          projection="$RUNNER_TEMP/future-branch-experiment.js"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 "$projection_raw" -o "$projection"
          test -s "$projection"
          node --check "$projection"
          test "$(git hash-object "$projection")" = "$expected_blob"

          for marker in \
            'AURUM_FUTURE_BRANCH_EXPERIMENT_V1_CANONICAL' \
            'Canonical website owner: FormatX66/ClusterSites.' \
            'gha-33567140374-attempt-1' \
            "sourceEvidenceCommit:'31113892de1ff66861fc9f3fb53cfe7d3734b9ee'" \
            "selectedPath:'current-release-flash-readback-proven-awaiting-physical-boot'" \
            "surfaceRevision:'v1.5'" \
            'stableSelectionCycleCount:4' \
            "stableSelectionRunIds:['33472480781','33513733596','33549260662','33567140374']" \
            'stableSelectionCycles:[35,36,37,38]' \
            "substantiveChange:'handoff-readiness'" \
            'equivalentRepeatSuppression:true' \
            'republishOnlyOnSubstantiveEvidenceChange:true' \
            'Prepared handoff process' \
            "storedStatus:'ready'" \
            'storedMissingEvidence:[]' \
            "storedBuildState:'READY_TO_FLASH'" \
            "storedNextGate:'physical-flash-and-boot-proof'" \
            "selectedMachinePath:'current-release-flash-readback-proven-awaiting-physical-boot'" \
            'selectedMachinePathRealBoundary:true' \
            "correctionCommit:'a5bae15cde278f07a77068f9af977bf12d9d1b81'" \
            "correctionTestRunId:'33557714319'" \
            'correctionVerified:true' \
            'normalCycleRefreshVerified:true' \
            'preparedPacketFirst:true' \
            'fetchOnlyNewerDeltasWhenPossible:true' \
            'neverClaimDeliveryBeforeUserInteraction:true' \
            'neverPromoteUnverifiedPhysicalState:true' \
            'manualExperimentRerunRequired:false' \
            'authorityWidened:false' \
            'Frontiers Advancing' \
            'Evidence-health policy' \
            'Needs Work → Aurum/System' \
            'Your Actions' \
            "runId:'33487915033'" \
            "benchmark:'bounded_recovery_v1'" \
            "needsWorkOwner:'aurum-system'" \
            'humanActionInference:false' \
            'productionExecutionInferred:false' \
            'newMajorBoxAdded:false' \
            'existingFutureBranchBoxRemainsExpandable:true'; do
            grep -Fq -- "$marker" "$projection"
          done
          echo "AURUM_CANONICAL_APPROVAL merge=$canonical_merge blob=$expected_blob projection_match=yes"
          echo "file=$projection" >> "$GITHUB_OUTPUT"
          echo "blob=$projection_blob" >> "$GITHUB_OUTPUT"

      - name: Configure existing Bluehost SSH carrier with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"
          test -n "$BLUEHOST_USERNAME"
          test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            if [ "$attempt" -eq 5 ]; then
              echo "Bluehost SSH keyscan remained unavailable after $attempt bounded attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Back up and fetch current Command Center before mutation
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() {
            local outfile="$1"; shift
            local attempt=1 rc=0 tmp
            tmp="$(mktemp)"
            while true; do
              if "$@" > "$tmp"; then mv "$tmp" "$outfile"; return 0; fi
              rc=$?
              if [ "$attempt" -ge 5 ]; then rm -f "$tmp"; return "$rc"; fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/future-branch-experiment-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" \
            ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/future-branch-experiment.js' ]; then cp -p '$remote/future-branch-experiment.js' '$backup/future-branch-experiment.js'; else touch '$backup/.missing-future-branch-experiment.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          grep -Fq 'Progress is proof, not activity.' "$RUNNER_TEMP/index.html"
          grep -Fq './command-center.js?v=32' "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject into existing expandable Future Branch surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1])
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./future-branch-experiment\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          if '</body>' not in text:
              raise SystemExit('dashboard missing body close')
          text=text.replace('</body>','<script src="./future-branch-experiment.js?v=6"></script>\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './future-branch-experiment.js?v=6' "$RUNNER_TEMP/index.html"

      - name: Publish experiment surface with bounded connection count
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 rc=0
            while true; do
              "$@" && return 0
              rc=$?
              if [ "$attempt" -ge 5 ]; then return "$rc"; fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          stage="$RUNNER_TEMP/aurum-future-branch-experiment-publish"
          mkdir -p "$stage"
          cp "$RUNNER_TEMP/index.html" "$stage/index.html"
          cp "${{ steps.source.outputs.file }}" "$stage/future-branch-experiment.js"
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 \
            "$stage/index.html" "$stage/future-branch-experiment.js" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "chmod 644 '$remote/index.html' '$remote/future-branch-experiment.js'"

      - name: Verify live experiment surface and exact canonical bytes
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          expected_blob='abdde5d5b52ad37e039a30b87edcf2ff03861d47'
          page="$(mktemp)"
          component="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' \
            'https://arkmatx.com/aurum/dashboard/future-branch-experiment.js?rev=6' -o "$component"
          grep -Fq 'Progress is proof, not activity.' "$page"
          grep -Fq './command-center.js?v=32' "$page"
          grep -Fq './future-branch-experiment.js?v=6' "$page"
          for marker in \
            'AURUM_FUTURE_BRANCH_EXPERIMENT_V1_CANONICAL' \
            'Canonical website owner: FormatX66/ClusterSites.' \
            'gha-33567140374-attempt-1' \
            "surfaceRevision:'v1.5'" \
            "substantiveChange:'handoff-readiness'" \
            'stableSelectionCycleCount:4' \
            "storedStatus:'ready'" \
            'storedMissingEvidence:[]' \
            "storedBuildState:'READY_TO_FLASH'" \
            "storedNextGate:'physical-flash-and-boot-proof'" \
            "selectedMachinePath:'current-release-flash-readback-proven-awaiting-physical-boot'" \
            'normalCycleRefreshVerified:true' \
            'preparedPacketFirst:true' \
            'fetchOnlyNewerDeltasWhenPossible:true' \
            'neverClaimDeliveryBeforeUserInteraction:true' \
            'neverPromoteUnverifiedPhysicalState:true' \
            'equivalentRepeatSuppression:true' \
            'republishOnlyOnSubstantiveEvidenceChange:true' \
            'Frontiers Advancing' \
            'Needs Work → Aurum/System' \
            'Your Actions' \
            "needsWorkOwner:'aurum-system'" \
            'humanActionInference:false' \
            'productionExecutionInferred:false' \
            'newMajorBoxAdded:false' \
            'existingFutureBranchBoxRemainsExpandable:true'; do
            grep -Fq -- "$marker" "$component"
          done
          test "$(git hash-object "$component")" = "$expected_blob"
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back if verification fails
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 rc=0
            while true; do
              "$@" && return 0
              rc=$?
              if [ "$attempt" -ge 5 ]; then return "$rc"; fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/future-branch-experiment-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/future-branch-experiment.js' ]; then cp -p '$backup/future-branch-experiment.js' '$remote/future-branch-experiment.js'; elif [ -f '$backup/.missing-future-branch-experiment.js' ]; then rm -f '$remote/future-branch-experiment.js'; fi"

      - name: Record verified experiment deployment receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-future-branch-experiment-live.json <<EOF
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/future-branch-experiment-v1.js",
            "canonical_merge_commit": "bbaae9e379cc43a459478c47b6738b4ffb88e683",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx/future-branch-experiment-v1.js",
            "projection_merge_commit": "147417c9caf8754fe87ad238d5f185764adf46cf",
            "projection_ci_run_id": "33568196467",
            "component_blob_sha": "${{ steps.source.outputs.blob }}",
            "deployment_carrier": "FormatX66/wetbeard-site",
            "surface_revision": "v1.5",
            "substantive_change": "handoff-readiness",
            "experiment_evidence_source_commit": "31113892de1ff66861fc9f3fb53cfe7d3734b9ee",
            "experiment_run_id": "33567140374",
            "experiment_id": "gha-33567140374-attempt-1",
            "experiment_cycle": 38,
            "experiment_effective_cycle": 41,
            "stable_selection_cycle_count": 4,
            "stable_selection_run_ids": ["33472480781", "33513733596", "33549260662", "33567140374"],
            "stable_selection_cycles": [35, 36, 37, 38],
            "equivalent_repeat": true,
            "equivalent_repeat_suppression": true,
            "republish_only_on_substantive_evidence_change": true,
            "selected_path": "current-release-flash-readback-proven-awaiting-physical-boot",
            "selected_probability": 0.8888888888888888,
            "selected_count": 1,
            "population_size": 8,
            "provider_sweeps_passed": true,
            "seed_artifact_fingerprint": "8a67443e3935d64c2d51f2df2785496adeacf56de91863b69fd8d46bfe75c015",
            "handoff_source_run_id": "33567140374",
            "handoff_stored_status": "ready",
            "handoff_stored_missing_evidence": [],
            "handoff_stored_build_state": "READY_TO_FLASH",
            "handoff_stored_next_gate": "physical-flash-and-boot-proof",
            "handoff_selected_machine_path": "current-release-flash-readback-proven-awaiting-physical-boot",
            "handoff_selected_machine_path_real_boundary": true,
            "handoff_branch_state_sha256": "11280c2c9fddfe00502bbee2a855417f44e2a4aa662a215aa6b50842f3b258ae",
            "handoff_calibration_sha256": "8431f00f73b22568eb1b26dea43a8f2cb40f33a51f29c73f99a124693bc4aa4f",
            "handoff_combined_fingerprint": "8a67443e3935d64c2d51f2df2785496adeacf56de91863b69fd8d46bfe75c015",
            "handoff_future_branch_seed_sha256": "148ee83e62f85702fd811d7777cd454f20ba842d07c267d154381991bbdc43fe",
            "handoff_correction_commit": "a5bae15cde278f07a77068f9af977bf12d9d1b81",
            "handoff_correction_test_run_id": "33557714319",
            "handoff_correction_verified": true,
            "handoff_normal_cycle_refresh_verified": true,
            "handoff_prepared_packet_first": true,
            "handoff_fetch_only_newer_deltas_when_possible": true,
            "handoff_never_claim_delivery_before_user_interaction": true,
            "handoff_never_promote_unverified_physical_state": true,
            "handoff_manual_experiment_rerun_required": false,
            "handoff_authority_widened": false,
            "experiment_race_run_id": "33487915033",
            "experiment_race_shared_benchmark": "bounded_recovery_v1",
            "experiment_race_lane_count": 4,
            "experiment_race_all_native_passed": true,
            "experiment_race_all_shared_benchmark_passed": true,
            "experiment_race_auto_promotion": false,
            "physical_boot_verified": false,
            "guardian_forced_rollback_verified": false,
            "existing_future_branch_box_expandable": true,
            "major_box_added": false,
            "needs_work_system_owned": true,
            "production_execution_inferred": false,
            "human_action_inference": false,
            "backup_before_publish": true,
            "rollback_on_verify_failure": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-future-branch-experiment-live.json
          git commit -m 'Record Aurum Future Branch experiment v1.5 live [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
