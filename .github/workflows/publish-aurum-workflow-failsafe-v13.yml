name: Publish Aurum Workflow Failsafe v1.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-workflow-failsafe-v13.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-workflow-failsafe-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Fetch validated public projection of canonical failsafe
        id: source
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/workflow-failsafe.js"
          curl --fail-with-body --silent --show-error --location \
            'https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/workflow-failsafe-v1.js' \
            -o "$src"
          test -s "$src"
          grep -Fq 'AURUM_WORKFLOW_FAILSAFE_V1_4_CANONICAL' "$src"
          grep -Fq 'self-hosted Linux' "$src"
          grep -Fq 'scheduler placement has not occurred' "$src"
          grep -Fq 'Workflow state alone never creates a human task.' "$src"
          echo "file=$src" >> "$GITHUB_OUTPUT"

      - name: Configure Bluehost SSH with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Back up current command center and fetch index
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() { local out="$1"; shift; local n=1 tmp; tmp="$(mktemp)"; while true; do if "$@" > "$tmp"; then mv "$tmp" "$out"; return 0; fi; if [ "$n" -ge 5 ]; then rm -f "$tmp"; return 1; fi; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/workflow-failsafe-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" \
            ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/workflow-failsafe.js' ]; then cp -p '$remote/workflow-failsafe.js' '$backup/workflow-failsafe.js'; else touch '$backup/.missing-workflow-failsafe.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject cache-busted failsafe component
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./workflow-failsafe\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          tag='<script src="./workflow-failsafe.js?v=14"></script>'
          marker=re.search(r'<script src="\./action-ownership\.js(?:\?v=[^"]+)?"></script>',text)
          if marker:
              text=text[:marker.start()]+tag+'\n'+text[marker.start():]
          elif '</body>' in text:
              text=text.replace('</body>',tag+'\n</body>',1)
          else:
              raise SystemExit('dashboard missing injection point')
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './workflow-failsafe.js?v=14' "$RUNNER_TEMP/index.html"

      - name: Publish failsafe component with bounded retries
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; if [ "$n" -ge 5 ]; then return 1; fi; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 \
            "$RUNNER_TEMP/index.html" "${{ steps.source.outputs.file }}" \
            "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mv -f '$remote/workflow-failsafe-v1.js' '$remote/workflow-failsafe.js' 2>/dev/null || true; chmod 644 '$remote/index.html' '$remote/workflow-failsafe.js'"

      - name: Verify live runner-aware workflow failsafe
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"; js="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' \
            'https://arkmatx.com/aurum/dashboard/workflow-failsafe.js?rev=14' -o "$js"
          grep -Fq './workflow-failsafe.js?v=14' "$page"
          grep -Fq 'AURUM_WORKFLOW_FAILSAFE_V1_4_CANONICAL' "$js"
          grep -Fq 'scheduler placement has not occurred' "$js"
          grep -Fq 'does not prove whether the runner is offline, busy, mislabeled, or otherwise unavailable' "$js"
          grep -Fq 'Workflow state alone never creates a human task.' "$js"
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back on verification failure
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; if [ "$n" -ge 5 ]; then return 1; fi; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/workflow-failsafe-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/workflow-failsafe.js' ]; then cp -p '$backup/workflow-failsafe.js' '$remote/workflow-failsafe.js'; elif [ -f '$backup/.missing-workflow-failsafe.js' ]; then rm -f '$remote/workflow-failsafe.js'; fi"

      - name: Record verified live receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-workflow-failsafe-live.json <<EOF
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/workflow-failsafe-v1.js",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx/workflow-failsafe-v1.js",
            "deployment_carrier": "FormatX66/wetbeard-site",
            "workflow_failsafe_revision": "1.4",
            "hopper_echo_physical_proof_tracking": true,
            "self_hosted_runner_scheduler_placement_visible": true,
            "runner_root_cause_non_inference": true,
            "self_hosted_runner_stall_owned_by_system": true,
            "human_action_inference": false,
            "rollback_protected": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-workflow-failsafe-live.json
          git commit -m 'Record runner-aware workflow failsafe live [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
