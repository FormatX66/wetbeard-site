name: Publish Aurum Action Ownership

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-action-ownership.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-action-ownership-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify ClusterSites canonical projection and approved blob
        id: source
        shell: bash
        run: |
          set -euo pipefail
          canonical_commit='1e0b1ce4f54acdfa170e3ba6336442c8f22e7999'
          projection_commit='55ee0d3a58733fd2281a7428abc25d7d1306aff0'
          expected_blob='a3f3d5574294f855778f36b7ab09ed032c6b1e41'
          src="$RUNNER_TEMP/action-ownership-canonical.js"
          current="$RUNNER_TEMP/action-ownership-current.js"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_commit/Web/Aurum-Arkmatx/action-ownership-v1.js" -o "$src"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/action-ownership-v1.js" -o "$current"
          test -s "$src"; test -s "$current"
          node --check "$src"; node --check "$current"
          cmp -s "$src" "$current"
          test "$(git hash-object "$src")" = "$expected_blob"
          for token in \
            'AURUM_ACTION_OWNERSHIP_V1_10_CANONICAL' \
            'Canonical website owner: FormatX66/ClusterSites.' \
            "const HOPPER_STATUS='https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/hopper-status.json'" \
            'const HOPPER_STATUS_MAX_AGE=60*60*1000' \
            'Hopper live-status observability stale' \
            'hopper-status runner lane' \
            'Do not infer Hopper power state' \
            'YOUR ACTIONS' \
            'NEEDS WORK → AURUM/SYSTEM' \
            'Unknown evidence never becomes your task.'; do
            grep -Fq "$token" "$src"
          done
          echo "file=$src" >> "$GITHUB_OUTPUT"
          echo "blob=$expected_blob" >> "$GITHUB_OUTPUT"
          echo "canonical_commit=$canonical_commit" >> "$GITHUB_OUTPUT"
          echo "projection_commit=$projection_commit" >> "$GITHUB_OUTPUT"

      - name: Verify exact projection CI
        shell: bash
        run: |
          set -euo pipefail
          ci_run='33312844569'
          projection='55ee0d3a58733fd2281a7428abc25d7d1306aff0'
          curl -fsSL "https://api.github.com/repos/FormatX66/BoxBrain/actions/runs/$ci_run" -o "$RUNNER_TEMP/ci.json"
          python3 - "$RUNNER_TEMP/ci.json" "$projection" <<'PY'
          import json,sys
          run=json.load(open(sys.argv[1],encoding='utf-8'))
          projection=sys.argv[2]
          assert run.get('name')=='BoxBrain CI'
          assert run.get('head_sha')==projection
          assert run.get('status')=='completed'
          assert run.get('conclusion')=='success'
          print('ACTION_OWNERSHIP_V110_EXACT_CI_OK')
          PY

      - name: Configure Bluehost SSH with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Back up current Command Center
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() { local out="$1"; shift; local n=1 tmp; tmp="$(mktemp)"; while true; do if "$@" > "$tmp"; then mv "$tmp" "$out"; return 0; fi; [ "$n" -ge 5 ] && { rm -f "$tmp"; return 1; }; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/action-ownership-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/action-ownership.js' ]; then cp -p '$remote/action-ownership.js' '$backup/action-ownership.js'; else touch '$backup/.missing-action-ownership.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject cache-busted action ownership component
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./action-ownership\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          tag='<script src="./action-ownership.js?v=110"></script>'
          marker=re.search(r'<script src="\./workflow-failsafe\.js(?:\?v=[^"]+)?"></script>',text)
          if marker:
              end=marker.end()
              text=text[:end]+'\n'+tag+text[end:]
          elif '</body>' in text:
              text=text.replace('</body>',tag+'\n</body>',1)
          else:
              raise SystemExit('dashboard missing action-ownership injection point')
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './action-ownership.js?v=110' "$RUNNER_TEMP/index.html"

      - name: Publish with bounded retries
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 "$RUNNER_TEMP/index.html" "${{ steps.source.outputs.file }}" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mv '$remote/action-ownership-canonical.js' '$remote/action-ownership.js'; chmod 644 '$remote/index.html' '$remote/action-ownership.js'"

      - name: Verify live Command Center
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/live-index.html"; js="$RUNNER_TEMP/live-action-ownership.js"
          final_url="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/action-ownership.js?rev=110' -o "$js"
          node --check "$js"
          test "$(git hash-object "$js")" = '${{ steps.source.outputs.blob }}'
          grep -Fq './action-ownership.js?v=110' "$page"
          for token in \
            'AURUM_ACTION_OWNERSHIP_V1_10_CANONICAL' \
            'Hopper live-status observability stale' \
            'Do not infer Hopper power state' \
            'YOUR ACTIONS' \
            'NEEDS WORK → AURUM/SYSTEM'; do
            grep -Fq "$token" "$js"
          done
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back on verification failure
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/action-ownership-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/action-ownership.js' ]; then cp -p '$backup/action-ownership.js' '$remote/action-ownership.js'; elif [ -f '$backup/.missing-action-ownership.js' ]; then rm -f '$remote/action-ownership.js'; fi"

      - name: Record verified live receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-action-ownership-live.json <<EOF
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/action-ownership-v1.js",
            "canonical_commit": "${{ steps.source.outputs.canonical_commit }}",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx/action-ownership-v1.js",
            "projection_commit": "${{ steps.source.outputs.projection_commit }}",
            "approved_projection_git_blob_sha": "${{ steps.source.outputs.blob }}",
            "exact_boxbrain_ci_run": "33312844569",
            "deployment_carrier": "FormatX66/wetbeard-site",
            "action_ownership_revision": "1.10",
            "hopper_status_freshness_gate_seconds": 3600,
            "stale_hopper_observability_system_owned": true,
            "stale_hopper_observability_infers_power_state": false,
            "frontiers_needs_work_actions_separation_visible": true,
            "major_box_added": false,
            "backup_before_publish": true,
            "rollback_on_verification_failure": true,
            "human_action_inference": false,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-action-ownership-live.json
          git commit -m 'Record Aurum action ownership v1.10 live [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main