name: Publish Aurum Generation Seed Ladder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-generation-seed-ladder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-generation-seed-ladder-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify ClusterSites authority pin, byte-identical projection, and changed evidence
        id: source
        shell: bash
        run: |
          set -euo pipefail

          # ClusterSites remains canonical. The private canonical merge/blob is pinned
          # explicitly; publication consumes only the green, byte-identical public
          # BoxBrain projection. This preserves the established authority boundary
          # without requiring unauthenticated raw access to the private canonical repo.
          canonical_commit='d27c08cfe83965531c3b2f628350c482b619d531'
          projection_commit='f19076611bdc9378d07b8ac7d9cd59de1ef6e233'
          projection_main_commit='91c1c008183c8b7d633bcff1a991573902207b34'
          expected_blob='cf77eb23841855c0c886b84900685dcdfcb39a34'
          projection_ci_run='33918870346'

          active_trunk_commit='ee421ab9d7332625585555a5ac8b2c5544a2df2c'
          active_trunk_tree='b0e8a3850a9d7da3613f2c2e9d1da55c3efe4e4c'
          promotion_pr='214'
          promotion_candidate='813d0e867eb5babdef4019c5a62c0e0d40ebccca'
          promotion_vhl_run='33911513126'
          current_pc_run='33913908160'
          current_native_run='33915328066'
          hopper_snapshot_commit='5c047ab0e8fac29b9350fdea1e48c770f50540f8'

          projection="$RUNNER_TEMP/projection.js"
          projection_main="$RUNNER_TEMP/projection-main.js"
          bbapi='https://api.github.com/repos/FormatX66/BoxBrain'

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_main_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection_main"
          test -s "$projection" && test -s "$projection_main"
          node --check "$projection"
          cmp -s "$projection" "$projection_main"
          blob="$(git hash-object "$projection")"
          test "$blob" = "$expected_blob"

          for token in \
            'AURUM_GENERATION_SEED_LADDER_V1_38_CANONICAL' \
            "componentRevision:'1.38'" \
            "canonicalWebsiteRepo:'FormatX66/ClusterSites'" \
            "ACTIVE_TRUNK_COMMIT='$active_trunk_commit'" \
            "ACTIVE_TRUNK_TREE='$active_trunk_tree'" \
            "PROMOTION_PR='$promotion_pr'" \
            "PROMOTION_CANDIDATE_COMMIT='$promotion_candidate'" \
            "PROMOTION_VHL_RUN='$promotion_vhl_run'" \
            "CURRENT_PC_IMAGE_RUN='$current_pc_run'" \
            "CURRENT_NATIVE_RUN='$current_native_run'" \
            "CURRENT_HOPPER_STATUS_SNAPSHOT_COMMIT='$hopper_snapshot_commit'" \
            'promotionCandidateTreeEqualsActiveTrunkTree:true' \
            'promotionCandidateFourTargetConvergencePassed:true' \
            'activeExactShaFourTargetRunObserved:false' \
            'currentFourTargetConvergencePassedOnExactActiveSha:false' \
            'currentPcImageRunPassed:true' \
            'currentNativeRunPassed:false' \
            "currentNativeFailureStep:'Verify native self-build contracts'" \
            'hopperWifiRecoveryMerged:true' \
            'hopperWifiRecoveryCodePromotionComplete:true' \
            'hopperWifiRecoveryPhysicalWifiProven:false' \
            'hopperWifiRecoveryObservedRebootPersistenceProven:false' \
            'hopperWifiRecoverySeedPromotionProven:false' \
            "hopperStatusCurrentBlocker:'no-valid-endpoint-candidate'" \
            'hopperStatusEquivalentNullSnapshotsAreEvidenceHealth:true' \
            'humanActionInference:true' \
            "humanActionType:'physical-boot-proof'" \
            'humanActionDestructive:false' \
            'backupBeforePublishExpected:true' \
            'rollbackOnVerificationFailure:true' \
            'rerunUnchangedFailedWork:false' \
            'majorBoxAdded:false' \
            'seedLifecycleRemainsExpandable:true' \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:' \
            'Hopper Wi-Fi ownership/recovery has crossed the code-promotion boundary.' \
            'The QEMU UEFI blocker is fixed in the promoted code path.' \
            'The current active-head native lane is the immediate software blocker.' \
            'No new Wi-Fi action is justified by the merge.' \
            'One genuine physical-only step is now proven necessary.' \
            'Do not choose install, erase, format, repair, or any destructive option.' \
            'ClusterSites remains canonical for website source.'; do
            grep -Fq "$token" "$projection"
          done

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$bbapi/actions/runs/$projection_ci_run" -o "$RUNNER_TEMP/projection-ci.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$bbapi/branches/aurum/trunk-v0.01" -o "$RUNNER_TEMP/active-branch.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$bbapi/commits/$active_trunk_commit" -o "$RUNNER_TEMP/active-commit.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$bbapi/commits/$promotion_candidate" -o "$RUNNER_TEMP/candidate-commit.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$bbapi/pulls/$promotion_pr" -o "$RUNNER_TEMP/promotion-pr.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$bbapi/actions/runs/$promotion_vhl_run" -o "$RUNNER_TEMP/promotion-vhl.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$bbapi/actions/runs/$promotion_vhl_run/jobs?per_page=100" -o "$RUNNER_TEMP/promotion-vhl-jobs.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$bbapi/actions/runs/$current_pc_run" -o "$RUNNER_TEMP/current-pc.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$bbapi/actions/runs/$current_pc_run/jobs?per_page=100" -o "$RUNNER_TEMP/current-pc-jobs.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$bbapi/actions/runs/$current_native_run" -o "$RUNNER_TEMP/current-native.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$bbapi/actions/runs/$current_native_run/jobs?per_page=100" -o "$RUNNER_TEMP/current-native-jobs.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$hopper_snapshot_commit/Web/Aurum-Arkmatx/hopper-status.json" -o "$RUNNER_TEMP/hopper-status.json"

          python3 - "$RUNNER_TEMP" "$projection_commit" "$projection_ci_run" "$active_trunk_commit" "$active_trunk_tree" "$promotion_candidate" "$promotion_vhl_run" "$current_pc_run" "$current_native_run" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          projection,ci_id,active,active_tree,candidate,vhl_id,pc_id,native_id=sys.argv[2:]
          load=lambda n: json.loads((root/n).read_text(encoding='utf-8-sig'))
          def steps(job): return {s.get('name'):s.get('conclusion') for s in job.get('steps',[])}

          ci=load('projection-ci.json')
          assert ci.get('id')==int(ci_id) and ci.get('name')=='BoxBrain CI'
          assert ci.get('head_sha')==projection and ci.get('status')=='completed' and ci.get('conclusion')=='success'
          assert (load('active-branch.json').get('commit') or {}).get('sha')==active
          ac=load('active-commit.json'); cc=load('candidate-commit.json')
          assert (ac.get('commit') or {}).get('tree',{}).get('sha')==active_tree
          assert (cc.get('commit') or {}).get('tree',{}).get('sha')==active_tree

          pr=load('promotion-pr.json')
          assert pr.get('state')=='closed' and pr.get('merged_at') and pr.get('merge_commit_sha')==active
          assert (pr.get('head') or {}).get('sha')==candidate and (pr.get('base') or {}).get('ref')=='aurum/trunk-v0.01'
          assert 'not evidence of physical Wi-Fi, reboot or seed promotion success' in (pr.get('body') or '')

          vhl=load('promotion-vhl.json')
          assert vhl.get('id')==int(vhl_id) and vhl.get('head_sha')==candidate
          assert vhl.get('status')=='completed' and vhl.get('conclusion')=='success'
          vjobs={j.get('name'):j for j in load('promotion-vhl-jobs.json').get('jobs',[])}
          for name in ('Docker runtime x86_64','Docker runtime ARM64','QEMU Raspberry Pi 3B machine/runtime','QEMU UEFI x86_64 PC','Same-commit four-target convergence gate'):
              assert (vjobs.get(name) or {}).get('conclusion')=='success',name
          assert steps(vjobs['QEMU UEFI x86_64 PC']).get('Boot PC image in QEMU UEFI')=='success'
          assert steps(vjobs['Same-commit four-target convergence gate']).get('Verify exact targets, commit, and evidence labels')=='success'

          pc=load('current-pc.json')
          assert pc.get('id')==int(pc_id) and pc.get('head_sha')==active and pc.get('conclusion')=='success'
          pjobs={j.get('name'):j for j in load('current-pc-jobs.json').get('jobs',[])}
          for name in ('validate','build-image','generic-uefi-smoke','hp-twin-smoke','publish-verified-image'):
              assert (pjobs.get(name) or {}).get('conclusion')=='success',name
          assert steps(pjobs['generic-uefi-smoke']).get('Generic low-memory UEFI install reboot and self-build smoke')=='success'
          assert steps(pjobs['generic-uefi-smoke']).get('Legacy BIOS install and installed-boot smoke')=='success'

          native=load('current-native.json')
          assert native.get('id')==int(native_id) and native.get('head_sha')==active and native.get('conclusion')=='failure'
          njobs=[j for j in load('current-native-jobs.json').get('jobs',[]) if j.get('name')=='Resume verified native growth']
          assert len(njobs)==1 and steps(njobs[0]).get('Verify native self-build contracts')=='failure'
          assert steps(njobs[0]).get('Bind successful same-commit virtual convergence proof')=='skipped'
          assert steps(njobs[0]).get('Resume bounded native growth')=='skipped'
          assert steps(njobs[0]).get('Report bounded stop without global stall')=='success'

          hs=load('hopper-status.json')
          assert hs.get('endpoint') is None and hs.get('http_status') is None and hs.get('reachable') is False and hs.get('report') is None
          assert hs.get('observed_at')=='2026-09-04T19:22:23Z'
          print('GENERATION_LADDER_V138_SOURCE_AND_EVIDENCE_OK')
          PY

          echo "file=$projection" >> "$GITHUB_OUTPUT"
          echo "blob=$blob" >> "$GITHUB_OUTPUT"
          echo "canonical_commit=$canonical_commit" >> "$GITHUB_OUTPUT"
          echo "projection_commit=$projection_commit" >> "$GITHUB_OUTPUT"
          echo "projection_main_commit=$projection_main_commit" >> "$GITHUB_OUTPUT"
          echo "projection_ci_run=$projection_ci_run" >> "$GITHUB_OUTPUT"
          echo "active_trunk_commit=$active_trunk_commit" >> "$GITHUB_OUTPUT"
          echo "active_trunk_tree=$active_trunk_tree" >> "$GITHUB_OUTPUT"
          echo "promotion_pr=$promotion_pr" >> "$GITHUB_OUTPUT"
          echo "promotion_candidate=$promotion_candidate" >> "$GITHUB_OUTPUT"
          echo "promotion_vhl_run=$promotion_vhl_run" >> "$GITHUB_OUTPUT"
          echo "current_pc_run=$current_pc_run" >> "$GITHUB_OUTPUT"
          echo "current_native_run=$current_native_run" >> "$GITHUB_OUTPUT"
          echo "hopper_snapshot_commit=$hopper_snapshot_commit" >> "$GITHUB_OUTPUT"
          echo 'CLUSTERSITES_CANONICAL_PROJECTION_V138_OK'

      - name: Configure Bluehost SSH with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"
          test -n "$BLUEHOST_USERNAME"
          test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Back up current Command Center
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() {
            local out="$1"; shift
            local n=1 tmp="$(mktemp)"
            while true; do
              if "$@" > "$tmp"; then mv "$tmp" "$out"; return 0; fi
              [ "$n" -ge 5 ] && { rm -f "$tmp"; return 1; }
              sleep $((n * 5)); n=$((n+1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/generation-seed-ladder.js' ]; then cp -p '$remote/generation-seed-ladder.js' '$backup/generation-seed-ladder.js'; else touch '$backup/.missing-generation-seed-ladder.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject expandable generation ladder component
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./generation-seed-ladder\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          tag='<script src="./generation-seed-ladder.js?v=138"></script>'
          for pattern in (r'<script src="\./seed-lifecycle\.js(?:\?v=[^"]+)?"></script>',r'<script src="\./recovery-guardian\.js(?:\?v=[^"]+)?"></script>',r'</body>'):
              m=re.search(pattern,text)
              if m:
                  text=text[:m.start()]+tag+'\n'+text[m.start():]
                  break
          else: raise SystemExit('dashboard missing generation ladder injection point')
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './generation-seed-ladder.js?v=138' "$RUNNER_TEMP/index.html"

      - name: Publish with bounded retries
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 \
            "$RUNNER_TEMP/index.html" "${{ steps.source.outputs.file }}" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mv '$remote/projection.js' '$remote/generation-seed-ladder.js'; chmod 644 '$remote/index.html' '$remote/generation-seed-ladder.js'"

      - name: Verify live Command Center
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/live-index.html"; js="$RUNNER_TEMP/live-generation-seed-ladder.js"
          final_url="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' \
            'https://arkmatx.com/aurum/dashboard/generation-seed-ladder.js?rev=138' -o "$js"
          grep -Fq './generation-seed-ladder.js?v=138' "$page"
          cmp -s "$js" "${{ steps.source.outputs.file }}"
          node --check "$js"
          for token in \
            'AURUM_GENERATION_SEED_LADDER_V1_38_CANONICAL' \
            "componentRevision:'1.38'" \
            'promotionCandidateFourTargetConvergencePassed:true' \
            'currentPcImageRunPassed:true' \
            'currentNativeRunPassed:false' \
            "currentNativeFailureStep:'Verify native self-build contracts'" \
            'hopperWifiRecoveryMerged:true' \
            'hopperWifiRecoveryPhysicalWifiProven:false' \
            'hopperWifiRecoveryObservedRebootPersistenceProven:false' \
            "hopperStatusCurrentBlocker:'no-valid-endpoint-candidate'" \
            'humanActionInference:true' \
            "humanActionType:'physical-boot-proof'" \
            'humanActionDestructive:false' \
            'majorBoxAdded:false' \
            'seedLifecycleRemainsExpandable:true' \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:' \
            'No new Wi-Fi action is justified by the merge.' \
            'Do not choose install, erase, format, repair, or any destructive option.'; do
            grep -Fq "$token" "$js"
          done
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back on verification failure
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/generation-seed-ladder.js' ]; then cp -p '$backup/generation-seed-ladder.js' '$remote/generation-seed-ladder.js'; elif [ -f '$backup/.missing-generation-seed-ladder.js' ]; then rm -f '$remote/generation-seed-ladder.js'; fi"

      - name: Record verified live receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-generation-seed-ladder-live.json <<EOF_RECEIPT
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/generation-seed-ladder-v1.js",
            "canonical_component_commit": "${{ steps.source.outputs.canonical_commit }}",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx/generation-seed-ladder-v1.js",
            "deployment_carrier": "FormatX66/wetbeard-site",
            "component_revision": "1.38",
            "approved_blob": "${{ steps.source.outputs.blob }}",
            "boxbrain_projection_commit": "${{ steps.source.outputs.projection_commit }}",
            "boxbrain_projection_main_commit": "${{ steps.source.outputs.projection_main_commit }}",
            "boxbrain_ci_run": ${{ steps.source.outputs.projection_ci_run }},
            "boxbrain_ci_proven": true,
            "cluster_canonical_commit_pinned": true,
            "canonical_direct_fetch_required": false,
            "active_trunk_commit": "${{ steps.source.outputs.active_trunk_commit }}",
            "active_trunk_tree": "${{ steps.source.outputs.active_trunk_tree }}",
            "hopper_wifi_recovery_pr": ${{ steps.source.outputs.promotion_pr }},
            "hopper_wifi_recovery_merged": true,
            "hopper_wifi_recovery_code_promotion_complete": true,
            "hopper_wifi_recovery_physical_wifi_proven": false,
            "hopper_wifi_recovery_observed_reboot_persistence_proven": false,
            "hopper_wifi_recovery_seed_promotion_proven": false,
            "promotion_candidate_commit": "${{ steps.source.outputs.promotion_candidate }}",
            "promotion_vhl_run": ${{ steps.source.outputs.promotion_vhl_run }},
            "promotion_candidate_same_tree_as_active": true,
            "promotion_candidate_four_target_convergence_passed": true,
            "active_exact_sha_four_target_run_observed": false,
            "current_pc_image_run": ${{ steps.source.outputs.current_pc_run }},
            "current_pc_image_run_passed": true,
            "current_native_run": ${{ steps.source.outputs.current_native_run }},
            "current_native_run_passed": false,
            "current_native_failure_step": "Verify native self-build contracts",
            "hopper_status_snapshot_commit": "${{ steps.source.outputs.hopper_snapshot_commit }}",
            "hopper_status_current_blocker": "no-valid-endpoint-candidate",
            "hopper_equivalent_null_snapshot_is_evidence_health": true,
            "physical_hopper_boot_proof_proven": false,
            "guardian_forced_rollback_proof_proven": false,
            "human_action_inference": true,
            "human_action_type": "physical-boot-proof",
            "human_action_destructive": false,
            "major_box_added": false,
            "seed_lifecycle_remains_expandable": true,
            "frontiers_advancing_visible": true,
            "needs_work_system_owned": true,
            "needs_work_owner": "aurum-system",
            "backup_before_publish": true,
            "rollback_on_verification_failure": true,
            "rerun_unchanged_failed_work": false,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF_RECEIPT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-generation-seed-ladder-live.json
          git commit -m 'Record Aurum generation seed ladder v1.38 live [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
