name: Deploy Aurum Primary Compatibility Relay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-aurum-primary-relay.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-primary-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify failover worker routes before touching compatibility URL
        shell: bash
        run: |
          set -euo pipefail
          base='https://madmorrigan.com/aurum-failover'
          work="$(curl -sS -L --fail-with-body "$base/work/status?id=bbpi4-bootstrap-v1")"
          printf '%s' "$work" | grep -F 'bbpi4-bootstrap-v1' >/dev/null
          lease="$(curl -sS -L --fail-with-body "$base/work/lease?node_id=aurum-relay-probe-no-such-node&capabilities=bbpi4-bootstrap")"
          printf '%s' "$lease" | grep -F '"work": null' >/dev/null
          printf '%s' "$lease" | grep -F 'Aurum-Arkmatx' >/dev/null

      - name: Build minimal compatibility relay locally
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/aurum-relay.php" <<'PHP'
          <?php
          $base = 'https://madmorrigan.com/aurum-failover';
          $method = $_SERVER['REQUEST_METHOD'] ?? 'GET';
          $pathInfo = isset($_GET['__aurum_path']) ? (string)$_GET['__aurum_path'] : '';
          if ($pathInfo !== '' && $pathInfo[0] !== '/') $pathInfo = '/' . $pathInfo;
          $args = $_GET;
          unset($args['__aurum_path']);
          $query = http_build_query($args, '', '&', PHP_QUERY_RFC3986);
          $target = $pathInfo === '' ? $base . '/index.php' : $base . $pathInfo;
          if ($query !== '') $target .= '?' . $query;
          $body = file_get_contents('php://input');
          if (!function_exists('curl_init')) {
              http_response_code(500);
              header('Content-Type: application/json');
              echo json_encode(array('ok'=>false,'error'=>'relay-curl-unavailable'));
              exit;
          }
          $ch = curl_init($target);
          curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
          curl_setopt($ch, CURLOPT_FOLLOWLOCATION, false);
          curl_setopt($ch, CURLOPT_CONNECTTIMEOUT, 5);
          curl_setopt($ch, CURLOPT_TIMEOUT, 20);
          curl_setopt($ch, CURLOPT_CUSTOMREQUEST, $method);
          curl_setopt($ch, CURLOPT_HTTPHEADER, array('Content-Type: application/json', 'Cache-Control: no-cache', 'User-Agent: Aurum-Primary-Relay/5'));
          if ($method === 'HEAD') curl_setopt($ch, CURLOPT_NOBODY, true);
          if ($method !== 'GET' && $method !== 'HEAD' && $body !== false && $body !== '') curl_setopt($ch, CURLOPT_POSTFIELDS, $body);
          $out = curl_exec($ch);
          if ($out === false) {
              $detail = curl_error($ch);
              curl_close($ch);
              http_response_code(502);
              header('Content-Type: application/json');
              echo json_encode(array('ok'=>false,'error'=>'relay-upstream','detail'=>$detail));
              exit;
          }
          $code = (int)curl_getinfo($ch, CURLINFO_RESPONSE_CODE);
          $ctype = curl_getinfo($ch, CURLINFO_CONTENT_TYPE);
          curl_close($ch);
          http_response_code($code > 0 ? $code : 502);
          header('Content-Type: ' . ($ctype ?: 'application/json; charset=utf-8'));
          header('Cache-Control: no-store');
          echo $out;
          PHP
          cat > "$RUNNER_TEMP/aurum-relay.htaccess" <<'HT'
          RewriteEngine On
          RewriteRule ^index\.php/(.*)$ index.php?__aurum_path=/$1 [QSA,L]
          HT
          php -l "$RUNNER_TEMP/aurum-relay.php"

      - name: Configure existing Bluehost SSH carrier
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          ssh-keyscan -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Back up old entrypoint and install only directory-local compatibility layer
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum'
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" "mkdir -p '$remote'; if [ -f '$remote/index.php' ]; then cp -p '$remote/index.php' '$remote/index.php.pre-relay-${GITHUB_RUN_ID}'; fi; if [ -f '$remote/.htaccess' ]; then cp -p '$remote/.htaccess' '$remote/.htaccess.pre-relay-${GITHUB_RUN_ID}'; fi"
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 "$RUNNER_TEMP/aurum-relay.php" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/index.php"
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 "$RUNNER_TEMP/aurum-relay.htaccess" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/.htaccess"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" "chmod 644 '$remote/index.php' '$remote/.htaccess'; php -l '$remote/index.php'"

      - name: Verify old installed-worker URLs end to end without taking real work
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -u
          root='https://arkmatx.com/aurum/index.php'
          root_code="$(curl -sS -L -o /tmp/root.json -w '%{http_code}' "$root" || true)"
          status_code="$(curl -sS -L -o /tmp/status.json -w '%{http_code}' "$root/work/status?id=bbpi4-bootstrap-v1" || true)"
          lease_code="$(curl -sS -L -o /tmp/lease.json -w '%{http_code}' "$root/work/lease?node_id=aurum-relay-probe-no-such-node&capabilities=bbpi4-bootstrap" || true)"
          root_ok=false; status_ok=false; lease_ok=false
          if [ "$root_code" = '200' ] && grep -F 'Aurum-Arkmatx' /tmp/root.json >/dev/null 2>&1; then root_ok=true; fi
          if [ "$status_code" = '200' ] && grep -F 'bbpi4-bootstrap-v1' /tmp/status.json >/dev/null 2>&1; then status_ok=true; fi
          if [ "$lease_code" = '200' ] && grep -F '"work": null' /tmp/lease.json >/dev/null 2>&1 && grep -F 'Aurum-Arkmatx' /tmp/lease.json >/dev/null 2>&1; then lease_ok=true; fi
          printf 'root_http=%s\nstatus_http=%s\nlease_http=%s\nroot_ok=%s\nstatus_ok=%s\nlease_ok=%s\n' "$root_code" "$status_code" "$lease_code" "$root_ok" "$status_ok" "$lease_ok" >> "$GITHUB_OUTPUT"
          test "$root_ok" = true
          test "$status_ok" = true
          test "$lease_ok" = true

      - name: Record compatibility relay result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          outcome='${{ steps.verify.outcome }}'
          status='relay-not-fully-verified-failover-remains-live'
          if [ "$outcome" = 'success' ]; then status='installed-worker-urls-relayed-and-verified'; fi
          printf '{\n  "primary": "https://arkmatx.com/aurum/index.php",\n  "upstream": "https://madmorrigan.com/aurum-failover",\n  "root_http": "%s",\n  "status_http": "%s",\n  "lease_http": "%s",\n  "root_ok": "%s",\n  "status_ok": "%s",\n  "lease_ok": "%s",\n  "verification": "%s",\n  "status": "%s",\n  "probe_mode": "read-only-status-plus-nonmatching-lease-no-real-work-consumed",\n  "verified_at_utc": "%s"\n}\n' '${{ steps.verify.outputs.root_http }}' '${{ steps.verify.outputs.status_http }}' '${{ steps.verify.outputs.lease_http }}' '${{ steps.verify.outputs.root_ok }}' '${{ steps.verify.outputs.status_ok }}' '${{ steps.verify.outputs.lease_ok }}' "$outcome" "$status" "$verified_at" > deployments/aurum-primary-relay.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-primary-relay.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Aurum primary relay result [skip ci]'
          git push origin main
