name: Publish Aurum Autonomy Controller

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-autonomy-controller.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-autonomy-controller-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify ClusterSites-approved projection
        id: source
        shell: bash
        run: |
          set -euo pipefail
          expected='0e5b5e055b74150dc27c44402afd86828e78fe48'
          out="$RUNNER_TEMP/autonomy-controller.js"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 \
            'https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/autonomy-controller-v1.js' -o "$out"
          actual="$(git hash-object "$out")"
          test "$actual" = "$expected"
          grep -Fq 'AURUM_AUTONOMY_CONTROLLER_V1_8_CANONICAL' "$out"
          grep -Fq 'Canonical website owner: FormatX66/ClusterSites' "$out"
          grep -Fq "LIVE_NODES='/aurum/index.php/nodes'" "$out"
          grep -Fq "LIVE_WORK='/aurum/index.php/work/status?id=bbpi4-bootstrap-v1'" "$out"
          grep -Fq 'historically confirmed; not present in live node directory' "$out"
          grep -Fq 'work state is not a heartbeat' "$out"
          grep -Fq 'Frontiers Advancing:' "$out"
          grep -Fq 'Needs Work → Aurum/System:' "$out"
          grep -Fq 'Your Actions:' "$out"
          grep -Fq 'this surface never creates a human task from controller state alone.' "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "blob=$actual" >> "$GITHUB_OUTPUT"

      - name: Verify latest Farmer proof remains fail-closed
        id: farmer
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/farmer.json"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 \
            'https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Projects/AurumFarmer/Deploy/latest-windows-runtime-proof.json' -o "$proof"
          python3 - "$proof" "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          p=json.load(open(sys.argv[1],encoding='utf-8-sig'))
          assert p.get('schema')=='aurum.farmer.windows-runtime-proof.v1'
          assert p.get('task_state')=='Running'
          assert p.get('initial_health_verified') is True
          assert p.get('post_restart_health_verified') is True
          assert p.get('event_chain_valid') is True
          assert p.get('restart_resume_job_state')=='SUCCEEDED'
          assert p.get('destructive_action_allowed') is False
          assert p.get('lkg_mutation_inferred') is False
          assert p.get('physical_proof_inferred') is False
          source=p.get('source_commit',''); assert re.fullmatch(r'[0-9a-f]{40}',source)
          with open(sys.argv[2],'a') as o:
              o.write(f'source_commit={source}\n')
              o.write(f'runner_name={p.get("runner_name","")}\n')
          PY

      - name: Configure bounded Bluehost carrier
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for n in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null && exit 0
            test "$n" -lt 5 || exit 1
            sleep $((n*5))
          done

      - name: Back up current live component and dashboard
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/autonomy-controller-$GITHUB_RUN_ID"
          ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/autonomy-controller.js' ]; then cp -p '$remote/autonomy-controller.js' '$backup/autonomy-controller.js'; else touch '$backup/.missing-autonomy-controller.js'; fi; cat '$remote/index.html'" \
            > "$RUNNER_TEMP/index.html"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject v1.8 without creating another box
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src="\./autonomy-controller\.js(?:\?v=[^"]+)?"></script>\s*','',s)
          if '</body>' not in s: raise SystemExit('dashboard missing body close')
          p.write_text(s.replace('</body>','<script src="./autonomy-controller.js?v=1.8"></script>\n</body>',1),encoding='utf-8')
          PY
          grep -Fq './autonomy-controller.js?v=1.8' "$RUNNER_TEMP/index.html"

      - name: Publish bounded component update
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          stage="$RUNNER_TEMP/publish"; mkdir -p "$stage"
          cp "$RUNNER_TEMP/index.html" "$stage/index.html"
          cp "${{ steps.source.outputs.file }}" "$stage/autonomy-controller.js"
          scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 \
            "$stage/index.html" "$stage/autonomy-controller.js" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "chmod 644 '$remote/index.html' '$remote/autonomy-controller.js'"

      - name: Verify live bytes and current topology contract
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/live-index.html"; component="$RUNNER_TEMP/live-component.js"
          final="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' \
            'https://arkmatx.com/aurum/dashboard/autonomy-controller.js?rev=1.8' -o "$component"
          grep -Fq './autonomy-controller.js?v=1.8' "$page"
          grep -Fq 'AURUM_AUTONOMY_CONTROLLER_V1_8_CANONICAL' "$component"
          live_blob="$(git hash-object "$component")"; test "$live_blob" = '${{ steps.source.outputs.blob }}'
          nodes="$RUNNER_TEMP/nodes.json"; work="$RUNNER_TEMP/work.json"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 'https://arkmatx.com/aurum/index.php/nodes' -o "$nodes"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 'https://arkmatx.com/aurum/index.php/work/status?id=bbpi4-bootstrap-v1' -o "$work"
          jq -e '.nodes|type=="array"' "$nodes" >/dev/null
          jq -e '.work_id=="bbpi4-bootstrap-v1"' "$work" >/dev/null
          echo "url=$final" >> "$GITHUB_OUTPUT"
          echo "live_blob=$live_blob" >> "$GITHUB_OUTPUT"
          echo "node_count=$(jq '.nodes|length' "$nodes")" >> "$GITHUB_OUTPUT"
          echo "morris_present=$(jq --arg id '825e5a7b7d4a7aed' '[.nodes[]? | select(.node_id==$id)]|length>0' "$nodes")" >> "$GITHUB_OUTPUT"
          echo "bbpi4_work_status=$(jq -r '.status//"unknown"' "$work")" >> "$GITHUB_OUTPUT"
          echo "bbpi4_attempts=$(jq -r '.attempts//0' "$work")" >> "$GITHUB_OUTPUT"
          echo "bbpi4_last_result=$(jq -r '.last_result_status//"none"' "$work")" >> "$GITHUB_OUTPUT"

      - name: Roll back if verification fails
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/autonomy-controller-$GITHUB_RUN_ID"
          ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/autonomy-controller.js' ]; then cp -p '$backup/autonomy-controller.js' '$remote/autonomy-controller.js'; elif [ -f '$backup/.missing-autonomy-controller.js' ]; then rm -f '$remote/autonomy-controller.js'; fi"

      - name: Record verified v1.8 receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main; git checkout main; git reset --hard origin/main; mkdir -p deployments
          cat > deployments/aurum-autonomy-controller-live.json <<JSON
          {
            "site":"aurum-command-center",
            "url":"${{ steps.verify.outputs.url }}",
            "canonical_website_repo":"FormatX66/ClusterSites",
            "public_projection_repo":"FormatX66/BoxBrain",
            "component":"autonomy-controller-v1.js",
            "revision":"1.8",
            "canonical_blob":"${{ steps.source.outputs.blob }}",
            "live_blob":"${{ steps.verify.outputs.live_blob }}",
            "canonical_projection_byte_identical":true,
            "live_byte_identical":true,
            "live_topology_direct_reads":true,
            "historical_enrollment_not_current_without_live_presence":true,
            "bbpi4_work_state_not_heartbeat":true,
            "node_count":${{ steps.verify.outputs.node_count }},
            "morris_present":${{ steps.verify.outputs.morris_present }},
            "bbpi4_work_status":"${{ steps.verify.outputs.bbpi4_work_status }}",
            "bbpi4_attempts":${{ steps.verify.outputs.bbpi4_attempts }},
            "bbpi4_last_result":"${{ steps.verify.outputs.bbpi4_last_result }}",
            "farmer_self_hosted_windows_source_commit":"${{ steps.farmer.outputs.source_commit }}",
            "backup_before_publish":true,
            "rollback_on_verification_failure":true,
            "major_box_expandable":true,
            "human_action_required":false,
            "verified_at_utc":"$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          JSON
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-autonomy-controller-live.json
          git commit -m 'Record Aurum Autonomy Controller v1.8 live [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
