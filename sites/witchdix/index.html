<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Witchdix — Heather's Woods</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#080d09;color:#eadfc4;font-family:Georgia,serif}.world,.viewport{position:relative;width:100%;height:100svh;overflow:hidden}.scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:arrive .75s ease-out both}.mist{position:absolute;left:-15%;bottom:7%;width:130%;height:20%;border-radius:50%;background:#d8e3d315;filter:blur(24px);animation:mist 13s ease-in-out infinite alternate;pointer-events:none}.hotspots{position:absolute;inset:0;width:100%;height:100%;z-index:5}.hotspots polygon{fill:#d6c48122;stroke:#e8d49166;stroke-width:3;opacity:0;cursor:pointer}.hotspots polygon:hover,.hotspots polygon:focus{opacity:.18}.reveal .hotspots polygon{opacity:.48}.label{position:absolute;left:22px;top:18px;z-index:8;text-shadow:0 2px 12px #000}.label b{display:block;font-size:24px;letter-spacing:.2em}.label small{font-size:9px;letter-spacing:.18em;color:#a89a77}.whisper{position:absolute;left:22px;bottom:20px;z-index:8;max-width:62vw;font-style:italic;color:#c9bea3;text-shadow:0 2px 10px #000}.hint{position:absolute;right:18px;top:18px;z-index:9;width:38px;height:38px;border-radius:50%;border:1px solid #aa9668;background:#17140dcc;color:#dbcba5;font:bold 17px Georgia}.book-ui{position:absolute;left:17%;right:17%;top:19%;bottom:17%;z-index:6;display:none;color:#3f3424;overflow:auto;padding:20px 7%}.book-ui.show{display:block}.book-ui h1{margin:0 0 8px;font-size:clamp(30px,4vw,58px)}.searchbar{display:flex;gap:7px;margin:14px 0}.searchbar input{flex:1;border:0;border-bottom:1px solid #725f40;background:#fff2;color:#3d3223;padding:9px;font:15px Georgia}.searchbar button,.tabs button,.backbook{border:1px solid #75613f;background:#aa966766;color:#443823;padding:8px 10px;font:12px Georgia;cursor:pointer}.tabs{display:flex;flex-wrap:wrap;gap:6px}.entrygrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:15px}.entry{padding:10px;border:1px solid #786543;background:#c9b98d88}.entry h3{margin:4px 0}.entry small{font-size:9px;letter-spacing:.1em}.safety{border-left:3px solid #7a3e32;padding-left:7px;font-size:12px}.empty{padding:20px;border:1px dashed #796849;font-style:italic}.backbook{position:fixed;right:3vw;bottom:3vh;z-index:10}.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#0a100ced;color:#d8ccb0;font-size:24px;letter-spacing:.12em;opacity:0;pointer-events:none;transition:.35s}.overlay.show{opacity:1;pointer-events:auto}@keyframes arrive{from{opacity:.15;transform:scale(1.06);filter:blur(8px)}to{opacity:1;transform:scale(1)}}@keyframes mist{to{transform:translateX(10%) scaleY(1.2)}}@media(max-width:760px){.book-ui{left:8%;right:8%;top:15%;bottom:13%;padding:22px 8%;background:#d2c39bde}.entrygrid{grid-template-columns:1fr}.label small{display:none}.whisper{max-width:75vw}.tabs button{font-size:10px}}</style></head><body><main class="world"><div class="viewport"><img id="sceneBg" class="scene-bg" alt=""><div class="mist"></div><svg id="hotspots" class="hotspots" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"></svg><section id="bookUi" class="book-ui"><small>HEATHER'S FIELD REPOSITORY</small><h1>The Living Grimoire</h1><div class="searchbar"><input id="search" placeholder="Search rosemary, moon, warding, dream…"><button id="searchBtn">FIND</button><button id="recentBtn">RECENT</button></div><div class="tabs"><button data-category="herbs-plants">Herbs & Plants</button><button data-category="spells-rituals">Spells & Rituals</button><button data-category="moon-seasons">Moon & Seasons</button><button data-category="stones-tools-curiosities">Cabinet</button></div><div id="page"><div class="empty">The book is listening for published pages…</div></div></section></div><div class="label"><b>WITCHDIX</b><small id="place">THE WOODS</small></div><div id="whisper" class="whisper">The hut keeps its own hours.</div><button id="hint" class="hint">?</button><button id="backBook" class="backbook" hidden>CLOSE THE BOOK</button><div id="overlay" class="overlay">THE WOODS ARE CHANGING…</div></main><script>const key='realm-passport',api='api.php';const incoming=(new URLSearchParams(location.search).get('rp')||'').split(',').filter(Boolean);const passport=new Set([...(localStorage.getItem(key)||'').split(',').filter(Boolean),...incoming]);const save=()=>localStorage.setItem(key,[...passport].join(','));const jump=url=>{const u=new URL(url);u.searchParams.set('rp',[...passport].join(','));location.href=u.toString()};save();const $=s=>document.querySelector(s),bg=$('#sceneBg'),hot=$('#hotspots'),place=$('#place'),whisper=$('#whisper'),bookUi=$('#bookUi'),page=$('#page'),overlay=$('#overlay');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let scene='woods';const scenes={woods:{bg:'scenes/woods.svg',label:'THE WOODS',note:'The hut keeps its own hours.',hot:[['door','Enter the hut','520,160 1115,160 1130,795 500,800','study'],['mush','Mushroom ring','150,650 430,640 450,850 120,850','mush'],['morri','Moss path','0,390 175,360 190,900 0,900','morri']]},study:{bg:'scenes/study.svg',label:'HEATHER’S STUDY',note:'The book is open even when nobody remembers opening it.',hot:[['book','Living Grimoire','525,520 1090,500 1120,830 500,835','book'],['moon','Moon window','650,85 950,80 970,345 630,350','moon'],['left','Herb shelves','40,140 470,140 475,735 30,735','herbs'],['right','Cabinet shelves','1130,140 1570,140 1570,735 1125,735','cabinet'],['quill','Heather’s writing desk','1160,610 1490,600 1500,840 1145,845','admin'],['back','Back outside','0,360 150,360 160,900 0,900','woods']]},book:{bg:'scenes/book.svg',label:'THE LIVING GRIMOIRE',note:'Published pages only. Heather’s raw notes stay behind the binding.',hot:[]}};function renderScene(n){scene=n;const s=scenes[n];bg.src=s.bg;place.textContent=s.label;whisper.textContent=s.note;bookUi.classList.toggle('show',n==='book');$('#backBook').hidden=n!=='book';hot.innerHTML=s.hot.map(h=>`<polygon tabindex="0" aria-label="${h[1]}" data-target="${h[3]}" points="${h[2]}"/>`).join('');hot.querySelectorAll('polygon').forEach(p=>p.onclick=()=>act(p.dataset.target));if(n==='book')loadRecent()}function act(t){if(t==='study'||t==='woods'||t==='book')return renderScene(t);if(t==='morri'){overlay.classList.add('show');setTimeout(()=>jump('https://madmorrigan.com/morri/?from=witchdix'),750);return}if(t==='admin'){location.href='admin.php';return}if(t==='mush'){whisper.textContent='One cap has a tiny knight-shaped bite missing from it.';return}if(t==='moon'){if(passport.has('morri-chess')){passport.add('witch-moon');save();whisper.textContent='The moon glass catches a rook-shaped reflection. A knight sigil warms in the binding.'}else whisper.textContent='Eight leaf marks circle the moon. One looks almost like a knight.';return}if(t==='herbs')return renderScene('book'),setTimeout(()=>search('herbs plants'),100);if(t==='cabinet')return renderScene('book'),setTimeout(()=>search('stones tools curiosities'),100)}async function call(action,data={}){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'The archive is quiet.');return j}function render(items,title='Published Pages'){page.innerHTML=`<h2>${esc(title)}</h2>`+(items.length?`<div class="entrygrid">${items.map(x=>`<article class="entry"><small>${esc((x.category||'other').replaceAll('-',' ').toUpperCase())}</small><h3>${esc(x.title)}</h3><p>${esc(x.summary)}</p><div>${(x.tags||[]).map(t=>'#'+esc(t)).join(' ')}</div>${x.safety_note?`<div class="safety">Practical note: ${esc(x.safety_note)}</div>`:''}</article>`).join('')}</div>`:'<div class="empty">No published pages match this part of the woods yet.</div>')}async function loadRecent(){try{render((await call('public_recent')).items,'Recently Pressed Pages')}catch{render([],'The Archive Is Still Growing')}}async function search(q){try{render((await call('public_search',{q})).items,q?`Search: ${q}`:'Published Pages')}catch{render([],'The Archive Is Still Growing')}}$('#searchBtn').onclick=()=>search($('#search').value.trim());$('#search').onkeydown=e=>{if(e.key==='Enter')$('#searchBtn').click()};$('#recentBtn').onclick=loadRecent;document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>search(b.dataset.category.replaceAll('-',' ')));$('#backBook').onclick=()=>renderScene('study');$('#hint').onpointerdown=()=>document.body.classList.add('reveal');$('#hint').onpointerup=$('#hint').onpointerleave=()=>document.body.classList.remove('reveal');if(passport.has('ark-red'))whisper.textContent='A red smear appears on the path, then vanishes.';renderScene('woods');</script></body></html>
