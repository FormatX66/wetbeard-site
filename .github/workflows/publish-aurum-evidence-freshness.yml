name: Publish Aurum Evidence Health v1.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-evidence-freshness.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-evidence-freshness-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public projection of canonical evidence health
        id: source
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/evidence-health.js"
          curl --fail-with-body --silent --show-error --location \
            'https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/evidence-health-v1.js' -o "$evidence"
          test -s "$evidence"
          grep -Fq 'AURUM_EVIDENCE_HEALTH_V1_3_CANONICAL' "$evidence"
          grep -Fq 'Canonical website owner: FormatX66/ClusterSites.' "$evidence"
          grep -Fq 'six-hour operator-action window' "$evidence"
          grep -Fq 'BoxBrain hosted mirror lane' "$evidence"
          grep -Fq 'deploymentReceiptRank' "$evidence"
          grep -Fq 'never creates a human task' "$evidence"
          echo "evidence=$evidence" >> "$GITHUB_OUTPUT"

      - name: Configure Bluehost SSH carrier with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            if [ "$attempt" -eq 5 ]; then
              echo "Bluehost SSH keyscan remained unavailable after $attempt bounded attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Back up live Evidence Sources surface
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() {
            local outfile="$1"; shift
            local attempt=1 rc=0 tmp
            tmp="$(mktemp)"
            while true; do
              if "$@" > "$tmp"; then mv "$tmp" "$outfile"; return 0; fi
              rc=$?
              if [ "$attempt" -ge 5 ]; then rm -f "$tmp"; return "$rc"; fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/evidence-health-v13-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" \
            ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/evidence-health.js' ]; then cp -p '$remote/evidence-health.js' '$backup/evidence-health.js'; else touch '$backup/.missing-evidence-health.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject v1.3 evidence health without disturbing other surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          text = re.sub(r'<script src="\./evidence-health\.js(?:\?v=[^"]+)?"></script>\s*', '', text)
          tag = '<script src="./evidence-health.js?v=13"></script>'
          marker = re.search(r'<script src="\./action-ownership\.js(?:\?v=[^"]+)?"></script>', text)
          if marker:
              text = text[:marker.start()] + tag + '\n' + text[marker.start():]
          elif '</body>' in text:
              text = text.replace('</body>', tag + '\n</body>', 1)
          else:
              raise SystemExit('dashboard missing injection point')
          p.write_text(text, encoding='utf-8')
          PY
          grep -Fq './evidence-health.js?v=13' "$RUNNER_TEMP/index.html"

      - name: Publish evidence health with bounded retries
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 rc=0
            while true; do
              "$@" && return 0
              rc=$?
              if [ "$attempt" -ge 5 ]; then return "$rc"; fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          stage="$RUNNER_TEMP/aurum-evidence-health-v13"
          mkdir -p "$stage"
          cp "$RUNNER_TEMP/index.html" "$stage/index.html"
          cp "${{ steps.source.outputs.evidence }}" "$stage/evidence-health.js"
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 \
            "$stage/index.html" "$stage/evidence-health.js" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "chmod 644 '$remote/index.html' '$remote/evidence-health.js'"

      - name: Verify live hosted-mirror-aware evidence health
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"
          evidence="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' \
            'https://arkmatx.com/aurum/dashboard/evidence-health.js?rev=13' -o "$evidence"
          grep -Fq './evidence-health.js?v=13' "$page"
          grep -Fq 'AURUM_EVIDENCE_HEALTH_V1_3_CANONICAL' "$evidence"
          grep -Fq 'BoxBrain hosted mirror lane' "$evidence"
          grep -Fq 'not configured in BoxBrain hosted-mirror workflow' "$evidence"
          grep -Fq 'not a request for credentials from you' "$evidence"
          grep -Fq 'Stale or unavailable evidence never creates a human task by itself.' "$evidence"

          python3 - <<'PY' > "$RUNNER_TEMP/config-state"
          import json, re, urllib.request
          api = 'https://api.github.com/repos/FormatX66/BoxBrain/contents/Projects/AurumBridge/results?ref=main'
          req = urllib.request.Request(api, headers={'Accept':'application/vnd.github+json','User-Agent':'aurum-command-center'})
          with urllib.request.urlopen(req, timeout=20) as response:
              items = json.load(response)
          pat = re.compile(r'^web(-static)?-mirror-(\d+)(?:-attempt-(\d+))?\.json$', re.I)
          ranked = []
          for item in items:
              m = pat.match(item.get('name',''))
              if m:
                  ranked.append((int(m.group(2)), int(m.group(3) or 0), item))
          if not ranked:
              raise SystemExit('no BoxBrain mirror receipt')
          _, _, latest = max(ranked, key=lambda x:(x[0],x[1]))
          with urllib.request.urlopen(latest['download_url'], timeout=20) as response:
              payload = json.load(response)
          configured = payload.get('hosted_deployment',{}).get('configured')
          if payload.get('schema') == 'aurum-web-mirror-receipt-v1':
              configured = True
          missing = payload.get('hosted_deployment',{}).get('missing') or []
          print('configured=' + ('true' if configured is True else 'false' if configured is False else 'unknown'))
          print('missing_count=' + str(len(missing)))
          print('receipt=' + latest['name'])
          PY
          cat "$RUNNER_TEMP/config-state" >> "$GITHUB_OUTPUT"
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back if verification fails
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 rc=0
            while true; do
              "$@" && return 0
              rc=$?
              if [ "$attempt" -ge 5 ]; then return "$rc"; fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/evidence-health-v13-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/evidence-health.js' ]; then cp -p '$backup/evidence-health.js' '$remote/evidence-health.js'; elif [ -f '$backup/.missing-evidence-health.js' ]; then rm -f '$remote/evidence-health.js'; fi"

      - name: Record verified evidence-health receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-evidence-freshness-live.json <<EOF
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "public_projection_repo": "FormatX66/BoxBrain",
            "credential_carrier_repo": "FormatX66/wetbeard-site",
            "evidence_health_revision": "1.3",
            "action_ownership_revision": "1.6",
            "voice_freshness_window_seconds": 21600,
            "hosted_mirror_configuration_visible": true,
            "boxbrain_hosted_mirror_configured": "${{ steps.verify.outputs.configured }}",
            "boxbrain_hosted_mirror_missing_setting_count": ${{ steps.verify.outputs.missing_count }},
            "boxbrain_hosted_mirror_receipt": "${{ steps.verify.outputs.receipt }}",
            "missing_hosted_mirror_configuration_is_system_work": true,
            "missing_hosted_mirror_configuration_can_create_human_action": false,
            "backup_before_publish": true,
            "rollback_on_verify_failure": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-evidence-freshness-live.json
          git commit -m 'Record hosted-mirror-aware Aurum evidence health live [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
