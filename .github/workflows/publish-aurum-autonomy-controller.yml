name: Publish Aurum Autonomy Controller

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-autonomy-controller.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish ClusterSites Aurum Dashboard
    types: [completed]

permissions:
  contents: write

concurrency:
  group: aurum-autonomy-controller-production
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public projection of canonical ClusterSites autonomy surface
        id: source
        shell: bash
        run: |
          set -euo pipefail
          src='https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/autonomy-controller-v1.js'
          out="$RUNNER_TEMP/autonomy-controller.js"
          curl --fail-with-body --silent --show-error --location "$src" -o "$out"
          test -s "$out"
          grep -Fq 'AURUM_AUTONOMY_CONTROLLER_V1_CANONICAL' "$out"
          grep -Fq 'AURUM_AUTONOMY_CONTROLLER_V1_1_CANONICAL' "$out"
          grep -Fq 'AURUM_AUTONOMY_CONTROLLER_V1_2_CANONICAL' "$out"
          grep -Fq 'Canonical website owner: FormatX66/ClusterSites' "$out"
          grep -Fq 'Runtime continuity' "$out"
          grep -Fq 'Frontiers Advancing:' "$out"
          grep -Fq 'Needs Work → Aurum/System:' "$out"
          grep -Fq 'Your Actions:' "$out"
          grep -Fq 'code/CI do not prove that a real controller process has restarted and restored correctly' "$out"
          grep -Fq 'this surface never creates a human task from controller state alone.' "$out"
          grep -Fq 'Split Evidence' "$out"
          grep -Fq 'Autonomy Controller' "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Configure existing Bluehost SSH carrier with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            if [ "$attempt" -eq 5 ]; then echo "Bluehost SSH keyscan remained unavailable after $attempt bounded attempts" >&2; exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Back up and fetch current command center
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() {
            local outfile="$1"; shift; local attempt=1 rc=0 tmp; tmp="$(mktemp)"
            while true; do
              if "$@" > "$tmp"; then mv "$tmp" "$outfile"; return 0; fi
              rc=$?; if [ "$attempt" -ge 5 ]; then rm -f "$tmp"; return "$rc"; fi
              sleep $((attempt * 5)); attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/autonomy-controller-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" \
            ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/autonomy-controller.js' ]; then cp -p '$remote/autonomy-controller.js' '$backup/autonomy-controller.js'; else touch '$backup/.missing-autonomy-controller.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject autonomy controller surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./autonomy-controller\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          if '</body>' not in text: raise SystemExit('dashboard missing body close')
          text=text.replace('</body>','<script src="./autonomy-controller.js?v=1.2"></script>\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './autonomy-controller.js?v=1.2' "$RUNNER_TEMP/index.html"

      - name: Publish autonomy controller with bounded connection count
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local attempt=1 rc=0; while true; do "$@" && return 0; rc=$?; if [ "$attempt" -ge 5 ]; then return "$rc"; fi; sleep $((attempt * 5)); attempt=$((attempt + 1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          stage="$RUNNER_TEMP/aurum-autonomy-publish"; mkdir -p "$stage"
          cp "$RUNNER_TEMP/index.html" "$stage/index.html"
          cp "${{ steps.source.outputs.file }}" "$stage/autonomy-controller.js"
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 \
            "$stage/index.html" "$stage/autonomy-controller.js" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "chmod 644 '$remote/index.html' '$remote/autonomy-controller.js'"

      - name: Verify live autonomy controller
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"; component="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/autonomy-controller.js?rev=1.2' -o "$component"
          grep -Fq './autonomy-controller.js?v=1.2' "$page"
          grep -Fq 'AURUM_AUTONOMY_CONTROLLER_V1_CANONICAL' "$component"
          grep -Fq 'AURUM_AUTONOMY_CONTROLLER_V1_1_CANONICAL' "$component"
          grep -Fq 'AURUM_AUTONOMY_CONTROLLER_V1_2_CANONICAL' "$component"
          grep -Fq 'Autonomy Controller' "$component"
          grep -Fq 'edge carrier healthy' "$component"
          grep -Fq 'Split Evidence' "$component"
          grep -Fq 'Runtime continuity' "$component"
          grep -Fq 'Frontiers Advancing:' "$component"
          grep -Fq 'Needs Work → Aurum/System:' "$component"
          grep -Fq 'Your Actions:' "$component"
          grep -Fq 'fresh successful Continuous Controller workflow proves the autonomous build scheduler executed' "$component"
          grep -Fq 'code/CI do not prove that a real controller process has restarted and restored correctly' "$component"
          grep -Fq 'this surface never creates a human task from controller state alone.' "$component"
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back if verification fails
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local attempt=1 rc=0; while true; do "$@" && return 0; rc=$?; if [ "$attempt" -ge 5 ]; then return "$rc"; fi; sleep $((attempt * 5)); attempt=$((attempt + 1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/autonomy-controller-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/autonomy-controller.js' ]; then cp -p '$backup/autonomy-controller.js' '$remote/autonomy-controller.js'; elif [ -f '$backup/.missing-autonomy-controller.js' ]; then rm -f '$remote/autonomy-controller.js'; fi"

      - name: Record verified autonomy-controller receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-autonomy-controller-live.json <<EOF
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "public_projection_repo": "FormatX66/BoxBrain",
            "component": "autonomy-controller-v1.js",
            "revision": "1.2",
            "controller_cycle_surface": true,
            "carrier_health_surface": true,
            "scheduler_liveness_surface": true,
            "scheduler_edge_evidence_split": true,
            "fresh_scheduler_does_not_reprove_edge_checkpoint": true,
            "runtime_continuity_surface": true,
            "runtime_checkpoint_distinct_from_edge_checkpoint": true,
            "implementation_ci_does_not_imply_live_restart": true,
            "live_restart_proof_pending": true,
            "enrollment_frontier_surface": true,
            "expandable": true,
            "needs_work_integration": true,
            "needs_work_owner": "Aurum/System",
            "human_action_inference": false,
            "backup_before_publish": true,
            "rollback_on_verify_failure": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-autonomy-controller-live.json
          git commit -m 'Record Aurum autonomy controller live deployment [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
