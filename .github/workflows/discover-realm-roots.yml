name: Discover Realm Document Roots

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/discover-realm-roots.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.BLUEHOST_HOST }}" >> ~/.ssh/known_hosts

      - name: Ask cPanel for target document roots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployments
          for domain in arkmatx.com witchdix.com xanderzombie.com; do
            ssh "${{ secrets.BLUEHOST_USERNAME }}@${{ secrets.BLUEHOST_HOST }}" \
              "/usr/local/cpanel/bin/uapi --output=json DomainInfo single_domain_data domain='$domain'" \
              > "/tmp/${domain}.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          targets = ['arkmatx.com','witchdix.com','xanderzombie.com']
          out = {'source':'cpanel-uapi','domains':{}}
          for domain in targets:
              data=json.loads(Path('/tmp/'+domain+'.json').read_text())
              result=data.get('result',{})
              if result.get('status') != 1:
                  raise SystemExit(f'cPanel did not return hosting data for {domain}')
              info=result.get('data') or {}
              root=info.get('documentroot') or info.get('document_root')
              if not root:
                  raise SystemExit(f'No document root returned for {domain}')
              marker='/public_html'
              safe='public_html'+root.split(marker,1)[1] if marker in root else root.rstrip('/').split('/')[-1]
              if '..' in safe or safe.startswith('/'):
                  raise SystemExit(f'Unsafe root shape for {domain}')
              out['domains'][domain]={'remotePath':safe}
          Path('deployments/realm-document-roots.json').write_text(json.dumps(out,indent=2)+'\n')
          PY

      - name: Commit discovery result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/realm-document-roots.json
          git diff --cached --quiet && exit 0
          git commit -m "Record realm document roots [skip ci]"
          git push origin HEAD:main
