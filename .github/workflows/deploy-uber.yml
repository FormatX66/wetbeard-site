name: Deploy Übercorp to Bluehost

on:
  push:
    branches:
      - main
    paths:
      - 'uber/**'
      - '.github/workflows/deploy-uber.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uber-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish madmorrigan.com/uber
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out site files
        uses: actions/checkout@v4

      - name: Create deployment version marker
        shell: bash
        run: |
          set -euo pipefail
          deployed_at_utc="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{\n  "commit_sha": "%s",\n  "deployed_at_utc": "%s",\n  "status": "deployed"\n}\n' "$GITHUB_SHA" "$deployed_at_utc" > uber/deploy-version.json

      - name: Install stable visual layers and Easter eggs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          logo_css = '<link rel="stylesheet" href="/uber/assets/logo.css?v=logo2">'
          tentacles_css = '<link rel="stylesheet" href="/uber/assets/tentacles.css?v=tent1">'
          logo_js = '<script src="/uber/assets/logo.js?v=logo2"></script>'
          tentacles_js = '<script src="/uber/assets/tentacles.js?v=tent1"></script>'
          easter_js = '<script src="/uber/assets/easter-eggs-stable.js?v=egg3"></script>'
          jimothy_js = '<script src="/uber/assets/jimothy.js?v=jim1"></script>'

          html_files = [Path('uber/index.html'), Path('uber/citizen.html'), Path('uber/careers.html')]
          for p in html_files:
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<link[^>]+(?:octopus|rebuild|logo|tentacles)\.css[^>]*>\s*', '', s, flags=re.I)
              s = re.sub(r'<script[^>]+(?:octopus|rebuild|easter-eggs(?:-stable)?|jimothy|logo|tentacles)\.js[^>]*></script>\s*', '', s, flags=re.I)
              s = s.replace('</head>', logo_css + tentacles_css + '</head>')
              s = s.replace('</body>', logo_js + tentacles_js + easter_js + jimothy_js + '</body>')
              p.write_text(s, encoding='utf-8')

          lab = Path('uber/lab/index.php')
          if lab.exists():
              s = lab.read_text(encoding='utf-8')
              s = re.sub(r'<link[^>]+(?:octopus|rebuild|logo|tentacles)\.css[^>]*>\s*', '', s, flags=re.I)
              s = re.sub(r'<script[^>]+(?:octopus|rebuild|easter-eggs(?:-stable)?|jimothy|logo|tentacles)\.js[^>]*></script>\s*', '', s, flags=re.I)
              s = s.replace('</head>', '<link rel="stylesheet" href="../assets/logo.css?v=logo2"><link rel="stylesheet" href="../assets/tentacles.css?v=tent1"></head>')
              s = s.replace('</body>', '<script src="../assets/logo.js?v=logo2"></script><script src="../assets/tentacles.js?v=tent1"></script></body>')
              lab.write_text(s, encoding='utf-8')
          PY

      - name: Configure secure Bluehost connection
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"
          test -n "$BLUEHOST_USERNAME"
          test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          ssh-keyscan -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Prepare Übercorp production folder
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'test -d public_html && mkdir -p public_html/uber'

      - name: Install Website Lab API key if configured
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          UBERCORP_OPENAI_API_KEY: ${{ secrets.UBERCORP_OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${UBERCORP_OPENAI_API_KEY:-}" ]; then
            printf '%s' "$UBERCORP_OPENAI_API_KEY" | ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'umask 077; cat > "$HOME/.ubercorp-openai-key"'
          else
            echo 'Website Lab API key is not configured; Lab will remain in setup-required mode.'
          fi

      - name: Deploy Übercorp files
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: tar -C uber -czf - . | ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'tar -xzf - -C public_html/uber'

      - name: Verify deployed commit
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --header 'Cache-Control: no-cache' --output /tmp/uber-version.json 'https://madmorrigan.com/uber/deploy-version.json'
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); sys.exit(0 if d.get("commit_sha")==sys.argv[2] and d.get("status")=="deployed" else "Übercorp deploy verification failed")' /tmp/uber-version.json "$GITHUB_SHA"

      - name: Verify logo tentacles and Easter eggs are healthy
        shell: bash
        run: |
          set -euo pipefail
          for page in '' 'citizen.html' 'careers.html'; do
            url="https://madmorrigan.com/uber/${page}"
            out="/tmp/uber-${page:-index}.html"
            curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --header 'Cache-Control: no-cache' --output "$out" "$url"
            grep -q 'Übercorp' "$out"
            grep -q 'WE MAKE IT. YOU BUY IT.' "$out"
            grep -q 'P1-KLS ONLINE.' "$out"
            grep -q 'logo.css?v=logo2' "$out"
            grep -q 'logo.js?v=logo2' "$out"
            grep -q 'tentacles.css?v=tent1' "$out"
            grep -q 'tentacles.js?v=tent1' "$out"
            grep -q 'easter-eggs-stable.js?v=egg3' "$out"
            grep -q 'jimothy.js?v=jim1' "$out"
            if grep -Eq '(rebuild\.js|octopus\.js|easter-eggs\.js)' "$out"; then
              echo "Obsolete experimental script still present in $page"
              exit 1
            fi
          done
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --output /tmp/site.css 'https://madmorrigan.com/uber/assets/site.css'
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --output /tmp/site.js 'https://madmorrigan.com/uber/assets/site.js'
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --output /tmp/logo.css 'https://madmorrigan.com/uber/assets/logo.css?v=logo2'
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --output /tmp/logo.js 'https://madmorrigan.com/uber/assets/logo.js?v=logo2'
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --output /tmp/tentacles.css 'https://madmorrigan.com/uber/assets/tentacles.css?v=tent1'
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --output /tmp/tentacles.js 'https://madmorrigan.com/uber/assets/tentacles.js?v=tent1'
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --output /tmp/easter.js 'https://madmorrigan.com/uber/assets/easter-eggs-stable.js?v=egg3'
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --output /tmp/jimothy.js 'https://madmorrigan.com/uber/assets/jimothy.js?v=jim1'
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --output /tmp/wordmark.svg 'https://madmorrigan.com/uber/assets/ubercorp-wordmark-final.svg?v=logo2'
          test -s /tmp/site.css
          grep -q 'launchTrogdor' /tmp/site.js
          grep -q '.uc-page-brand' /tmp/logo.css
          if grep -q 'ucLogoSweep\|animation:' /tmp/logo.css; then echo 'Logo shimmer unexpectedly present'; exit 1; fi
          grep -q 'ubercorp-wordmark-final.svg' /tmp/logo.js
          grep -q '#ucTentacles' /tmp/tentacles.css
          grep -q "id:'ucTentacles'" /tmp/tentacles.js
          grep -q 'data-tentacle' /tmp/tentacles.js
          grep -q 'STARWARS' /tmp/easter.js
          grep -q 'DETRITUS' /tmp/easter.js
          grep -q 'P1-KLS ONLINE' /tmp/easter.js
          grep -q 'PICKLES:p1klz' /tmp/easter.js
          grep -q 'OCTOPUS' /tmp/easter.js
          grep -q 'ubercorp-wordmark-final.svg' /tmp/easter.js
          grep -q 'EMPLOYEE OF THE SUMMER' /tmp/jimothy.js
          grep -q 'aria-label="Übercorp wordmark"' /tmp/wordmark.svg
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --output /tmp/uber-lab.html 'https://madmorrigan.com/uber/lab/'
          grep -q 'WEBSITE IMPROVEMENT TERMINAL' /tmp/uber-lab.html
          grep -q 'logo.css?v=logo2' /tmp/uber-lab.html
          grep -q 'tentacles.js?v=tent1' /tmp/uber-lab.html
          response="$(curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 'https://madmorrigan.com/uber/api/compliance-score.php?name=CorporateTest')"
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); sys.exit(0 if d.get("ok") is True and isinstance(d.get("score"),int) else "Übercorp API health check failed")' "$response"

      - name: Record successful production deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployments
          deployed_at_utc="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '{\n  "site": "uber",\n  "url": "https://madmorrigan.com/uber/",\n  "commit_sha": "%s",\n  "verified_at_utc": "%s",\n  "status": "verified-live"\n}\n' "$GITHUB_SHA" "$deployed_at_utc" > deployments/uber-live.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/uber-live.json
          git commit -m 'Record Übercorp live deployment [skip ci]'
          git push
