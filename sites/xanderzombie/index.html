<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xander Zombie</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#111;color:#f2ebd8;font-family:Arial,Helvetica,sans-serif}.comic,.viewport{position:relative;width:100%;height:100svh;overflow:hidden}.scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:panelIn .55s ease-out both}.hotspots{position:absolute;inset:0;width:100%;height:100%;z-index:5}.hotspots polygon{fill:#f4e46e22;stroke:#1118;stroke-width:4;opacity:0;cursor:pointer}.hotspots polygon:hover,.hotspots polygon:focus{opacity:.18}.reveal .hotspots polygon{opacity:.45;stroke:#fff}.issue{position:absolute;left:22px;top:18px;z-index:8;padding:8px 11px;background:#111d;color:#f3ead3;font-weight:900;letter-spacing:.12em}.readout{position:absolute;left:22px;bottom:20px;z-index:8;max-width:65vw;padding:8px 12px;background:#111d;color:#eadfc6;font:700 13px Georgia}.hint{position:absolute;right:18px;top:18px;z-index:8;width:38px;height:38px;border:4px solid #111;background:#f1e5c7;font-weight:900}.transition{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#111;color:#e7ddc4;font:900 40px Arial;opacity:0;pointer-events:none;transition:.35s}.transition.show{opacity:1;pointer-events:auto}.drawer{position:fixed;inset:0;z-index:40;display:none;background:#111e;color:#eee;padding:7vh 7vw;overflow:auto}.drawer.show{display:block}.close{position:fixed;right:3vw;top:3vh;background:#eee;color:#111;border:4px solid #111;padding:8px 12px;font-weight:900}.episodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.ep{border:5px solid #eee;background:#222;padding:18px;cursor:pointer}.archive{position:absolute;right:22px;bottom:18px;z-index:8;border:4px solid #111;background:#eee2c3;padding:8px 12px;font-weight:900}.dynamic-caption{position:absolute;left:7%;top:7%;z-index:6;max-width:55%;padding:14px 18px;background:#f5e8c8;border:7px solid #111;color:#111;font:700 24px Georgia;display:none}.dynamic-caption.show{display:block}@keyframes panelIn{from{opacity:.15;transform:translateX(35px) scale(1.025);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}@media(max-width:760px){.issue{font-size:10px;left:10px;top:10px}.readout{left:10px;bottom:10px;max-width:70vw;font-size:11px}.archive{right:10px;bottom:10px;font-size:9px}.dynamic-caption{font-size:17px;max-width:72%}}</style></head><body><main class="comic"><div class="viewport"><img id="sceneBg" class="scene-bg" alt=""><svg id="hotspots" class="hotspots" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"></svg><div id="dynCaption" class="dynamic-caption"></div></div><div id="issue" class="issue">XANDER ZOMBIE • ISSUE 01</div><div id="readout" class="readout">Tuesday was pizza day.</div><button id="hint" class="hint">?</button><button id="archiveBtn" class="archive">ISSUE ARCHIVE</button><div id="transition" class="transition">THE INK TURNS TO MOSS…</div><div id="drawer" class="drawer"><button class="close" id="close">CLOSE X</button><h1>ISSUE ARCHIVE</h1><div class="episodes" id="episodes"></div></div></main><script>const key='realm-passport',api='comic-api.php';const incoming=(new URLSearchParams(location.search).get('rp')||'').split(',').filter(Boolean);const passport=new Set([...(localStorage.getItem(key)||'').split(',').filter(Boolean),...incoming]);const save=()=>localStorage.setItem(key,[...passport].join(','));const jump=url=>{const u=new URL(url);u.searchParams.set('rp',[...passport].join(','));location.href=u.toString()};save();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const bg=document.querySelector('#sceneBg'),hot=document.querySelector('#hotspots'),readout=document.querySelector('#readout'),issue=document.querySelector('#issue'),trans=document.querySelector('#transition'),dyn=document.querySelector('#dynCaption');let current='cemetery',episodes=[];const scenes={cemetery:{bg:'scenes/cemetery.svg',hot:[['xander','Xander','680,380 930,380 960,860 650,860','thought'],['moon','Moon','1160,70 1410,60 1430,330 1140,335','moon'],['next','Walk toward town','1330,350 1595,330 1595,900 1310,900','town']]},town:{bg:'scenes/town.svg',hot:[['home','Go home','60,250 455,240 470,720 40,730','home'],['woods','Take weird path','560,440 1060,420 1100,900 520,900','woods'],['back','Back','0,0 130,0 130,900 0,900','cemetery']]},woods:{bg:'scenes/woods.svg',hot:[['knight','Knight artifact','1190,260 1390,245 1400,440 1170,445','knight'],['moss','Follow the moss','600,430 1060,410 1120,900 520,900','morri'],['back','Back toward town','0,0 160,0 160,900 0,900','town']]}};function render(name){current=name;const s=scenes[name];dyn.classList.remove('show');bg.src=s.bg;bg.alt=`Xander Zombie ${name}`;hot.innerHTML=s.hot.map(h=>`<polygon tabindex="0" aria-label="${h[1]}" data-target="${h[3]}" points="${h[2]}"/>`).join('');hot.querySelectorAll('polygon').forEach(p=>p.onclick=()=>act(p.dataset.target));readout.textContent=name==='cemetery'?'Tuesday was pizza day.':name==='town'?'Normal teenage decisions remain available for some reason.':'The path has ink on one side and moss on the other.'}function act(t){if(scenes[t])return render(t);if(t==='thought'){readout.textContent='Being undead does not excuse chores.';return}if(t==='moon'){readout.textContent=passport.has('witch-moon')?'The moon has the same ring from Heather’s book.':'For a dead kid, Xander is remarkably concerned about curfew.';return}if(t==='home'){readout.textContent='Mom is going to have QUESTIONS.';setTimeout(()=>render('woods'),650);return}if(t==='knight'){if(passport.has('morri-chess')){passport.add('xander-knight');save();readout.textContent='The chess knight is lodged in the gutter between panels.'}else readout.textContent='The symbol refuses to explain itself yet.';return}if(t==='morri'){passport.add('xander-woods');save();trans.classList.add('show');setTimeout(()=>jump('https://madmorrigan.com/morri/?from=xander'),800)}}async function loadEpisodes(){try{const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'public_list'})});const j=await r.json();episodes=j.items||[]}catch{episodes=[]}renderArchive()}function renderArchive(){document.querySelector('#episodes').innerHTML=episodes.length?episodes.map((e,n)=>`<article class="ep" data-ep="${n}"><small>ISSUE ${e.issue}</small><h2>${esc(e.title)}</h2><p>${esc(e.summary)}</p></article>`).join(''):'<p>No studio-published issues yet. Issue 01 is built into the reader.</p>';document.querySelectorAll('[data-ep]').forEach(x=>x.onclick=()=>openEpisode(episodes[+x.dataset.ep]))}function openEpisode(e){document.querySelector('#drawer').classList.remove('show');issue.textContent=`XANDER ZOMBIE • ISSUE ${String(e.issue).padStart(2,'0')} • ${e.title.toUpperCase()}`;if(e.art_url){bg.src=e.art_url;bg.alt=e.title;hot.innerHTML='';dyn.textContent=e.summary||'';dyn.classList.add('show')}else{bg.src='scenes/cemetery.svg';hot.innerHTML='';dyn.textContent=(e.panels||[]).map((p,n)=>`PANEL ${n+1}: ${p.visual} — ${p.caption} “${p.dialogue}”`).join('\n\n');dyn.style.whiteSpace='pre-wrap';dyn.classList.add('show')}passport.add('xander-episode');save();readout.textContent='Published from Xander’s private creator studio.'}document.querySelector('#archiveBtn').onclick=()=>document.querySelector('#drawer').classList.add('show');document.querySelector('#close').onclick=()=>document.querySelector('#drawer').classList.remove('show');document.querySelector('#hint').onpointerdown=()=>document.body.classList.add('reveal');document.querySelector('#hint').onpointerup=document.querySelector('#hint').onpointerleave=()=>document.body.classList.remove('reveal');if(passport.has('ark-red'))document.body.style.filter='contrast(1.05)';render('cemetery');loadEpisodes();</script></body></html>
