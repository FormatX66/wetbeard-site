name: Deploy Aurum Arkmatx

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-aurum-arkmatx.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurum-arkmatx-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish Aurum-Arkmatx
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out carrier repo
        uses: actions/checkout@v4

      - name: Fetch Aurum web node from BoxBrain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/FormatX66/BoxBrain.git "$RUNNER_TEMP/BoxBrain"
          git -C "$RUNNER_TEMP/BoxBrain" sparse-checkout set Web/Aurum-Arkmatx
          php -l "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/index.php"

      - name: Configure existing Bluehost SSH carrier
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"
          test -n "$BLUEHOST_USERNAME"
          test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          ssh-keyscan -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Prepare Aurum under ArkmatX document root
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            'set -e; mkdir -p public_html/arkmatx/aurum/state/inbox public_html/arkmatx/aurum/state/outbox; chmod 755 public_html/arkmatx/aurum; chmod 700 public_html/arkmatx/aurum/state public_html/arkmatx/aurum/state/inbox public_html/arkmatx/aurum/state/outbox; rm -f public_html/arkmatx/aurum/.htaccess; php -v | head -n 2 || true'

      - name: Deploy Aurum web node
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx" -czf - index.php | \
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            'set -e; tar -xzf - -C public_html/arkmatx/aurum; chmod 644 public_html/arkmatx/aurum/index.php; php -l public_html/arkmatx/aurum/index.php'

      - name: Verify live Aurum node
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --header 'Cache-Control: no-cache' \
            --output "$body" \
            'https://arkmatx.com/aurum/index.php'
          python3 - "$body" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          assert data.get('node') == 'Aurum-Arkmatx', data
          assert data.get('status') == 'active-edge-web-node', data
          assert data.get('schema') == 'aurum.uaf.v0', data
          print(json.dumps(data,indent=2,sort_keys=True))
          PY

      - name: Verify UAF receive and receipt
        shell: bash
        run: |
          set -euo pipefail
          frame_id="gh-$(date +%s)-$RANDOM"
          payload="$(mktemp)"
          response="$(mktemp)"
          python3 - "$frame_id" "$payload" <<'PY'
          import json,sys,time
          frame={
            'schema':'aurum.uaf.v0',
            'frame_id':sys.argv[1],
            'origin':'Aurum-GitHub-Verify',
            'target':'Aurum-Arkmatx',
            'intent':'verification_ping',
            'state_delta':{'verified':True},
            'provenance':{'node':'Aurum-GitHub-Verify','created':int(time.time())},
            'verification':{'content_addressed':True,'reversible':True}
          }
          json.dump(frame,open(sys.argv[2],'w',encoding='utf-8'),separators=(',',':'))
          PY
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data-binary "@$payload" \
            'https://arkmatx.com/aurum/uaf')"
          test "$code" = '202'
          python3 - "$response" "$frame_id" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          expected=sys.argv[2]
          assert data.get('status') == 'merged', data
          receipt=data.get('receipt') or {}
          assert receipt.get('origin') == 'Aurum-Arkmatx', receipt
          assert (receipt.get('state_delta') or {}).get('received_frame') == expected, receipt
          assert (receipt.get('state_delta') or {}).get('status') == 'merged', receipt
          print(json.dumps(data,indent=2,sort_keys=True))
          PY
