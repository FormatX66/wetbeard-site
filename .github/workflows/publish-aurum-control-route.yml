name: Publish Aurum Control Route

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-control-route.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish ClusterSites Aurum Dashboard
    types: [completed]

permissions:
  contents: write

concurrency:
  group: aurum-control-route-production
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Fetch canonical ClusterSites command surfaces
        id: source
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/FormatX66/ClusterSites/main/services/aurum-arkmatx'
          route="$RUNNER_TEMP/control-route.js"
          reach="$RUNNER_TEMP/pi4-reachability.js"
          seed="$RUNNER_TEMP/seed-delivery.js"
          action="$RUNNER_TEMP/action-ownership.js"
          curl --fail-with-body --silent --show-error --location "$base/control-route-v1.js" -o "$route"
          curl --fail-with-body --silent --show-error --location "$base/pi4-reachability-v1.js" -o "$reach"
          curl --fail-with-body --silent --show-error --location "$base/seed-delivery-v1.js" -o "$seed"
          curl --fail-with-body --silent --show-error --location "$base/action-ownership-v1.js" -o "$action"
          test -s "$route"; test -s "$reach"; test -s "$seed"; test -s "$action"
          grep -Fq 'AURUM_CONTROL_ROUTE_V1_3_CANONICAL' "$route"
          grep -Fq 'SSH attempts:' "$route"
          grep -Fq 'AURUM_PI4_REACHABILITY_V1_CANONICAL' "$reach"
          grep -Fq 'transport reachability, not proof of SSH identity' "$reach"
          grep -Fq 'AURUM_SEED_DELIVERY_V1_2_CANONICAL' "$seed"
          grep -Fq 'reachabilitySuperseded' "$seed"
          grep -Fq 'AURUM_ACTION_OWNERSHIP_V1_5_CANONICAL' "$action"
          grep -Fq 'BBPI4 LAN route rediscovered; SSH path unstable' "$action"
          echo "route=$route" >> "$GITHUB_OUTPUT"
          echo "reach=$reach" >> "$GITHUB_OUTPUT"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"

      - name: Configure existing Bluehost SSH carrier with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            if [ "$attempt" -eq 5 ]; then echo "Bluehost SSH keyscan remained unavailable after $attempt bounded attempts" >&2; exit 1; fi
            sleep $((attempt * 5))
          done

      - name: Back up and fetch current command center in one SSH session
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() {
            local outfile="$1"; shift; local attempt=1 rc=0 tmp; tmp="$(mktemp)"
            while true; do
              if "$@" > "$tmp"; then mv "$tmp" "$outfile"; return 0; fi
              rc=$?; if [ "$attempt" -ge 5 ]; then rm -f "$tmp"; return "$rc"; fi
              sleep $((attempt * 5)); attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/control-route-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" \
            ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; for f in control-route.js pi4-reachability.js seed-delivery.js action-ownership.js; do if [ -f '$remote/'\"\$f\" ]; then cp -p '$remote/'\"\$f\" '$backup/'\"\$f\"; else touch '$backup/.missing-'\"\$f\"; fi; done; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject ordered command surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          specs=[
            ('control-route.js','13'),
            ('pi4-reachability.js','1'),
            ('seed-delivery.js','12'),
            ('action-ownership.js','15'),
          ]
          for name,_ in specs:
              text=re.sub(r'<script src="\./'+re.escape(name)+r'\?v=[^"]+"></script>\s*','',text)
              text=re.sub(r'<script src="\./'+re.escape(name)+r'"></script>\s*','',text)
          if '</body>' not in text: raise SystemExit('dashboard missing body close')
          tags='\n'.join(f'<script src="./{name}?v={version}"></script>' for name,version in specs)
          text=text.replace('</body>',tags+'\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './control-route.js?v=13' "$RUNNER_TEMP/index.html"
          grep -Fq './pi4-reachability.js?v=1' "$RUNNER_TEMP/index.html"
          grep -Fq './seed-delivery.js?v=12' "$RUNNER_TEMP/index.html"
          grep -Fq './action-ownership.js?v=15' "$RUNNER_TEMP/index.html"

      - name: Publish all command surfaces with bounded connection count
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local attempt=1 rc=0; while true; do "$@" && return 0; rc=$?; if [ "$attempt" -ge 5 ]; then return "$rc"; fi; sleep $((attempt * 5)); attempt=$((attempt + 1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          stage="$RUNNER_TEMP/aurum-command-publish"; mkdir -p "$stage"
          cp "$RUNNER_TEMP/index.html" "$stage/index.html"
          cp "${{ steps.source.outputs.route }}" "$stage/control-route.js"
          cp "${{ steps.source.outputs.reach }}" "$stage/pi4-reachability.js"
          cp "${{ steps.source.outputs.seed }}" "$stage/seed-delivery.js"
          cp "${{ steps.source.outputs.action }}" "$stage/action-ownership.js"
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 \
            "$stage/index.html" "$stage/control-route.js" "$stage/pi4-reachability.js" "$stage/seed-delivery.js" "$stage/action-ownership.js" \
            "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "chmod 644 '$remote/index.html' '$remote/control-route.js' '$remote/pi4-reachability.js' '$remote/seed-delivery.js' '$remote/action-ownership.js'"

      - name: Verify live layered BBPI4 surfaces
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"; route="$(mktemp)"; reach="$(mktemp)"; seed="$(mktemp)"; action="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/control-route.js?rev=13' -o "$route"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/pi4-reachability.js?rev=1' -o "$reach"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/seed-delivery.js?rev=12' -o "$seed"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/action-ownership.js?rev=15' -o "$action"
          grep -Fq './control-route.js?v=13' "$page"
          grep -Fq './pi4-reachability.js?v=1' "$page"
          grep -Fq './seed-delivery.js?v=12' "$page"
          grep -Fq './action-ownership.js?v=15' "$page"
          grep -Fq 'AURUM_CONTROL_ROUTE_V1_3_CANONICAL' "$route"
          grep -Fq 'AURUM_PI4_REACHABILITY_V1_CANONICAL' "$reach"
          grep -Fq 'transport reachability, not proof of SSH identity' "$reach"
          grep -Fq 'AURUM_SEED_DELIVERY_V1_2_CANONICAL' "$seed"
          grep -Fq 'reachabilitySuperseded' "$seed"
          grep -Fq 'AURUM_ACTION_OWNERSHIP_V1_5_CANONICAL' "$action"
          grep -Fq 'BBPI4 LAN route rediscovered; SSH path unstable' "$action"
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back if verification fails
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local attempt=1 rc=0; while true; do "$@" && return 0; rc=$?; if [ "$attempt" -ge 5 ]; then return "$rc"; fi; sleep $((attempt * 5)); attempt=$((attempt + 1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/control-route-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; for f in control-route.js pi4-reachability.js seed-delivery.js action-ownership.js; do if [ -f '$backup/'\"\$f\" ]; then cp -p '$backup/'\"\$f\" '$remote/'\"\$f\"; elif [ -f '$backup/.missing-'\"\$f\" ]; then rm -f '$remote/'\"\$f\"; fi; done"

      - name: Record verified control-route receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-control-route-live.json <<EOF
          {
            "site": "aurum-control-route",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "production_source": "direct-canonical-clustersites",
            "canonical_component": "services/aurum-arkmatx/control-route-v1.js",
            "canonical_reachability_component": "services/aurum-arkmatx/pi4-reachability-v1.js",
            "canonical_seed_component": "services/aurum-arkmatx/seed-delivery-v1.js",
            "canonical_action_component": "services/aurum-arkmatx/action-ownership-v1.js",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx",
            "component_revision": "1.3",
            "pi4_reachability_revision": "1.0",
            "seed_delivery_revision": "1.2",
            "action_ownership_revision": "1.5",
            "deployment_resilience_revision": "1.3",
            "ssh_retry_attempts": 5,
            "ssh_retry_policy": "bounded-linear-backoff",
            "ssh_connection_batching": true,
            "layered_reachability_evidence": true,
            "newer_evidence_supersedes_stale_boundary": true,
            "ssh_identity_distinct_from_tcp22": true,
            "root_cause_not_inferred": true,
            "human_action_requires_separate_physical_evidence": true,
            "credential_carrier_repo": "FormatX66/wetbeard-site",
            "read_only": true,
            "expandable": true,
            "needs_work_integration": true,
            "system_failure_ownership": true,
            "human_action_inference": false,
            "canonical_deployment_owner": "FormatX66/ClusterSites",
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-control-route-live.json
          git commit -m 'Record Aurum control route live deployment [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
