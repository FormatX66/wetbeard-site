name: Deploy Aurum Arkmatx

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-aurum-arkmatx.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurum-arkmatx-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish Aurum-Arkmatx Assets Safely
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out carrier repo
        uses: actions/checkout@v4

      - name: Fetch Aurum controller and portal from BoxBrain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/FormatX66/BoxBrain.git "$RUNNER_TEMP/BoxBrain"
          git -C "$RUNNER_TEMP/BoxBrain" sparse-checkout set Web/Aurum-Arkmatx
          php -l "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/index.php"
          php -l "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/work-status.php"
          php -l "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/seed-swarm.php"
          php -l "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/helpaurum.php"
          for f in portal.html bootstrap.sh bootstrap.ps1 worker.ps1 worker-watchdog.ps1 seed-swarm.php helpaurum.php work-status.php; do
            test -s "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/$f"
          done

      - name: Configure existing Bluehost SSH carrier
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          ssh-keyscan -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Detect active compatibility relay
        id: mode
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          if ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "grep -q 'Aurum-Primary-Relay' public_html/arkmatx/aurum/index.php 2>/dev/null"; then
            echo 'relay=true' >> "$GITHUB_OUTPUT"
            echo 'AURUM_DEPLOY_MODE compatibility-relay-preserved'
          else
            echo 'relay=false' >> "$GITHUB_OUTPUT"
            echo 'AURUM_DEPLOY_MODE direct-controller'
          fi

      - name: Ensure Aurum state directories exist without altering routing
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'set -e
            mkdir -p public_html/arkmatx/aurum/state/inbox public_html/arkmatx/aurum/state/outbox public_html/arkmatx/aurum/state/nodes public_html/arkmatx/aurum/state/conversations public_html/arkmatx/aurum/state/work
            chmod 755 public_html/arkmatx/aurum
            chmod 700 public_html/arkmatx/aurum/state public_html/arkmatx/aurum/state/inbox public_html/arkmatx/aurum/state/outbox public_html/arkmatx/aurum/state/nodes public_html/arkmatx/aurum/state/conversations public_html/arkmatx/aurum/state/work'

      - name: Deploy portal bootstrap worker watchdog and helper assets
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx" -czf - portal.html bootstrap.sh bootstrap.ps1 worker.ps1 worker-watchdog.ps1 seed-swarm.php helpaurum.php work-status.php | \
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            'set -e; tar -xzf - -C public_html/arkmatx/aurum; chmod 644 public_html/arkmatx/aurum/portal.html public_html/arkmatx/aurum/bootstrap.sh public_html/arkmatx/aurum/bootstrap.ps1 public_html/arkmatx/aurum/worker.ps1 public_html/arkmatx/aurum/worker-watchdog.ps1 public_html/arkmatx/aurum/seed-swarm.php public_html/arkmatx/aurum/helpaurum.php public_html/arkmatx/aurum/work-status.php; php -l public_html/arkmatx/aurum/seed-swarm.php; php -l public_html/arkmatx/aurum/helpaurum.php; php -l public_html/arkmatx/aurum/work-status.php'

      - name: Deploy direct controller only when no compatibility relay is active
        if: steps.mode.outputs.relay != 'true'
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/index.php" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:public_html/arkmatx/aurum/index.php"
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/.htaccess" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:public_html/arkmatx/aurum/.htaccess"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'chmod 644 public_html/arkmatx/aurum/index.php public_html/arkmatx/aurum/.htaccess; php -l public_html/arkmatx/aurum/index.php; php public_html/arkmatx/aurum/seed-swarm.php'

      - name: Verify controller and assets without consuming real work
        shell: bash
        run: |
          set -euo pipefail
          api='https://arkmatx.com/aurum/index.php'
          body="$(curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 "$api")"
          printf '%s' "$body" | grep -F 'work_lease' >/dev/null
          curl --fail-with-body --silent --show-error 'https://aurum.arkmatx.com/worker.ps1' | grep -F 'safe_carriers_tried' >/dev/null
          curl --fail-with-body --silent --show-error 'https://aurum.arkmatx.com/worker-watchdog.ps1' | grep -F 'worker-restarted' >/dev/null
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 'https://aurum.arkmatx.com/helpaurum.php' | grep -F 'Help Aurum' >/dev/null
          status="$(curl --fail-with-body --silent --show-error "$api/work/status?id=bbpi4-bootstrap-v1")"
          printf '%s' "$status" | grep -F 'bbpi4-bootstrap-v1' >/dev/null
          lease="$(curl --fail-with-body --silent --show-error "$api/work/lease?node_id=aurum-deploy-probe-no-such-node&capabilities=bbpi4-bootstrap")"
          printf '%s' "$lease" | grep -F '"work": null' >/dev/null
          printf '%s' "$lease" | grep -F 'Aurum-Arkmatx' >/dev/null
          echo 'AURUM_DEPLOY verified=true real_work_consumed=false'
