name: Repair Aurum Worker Routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-aurum-worker-routing.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-worker-routing-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Fetch canonical Aurum web node
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/FormatX66/BoxBrain.git "$RUNNER_TEMP/BoxBrain"
          git -C "$RUNNER_TEMP/BoxBrain" sparse-checkout set Web/Aurum-Arkmatx
          php -l "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/index.php"
          php -l "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/work-status.php"
          test -s "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/.htaccess"

      - name: Configure existing Bluehost SSH carrier
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          ssh-keyscan -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Deploy clean worker routes on failover carrier
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          dst='public_html/aurum-failover'
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" "mkdir -p '$dst/state/work'; chmod 755 '$dst'"
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/.htaccess" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$dst/.htaccess"
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/work-status.php" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$dst/work-status.php"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" "chmod 644 '$dst/.htaccess' '$dst/work-status.php'; php -l '$dst/work-status.php'"

      - name: Verify failover worker routes without taking real work
        id: failover
        shell: bash
        run: |
          set -euo pipefail
          base='https://madmorrigan.com/aurum-failover'
          status_code="$(curl -sS -L -o /tmp/f-work.json -w '%{http_code}' "$base/work/status?id=bbpi4-bootstrap-v1" || true)"
          lease_code="$(curl -sS -L -o /tmp/f-lease.json -w '%{http_code}' "$base/work/lease?node_id=aurum-routing-probe-no-such-node&capabilities=bbpi4-bootstrap" || true)"
          nodes_code="$(curl -sS -L -o /tmp/f-nodes.json -w '%{http_code}' "$base/nodes" || true)"
          echo "status_http=$status_code" >> "$GITHUB_OUTPUT"
          echo "lease_http=$lease_code" >> "$GITHUB_OUTPUT"
          echo "nodes_http=$nodes_code" >> "$GITHUB_OUTPUT"
          test "$status_code" = '200'
          test "$lease_code" = '200'
          test "$nodes_code" = '200'
          grep -F 'bbpi4-bootstrap-v1' /tmp/f-work.json >/dev/null
          grep -F '"work": null' /tmp/f-lease.json >/dev/null
          grep -F 'Aurum-Arkmatx' /tmp/f-lease.json >/dev/null
          grep -F 'controller' /tmp/f-nodes.json >/dev/null

      - name: Build compatibility relay for already-installed workers
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/aurum-relay.php" <<'PHP'
          <?php
          $base = 'https://madmorrigan.com/aurum-failover';
          $method = $_SERVER['REQUEST_METHOD'] ?? 'GET';
          $pathInfo = isset($_GET['__aurum_path']) ? (string)$_GET['__aurum_path'] : '';
          if ($pathInfo !== '' && $pathInfo[0] !== '/') $pathInfo = '/' . $pathInfo;
          $args = $_GET;
          unset($args['__aurum_path']);
          $query = http_build_query($args, '', '&', PHP_QUERY_RFC3986);
          $target = $pathInfo === '' ? $base . '/index.php' : $base . $pathInfo;
          if ($query !== '') $target .= '?' . $query;
          $body = file_get_contents('php://input');
          if (!function_exists('curl_init')) {
              http_response_code(500);
              header('Content-Type: application/json');
              echo json_encode(array('ok'=>false,'error'=>'relay-curl-unavailable'));
              exit;
          }
          $ch = curl_init($target);
          curl_setopt($ch, CURLOPT_RETURNTRANSFER, true);
          curl_setopt($ch, CURLOPT_FOLLOWLOCATION, false);
          curl_setopt($ch, CURLOPT_CONNECTTIMEOUT, 5);
          curl_setopt($ch, CURLOPT_TIMEOUT, 20);
          curl_setopt($ch, CURLOPT_CUSTOMREQUEST, $method);
          curl_setopt($ch, CURLOPT_HTTPHEADER, array('Content-Type: application/json', 'Cache-Control: no-cache', 'User-Agent: Aurum-Primary-Relay/4'));
          if ($method === 'HEAD') curl_setopt($ch, CURLOPT_NOBODY, true);
          if ($method !== 'GET' && $method !== 'HEAD' && $body !== false && $body !== '') curl_setopt($ch, CURLOPT_POSTFIELDS, $body);
          $out = curl_exec($ch);
          if ($out === false) {
              $detail = curl_error($ch);
              curl_close($ch);
              http_response_code(502);
              header('Content-Type: application/json');
              echo json_encode(array('ok'=>false,'error'=>'relay-upstream','detail'=>$detail));
              exit;
          }
          $code = (int)curl_getinfo($ch, CURLINFO_RESPONSE_CODE);
          $ctype = curl_getinfo($ch, CURLINFO_CONTENT_TYPE);
          curl_close($ch);
          http_response_code($code > 0 ? $code : 502);
          header('Content-Type: ' . ($ctype ?: 'application/json; charset=utf-8'));
          header('Cache-Control: no-store');
          echo $out;
          PHP
          php -l "$RUNNER_TEMP/aurum-relay.php"

      - name: Install reversible old-URL compatibility routing
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" "RUN_ID=$GITHUB_RUN_ID bash -s" <<'REMOTE'
          set -euo pipefail
          doc='public_html/arkmatx'
          app="$doc/aurum"
          mkdir -p "$app"
          if [ -f "$app/index.php" ]; then cp -p "$app/index.php" "$app/index.php.pre-worker-routing-${RUN_ID}"; fi
          ht="$doc/.htaccess"
          if [ -f "$ht" ]; then cp -p "$ht" "$ht.pre-worker-routing-${RUN_ID}"; else : > "$ht"; fi
          tmp="$(mktemp)"
          awk '
            /^# BEGIN AURUM PRIMARY RELAY ROUTES$/ {skip=1; next}
            /^# END AURUM PRIMARY RELAY ROUTES$/ {skip=0; next}
            !skip {print}
          ' "$ht" > "$tmp"
          cat >> "$tmp" <<'RULES'

          # BEGIN AURUM PRIMARY RELAY ROUTES
          RewriteEngine On
          RewriteRule ^aurum/index\.php/(.*)$ aurum/index.php?__aurum_path=/$1 [QSA,L]
          # END AURUM PRIMARY RELAY ROUTES
          RULES
          cat "$tmp" > "$ht"
          rm -f "$tmp"
          chmod 644 "$ht"
          REMOTE
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 "$RUNNER_TEMP/aurum-relay.php" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:public_html/arkmatx/aurum/index.php"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'chmod 644 public_html/arkmatx/aurum/index.php; php -l public_html/arkmatx/aurum/index.php'

      - name: Verify old installed-worker URL end to end without taking real work
        id: primary
        shell: bash
        run: |
          set -euo pipefail
          root='https://arkmatx.com/aurum/index.php'
          root_code="$(curl -sS -L -o /tmp/p-root.json -w '%{http_code}' "$root" || true)"
          status_code="$(curl -sS -L -o /tmp/p-work.json -w '%{http_code}' "$root/work/status?id=bbpi4-bootstrap-v1" || true)"
          lease_code="$(curl -sS -L -o /tmp/p-lease.json -w '%{http_code}' "$root/work/lease?node_id=aurum-routing-probe-no-such-node&capabilities=bbpi4-bootstrap" || true)"
          echo "root_http=$root_code" >> "$GITHUB_OUTPUT"
          echo "status_http=$status_code" >> "$GITHUB_OUTPUT"
          echo "lease_http=$lease_code" >> "$GITHUB_OUTPUT"
          test "$root_code" = '200'
          test "$status_code" = '200'
          test "$lease_code" = '200'
          grep -F 'Aurum-Arkmatx' /tmp/p-root.json >/dev/null
          grep -F 'bbpi4-bootstrap-v1' /tmp/p-work.json >/dev/null
          grep -F '"work": null' /tmp/p-lease.json >/dev/null
          grep -F 'Aurum-Arkmatx' /tmp/p-lease.json >/dev/null

      - name: Read actual BBPI4 and node state directly
        id: state
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          raw="$(ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'cat public_html/aurum-failover/state/work/bbpi4-bootstrap-v1.json 2>/dev/null || true')"
          work_status="$(printf '%s' "$raw" | jq -r '.status // "missing"' 2>/dev/null || printf 'unreadable')"
          attempts="$(printf '%s' "$raw" | jq -r '.attempts // 0' 2>/dev/null || printf '0')"
          morris="$(ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'test -f public_html/aurum-failover/state/nodes/825e5a7b7d4a7aed.json && echo true || echo false')"
          echo "work_status=$work_status" >> "$GITHUB_OUTPUT"
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"
          echo "morris_present=$morris" >> "$GITHUB_OUTPUT"

      - name: Record worker routing repair
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          checked="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          overall='${{ steps.primary.outcome }}'
          status='worker-routing-not-fully-verified-failover-preserved'
          if [ "$overall" = 'success' ]; then status='worker-routing-end-to-end-verified'; fi
          printf '{\n  "failover_status_http": "%s",\n  "failover_lease_http": "%s",\n  "primary_root_http": "%s",\n  "primary_status_http": "%s",\n  "primary_lease_http": "%s",\n  "bbpi4_work_status": "%s",\n  "bbpi4_attempts": "%s",\n  "morris_node_present": "%s",\n  "verification": "%s",\n  "probe_mode": "read-only-status-plus-nonmatching-lease-no-real-work-consumed",\n  "status": "%s",\n  "verified_at_utc": "%s"\n}\n' '${{ steps.failover.outputs.status_http }}' '${{ steps.failover.outputs.lease_http }}' '${{ steps.primary.outputs.root_http }}' '${{ steps.primary.outputs.status_http }}' '${{ steps.primary.outputs.lease_http }}' '${{ steps.state.outputs.work_status }}' '${{ steps.state.outputs.attempts }}' '${{ steps.state.outputs.morris_present }}' "$overall" "$status" "$checked" > deployments/aurum-worker-routing-repair.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-worker-routing-repair.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Aurum worker routing repair [skip ci]'
          git push origin main
