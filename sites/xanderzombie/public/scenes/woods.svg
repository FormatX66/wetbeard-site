<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#596554"/><stop offset="1" stop-color="#1c251d"/></linearGradient><radialGradient id="path"><stop stop-color="#72816b" stop-opacity=".35"/><stop offset="1" stop-color="#72816b" stop-opacity="0"/></radialGradient></defs><rect width="1600" height="900" fill="#ddd2b8"/><rect x="40" y="40" width="1520" height="820" fill="url(#sky)" stroke="#111" stroke-width="18"/><g fill="#101812"><path d="M40 40h230l-70 820H40z"/><path d="M1560 40h-250l70 820h180z"/><path d="M290 40h130l-40 820H245z"/><path d="M1180 40h145l45 820h-220z"/></g><path d="M620 520Q800 440 980 520L1080 860H520z" fill="#465344"/><ellipse cx="800" cy="690" rx="380" ry="280" fill="url(#path)"/><g transform="translate(510 410)"><circle cx="95" cy="85" r="65" fill="#87947a" stroke="#111" stroke-width="10"/><path d="M38 50q60-75 115 0" fill="#111"/><circle cx="70" cy="92" r="8"/><circle cx="122" cy="92" r="8"/><path d="M35 145h120l35 180H4z" fill="#52362f" stroke="#111" stroke-width="10"/><rect x="24" y="318" width="43" height="88" fill="#222" stroke="#111" stroke-width="9"/><rect x="99" y="318" width="43" height="88" fill="#222" stroke="#111" stroke-width="9"/></g><g><rect x="105" y="95" width="690" height="125" fill="#f4e8c8" stroke="#111" stroke-width="10"/><text x="145" y="155" font-family="Georgia" font-size="38" font-weight="700">At the edge of town, the trees changed.</text><text x="145" y="198" font-family="Georgia" font-size="28">The gutter smelled faintly of moss.</text></g><g><ellipse cx="1100" cy="620" rx="215" ry="95" fill="#fff" stroke="#111" stroke-width="9"/><text x="930" y="625" font-family="Arial" font-size="32" font-weight="700">Pretty sure this path</text><text x="965" y="665" font-family="Arial" font-size="30">wasn't here yesterday.</text></g><text x="1220" y="355" fill="#f1e7c9" stroke="#111" stroke-width="3" paint-order="stroke" font-family="Georgia" font-size="110">