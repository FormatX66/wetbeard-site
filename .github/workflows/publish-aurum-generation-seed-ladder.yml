name: Publish Aurum Generation Seed Ladder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-generation-seed-ladder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-generation-seed-ladder-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify ClusterSites authority, byte-identical projection, and changed evidence
        id: source
        shell: bash
        run: |
          set -euo pipefail
          canonical_commit='9656e630b7b67c5d0bf8aa48ae746d39ae9f1e2c'
          expected_blob='45de6c9b887aebc22699fb8034313844931dd4fa'
          projection_commit='e12851c0426e615130500ce4db2a33d013623986'
          projection_main_commit='b1f73d926a809afcf60661ef9f1e59d9af002099'
          projection_ci_run='33940184497'
          active='0c77f715c8ceeabc7a6cbd714086db67c0375412'
          tree='722824cd9a9068b85c0efef31ecc4d6538741cb7'
          previous_active='958f3a9de28b9e4baa95fabfc8dbf9af1af3d4ea'
          wifi_pr='223'
          wifi_candidate='917756be145db20252e818700cbd0c44664f650b'
          wifi_vhl='33933009074'
          browser_pr='222'
          browser_previous_candidate='1e3bf9c3a265058b8c55e456668f156259b05069'
          browser_candidate='29ab0da5e8741a2f370a775c5fbf9c01b1b40a1a'
          browser_previous_vhl='33934946010'
          browser_vhl='33936783197'
          pc='33938121980'
          pi3='33938121968'
          compute='33938121722'
          native='33938908591'
          hopper='90420651044fe15a53c5086adf6d0ced3cddd2de'
          canonical="$RUNNER_TEMP/canonical.js"
          projection="$RUNNER_TEMP/projection.js"
          projection_main="$RUNNER_TEMP/projection-main.js"
          api='https://api.github.com/repos/FormatX66/BoxBrain'

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_main_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection_main"
          test -s "$projection" && test -s "$projection_main"
          node --check "$projection"
          cmp -s "$projection" "$projection_main"
          blob="$(git hash-object "$projection")"
          test "$blob" = "$expected_blob"
          cp "$projection" "$canonical"

          for token in \
            'AURUM_GENERATION_SEED_LADDER_V1_48_CANONICAL' \
            "componentRevision:'1.48'" \
            "canonicalWebsiteRepo:'FormatX66/ClusterSites'" \
            "ACTIVE_TRUNK_COMMIT='$active'" \
            "ACTIVE_TRUNK_TREE='$tree'" \
            "browserPromptSeedGatePromotionState:'code-promoted-corrected-vhl-green-exact-active-head-images-green'" \
            'browserPromptSeedGateMerged:true' \
            'browserPromptSeedGateCandidateTreeEqualsActiveTrunkTree:true' \
            'browserPromptSeedGateChangedBeforeRetry:true' \
            'browserPromptSeedGateVhlFinalResultObserved:true' \
            'browserPromptSeedGateVhlPassed:true' \
            'browserPromptSeedGateFourTargetVhlPassed:true' \
            'browserPromptSeedGatePhysicalProofProven:false' \
            'currentPcImageRunPassed:true' \
            'currentPi3ImageRunPassed:true' \
            'computeWeaveRunPassed:true' \
            'currentNativeResultObserved:true' \
            'currentNativeRunPassed:false' \
            "currentNativeFailureStep:'Verify native self-build contracts'" \
            'currentNativeFailureOutsideBrowserPromptDiff:true' \
            'wifiOwnerRepairFourTargetVhlPassed:true' \
            'wifiOwnerRepairPhysicalWifiProven:false' \
            "hopperStatusCurrentBlocker:'no-valid-endpoint-candidate'" \
            'hopperStatusEquivalentNullSnapshotsAreEvidenceHealth:true' \
            'physicalHopperBootProofProven:false' \
            'guardianForcedRollbackProofProven:false' \
            'humanActionInference:true' \
            "humanActionType:'physical-boot-proof'" \
            'humanActionDestructive:false' \
            'backupBeforePublishExpected:true' \
            'rollbackOnVerificationFailure:true' \
            'rerunUnchangedFailedWork:false' \
            'majorBoxAdded:false' \
            'seedLifecycleRemainsExpandable:true' \
            'generationLadderRemainsExpandable:true' \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:' \
            'One genuine physical-only step is now proven necessary.' \
            'Do not choose install, erase, format, repair, or any destructive option.' \
            'ClusterSites remains canonical for website source.'; do
            grep -Fq "$token" "$canonical"
          done

          get(){ curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$1" -o "$2"; }
          get "$api/actions/runs/$projection_ci_run" "$RUNNER_TEMP/ci.json"
          get "$api/branches/aurum%2Ftrunk-v0.01" "$RUNNER_TEMP/branch.json"
          get "$api/commits/$active" "$RUNNER_TEMP/active.json"
          get "$api/commits/$browser_candidate" "$RUNNER_TEMP/browser-candidate.json"
          get "$api/pulls/$browser_pr" "$RUNNER_TEMP/browser-pr.json"
          get "$api/actions/runs/$browser_previous_vhl" "$RUNNER_TEMP/browser-previous-vhl.json"
          get "$api/actions/runs/$browser_previous_vhl/jobs?per_page=100" "$RUNNER_TEMP/browser-previous-vhl-jobs.json"
          get "$api/actions/runs/$browser_vhl" "$RUNNER_TEMP/browser-vhl.json"
          get "$api/actions/runs/$browser_vhl/jobs?per_page=100" "$RUNNER_TEMP/browser-vhl-jobs.json"
          get "$api/compare/$browser_previous_candidate...$browser_candidate" "$RUNNER_TEMP/browser-compare.json"
          get "https://raw.githubusercontent.com/FormatX66/BoxBrain/$browser_candidate/Projects/AurumVirtualLab/qemu-pc-smoke.sh" "$RUNNER_TEMP/qemu-pc-smoke.sh"
          get "$api/actions/runs/$pc" "$RUNNER_TEMP/pc.json"
          get "$api/actions/runs/$pc/jobs?per_page=100" "$RUNNER_TEMP/pc-jobs.json"
          get "$api/actions/runs/$pi3" "$RUNNER_TEMP/pi3.json"
          get "$api/actions/runs/$compute" "$RUNNER_TEMP/compute.json"
          get "$api/actions/runs/$native" "$RUNNER_TEMP/native.json"
          get "$api/actions/runs/$native/jobs?per_page=100" "$RUNNER_TEMP/native-jobs.json"
          get "$api/compare/$previous_active...$active" "$RUNNER_TEMP/active-compare.json"
          get "$api/pulls/$wifi_pr" "$RUNNER_TEMP/wifi-pr.json"
          get "$api/actions/runs/$wifi_vhl" "$RUNNER_TEMP/wifi-vhl.json"
          get "$api/actions/runs/$wifi_vhl/jobs?per_page=100" "$RUNNER_TEMP/wifi-vhl-jobs.json"
          get "https://raw.githubusercontent.com/FormatX66/BoxBrain/$hopper/Web/Aurum-Arkmatx/hopper-status.json" "$RUNNER_TEMP/hopper.json"

          python3 - "$RUNNER_TEMP" "$projection_commit" "$projection_ci_run" "$active" "$tree" "$previous_active" "$browser_previous_candidate" "$browser_candidate" "$browser_previous_vhl" "$browser_vhl" "$pc" "$pi3" "$compute" "$native" "$wifi_vhl" <<'PY'
          import json,pathlib,sys
          r=pathlib.Path(sys.argv[1])
          projection,ci_id,active,tree,previous_active,bprev,bc,bold_id,bvhl_id,pc_id,pi3_id,compute_id,native_id,wifi_vhl_id=sys.argv[2:]
          load=lambda n:json.loads((r/n).read_text(encoding='utf-8-sig'))
          steps=lambda j:{s.get('name'):s.get('conclusion') for s in j.get('steps',[])}

          ci=load('ci.json')
          assert ci['id']==int(ci_id) and ci['head_sha']==projection and ci['status']=='completed' and ci['conclusion']=='success'
          assert load('branch.json')['commit']['sha']==active
          assert load('active.json')['commit']['tree']['sha']==tree
          assert load('browser-candidate.json')['commit']['tree']['sha']==tree

          bpr=load('browser-pr.json')
          assert bpr['state']=='closed' and bpr.get('merged_at') and bpr['merge_commit_sha']==active
          assert bpr['head']['sha']==bc and bpr['base']['sha']==previous_active

          old=load('browser-previous-vhl.json')
          assert old['id']==int(bold_id) and old['head_sha']==bprev and old['status']=='completed' and old['conclusion']=='failure'
          oldj={j['name']:j for j in load('browser-previous-vhl-jobs.json')['jobs']}
          oq=oldj['QEMU UEFI x86_64 PC']; os=steps(oq)
          assert oq['conclusion']=='failure' and os.get('Build PC ISO')=='success' and os.get('Boot PC image in QEMU UEFI')=='failure'

          cmp=load('browser-compare.json')
          assert cmp['status']=='ahead' and cmp['ahead_by']==1 and cmp['behind_by']==0
          changed={f['filename'] for f in cmp.get('files',[])}
          assert changed=={'Projects/AurumPC/tests/test_build_iso_contract.py','Projects/AurumVirtualLab/qemu-pc-smoke.sh'},changed
          smoke=(r/'qemu-pc-smoke.sh').read_text(encoding='utf-8')
          primary=smoke.split('wait_for_primary_gui() {',1)[1].split('wait_for_install()',1)[0]
          assert 'for _ in $(seq 1 45)' in primary and 'for _ in $(seq 1 10)' in primary and '450-second overall acceptance bound' in primary

          bv=load('browser-vhl.json')
          assert bv['id']==int(bvhl_id) and bv['head_sha']==bc and bv['status']=='completed' and bv['conclusion']=='success'
          bj={j['name']:j for j in load('browser-vhl-jobs.json')['jobs']}
          for n in ('Docker runtime x86_64','Docker runtime ARM64','QEMU Raspberry Pi 3B machine/runtime','QEMU UEFI x86_64 PC','Same-commit four-target convergence gate'):
              assert bj[n]['conclusion']=='success',n
          for name,run_id in (('pc.json',pc_id),('pi3.json',pi3_id),('compute.json',compute_id)):
              x=load(name)
              assert x['id']==int(run_id) and x['head_sha']==active and x['status']=='completed' and x['conclusion']=='success',name
          pj={j['name']:j for j in load('pc-jobs.json')['jobs']}
          for n in ('validate','build-image','generic-uefi-smoke','hp-twin-smoke','publish-verified-image'):
              assert pj[n]['conclusion']=='success',n
          native=load('native.json')
          assert native['id']==int(native_id) and native['head_sha']==active and native['status']=='completed' and native['conclusion']=='failure'
          nj={j['name']:j for j in load('native-jobs.json')['jobs']}['Resume verified native growth']
          assert steps(nj).get('Verify native self-build contracts')=='failure'
          ad=load('active-compare.json')
          changed_active={f['filename'] for f in ad.get('files',[])}
          assert changed_active and not any(p.startswith('Projects/Codelation/') for p in changed_active),changed_active

          wpr=load('wifi-pr.json')
          assert wpr['state']=='closed' and wpr.get('merged_at')
          wv=load('wifi-vhl.json')
          assert wv['id']==int(wifi_vhl_id) and wv['status']=='completed' and wv['conclusion']=='success'
          wj={j['name']:j for j in load('wifi-vhl-jobs.json')['jobs']}
          for n in ('Docker runtime x86_64','Docker runtime ARM64','QEMU Raspberry Pi 3B machine/runtime','QEMU UEFI x86_64 PC','Same-commit four-target convergence gate'):
              assert wj[n]['conclusion']=='success',n
          h=load('hopper.json')
          assert h['endpoint'] is None and h['reachable'] is False and h['summary']['health']=='no-endpoint-candidate'
          print('GENERATION_LADDER_V148_SOURCE_AND_EVIDENCE_OK')
          PY

          echo "file=$canonical" >> "$GITHUB_OUTPUT"
          echo "blob=$blob" >> "$GITHUB_OUTPUT"
          echo "canonical_commit=$canonical_commit" >> "$GITHUB_OUTPUT"
          echo "projection_commit=$projection_commit" >> "$GITHUB_OUTPUT"
          echo "projection_main_commit=$projection_main_commit" >> "$GITHUB_OUTPUT"
          echo "projection_ci_run=$projection_ci_run" >> "$GITHUB_OUTPUT"
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "wifi_candidate=$wifi_candidate" >> "$GITHUB_OUTPUT"
          echo "wifi_vhl=$wifi_vhl" >> "$GITHUB_OUTPUT"
          echo "browser_previous_candidate=$browser_previous_candidate" >> "$GITHUB_OUTPUT"
          echo "browser_candidate=$browser_candidate" >> "$GITHUB_OUTPUT"
          echo "browser_previous_vhl=$browser_previous_vhl" >> "$GITHUB_OUTPUT"
          echo "browser_vhl=$browser_vhl" >> "$GITHUB_OUTPUT"
          echo "pc=$pc" >> "$GITHUB_OUTPUT"
          echo "pi3=$pi3" >> "$GITHUB_OUTPUT"
          echo "compute=$compute" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "hopper=$hopper" >> "$GITHUB_OUTPUT"

      - name: Configure Bluehost SSH with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for n in 1 2 3 4 5; do ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null && exit 0; [ "$n" -eq 5 ] && exit 1; sleep $((n*5)); done

      - name: Back up current Command Center
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture(){ local out="$1"; shift; local n=1 tmp="$(mktemp)"; while true; do if "$@" > "$tmp"; then mv "$tmp" "$out"; return 0; fi; [ "$n" -ge 5 ] && { rm -f "$tmp"; return 1; }; sleep $((n*5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/generation-seed-ladder.js' ]; then cp -p '$remote/generation-seed-ladder.js' '$backup/generation-seed-ladder.js'; else touch '$backup/.missing-generation-seed-ladder.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject expandable generation ladder component
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); t=p.read_text(encoding='utf-8')
          t=re.sub(r'<script src="\./generation-seed-ladder\.js(?:\?v=[^"]+)?"></script>\s*','',t)
          tag='<script src="./generation-seed-ladder.js?v=148"></script>'
          for pat in (r'<script src="\./seed-lifecycle\.js(?:\?v=[^"]+)?"></script>',r'<script src="\./recovery-guardian\.js(?:\?v=[^"]+)?"></script>',r'</body>'):
              m=re.search(pat,t)
              if m: t=t[:m.start()]+tag+'\n'+t[m.start():]; break
          else: raise SystemExit('dashboard missing generation ladder injection point')
          p.write_text(t,encoding='utf-8')
          PY
          grep -Fq './generation-seed-ladder.js?v=148' "$RUNNER_TEMP/index.html"

      - name: Publish with bounded retries
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry(){ local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n*5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 "$RUNNER_TEMP/index.html" "${{ steps.source.outputs.file }}" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" "set -eu; mv '$remote/canonical.js' '$remote/generation-seed-ladder.js'; chmod 644 '$remote/index.html' '$remote/generation-seed-ladder.js'"

      - name: Verify live Command Center
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/live-index.html"; js="$RUNNER_TEMP/live-generation-seed-ladder.js"
          final_url="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/generation-seed-ladder.js?rev=148' -o "$js"
          grep -Fq './generation-seed-ladder.js?v=148' "$page"
          cmp -s "$js" "${{ steps.source.outputs.file }}"
          node --check "$js"
          for token in 'AURUM_GENERATION_SEED_LADDER_V1_48_CANONICAL' "componentRevision:'1.48'" 'browserPromptSeedGateMerged:true' 'browserPromptSeedGateVhlPassed:true' 'browserPromptSeedGateFourTargetVhlPassed:true' 'currentPcImageRunPassed:true' 'currentPi3ImageRunPassed:true' 'computeWeaveRunPassed:true' 'currentNativeResultObserved:true' 'currentNativeRunPassed:false' 'currentNativeFailureOutsideBrowserPromptDiff:true' 'wifiOwnerRepairPhysicalWifiProven:false' "hopperStatusCurrentBlocker:'no-valid-endpoint-candidate'" 'humanActionInference:true' 'humanActionDestructive:false' 'majorBoxAdded:false' 'seedLifecycleRemainsExpandable:true' 'generationLadderRemainsExpandable:true' 'Frontiers Advancing:' 'Needs Work → Aurum/System:' 'Your Actions:' 'Do not choose install, erase, format, repair, or any destructive option.'; do grep -Fq "$token" "$js"; done
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back on verification failure
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry(){ local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n*5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/generation-seed-ladder.js' ]; then cp -p '$backup/generation-seed-ladder.js' '$remote/generation-seed-ladder.js'; elif [ -f '$backup/.missing-generation-seed-ladder.js' ]; then rm -f '$remote/generation-seed-ladder.js'; fi"

      - name: Record verified live receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main; git checkout main; git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-generation-seed-ladder-live.json <<EOF_RECEIPT
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/generation-seed-ladder-v1.js",
            "canonical_component_commit": "${{ steps.source.outputs.canonical_commit }}",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx/generation-seed-ladder-v1.js",
            "deployment_carrier": "FormatX66/wetbeard-site",
            "component_revision": "1.48",
            "approved_blob": "${{ steps.source.outputs.blob }}",
            "boxbrain_projection_commit": "${{ steps.source.outputs.projection_commit }}",
            "boxbrain_projection_main_commit": "${{ steps.source.outputs.projection_main_commit }}",
            "boxbrain_ci_run": ${{ steps.source.outputs.projection_ci_run }},
            "boxbrain_ci_proven": true,
            "cluster_canonical_commit_pinned": true,
            "active_trunk_commit": "${{ steps.source.outputs.active }}",
            "active_trunk_tree": "${{ steps.source.outputs.tree }}",
            "hopper_wifi_owner_candidate": "${{ steps.source.outputs.wifi_candidate }}",
            "hopper_wifi_owner_vhl_run": ${{ steps.source.outputs.wifi_vhl }},
            "hopper_wifi_owner_four_target_convergence_passed": true,
            "hopper_wifi_owner_physical_wifi_proven": false,
            "hopper_wifi_owner_reboot_persistence_proven": false,
            "browser_prompt_previous_candidate": "${{ steps.source.outputs.browser_previous_candidate }}",
            "browser_prompt_candidate": "${{ steps.source.outputs.browser_candidate }}",
            "browser_prompt_previous_vhl_run": ${{ steps.source.outputs.browser_previous_vhl }},
            "browser_prompt_previous_vhl_final_result_observed": true,
            "browser_prompt_previous_vhl_passed": false,
            "browser_prompt_probe_race_changed_before_retry": true,
            "browser_prompt_vhl_run": ${{ steps.source.outputs.browser_vhl }},
            "browser_prompt_vhl_final_result_observed": true,
            "browser_prompt_vhl_passed": true,
            "browser_prompt_four_target_convergence_passed": true,
            "browser_prompt_code_promoted": true,
            "current_pc_image_run": ${{ steps.source.outputs.pc }},
            "current_pc_image_run_passed": true,
            "current_pi3_image_run": ${{ steps.source.outputs.pi3 }},
            "current_pi3_image_run_passed": true,
            "computeweave_run": ${{ steps.source.outputs.compute }},
            "computeweave_run_passed": true,
            "current_native_run": ${{ steps.source.outputs.native }},
            "current_native_result_observed": true,
            "current_native_run_passed": false,
            "current_native_failure_step": "Verify native self-build contracts",
            "current_native_failure_outside_browser_prompt_diff": true,
            "hopper_status_snapshot_commit": "${{ steps.source.outputs.hopper }}",
            "hopper_status_current_blocker": "no-valid-endpoint-candidate",
            "hopper_equivalent_null_snapshot_is_evidence_health": true,
            "physical_hopper_boot_proof_proven": false,
            "guardian_forced_rollback_proof_proven": false,
            "human_action_inference": true,
            "human_action_type": "physical-boot-proof",
            "human_action_destructive": false,
            "major_box_added": false,
            "seed_lifecycle_remains_expandable": true,
            "generation_ladder_remains_expandable": true,
            "frontiers_advancing_visible": true,
            "needs_work_system_owned": true,
            "needs_work_owner": "aurum-system",
            "backup_before_publish": true,
            "rollback_on_verification_failure": true,
            "rerun_unchanged_failed_work": false,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF_RECEIPT
