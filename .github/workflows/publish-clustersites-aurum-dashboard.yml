name: Publish ClusterSites Aurum Dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-clustersites-aurum-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clustersites-aurum-dashboard-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish canonical Aurum Command Center v3
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out deployment carrier
        uses: actions/checkout@v4

      - name: Fetch canonical ClusterSites command center
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_url='https://raw.githubusercontent.com/FormatX66/ClusterSites/main/services/aurum-arkmatx/dashboard-v3.html'
          source_api='https://api.github.com/repos/FormatX66/ClusterSites/commits/main'
          target="$RUNNER_TEMP/aurum-dashboard-v3.html"
          curl --fail-with-body --silent --show-error --location "$source_url" -o "$target"
          source_json="$(curl --fail-with-body --silent --show-error --location -H 'Accept: application/vnd.github+json' "$source_api")"
          source_sha="$(printf '%s' "$source_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          test -s "$target"
          grep -Fq 'AURUM_COMMAND_CENTER_V3' "$target"
          grep -Fq 'frontiers advancing' "$target"
          grep -Fq 'needs work' "$target"
          grep -Fq 'your actions' "$target"
          grep -Fq '/aurum/voice-status.json' "$target"
          grep -Fq '#6c63ff' "$target"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "file=$target" >> "$GITHUB_OUTPUT"

      - name: Configure existing Bluehost SSH carrier
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"
          test -n "$BLUEHOST_USERNAME"
          test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          ssh-keyscan -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Back up current dashboard
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/v3-$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; if [ -f '$remote/index.html' ]; then cp -p '$remote/index.html' '$backup/index.html'; else touch '$backup/.missing-index.html'; fi"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Publish canonical command center
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 "${{ steps.source.outputs.file }}" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/index.html"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" "chmod 644 '$remote/index.html'"

      - name: Verify live command center and shared evidence mirror
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"
          mirror="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          grep -Fq 'AURUM_COMMAND_CENTER_V3' "$page"
          grep -Fq 'Frontiers Advancing' "$page"
          grep -Fq 'Needs Work' "$page"
          grep -Fq 'Your Actions' "$page"
          grep -Fq '/aurum/voice-status.json' "$page"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/voice-status.json' -o "$mirror"
          python3 - "$mirror" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text())
          assert payload['schema']=='aurum-voice-status-v1'
          assert len(payload.get('human_capabilities',[]))==7
          assert 'overall' in payload and 'human_action' in payload['overall']
          print('AURUM_COMMAND_CENTER_MIRROR_OK')
          PY
          status="$(curl --fail-with-body --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 'https://arkmatx.com/aurum/index.php')"
          printf '%s' "$status" | grep -Fq 'Aurum-Arkmatx'
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back dashboard if verification fails
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/v3-$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; if [ -f '$backup/index.html' ]; then cp -p '$backup/index.html' '$remote/index.html'; elif [ -f '$backup/.missing-index.html' ]; then rm -f '$remote/index.html'; fi"

      - name: Record verified canonical deployment receipt
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-dashboard-live.json <<EOF
          {
            "site": "arkmatx-aurum-dashboard",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/dashboard-v3.html",
            "canonical_sha": "${{ steps.source.outputs.sha }}",
            "credential_carrier_repo": "FormatX66/wetbeard-site",
            "command_center_version": 3,
            "aurum_gui_theme": "dark-violet",
            "expandable_boxes": true,
            "semantic_frontier_progress": true,
            "needs_work_separated": true,
            "your_actions_separated": true,
            "voice_mirror_verified": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '4189822+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-dashboard-live.json
          git commit -m 'Record Aurum dashboard v3 live deployment [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
