name: Workflow v2 preflight

on:
  push:
    branches:
      - dev/ubercorp-workflow-v2
    paths:
      - 'uber/**'
      - 'deploy-platform/**'
      - '.devcontainer/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/workflow-v2-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Validate Übercorp source
        run: python3 deploy-platform/local/check-site.py ubercorp

      - name: Validate Vite config
        run: npx vite --version

      - name: Verify PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find uber -type f -name '*.php' -print0)

      - name: Confirm production guardrails
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          manifest=json.load(open('deploy-platform/sites/ubercorp.json',encoding='utf-8'))
          staging=manifest['staging']['target_path']
          production=manifest['production']
          assert staging.startswith('public_html/dev-platform/'), staging
          assert production.get('locked') is True, 'Production must remain locked in workflow v2'
          workflow=pathlib.Path('.github/workflows/deploy-platform-v2.yml').read_text(encoding='utf-8')
          assert "public_html/dev-platform" in workflow
          assert "DEPLOY_TARGET: public_html/uber" not in workflow
          print('Guardrails OK: staging isolated; production locked.')
          PY
