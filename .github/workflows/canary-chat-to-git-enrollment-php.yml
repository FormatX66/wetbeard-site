name: Canary Chat-to-Git Enrollment PHP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-to-git-enrollment-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      CANDIDATE_SHA: '158d245dbeaed24796d44ac846b1af445d7d7da2'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact validated ClusterSites artifact
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/candidate"; mkdir -p "$stage"
          artifact_url='https://sdmntprcentralus.oaiusercontent.com/files/00000000-a3dc-81f5-9cd2-71a2f851a1ee/raw?se=2026-09-26T23%3A49%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=3f066f85-5721-59c8-a2ea-837eb514dda3&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-26T11%3A27%3A11Z&ske=2026-09-27T11%3A27%3A11Z&sks=b&skv=2026-02-06&sig=Ygl9B7uoN3nM5N882lNph%2BQr2epz7PsixceLorUshnA%3D'
          curl --fail-with-body --silent --show-error --location "$artifact_url" -o "$RUNNER_TEMP/runtime.zip"
          echo '86ed55e5e7fc704148f274ce3e188a58046554e73565bd08fb2d1f302a3178d2  '"$RUNNER_TEMP/runtime.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/runtime.zip" -d "$RUNNER_TEMP/unpacked"
          src="$RUNNER_TEMP/unpacked/services/chat-to-git-webhook"
          cp "$src/index.php" "$src/lib.php" "$src/siri.php" "$src/shortcut.php" "$src/.htaccess" "$stage/"
          php -l "$stage/index.php"; php -l "$stage/lib.php"; php -l "$stage/siri.php"; php -l "$stage/shortcut.php"
          grep -Fq "enrollment_token" "$stage/index.php"
          echo "stage=$stage" >> "$GITHUB_ENV"

      - name: Configure existing Bluehost SSH carrier
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"; chmod 600 "$HOME/.ssh/bluehost_deploy"
          ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Back up LKG and stage candidate outside public_html
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='/home1/madmorri/public_html/arkmatx/aurum/chat-to-git'
          backup="/home1/madmorri/.deploy-rollbacks/chat-to-git/$GITHUB_RUN_ID"
          candidate="/home1/madmorri/.deploy-candidates/chat-to-git/$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST"             "set -eu; test -d '$remote'; mkdir -p '$backup' '$candidate'; cp -a '$remote/.' '$backup/'; test -f '$backup/index.php'; test -f '$backup/lib.php'; test -f '$backup/.htaccess'"
          tar -C "$stage" -czf - index.php lib.php siri.php shortcut.php .htaccess |             ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" "tar -xzf - -C '$candidate'"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST"             "set -eu; php -l '$candidate/index.php'; php -l '$candidate/lib.php'; php -l '$candidate/siri.php'; php -l '$candidate/shortcut.php'; test -f /home1/madmorri/.config/chat-to-git/config.php; test -d /home1/madmorri/.local/state/chat-to-git"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "backup=$backup" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

      - name: Promote candidate atomically without enrollment
        id: promote
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='/home1/madmorri/public_html/arkmatx/aurum/chat-to-git'
          previous="/home1/madmorri/.deploy-rollbacks/chat-to-git/pre-canary-$GITHUB_RUN_ID"
          candidate='${{ steps.backup.outputs.candidate }}'
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST"             "set -eu; mv '$remote' '$previous'; mv '$candidate' '$remote'; chmod 755 '$remote'; chmod 644 '$remote/index.php' '$remote/lib.php' '$remote/siri.php' '$remote/shortcut.php' '$remote/.htaccess'"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify live LKG compatibility and unconfigured Siri hold
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          base='https://aurum.arkmatx.com/chat-to-git'
          health="$(mktemp)"; code="$(curl --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$health" -w '%{http_code}' "$base/health")"
          test "$code" = 200
          python3 - "$health" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['status']=='ok' and x['service']=='chat-to-git-webhook'
          assert x['github_configured'] is True and x['authentication_configured'] is True and x['storage_writable'] is True
          assert x.get('siri_configured') is False
          assert x.get('shortcut_configured') is False
          PY
          legacy="$(mktemp)"; legacy_code="$(curl --silent --show-error -o "$legacy" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$base/webhook/voice")"
          test "$legacy_code" = 401
          grep -Fq '"unauthorized"' "$legacy"
          siri="$(mktemp)"; siri_code="$(curl --silent --show-error -o "$siri" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"device_id":"bruce-iphone"}' "$base/siri/challenge")"
          test "$siri_code" = 503
          grep -Fq '"siri-ingress-not-configured"' "$siri"
          shortcut="$(mktemp)"; shortcut_code="$(curl --silent --show-error -o "$shortcut" -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$base/shortcut/dispatch")"
          test "$shortcut_code" = 503
          grep -Fq '"shortcut-ingress-not-configured"' "$shortcut"
          echo 'CANARY_OK health=200 legacy_unauth=401 siri_unconfigured=503 shortcut_unconfigured=503'

      - name: Roll back on any post-backup failure
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='/home1/madmorri/public_html/arkmatx/aurum/chat-to-git'
          backup='${{ steps.backup.outputs.backup }}'
          failed="/home1/madmorri/.deploy-rollbacks/chat-to-git/failed-$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST"             "set -eu; if [ -d '$remote' ]; then mv '$remote' '$failed'; fi; mkdir -p '$remote'; cp -a '$backup/.' '$remote/'"
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 'https://aurum.arkmatx.com/chat-to-git/health' >/dev/null
          echo 'ROLLBACK_VERIFIED'

      - name: Record canary boundary
        if: success()
        run: |
          echo 'Self-enrollment-capable canary deployed without an enrollment code or Shortcut credential. Existing webhook and Siri holds verified. Shortcut enrollment and round trip remain separate gates.' >> "$GITHUB_STEP_SUMMARY"
