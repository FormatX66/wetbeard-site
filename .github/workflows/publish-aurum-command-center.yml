name: Publish Aurum Command Center Shell

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish ClusterSites Aurum Dashboard
    types: [completed]

permissions:
  contents: write

concurrency:
  group: aurum-command-center-shell-production
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical v3 command center is live
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"
          mirror="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          grep -Fq 'AURUM_COMMAND_CENTER_V3' "$page"
          grep -Fq 'Frontiers Advancing' "$page"
          grep -Fq 'Needs Work' "$page"
          grep -Fq 'Your Actions' "$page"
          grep -Fq 'Progress is proof, not activity.' "$page"
          grep -Fq 'Canonical website source: FormatX66/ClusterSites' "$page"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/voice-status.json' -o "$mirror"
          python3 - "$mirror" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text())
          assert payload['schema']=='aurum-voice-status-v1'
          assert len(payload.get('human_capabilities',[]))==7
          assert 'human_action' in payload.get('overall',{})
          print('AURUM_COMMAND_CENTER_V3_VERIFIED')
          PY
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Record verified command-center receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-command-center-live.json <<EOF
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/dashboard-v3.html",
            "credential_carrier_repo": "FormatX66/wetbeard-site",
            "command_center_version": 3,
            "theme": "aurum-dark-violet",
            "expandable_summary": true,
            "expandable_systems": true,
            "expandable_capabilities": true,
            "expandable_panels": true,
            "frontiers_advancing": true,
            "needs_work": true,
            "your_actions": true,
            "voice_mirror_verified": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-command-center-live.json
          git commit -m 'Record Aurum command center v3 live deployment [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
