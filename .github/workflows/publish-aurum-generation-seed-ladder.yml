name: Publish Aurum Generation Seed Ladder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-generation-seed-ladder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-generation-seed-ladder-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify ClusterSites authority pin, public projection, and changed evidence
        id: source
        shell: bash
        run: |
          set -euo pipefail

          # ClusterSites remains canonical. This public carrier pins the independently
          # approved canonical merge/blob, requires the byte-identical public BoxBrain
          # projection plus green CI, and verifies the changed runtime evidence before
          # any production connection. Unchanged failed lanes are read, never rerun.
          canonical_commit='d59d633ed531fe8efe2f13d3fc6d5622550e1355'
          projection_commit='2517f03fcc3f13cb708d8efc959752a8beb110b8'
          projection_main_commit='ab205663affa4357806bc53a50d0be1e57631f2c'
          expected_blob='0b8d06d363b9804c9a7cca807dd6710876840c86'
          projection_ci_run='33898414688'

          active_trunk_commit='51b39a5c9767efb1428fd48621c4855d76962acc'
          current_pc_run='33828601576'
          current_vhl_run='33842112609'
          current_native_run='33829617010'
          hopper_status_run='33837892970'
          hopper_status_job='100914038192'
          hopper_snapshot_commit='a4674a918dbe74017778da39e2c88ad73d1f553c'
          voice_mirror_run='33834801810'
          voice_mirror_receipt_commit='d4b80d95f834bc8c56e0cedad18c77bac25f3402'
          quantum_run='33837282240'
          quantum_evidence_commit='3606746cf11be4663f8d5873dcdda9a7c227a87b'
          farmer_continuous_explorer_commit='fb3c7f375d200bd8682266c1ab16262cacf7ab6e'
          farmer_runtime_proof_commit='73b4f1d02fc01245a2dc84fb2440e6e4d2ea246d'
          workload_source_commit='6c7b0ca8bc7ae011bde7943b114ea58d8e743380'
          workload_runtime_proof_commit='73b4f1d02fc01245a2dc84fb2440e6e4d2ea246d'
          workload_boxbrain_ci='33893044460'
          workload_farmer_ci='33893044539'
          supervision_commit='043b84ac0eb5da2c561abb66232282fba26704b8'
          supervision_boxbrain_ci='33894107962'
          supervision_farmer_ci='33894107973'

          projection="$RUNNER_TEMP/generation-seed-ladder-projection.js"
          projection_main="$RUNNER_TEMP/generation-seed-ladder-projection-main.js"
          api='https://api.github.com/repos/FormatX66/BoxBrain'

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_main_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection_main"
          test -s "$projection" && test -s "$projection_main"
          node --check "$projection"
          cmp -s "$projection" "$projection_main"
          blob="$(git hash-object "$projection")"
          test "$blob" = "$expected_blob"

          for token in \
            'AURUM_GENERATION_SEED_LADDER_V1_36_CANONICAL' \
            "canonicalWebsiteRepo:'FormatX66/ClusterSites'" \
            "componentRevision:'1.36'" \
            "ACTIVE_TRUNK_COMMIT='$active_trunk_commit'" \
            "CURRENT_PC_IMAGE_RUN='$current_pc_run'" \
            "CURRENT_VHL_RUN='$current_vhl_run'" \
            "CURRENT_NATIVE_RUN='$current_native_run'" \
            "CURRENT_HOPPER_STATUS_RUN='$hopper_status_run'" \
            "CURRENT_HOPPER_STATUS_SNAPSHOT_COMMIT='$hopper_snapshot_commit'" \
            "FARMER_RUNTIME_PROOF_COMMIT='$farmer_runtime_proof_commit'" \
            "WORKLOAD_OBSERVER_SOURCE_COMMIT='$workload_source_commit'" \
            "WORKLOAD_OBSERVER_RUNTIME_PROOF_COMMIT='$workload_runtime_proof_commit'" \
            "WORKLOAD_OBSERVER_SUPERVISION_COMMIT='$supervision_commit'" \
            "workloadObserverRuntime:'verified-read-only-feed'" \
            'workloadObserverReadOnly:true' \
            "workloadObserverActivityEvidence:'available-observed'" \
            "workloadObserverBudgetAuthority:'resident-explorer-only'" \
            "workloadObserverRemoteCapacityAuthority:'none'" \
            "workloadObserverFallback:'host-only-on-stale-or-missing'" \
            'workloadObserverProcessControlAllowed:false' \
            'workloadObserverRemoteExecutionAuthority:false' \
            'workloadObserverProviderCpuRamAvailable:false' \
            'workloadObserverCodexHostedTelemetryAvailable:false' \
            "workloadObserverSupervisionRuntime:'runtime-proof-pending'" \
            'farmerContinuousExplorerPathsBefore:1083' \
            'farmerContinuousExplorerPathsAfter:1099' \
            'farmerDecisionEngineCalibratedOutcomes:5' \
            'farmerDecisionEngineDecisions:10' \
            'currentVirtualLabExactHeadAvailable:true' \
            'currentVirtualLabDockerX86Passed:true' \
            'currentVirtualLabArm64Passed:true' \
            'currentVirtualLabPi3Passed:true' \
            'currentVirtualLabUefiImageBuilt:true' \
            'currentVirtualLabUefiBootPassed:false' \
            "currentVirtualLabFailureStep:'Boot PC image in QEMU UEFI'" \
            'currentFourTargetConvergencePassed:false' \
            'currentNativeRunPassed:false' \
            "hopperStatusCurrentBlocker:'no-valid-endpoint-candidate'" \
            'voiceStaticMirrorVerified:true' \
            'quantumRunPassed:true' \
            "quantumSelectedPath:'current-release-flash-readback-proven-awaiting-physical-boot'" \
            'tinySeedPhysicalBootPending:true' \
            'humanActionInference:true' \
            "humanActionType:'physical-boot-proof'" \
            'humanActionDestructive:false' \
            'backupBeforePublishExpected:true' \
            'rollbackOnVerificationFailure:true' \
            'rerunUnchangedFailedWork:false' \
            'majorBoxAdded:false' \
            'seedLifecycleRemainsExpandable:true' \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:' \
            'The unified workload observer is now verified in the protected Farmer runtime.' \
            'Fresh corroborated local contention may reduce only the resident failure explorer budget; cloud/provider activity is advisory and never increases local capacity.' \
            'Stale or missing observer evidence falls back to host-only budgeting.' \
            'The feed grants no process-control or remote-execution authority.' \
            'Finish runtime proof for workload-observer supervision before promoting it to live runtime truth.' \
            'One genuine physical-only step is now proven necessary.' \
            'Do not choose install, erase, format, repair, or any destructive option.' \
            'ClusterSites remains canonical for website source.'; do
            grep -Fq "$token" "$projection"
          done

          for pair in \
            "$projection_ci_run projection-ci" \
            "$current_pc_run current-pc" \
            "$current_vhl_run current-vhl" \
            "$current_native_run current-native" \
            "$hopper_status_run hopper-current" \
            "$voice_mirror_run voice-mirror" \
            "$workload_boxbrain_ci workload-boxbrain-ci" \
            "$workload_farmer_ci workload-farmer-ci" \
            "$supervision_boxbrain_ci supervision-boxbrain-ci" \
            "$supervision_farmer_ci supervision-farmer-ci"; do
            set -- $pair
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/actions/runs/$1" -o "$RUNNER_TEMP/$2.json"
          done
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/actions/runs/$current_vhl_run/jobs?per_page=100" -o "$RUNNER_TEMP/current-vhl-jobs.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/actions/runs/$current_native_run/jobs?per_page=100" -o "$RUNNER_TEMP/current-native-jobs.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/actions/runs/$hopper_status_run/jobs?per_page=100" -o "$RUNNER_TEMP/hopper-current-jobs.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/branches/aurum/trunk-v0.01" -o "$RUNNER_TEMP/active-branch.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$hopper_snapshot_commit/Web/Aurum-Arkmatx/hopper-status.json" -o "$RUNNER_TEMP/hopper-status.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$voice_mirror_receipt_commit/Projects/AurumBridge/results/web-static-mirror-33834801810-attempt-1.json" -o "$RUNNER_TEMP/voice-mirror-receipt.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$quantum_evidence_commit/Projects/FutureBranch/results/quantum-experiment-33837282240.json" -o "$RUNNER_TEMP/quantum-evidence.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$workload_runtime_proof_commit/Projects/AurumFarmer/Deploy/latest-windows-runtime-proof.json" -o "$RUNNER_TEMP/workload-runtime-proof.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$workload_source_commit/Projects/AurumFarmer/aurum_farmer/activity_reader.py" -o "$RUNNER_TEMP/activity-reader.py"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$workload_source_commit/Projects/AurumFarmer/aurum_farmer/resource_budget.py" -o "$RUNNER_TEMP/resource-budget.py"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$supervision_commit/Projects/FutureBranchMonitor/register-startup.ps1" -o "$RUNNER_TEMP/register-startup.ps1"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_main_commit/Projects/AurumFarmer/Deploy/latest-windows-runtime-proof.json" -o "$RUNNER_TEMP/latest-runtime-proof.json"

          python3 - "$RUNNER_TEMP" "$projection_commit" "$active_trunk_commit" "$projection_ci_run" "$current_pc_run" "$current_vhl_run" "$current_native_run" "$hopper_status_run" "$hopper_status_job" "$voice_mirror_run" "$quantum_run" "$workload_source_commit" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          projection,active,ci_id,pc_id,vhl_id,native_id,hopper_id,hopper_job,voice_id,quantum_id,workload_src=sys.argv[2:]
          load=lambda n: json.loads((root/n).read_text(encoding='utf-8-sig'))
          ok=lambda n: load(n).get('status')=='completed' and load(n).get('conclusion')=='success'

          ci=load('projection-ci.json')
          assert ci.get('id')==int(ci_id) and ci.get('name')=='BoxBrain CI'
          assert ci.get('head_sha')==projection and ci.get('status')=='completed' and ci.get('conclusion')=='success'
          assert (load('active-branch.json').get('commit') or {}).get('sha')==active

          pc=load('current-pc.json')
          assert pc.get('id')==int(pc_id) and pc.get('head_sha')==active and pc.get('conclusion')=='success'
          vhl=load('current-vhl.json')
          assert vhl.get('id')==int(vhl_id) and vhl.get('head_sha')==active and vhl.get('conclusion')=='failure'
          vjobs={j.get('name'):j for j in load('current-vhl-jobs.json').get('jobs',[])}
          for name in ('Docker runtime x86_64','Docker runtime ARM64','QEMU Raspberry Pi 3B machine/runtime'):
              assert (vjobs.get(name) or {}).get('conclusion')=='success',name
          uefi=vjobs.get('QEMU UEFI x86_64 PC') or {}
          assert uefi.get('conclusion')=='failure'
          usteps={s.get('name'):s.get('conclusion') for s in uefi.get('steps',[])}
          assert usteps.get('Build PC ISO')=='success'
          assert usteps.get('Boot PC image in QEMU UEFI')=='failure'
          assert (vjobs.get('Same-commit four-target convergence gate') or {}).get('conclusion')=='skipped'

          native=load('current-native.json')
          assert native.get('id')==int(native_id) and native.get('head_sha')==active and native.get('conclusion')=='failure'
          njobs=[j for j in load('current-native-jobs.json').get('jobs',[]) if j.get('name')=='Resume verified native growth']
          assert len(njobs)==1 and njobs[0].get('conclusion')=='failure'
          assert {s.get('name'):s.get('conclusion') for s in njobs[0].get('steps',[])}.get('Verify native self-build contracts')=='failure'

          hopper=load('hopper-current.json')
          assert hopper.get('id')==int(hopper_id) and hopper.get('event')=='schedule' and hopper.get('conclusion')=='success'
          hmatch=[j for j in load('hopper-current-jobs.json').get('jobs',[]) if j.get('id')==int(hopper_job)]
          assert len(hmatch)==1 and hmatch[0].get('conclusion')=='success' and hmatch[0].get('runner_name')=='AURUM-HOPPER-STATUS-WSL'
          hs=load('hopper-status.json')
          assert hs.get('endpoint') is None and hs.get('reachable') is False and (hs.get('summary') or {}).get('health')=='no-endpoint-candidate'

          voice=load('voice-mirror.json')
          assert voice.get('id')==int(voice_id) and voice.get('conclusion')=='success'
          assert load('voice-mirror-receipt.json').get('state')=='WEB_STATIC_MIRROR_OK'
          q=load('quantum-evidence.json')
          assert q.get('source_run_id')==int(quantum_id) and q.get('overall')=='success'
          assert (q.get('next_human_boundary') or {}).get('genuine_human_only') is True
          assert (q.get('next_human_boundary') or {}).get('destructive_action_required') is False

          for name in ('workload-boxbrain-ci.json','workload-farmer-ci.json','supervision-boxbrain-ci.json','supervision-farmer-ci.json'):
              assert ok(name),name
          reader=(root/'activity-reader.py').read_text(encoding='utf-8')
          governor=(root/'resource-budget.py').read_text(encoding='utf-8')
          assert 'Local contention may reduce explorer budget only; cloud activity is advisory' in reader
          assert "data.get('read_only') is not True" in reader and "data.get('authority_granted') is not False" in reader
          assert 'local_activity_stale_or_disconnected' in reader
          assert 'Remote CPU/RAM never enters local pressure.' in governor
          assert "owner': 'Future Branch failure explorer only'" in governor
          assert "external_process_control': 'not_configured'" in governor and "cloud_routing': 'not_configured'" in governor

          runtime=load('workload-runtime-proof.json')
          assert runtime.get('schema')=='aurum.farmer.windows-runtime-proof.v1'
          assert runtime.get('source_commit')==workload_src
          assert runtime.get('continuous_exploration_verified') is True
          assert runtime.get('exploration_paths_before')==1083 and runtime.get('exploration_paths_after')==1099
          assert (runtime.get('future_branch') or {}).get('calibrated_outcomes')==5 and (runtime.get('future_branch') or {}).get('decisions')==10
          resource=(runtime.get('continuous_exploration') or {}).get('resource_decision') or {}
          activity=resource.get('activity_evidence') or {}
          assert activity.get('available') is True and activity.get('authority_granted') is False and activity.get('github_active_observed')==1
          assert resource.get('selected')=='normal_local_budget'
          assert resource.get('owner')=='Future Branch failure explorer only'
          assert resource.get('external_process_control')=='not_configured' and resource.get('cloud_routing')=='not_configured'
          assert runtime.get('destructive_action_allowed') is False and runtime.get('physical_proof_inferred') is False

          startup=(root/'register-startup.ps1').read_text(encoding='utf-8')
          assert '-RestartCount 3' in startup and '-RunLevel Limited' in startup and 'MultipleInstances IgnoreNew' in startup
          latest=load('latest-runtime-proof.json')
          assert latest.get('source_commit')==workload_src, 'supervision runtime proof boundary changed; reconcile before publish'
          print('GENERATION_LADDER_V136_SOURCE_AND_EVIDENCE_OK')
          PY

          echo "file=$projection" >> "$GITHUB_OUTPUT"
          echo "blob=$blob" >> "$GITHUB_OUTPUT"
          echo "canonical_commit=$canonical_commit" >> "$GITHUB_OUTPUT"
          echo "projection_commit=$projection_commit" >> "$GITHUB_OUTPUT"
          echo "projection_main_commit=$projection_main_commit" >> "$GITHUB_OUTPUT"
          echo "projection_ci_run=$projection_ci_run" >> "$GITHUB_OUTPUT"
          echo "active_trunk_commit=$active_trunk_commit" >> "$GITHUB_OUTPUT"
          echo "current_pc_run=$current_pc_run" >> "$GITHUB_OUTPUT"
          echo "current_vhl_run=$current_vhl_run" >> "$GITHUB_OUTPUT"
          echo "current_native_run=$current_native_run" >> "$GITHUB_OUTPUT"
          echo "hopper_status_run=$hopper_status_run" >> "$GITHUB_OUTPUT"
          echo "hopper_status_job=$hopper_status_job" >> "$GITHUB_OUTPUT"
          echo "hopper_snapshot_commit=$hopper_snapshot_commit" >> "$GITHUB_OUTPUT"
          echo "voice_mirror_run=$voice_mirror_run" >> "$GITHUB_OUTPUT"
          echo "voice_mirror_receipt_commit=$voice_mirror_receipt_commit" >> "$GITHUB_OUTPUT"
          echo "quantum_run=$quantum_run" >> "$GITHUB_OUTPUT"
          echo "quantum_evidence_commit=$quantum_evidence_commit" >> "$GITHUB_OUTPUT"
          echo "farmer_continuous_explorer_commit=$farmer_continuous_explorer_commit" >> "$GITHUB_OUTPUT"
          echo "farmer_runtime_proof_commit=$farmer_runtime_proof_commit" >> "$GITHUB_OUTPUT"
          echo "workload_source_commit=$workload_source_commit" >> "$GITHUB_OUTPUT"
          echo "workload_runtime_proof_commit=$workload_runtime_proof_commit" >> "$GITHUB_OUTPUT"
          echo "workload_boxbrain_ci=$workload_boxbrain_ci" >> "$GITHUB_OUTPUT"
          echo "workload_farmer_ci=$workload_farmer_ci" >> "$GITHUB_OUTPUT"
          echo "supervision_commit=$supervision_commit" >> "$GITHUB_OUTPUT"
          echo "supervision_boxbrain_ci=$supervision_boxbrain_ci" >> "$GITHUB_OUTPUT"
          echo "supervision_farmer_ci=$supervision_farmer_ci" >> "$GITHUB_OUTPUT"
          echo 'CLUSTERSITES_CANONICAL_PROJECTION_V136_OK'

      - name: Configure Bluehost SSH with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"
          test -n "$BLUEHOST_USERNAME"
          test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Back up current Command Center
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() {
            local out="$1"; shift
            local n=1 tmp="$(mktemp)"
            while true; do
              if "$@" > "$tmp"; then mv "$tmp" "$out"; return 0; fi
              [ "$n" -ge 5 ] && { rm -f "$tmp"; return 1; }
              sleep $((n * 5)); n=$((n+1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/generation-seed-ladder.js' ]; then cp -p '$remote/generation-seed-ladder.js' '$backup/generation-seed-ladder.js'; else touch '$backup/.missing-generation-seed-ladder.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject expandable generation ladder component
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./generation-seed-ladder\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          tag='<script src="./generation-seed-ladder.js?v=136"></script>'
          for pattern in (r'<script src="\./seed-lifecycle\.js(?:\?v=[^"]+)?"></script>',r'<script src="\./recovery-guardian\.js(?:\?v=[^"]+)?"></script>',r'</body>'):
              m=re.search(pattern,text)
              if m:
                  text=text[:m.start()]+tag+'\n'+text[m.start():]
                  break
          else: raise SystemExit('dashboard missing generation ladder injection point')
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './generation-seed-ladder.js?v=136' "$RUNNER_TEMP/index.html"

      - name: Publish with bounded retries
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 \
            "$RUNNER_TEMP/index.html" "${{ steps.source.outputs.file }}" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mv '$remote/generation-seed-ladder-projection.js' '$remote/generation-seed-ladder.js'; chmod 644 '$remote/index.html' '$remote/generation-seed-ladder.js'"

      - name: Verify live Command Center
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/live-index.html"; js="$RUNNER_TEMP/live-generation-seed-ladder.js"
          final_url="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' \
            'https://arkmatx.com/aurum/dashboard/generation-seed-ladder.js?rev=136' -o "$js"
          grep -Fq './generation-seed-ladder.js?v=136' "$page"
          cmp -s "$js" "${{ steps.source.outputs.file }}"
          node --check "$js"
          for token in \
            'AURUM_GENERATION_SEED_LADDER_V1_36_CANONICAL' \
            "componentRevision:'1.36'" \
            "workloadObserverRuntime:'verified-read-only-feed'" \
            'workloadObserverReadOnly:true' \
            "workloadObserverBudgetAuthority:'resident-explorer-only'" \
            "workloadObserverRemoteCapacityAuthority:'none'" \
            'workloadObserverProcessControlAllowed:false' \
            'workloadObserverRemoteExecutionAuthority:false' \
            "workloadObserverSupervisionRuntime:'runtime-proof-pending'" \
            'currentVirtualLabDockerX86Passed:true' \
            'currentVirtualLabArm64Passed:true' \
            'currentVirtualLabPi3Passed:true' \
            'currentVirtualLabUefiBootPassed:false' \
            "currentVirtualLabFailureStep:'Boot PC image in QEMU UEFI'" \
            'currentNativeRunPassed:false' \
            "hopperStatusCurrentBlocker:'no-valid-endpoint-candidate'" \
            'humanActionInference:true' \
            "humanActionType:'physical-boot-proof'" \
            'humanActionDestructive:false' \
            'majorBoxAdded:false' \
            'seedLifecycleRemainsExpandable:true' \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:' \
            'The unified workload observer is now verified in the protected Farmer runtime.' \
            'Finish runtime proof for workload-observer supervision before promoting it to live runtime truth.' \
            'Do not choose install, erase, format, repair, or any destructive option.'; do grep -Fq "$token" "$js"; done
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back on verification failure
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/generation-seed-ladder.js' ]; then cp -p '$backup/generation-seed-ladder.js' '$remote/generation-seed-ladder.js'; elif [ -f '$backup/.missing-generation-seed-ladder.js' ]; then rm -f '$remote/generation-seed-ladder.js'; fi"

      - name: Record verified live receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
