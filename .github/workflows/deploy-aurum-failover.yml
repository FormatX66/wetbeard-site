name: Deploy Aurum Failover Carrier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-aurum-failover.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-failover-carrier
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish Aurum failover controller
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out carrier repo
        uses: actions/checkout@v4

      - name: Fetch Aurum controller from BoxBrain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/FormatX66/BoxBrain.git "$RUNNER_TEMP/BoxBrain"
          git -C "$RUNNER_TEMP/BoxBrain" sparse-checkout set Web/Aurum-Arkmatx
          php -l "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/index.php"
          php -l "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/seed-swarm.php"
          test -s "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/.htaccess"

      - name: Configure existing Bluehost SSH carrier
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          ssh-keyscan -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Create isolated failover path and preserve existing failover state
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          dst='public_html/aurum-failover'
          mkdir -p "$dst/state/inbox" "$dst/state/outbox" "$dst/state/nodes" "$dst/state/conversations" "$dst/state/work"
          chmod 755 "$dst"
          find "$dst/state" -type d -exec chmod 700 {} +
          find "$dst/state" -type f -exec chmod 600 {} +
          REMOTE

      - name: Deploy current controller and shared-host route map
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx" -czf - .htaccess index.php portal.html bootstrap.sh bootstrap.ps1 worker.ps1 seed-swarm.php helpaurum.php | \
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            'set -e; tar -xzf - -C public_html/aurum-failover; chmod 644 public_html/aurum-failover/.htaccess public_html/aurum-failover/index.php public_html/aurum-failover/portal.html public_html/aurum-failover/bootstrap.sh public_html/aurum-failover/bootstrap.ps1 public_html/aurum-failover/worker.ps1 public_html/aurum-failover/seed-swarm.php public_html/aurum-failover/helpaurum.php; php -l public_html/aurum-failover/index.php; php -l public_html/aurum-failover/seed-swarm.php; php public_html/aurum-failover/seed-swarm.php'

      - name: Probe failover controller and worker routes without consuming real work
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -u
          api='https://madmorrigan.com/aurum-failover'
          root_code="$(curl -sS -L -o /tmp/root.json -w '%{http_code}' "$api/index.php" || true)"
          nodes_code="$(curl -sS -L -o /tmp/nodes.json -w '%{http_code}' "$api/nodes" || true)"
          lease_code="$(curl -sS -L -o /tmp/lease.json -w '%{http_code}' "$api/work/lease?node_id=aurum-route-probe-no-such-node&capabilities=bbpi4-bootstrap" || true)"
          root_ok=false; nodes_ok=false; lease_ok=false
          if [ "$root_code" = '200' ] && grep -F 'Aurum-Arkmatx' /tmp/root.json >/dev/null 2>&1 && grep -F 'work_lease' /tmp/root.json >/dev/null 2>&1; then root_ok=true; fi
          if [ "$nodes_code" = '200' ] && grep -F 'controller' /tmp/nodes.json >/dev/null 2>&1; then nodes_ok=true; fi
          if [ "$lease_code" = '200' ] && grep -F '"work": null' /tmp/lease.json >/dev/null 2>&1 && grep -F 'Aurum-Arkmatx' /tmp/lease.json >/dev/null 2>&1; then lease_ok=true; fi
          printf 'root_http=%s\nnodes_http=%s\nlease_http=%s\nroot_ok=%s\nnodes_ok=%s\nlease_ok=%s\n' "$root_code" "$nodes_code" "$lease_code" "$root_ok" "$nodes_ok" "$lease_ok" >> "$GITHUB_OUTPUT"
          test "$root_ok" = true
          test "$nodes_ok" = true
          test "$lease_ok" = true

      - name: Read BBPI4 work state directly without leasing
        id: workstate
        if: always()
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          raw="$(ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'cat public_html/aurum-failover/state/work/bbpi4-bootstrap-v1.json 2>/dev/null || true')"
          status="$(printf '%s' "$raw" | jq -r '.status // "missing"' 2>/dev/null || printf 'unreadable')"
          attempts="$(printf '%s' "$raw" | jq -r '.attempts // 0' 2>/dev/null || printf '0')"
          target="$(printf '%s' "$raw" | jq -r '.target_node_id // ""' 2>/dev/null || true)"
          printf 'status=%s\nattempts=%s\ntarget=%s\n' "$status" "$attempts" "$target" >> "$GITHUB_OUTPUT"

      - name: Record failover deployment and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          outcome='${{ steps.verify.outcome }}'
          status='worker-route-verification-failed-controller-root-preserved'
          if [ "$outcome" = 'success' ]; then status='verified-live-worker-routes'; fi
          printf '{\n  "node": "Aurum-Arkmatx",\n  "carrier": "https://madmorrigan.com/aurum-failover/index.php",\n  "clean_route_base": "https://madmorrigan.com/aurum-failover",\n  "state_mode": "preserved-nondestructive",\n  "root_http": "%s",\n  "nodes_http": "%s",\n  "lease_http": "%s",\n  "root_ok": "%s",\n  "nodes_ok": "%s",\n  "lease_ok": "%s",\n  "bbpi4_work_status": "%s",\n  "bbpi4_attempts": "%s",\n  "bbpi4_target_node": "%s",\n  "verification": "%s",\n  "probe_mode": "nonmatching-lease-plus-direct-read-no-real-work-consumed",\n  "verified_at_utc": "%s",\n  "status": "%s"\n}\n' '${{ steps.verify.outputs.root_http }}' '${{ steps.verify.outputs.nodes_http }}' '${{ steps.verify.outputs.lease_http }}' '${{ steps.verify.outputs.root_ok }}' '${{ steps.verify.outputs.nodes_ok }}' '${{ steps.verify.outputs.lease_ok }}' '${{ steps.workstate.outputs.status }}' '${{ steps.workstate.outputs.attempts }}' '${{ steps.workstate.outputs.target }}' "$outcome" "$verified_at" "$status" > deployments/aurum-failover-live.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-failover-live.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Aurum failover live deployment [skip ci]'
          git push origin main
