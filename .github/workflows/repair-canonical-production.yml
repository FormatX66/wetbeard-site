name: Repair Canonical ArkmatX and Xander Production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/repair-canonical-production.yml'

permissions:
  contents: read

concurrency:
  group: canonical-family-production-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Bluehost SSH
        shell: bash
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"
          test -n "$BLUEHOST_USERNAME"
          test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Preflight canonical sources
        shell: bash
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        run: |
          set -euo pipefail
          ssh "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'bash -s' <<'REMOTE'
          set -eu
          ark_src="$HOME/public_html/arkmatx/preview/repair-20260821-highres"
          ark_root="$HOME/public_html/arkmatx"
          x_src="$HOME/repositories/ClusterSites/sites/xanderzombie/index.html"
          x_root="$HOME/public_html/xanderzombie"

          test -s "$ark_src/index.html"
          grep -Fq 'Workshop Between Worlds' "$ark_src/index.html"
          for f in workshop-mobile-v4.png server-mobile-v3.png paradox-mobile-v3.png; do test -s "$ark_src/scenes/$f"; done
          test -s "$ark_src/world-state.php"
          php -l "$ark_src/world-state.php" >/dev/null
          test -s "$x_src"
          grep -Fq 'https://madmorrigan.com/?from=xander' "$x_src"

          test -d "$ark_root/aurum"
          test -d "$ark_root/preview"
          test -d "$ark_root/state"
          test -d "$x_root/data"
          test -d "$x_root/generated"
          test -d "$x_root/preview"
          echo 'RECOVERY_PREFLIGHT_OK'
          REMOTE

      - name: Back up files that will be replaced
        id: backup
        shell: bash
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        run: |
          set -euo pipefail
          ssh "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'bash -s' <<'REMOTE'
          set -eu
          run_id='${{ github.run_id }}'
          backup="$HOME/.site-recovery-backups/20260822-$run_id"
          ark_src="$HOME/public_html/arkmatx/preview/repair-20260821-highres"
          ark_root="$HOME/public_html/arkmatx"
          x_root="$HOME/public_html/xanderzombie"
          mkdir -p "$backup/arkmatx" "$backup/xanderzombie"
          : > "$backup/arkmatx-missing.txt"

          cd "$ark_src"
          find . -type f -print0 | while IFS= read -r -d '' rel; do
            rel="${rel#./}"
            case "$rel" in
              aurum/*|preview/*|state/*|data/*|generated/*) continue ;;
            esac
            if [ -f "$ark_root/$rel" ]; then
              mkdir -p "$backup/arkmatx/$(dirname "$rel")"
              cp -p "$ark_root/$rel" "$backup/arkmatx/$rel"
            else
              printf '%s\n' "$rel" >> "$backup/arkmatx-missing.txt"
            fi
          done

          cp -p "$x_root/index.html" "$backup/xanderzombie/index.html"
          printf '%s\n' "$backup" > "$HOME/.site-recovery-backups/latest-20260822.txt"
          printf 'BACKUP_READY path=%s\n' "$backup"
          REMOTE

      - name: Promote verified canonical files
        shell: bash
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        run: |
          set -euo pipefail
          ssh "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'bash -s' <<'REMOTE'
          set -eu
          ark_src="$HOME/public_html/arkmatx/preview/repair-20260821-highres/"
          ark_root="$HOME/public_html/arkmatx/"
          x_src="$HOME/repositories/ClusterSites/sites/xanderzombie/index.html"
          x_root="$HOME/public_html/xanderzombie/index.html"

          rsync -a \
            --exclude '/aurum/' \
            --exclude '/preview/' \
            --exclude '/state/' \
            --exclude '/data/' \
            --exclude '/generated/' \
            "$ark_src" "$ark_root"
          cp -p "$x_src" "$x_root"
          chmod 644 "$x_root"
          echo 'CANONICAL_FILES_PROMOTED'
          REMOTE

      - name: Verify repaired production surfaces
        shell: bash
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        run: |
          set -euo pipefail

          ark_url='https://arkmatx.com/?canonical_repair=20260822'
          curl -LfsS -H 'Cache-Control: no-cache' "$ark_url" -o /tmp/ark.html
          grep -Fq 'Workshop Between Worlds' /tmp/ark.html
          js_path="$(grep -Eo '/assets/[^\"]+\.js' /tmp/ark.html | head -n1)"
          test -n "$js_path"
          curl -LfsS -H 'Cache-Control: no-cache' "https://arkmatx.com${js_path}?canonical_repair=20260822" -o /tmp/ark.js
          test -s /tmp/ark.js
          for f in workshop-mobile-v4.png server-mobile-v3.png paradox-mobile-v3.png; do
            curl -LfsS -H 'Cache-Control: no-cache' "https://arkmatx.com/scenes/$f?canonical_repair=20260822" -o "/tmp/$f"
            test -s "/tmp/$f"
          done

          curl -LfsS -H 'Cache-Control: no-cache' 'https://xanderzombie.com/?canonical_repair=20260822' -o /tmp/xander.html
          grep -Fq 'XANDER ZOMBIE' /tmp/xander.html
          grep -Fq 'https://madmorrigan.com/?from=xander' /tmp/xander.html
          for f in cemetery.svg town.svg woods.svg; do
            curl -LfsS -H 'Cache-Control: no-cache' "https://xanderzombie.com/scenes/$f?canonical_repair=20260822" -o "/tmp/x-$f"
            test -s "/tmp/x-$f"
          done

          curl -LfsS -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/?canonical_repair=20260822' -o /tmp/aurum.html
          test -s /tmp/aurum.html

          ssh "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'bash -s' <<'REMOTE'
          set -eu
          ark_root="$HOME/public_html/arkmatx"
          x_root="$HOME/public_html/xanderzombie"
          x_src="$HOME/repositories/ClusterSites/sites/xanderzombie/index.html"
          test -d "$ark_root/aurum"
          test -d "$ark_root/preview"
          test -d "$ark_root/state"
          test -d "$x_root/data"
          test -d "$x_root/generated"
          test -d "$x_root/preview"
          php -l "$ark_root/world-state.php" >/dev/null
          php -l "$x_root/comic-api.php" >/dev/null
          php -l "$x_root/studio.php" >/dev/null
          php -l "$x_root/reel.php" >/dev/null
          test "$(sha256sum "$x_src" | awk '{print $1}')" = "$(sha256sum "$x_root/index.html" | awk '{print $1}')"
          echo 'CANONICAL_PRODUCTION_VERIFIED'
          REMOTE

      - name: Roll back if repair verification fails
        if: ${{ failure() && steps.backup.outcome == 'success' }}
        shell: bash
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        run: |
          set -euo pipefail
          ssh "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'bash -s' <<'REMOTE'
          set -eu
          run_id='${{ github.run_id }}'
          backup="$HOME/.site-recovery-backups/20260822-$run_id"
          ark_root="$HOME/public_html/arkmatx"
          x_root="$HOME/public_html/xanderzombie"
          test -d "$backup/arkmatx"

          cd "$backup/arkmatx"
          find . -type f -print0 | while IFS= read -r -d '' rel; do
            rel="${rel#./}"
            mkdir -p "$ark_root/$(dirname "$rel")"
            cp -p "$backup/arkmatx/$rel" "$ark_root/$rel"
          done
          if [ -f "$backup/arkmatx-missing.txt" ]; then
            while IFS= read -r rel; do [ -n "$rel" ] && rm -f "$ark_root/$rel"; done < "$backup/arkmatx-missing.txt"
          fi
          cp -p "$backup/xanderzombie/index.html" "$x_root/index.html"
          echo 'REPAIR_ROLLED_BACK'
          REMOTE
