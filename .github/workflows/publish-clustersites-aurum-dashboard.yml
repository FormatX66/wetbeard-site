name: Publish ClusterSites Aurum Dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-clustersites-aurum-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clustersites-aurum-dashboard-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Aurum Command Center v3.2
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out deployment carrier
        uses: actions/checkout@v4

      - name: Prepare verified public projection of canonical command center
        id: source
        shell: bash
        run: |
          set -euo pipefail
          base_url='https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/dashboard.html'
          shell_url='https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/command-center-v3.2.js'
          source_api='https://api.github.com/repos/FormatX66/BoxBrain/commits/main'
          target="$RUNNER_TEMP/aurum-dashboard.html"
          shell="$RUNNER_TEMP/command-center.js"
          curl --fail-with-body --silent --show-error --location "$base_url" -o "$target"
          curl --fail-with-body --silent --show-error --location "$shell_url" -o "$shell"
          source_json="$(curl --fail-with-body --silent --show-error --location -H 'Accept: application/vnd.github+json' "$source_api")"
          projection_sha="$(printf '%s' "$source_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          python3 - "$target" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          text=p.read_text(encoding='utf-8')
          old="function rel(path){return base()+String(path).replace(/^\\//,'')}"
          new="function rel(path){const p=String(path).replace(/^\\//,'');if(p==='voice-status.json')return '/aurum/voice-status.json';if(p==='status')return '/aurum/index.php';if(p==='nodes')return '/aurum/index.php/nodes';return `/aurum/index.php/${p}`}"
          if old not in text:
              raise SystemExit('Aurum projection route contract changed; refusing blind deployment')
          text=text.replace(old,new,1)
          text=text.replace('href=\"./\">Aurum portal','href=\"/aurum/\">Aurum portal',1)
          tag='<script src="./command-center.js?v=32"></script>'
          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('dashboard missing body close')
              text=text.replace('</body>',tag+'\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
          test -s "$target"
          test -s "$shell"
          grep -Fq 'Progress is proof, not activity.' "$target"
          grep -Fq 'voice-status.json' "$target"
          grep -Fq './command-center.js?v=32' "$target"
          grep -Fq 'AURUM_COMMAND_CENTER_V3_2_CANONICAL' "$shell"
          grep -Fq 'frontiers advancing' "$shell"
          grep -Fq 'needs work' "$shell"
          grep -Fq 'your actions' "$shell"
          grep -Fq 'Unknown or unavailable evidence never becomes a task.' "$shell"
          echo "projection_sha=$projection_sha" >> "$GITHUB_OUTPUT"
          echo "file=$target" >> "$GITHUB_OUTPUT"
          echo "shell=$shell" >> "$GITHUB_OUTPUT"

      - name: Configure existing Bluehost SSH carrier
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"
          test -n "$BLUEHOST_USERNAME"
          test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          ssh-keyscan -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Back up current dashboard target
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/v32-$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; if [ -f '$remote/index.html' ]; then cp -p '$remote/index.html' '$backup/index.html'; else touch '$backup/.missing-index.html'; fi; if [ -f '$remote/command-center.js' ]; then cp -p '$remote/command-center.js' '$backup/command-center.js'; else touch '$backup/.missing-command-center.js'; fi"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Publish command center projection
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 "${{ steps.source.outputs.file }}" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/index.html"
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 "${{ steps.source.outputs.shell }}" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/command-center.js"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" "chmod 644 '$remote/index.html' '$remote/command-center.js'"

      - name: Verify live command center and shared evidence mirror
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"
          shell="$(mktemp)"
          mirror="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/command-center.js?rev=32' -o "$shell"
          grep -Fq 'Progress is proof, not activity.' "$page"
          grep -Fq './command-center.js?v=32' "$page"
          grep -Fq 'AURUM_COMMAND_CENTER_V3_2_CANONICAL' "$shell"
          grep -Fq 'Frontiers Advancing' "$shell"
          grep -Fq 'Needs Work' "$shell"
          grep -Fq 'Your Actions' "$shell"
          grep -Fq 'Unknown or unavailable evidence never becomes a task.' "$shell"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/voice-status.json' -o "$mirror"
          python3 - "$mirror" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text())
          assert payload['schema']=='aurum-voice-status-v1'
          assert len(payload.get('human_capabilities',[]))==7
          assert 'human_action' in payload.get('overall',{})
          print('AURUM_COMMAND_CENTER_V32_MIRROR_OK')
          PY
          status="$(curl --fail-with-body --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 'https://arkmatx.com/aurum/index.php')"
          printf '%s' "$status" | grep -Fq 'Aurum-Arkmatx'
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back dashboard if verification fails
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/v32-$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; if [ -f '$backup/index.html' ]; then cp -p '$backup/index.html' '$remote/index.html'; elif [ -f '$backup/.missing-index.html' ]; then rm -f '$remote/index.html'; fi; if [ -f '$backup/command-center.js' ]; then cp -p '$backup/command-center.js' '$remote/command-center.js'; elif [ -f '$backup/.missing-command-center.js' ]; then rm -f '$remote/command-center.js'; fi"

      - name: Record verified deployment receipt
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-dashboard-live.json <<EOF
          {
            "site": "arkmatx-aurum-dashboard",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_dashboard": "services/aurum-arkmatx/dashboard-v3.html",
            "canonical_behavior": "services/aurum-arkmatx/command-center-v3.2.js",
            "runtime_projection_repo": "FormatX66/BoxBrain",
            "runtime_projection_sha": "${{ steps.source.outputs.projection_sha }}",
            "credential_carrier_repo": "FormatX66/wetbeard-site",
            "command_center_version": "3.2",
            "stable_runtime_asset": "command-center.js",
            "aurum_gui_theme": "dark-violet",
            "expandable_summary": true,
            "expandable_systems": true,
            "expandable_capabilities": true,
            "expandable_panels": true,
            "frontiers_advancing": true,
            "needs_work": true,
            "your_actions": true,
            "unknown_is_not_human_action": true,
            "voice_mirror_verified": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-dashboard-live.json
          git commit -m 'Record Aurum dashboard v3.2 live deployment [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
