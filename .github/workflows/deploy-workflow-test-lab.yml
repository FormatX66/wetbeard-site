name: Deploy isolated workflow test lab

on:
  push:
    branches:
      - dev/workflow-test-lab
    paths:
      - 'workflow-test-site/**'
      - 'workflow-test-platform/**'
      - '.github/workflows/deploy-workflow-test-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workflow-test-lab-only
  cancel-in-progress: false

jobs:
  validate-deploy-verify:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/workflow-test-lab
          fetch-depth: 0

      - name: Validate isolated source and routes
        run: python3 workflow-test-platform/scripts/validate.py

      - name: Build release metadata
        shell: bash
        run: |
          set -euo pipefail
          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > workflow-test-site/deployment.json <<EOF
          {
            "site": "workflow-test-lab",
            "release_id": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "deployed_at_utc": "${deployed_at}",
            "status": "verified-live"
          }
          EOF

      - name: Atomic deploy with pre-deploy backup
        env:
          DEPLOY_HOST: ${{ secrets.BLUEHOST_HOST }}
          DEPLOY_USER: ${{ secrets.BLUEHOST_USERNAME }}
          DEPLOY_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
          SOURCE_DIR: workflow-test-site
          TARGET_PATH: public_html/workflow-test-lab
          RELEASE_ROOT: public_html/workflow-test-lab-releases
          BACKUP_ROOT: public_html/workflow-test-lab-backups
          RELEASE_ID: ${{ github.sha }}
          DEPLOY_PORT: '22'
        run: bash workflow-test-platform/scripts/deploy-release.sh

      - name: Verify deployed calibration site
        shell: bash
        run: |
          set -euo pipefail
          url='https://madmorrigan.com/workflow-test-lab/'
          curl --fail-with-body --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 -o /tmp/test.html "$url"
          curl --fail-with-body --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 -o /tmp/target.svg "${url}assets/calibration-target.svg"
          curl --fail-with-body --silent --show-error --retry 6 --retry-all-errors --retry-delay 2 -o /tmp/deployment.json "${url}deployment.json"
          grep -Fq 'WORKFLOW TEST LAB' /tmp/test.html
          grep -Fq 'RESPONSIVE TARGET 01' /tmp/test.html
          grep -Fq 'TEST SITE ONLY // NO PRODUCTION ROUTES' /tmp/test.html
          grep -Fq 'Calibration target' /tmp/target.svg
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/deployment.json',encoding='utf-8'))
          assert d['site']=='workflow-test-lab'
          assert d['status']=='verified-live'
          PY

      - name: Finalize verified release and retain last five
        env:
          DEPLOY_HOST: ${{ secrets.BLUEHOST_HOST }}
          DEPLOY_USER: ${{ secrets.BLUEHOST_USERNAME }}
          DEPLOY_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
          TARGET_PATH: public_html/workflow-test-lab
          RELEASE_ROOT: public_html/workflow-test-lab-releases
          BACKUP_ROOT: public_html/workflow-test-lab-backups
          DEPLOY_PORT: '22'
        run: bash workflow-test-platform/scripts/finalize-release.sh

      - name: Record isolated deployment receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workflow-test-receipts
          deployed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > workflow-test-receipts/test-site.json <<EOF
          {
            "url": "https://madmorrigan.com/workflow-test-lab/",
            "target": "public_html/workflow-test-lab",
            "source_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "verified_at_utc": "${deployed_at}",
            "status": "verified-live"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflow-test-receipts/test-site.json
          git commit -m 'Record isolated workflow test deployment [skip ci]' || exit 0
          git pull --rebase origin dev/workflow-test-lab
          git push origin HEAD:dev/workflow-test-lab
