name: Publish Aurum Pi3 Physical Evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-pi3-physical-evidence.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish ClusterSites Aurum Dashboard
    types: [completed]

permissions:
  contents: write

concurrency:
  group: aurum-pi3-physical-evidence-production
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public projection of canonical ClusterSites Pi3 evidence surface
        id: source
        shell: bash
        run: |
          set -euo pipefail
          src='https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/pi3-physical-evidence-v1.js'
          out="$RUNNER_TEMP/pi3-physical-evidence.js"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 "$src" -o "$out"
          test -s "$out"
          node --check "$out"
          grep -Fq 'AURUM_PI3_PHYSICAL_EVIDENCE_V1_3_CANONICAL' "$out"
          grep -Fq 'Canonical website owner: FormatX66/ClusterSites.' "$out"
          grep -Fq "schema:'aurum-command-center-pi3-physical-evidence-v1.3'" "$out"
          grep -Fq 'Pi3 Physical Evidence' "$out"
          grep -Fq 'Aurum Pi3 Attached-Runner Read-Only Probe' "$out"
          grep -Fq "const ATTACHED_RUNNER='GLOBAL-FAMILY-DESKTOP'" "$out"
          grep -Fq 'REACHABLE_IDENTITY_UNVERIFIED' "$out"
          grep -Fq 'NO_REACHABLE_PASSIVE_USB_ENDPOINT' "$out"
          grep -Fq 'NO_REACHABLE_PI3_RECEIPT' "$out"
          grep -Fq 'attachedRunnerRequestSafeReadOnly:' "$out"
          grep -Fq 'attachedRunnerWorkflowGuarded:' "$out"
          grep -Fq 'attachedRunnerReceiptState:' "$out"
          grep -Fq 'activeNetworkScanAllowed:false' "$out"
          grep -Fq 'persistentTrustChangeAllowed:false' "$out"
          grep -Fq 'noReachableReceiptObserved:' "$out"
          grep -Fq 'reachabilityReceiptState:' "$out"
          grep -Fq 'knownTargetsTried:' "$out"
          grep -Fq 'tcp22ReachableCount:' "$out"
          grep -Fq 'rootCauseInferred:false' "$out"
          grep -Fq 'Frontiers Advancing:' "$out"
          grep -Fq 'Needs Work → Aurum/System:' "$out"
          grep -Fq 'Your Actions:' "$out"
          grep -Fq 'probeWorkflowGuarded:' "$out"
          grep -Fq 'parallelExperimentGatePresent:' "$out"
          grep -Fq 'physicalReceiptCaptured:' "$out"
          grep -Fq 'stateWeaveHardwareBinding:' "$out"
          grep -Fq 'mutationAllowed:false' "$out"
          grep -Fq 'promotionAllowed:false' "$out"
          grep -Fq 'writeAuthority:false' "$out"
          grep -Fq "needsWorkOwner:'aurum-system'" "$out"
          grep -Fq 'humanActionInference:false' "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Configure existing Bluehost SSH carrier with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"
          test -n "$BLUEHOST_USERNAME"
          test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            if [ "$attempt" -eq 5 ]; then
              echo "Bluehost SSH keyscan remained unavailable after $attempt bounded attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

      - name: Back up and fetch current command center
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() {
            local outfile="$1"; shift
            local attempt=1 rc=0 tmp
            tmp="$(mktemp)"
            while true; do
              if "$@" > "$tmp"; then mv "$tmp" "$outfile"; return 0; fi
              rc=$?
              if [ "$attempt" -ge 5 ]; then rm -f "$tmp"; return "$rc"; fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/pi3-physical-evidence-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" \
            ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/pi3-physical-evidence.js' ]; then cp -p '$remote/pi3-physical-evidence.js' '$backup/pi3-physical-evidence.js'; else touch '$backup/.missing-pi3-physical-evidence.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          grep -Fq 'Progress is proof, not activity.' "$RUNNER_TEMP/index.html"
          grep -Fq './command-center.js?v=32' "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject Pi3 physical evidence surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1])
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./pi3-physical-evidence\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          if '</body>' not in text:
              raise SystemExit('dashboard missing body close')
          text=text.replace('</body>','<script src="./pi3-physical-evidence.js?v=4"></script>\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './pi3-physical-evidence.js?v=4' "$RUNNER_TEMP/index.html"

      - name: Publish Pi3 physical evidence with bounded connection count
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 rc=0
            while true; do
              "$@" && return 0
              rc=$?
              if [ "$attempt" -ge 5 ]; then return "$rc"; fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          stage="$RUNNER_TEMP/aurum-pi3-physical-evidence-publish"
          mkdir -p "$stage"
          cp "$RUNNER_TEMP/index.html" "$stage/index.html"
          cp "${{ steps.source.outputs.file }}" "$stage/pi3-physical-evidence.js"
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 \
            "$stage/index.html" "$stage/pi3-physical-evidence.js" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "chmod 644 '$remote/index.html' '$remote/pi3-physical-evidence.js'"

      - name: Verify live Pi3 physical evidence surface
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"
          component="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' \
            'https://arkmatx.com/aurum/dashboard/pi3-physical-evidence.js?rev=4' -o "$component"
          grep -Fq 'Progress is proof, not activity.' "$page"
          grep -Fq './command-center.js?v=32' "$page"
          grep -Fq './pi3-physical-evidence.js?v=4' "$page"
          grep -Fq 'AURUM_PI3_PHYSICAL_EVIDENCE_V1_3_CANONICAL' "$component"
          grep -Fq "schema:'aurum-command-center-pi3-physical-evidence-v1.3'" "$component"
          grep -Fq 'Pi3 Physical Evidence' "$component"
          grep -Fq 'Aurum Pi3 Attached-Runner Read-Only Probe' "$component"
          grep -Fq "const ATTACHED_RUNNER='GLOBAL-FAMILY-DESKTOP'" "$component"
          grep -Fq 'REACHABLE_IDENTITY_UNVERIFIED' "$component"
          grep -Fq 'NO_REACHABLE_PASSIVE_USB_ENDPOINT' "$component"
          grep -Fq 'attachedRunnerRequestSafeReadOnly:' "$component"
          grep -Fq 'attachedRunnerWorkflowGuarded:' "$component"
          grep -Fq 'attachedRunnerReceiptState:' "$component"
          grep -Fq 'activeNetworkScanAllowed:false' "$component"
          grep -Fq 'persistentTrustChangeAllowed:false' "$component"
          grep -Fq 'noReachableReceiptObserved:' "$component"
          grep -Fq 'rootCauseInferred:false' "$component"
          grep -Fq 'Frontiers Advancing:' "$component"
          grep -Fq 'Needs Work → Aurum/System:' "$component"
          grep -Fq 'Your Actions:' "$component"
          grep -Fq 'physicalReceiptCaptured:' "$component"
          grep -Fq 'stateWeaveHardwareBinding:' "$component"
          grep -Fq 'mutationAllowed:false' "$component"
          grep -Fq 'promotionAllowed:false' "$component"
          grep -Fq 'writeAuthority:false' "$component"
          grep -Fq "needsWorkOwner:'aurum-system'" "$component"
          grep -Fq 'humanActionInference:false' "$component"
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back if verification fails
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt=1 rc=0
            while true; do
              "$@" && return 0
              rc=$?
              if [ "$attempt" -ge 5 ]; then return "$rc"; fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/pi3-physical-evidence-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/pi3-physical-evidence.js' ]; then cp -p '$backup/pi3-physical-evidence.js' '$remote/pi3-physical-evidence.js'; elif [ -f '$backup/.missing-pi3-physical-evidence.js' ]; then rm -f '$remote/pi3-physical-evidence.js'; fi"

      - name: Record verified Pi3 physical evidence receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-pi3-physical-evidence-live.json <<EOF
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/pi3-physical-evidence-v1.js",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx/pi3-physical-evidence-v1.js",
            "deployment_carrier": "FormatX66/wetbeard-site",
            "pi3_physical_evidence_revision": "1.3",
            "expandable": true,
            "read_only_request_visible": true,
            "self_hosted_probe_lane_visible": true,
            "attached_runner_routing_visible": true,
            "attached_runner_target": "GLOBAL-FAMILY-DESKTOP",
            "wrong_runner_jobs_exit_without_probe": true,
            "passive_usb_neighbor_only": true,
            "strict_ssh_identity_boundary_visible": true,
            "active_network_scan_allowed": false,
            "persistent_trust_change_allowed": false,
            "terminal_no_reachable_receipt_visible": true,
            "terminal_attached_runner_receipts_visible": true,
            "no_reachable_receipt_is_not_identity_capture": true,
            "root_cause_inference": false,
            "stateweave_hardware_binding_visible": true,
            "adaptive_kernel_arch_gate_visible": true,
            "future_branch_next_state_visible": true,
            "physical_receipt_separate_from_repository_proof": true,
            "canonical_projection_parity_republished": true,
            "mutation_authority": false,
            "promotion_authority": false,
            "write_authority": false,
            "frontiers_advancing_visible": true,
            "needs_work_system_owned": true,
            "human_action_inference": false,
            "backup_before_publish": true,
            "rollback_on_verify_failure": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-pi3-physical-evidence-live.json
          git commit -m 'Record Aurum Pi3 physical evidence v1.3 live [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
