name: Deployment Platform v2 - Staging

on:
  workflow_dispatch:
    inputs:
      site:
        description: Site id from deploy-platform/sites
        required: true
        default: ubercorp
      host:
        description: Host profile
        required: true
        default: bluehost
  push:
    branches:
      - dev/ubercorp-workflow-v2
    paths:
      - 'uber/**'
      - 'deploy-platform/**'
      - '.github/workflows/deploy-platform-v2.yml'

permissions:
  contents: write

concurrency:
  group: deployment-platform-v2-staging
  cancel-in-progress: true

jobs:
  stage:
    name: Stage site without touching production
    runs-on: ubuntu-latest
    steps:
      - name: Check out v2 branch
        uses: actions/checkout@v4
        with:
          ref: dev/ubercorp-workflow-v2

      - name: Resolve site manifest
        id: site
        shell: bash
        run: |
          set -euo pipefail
          site='${{ github.event.inputs.site || 'ubercorp' }}'
          manifest="deploy-platform/sites/${site}.json"
          test -f "$manifest"
          python3 - <<'PY' "$manifest" >> "$GITHUB_OUTPUT"
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          s=d['staging']
          print(f"manifest={sys.argv[1]}")
          print(f"site_id={d['id']}")
          print(f"host={s['host']}")
          print(f"target={s['target_path']}")
          print(f"url={s['public_url']}")
          PY

      - name: Enforce staging-only safety lock
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.site.outputs.target }}' != 'public_html/uber'
          case '${{ steps.site.outputs.target }}' in
            public_html/dev-platform/*) ;;
            *) echo 'Refusing target outside public_html/dev-platform'; exit 1;;
          esac

      - name: Run source preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy-platform/local/check-site.py '${{ steps.site.outputs.site_id }}'
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find uber -type f -name '*.php' -print0)

      - name: Build isolated staging copy
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy-platform/scripts/prepare-site.py '${{ steps.site.outputs.manifest }}' staging /tmp/site-stage

      - name: Validate staged output
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/site-stage/index.html
          test -s /tmp/site-stage/deployment-platform.json
          python3 - <<'PY' '${{ steps.site.outputs.manifest }}'
          import json,sys,pathlib
          m=json.load(open(sys.argv[1],encoding='utf-8'))
          html=pathlib.Path('/tmp/site-stage/index.html').read_text(encoding='utf-8')
          for needle in m.get('checks',[]):
              assert needle in html, f'Missing staging check: {needle}'
          PY

      - name: Deploy to Bluehost staging adapter
        if: ${{ steps.site.outputs.host == 'bluehost' }}
        env:
          DEPLOY_HOST: ${{ secrets.BLUEHOST_HOST }}
          DEPLOY_USER: ${{ secrets.BLUEHOST_USERNAME }}
          DEPLOY_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
          DEPLOY_TARGET: ${{ steps.site.outputs.target }}
          DEPLOY_SOURCE: /tmp/site-stage
          DEPLOY_PORT: '22'
        shell: bash
        run: bash deploy-platform/scripts/deploy-ssh.sh

      - name: Reject unconfigured host adapters
        if: ${{ steps.site.outputs.host != 'bluehost' }}
        shell: bash
        run: |
          echo 'Requested host profile is not yet wired to GitHub secrets.'
          exit 1

      - name: Verify public staging URL
        shell: bash
        run: |
          set -euo pipefail
          url='${{ steps.site.outputs.url }}'
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --header 'Cache-Control: no-cache' --output /tmp/stage.html "$url"
          curl --fail-with-body --silent --show-error --output /tmp/stage-marker.json "${url}deployment-platform.json"
          python3 - <<'PY' '${{ steps.site.outputs.manifest }}'
          import json,sys
          manifest=json.load(open(sys.argv[1],encoding='utf-8'))
          marker=json.load(open('/tmp/stage-marker.json',encoding='utf-8'))
          html=open('/tmp/stage.html',encoding='utf-8').read()
          assert marker['site']==manifest['id']
          assert marker['environment']=='staging'
          for needle in manifest.get('checks',[]):
              assert needle in html, f'Live staging missing check: {needle}'
          print('Staging deployment verified:', marker['public_url'])
          PY

      - name: Record verified staging receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployments-v2
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > "deployments-v2/staging-${{ steps.site.outputs.site_id }}.json" <<EOF
          {
            "site": "${{ steps.site.outputs.site_id }}",
            "environment": "staging",
            "host": "${{ steps.site.outputs.host }}",
            "url": "${{ steps.site.outputs.url }}",
            "source_sha": "${GITHUB_SHA}",
            "verified_at_utc": "${verified_at}",
            "status": "verified-live"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "deployments-v2/staging-${{ steps.site.outputs.site_id }}.json"
          git commit -m 'Record workflow v2 staging verification [skip ci]'
          git pull --rebase origin dev/ubercorp-workflow-v2
          git push origin HEAD:dev/ubercorp-workflow-v2
