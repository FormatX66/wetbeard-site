name: Publish Aurum Activity Clarity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-activity-clarity.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish ClusterSites Aurum Dashboard
    types: [completed]

permissions:
  contents: write

concurrency:
  group: aurum-activity-clarity-production
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out deployment carrier
        uses: actions/checkout@v4

      - name: Fetch canonical ClusterSites activity clarity component
        id: source
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/FormatX66/ClusterSites/main/services/aurum-arkmatx/activity-clarity-v1.js'
          target="$RUNNER_TEMP/activity-clarity.js"
          curl --fail-with-body --silent --show-error --location "$url" -o "$target"
          test -s "$target"
          grep -Fq 'AURUM_ACTIVITY_CLARITY_V1_CANONICAL' "$target"
          grep -Fq 'idempotent confirmations, not new frontier progress' "$target"
          grep -Fq 'full repository history' "$target"
          echo "file=$target" >> "$GITHUB_OUTPUT"

      - name: Configure existing Bluehost SSH carrier
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"
          test -n "$BLUEHOST_USERNAME"
          test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          ssh-keyscan -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Back up current dashboard target
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/activity-clarity-$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/activity-clarity.js' ]; then cp -p '$remote/activity-clarity.js' '$backup/activity-clarity.js'; else touch '$backup/.missing-activity-clarity.js'; fi"
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/index.html" "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject activity clarity component
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          text=p.read_text(encoding='utf-8')
          tag='<script src="./activity-clarity.js?v=1"></script>'
          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('dashboard missing body close')
              text=text.replace('</body>',tag+'\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './activity-clarity.js?v=1' "$RUNNER_TEMP/index.html"
          grep -Fq './command-center.js?v=32' "$RUNNER_TEMP/index.html"

      - name: Publish activity clarity component
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 "$RUNNER_TEMP/index.html" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/index.html"
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 "${{ steps.source.outputs.file }}" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/activity-clarity.js"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" "chmod 644 '$remote/index.html' '$remote/activity-clarity.js'"

      - name: Verify live activity clarity component
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"
          component="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/activity-clarity.js?rev=1' -o "$component"
          grep -Fq './command-center.js?v=32' "$page"
          grep -Fq './activity-clarity.js?v=1' "$page"
          grep -Fq 'AURUM_ACTIVITY_CLARITY_V1_CANONICAL' "$component"
          grep -Fq 'idempotent confirmations, not new frontier progress' "$component"
          grep -Fq 'full repository history' "$component"
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back activity clarity if verification fails
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/activity-clarity-$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/activity-clarity.js' ]; then cp -p '$backup/activity-clarity.js' '$remote/activity-clarity.js'; elif [ -f '$backup/.missing-activity-clarity.js' ]; then rm -f '$remote/activity-clarity.js'; fi"

      - name: Record verified activity clarity receipt
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-activity-clarity-live.json <<EOF
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/activity-clarity-v1.js",
            "credential_carrier_repo": "FormatX66/wetbeard-site",
            "routine_receipt_compaction": true,
            "audit_evidence_preserved": true,
            "routine_receipts_are_not_frontier_progress": true,
            "routine_receipts_are_not_human_actions": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-activity-clarity-live.json
          git commit -m 'Record Aurum activity clarity live deployment [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
