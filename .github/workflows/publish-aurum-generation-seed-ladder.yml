name: Publish Aurum Generation Seed Ladder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-generation-seed-ladder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-generation-seed-ladder-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify ClusterSites authority pin, public projection, and approved evidence
        id: source
        shell: bash
        run: |
          set -euo pipefail
          # ClusterSites remains canonical. Production accepts only the independently
          # approved canonical blob after byte-identical BoxBrain projection + CI proof.
          canonical_commit='a3384a4045eebc778e1e316f3584036a98e56b5b'
          projection_commit='3212096840c99f3f604904c4da9f9af9665b30e4'
          projection_main_commit='5cdff7de7f02d0e155a0ee9594edb941a9fd3ebd'
          expected_blob='4fd8b7e2b1dc4658db67542b62f49b4838595297'
          projection_ci_run='33710028758'
          hopper_snapshot_commit='4ac20ff95617698f3a893f01b5d28a6d728562a1'
          active_trunk_commit='ac6b03819e47e7167ba77b2e3a5846f515a88d72'
          active_trunk_parent='e0fe2aea7cc91829912be2c833ca81f5f9407a5e'
          pc_image_run='33677247135'
          prior_pc_failure_run='33675680912'
          virtual_lab_run='33695190511'
          native_run='33687947059'
          controller_run='33703121424'
          prerequisite_run='33703828433'

          projection="$RUNNER_TEMP/generation-seed-ladder-projection.js"
          projection_main="$RUNNER_TEMP/generation-seed-ladder-projection-main.js"
          api_boxbrain='https://api.github.com/repos/FormatX66/BoxBrain'

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_main_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection_main"
          test -s "$projection"; test -s "$projection_main"
          node --check "$projection"
          cmp -s "$projection" "$projection_main"
          blob="$(git hash-object "$projection")"
          test "$blob" = "$expected_blob"

          for token in \
            'AURUM_GENERATION_SEED_LADDER_V1_CANONICAL' \
            'AURUM_GENERATION_SEED_LADDER_V1_22_CANONICAL' \
            "canonicalWebsiteRepo:'FormatX66/ClusterSites'" \
            "componentRevision:'1.22'" \
            "ACTIVE_TRUNK_COMMIT='ac6b03819e47e7167ba77b2e3a5846f515a88d72'" \
            'legacyAutobootIntegratedIntoActiveTrunk:true' \
            'legacyAutobootPhysicalHopperProofProven:false' \
            'currentPcImageValidationPassed:true' \
            'currentPcImageBuildPassed:true' \
            'currentGenericUefiInstallRebootSelfBuildSmokePassed:true' \
            'currentLegacyBiosInstallAndBootSmokePassed:true' \
            'currentHpTwinSmokePassed:true' \
            'currentVerifiedPcImagePublished:true' \
            'currentHeadVirtualLabPassed:true' \
            'currentHeadFourTargetConvergencePassed:true' \
            'currentHeadRuntimePublicationPerformed:false' \
            "currentNativeFailureStep:'Verify native self-build contracts'" \
            'test_gui_live_trial_preserves_human_constants_and_dialogue_boundary' \
            "latestKnownNativeExternalEvidenceReason:'gui-live-trial-evidence-expired'" \
            "continuousNativeState:'stable:external-evidence-pending'" \
            "continuousLabState:'same-head-terminal-result-already-recorded'" \
            'continuousNativeDispatch:false' \
            'continuousLabDispatch:false' \
            "physicalPrerequisitePublish:'skipped-unchanged'" \
            'guardedHopperInstallImplemented:true' \
            'guardedInstallVisibleEraseConfirmationRequired:true' \
            'guardedInstallExactlyOneEligibleInternalTargetRequired:true' \
            'guardedInstallFreshTargetDiscoveryBeforeWrite:true' \
            'guardedInstallVerifiedCompletionRequiredBeforePoweroff:true' \
            'guardedInstallPhysicalExecutionProven:false' \
            'guardedInstallPhysicalVerificationProven:false' \
            'guardedInstallHumanApprovalCurrent:false' \
            "hopperStatusCurrentBlocker:'no-valid-endpoint-candidate'" \
            'hopperStatusPowerStateInferred:false' \
            'hopperStatusNetworkStateInferred:false' \
            'hopperStatusRuntimeStateInferred:false' \
            'humanActionInferred:false' \
            'humanActionInference:false' \
            "needsWorkOwner:'aurum-system'" \
            'backupBeforePublishExpected:true' \
            'rollbackOnVerificationFailure:true' \
            'majorBoxAdded:false' \
            'seedLifecycleRemainsExpandable:true' \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:'; do
            grep -Fq "$token" "$projection"
          done

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api_boxbrain/actions/runs/$projection_ci_run" -o "$RUNNER_TEMP/projection-ci.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://raw.githubusercontent.com/FormatX66/BoxBrain/$hopper_snapshot_commit/Web/Aurum-Arkmatx/hopper-status.json" -o "$RUNNER_TEMP/hopper-status.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api_boxbrain/commits/$active_trunk_commit" -o "$RUNNER_TEMP/active-trunk.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api_boxbrain/actions/runs/$pc_image_run" -o "$RUNNER_TEMP/pc-image.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api_boxbrain/actions/runs/$pc_image_run/jobs?per_page=100" -o "$RUNNER_TEMP/pc-image-jobs.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api_boxbrain/actions/runs/$prior_pc_failure_run" -o "$RUNNER_TEMP/prior-pc.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api_boxbrain/actions/runs/$virtual_lab_run" -o "$RUNNER_TEMP/vlab.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api_boxbrain/actions/runs/$virtual_lab_run/jobs?per_page=100" -o "$RUNNER_TEMP/vlab-jobs.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api_boxbrain/actions/runs/$native_run" -o "$RUNNER_TEMP/native.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api_boxbrain/actions/runs/$native_run/jobs?per_page=100" -o "$RUNNER_TEMP/native-jobs.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api_boxbrain/actions/runs/$controller_run" -o "$RUNNER_TEMP/controller.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api_boxbrain/actions/runs/$prerequisite_run" -o "$RUNNER_TEMP/prerequisite.json"

          python3 - "$RUNNER_TEMP/projection-ci.json" "$RUNNER_TEMP/hopper-status.json" "$projection_commit" \
            "$RUNNER_TEMP/active-trunk.json" "$RUNNER_TEMP/pc-image.json" "$RUNNER_TEMP/pc-image-jobs.json" \
            "$RUNNER_TEMP/prior-pc.json" "$RUNNER_TEMP/vlab.json" "$RUNNER_TEMP/vlab-jobs.json" \
            "$RUNNER_TEMP/native.json" "$RUNNER_TEMP/native-jobs.json" "$RUNNER_TEMP/controller.json" "$RUNNER_TEMP/prerequisite.json" <<'PY'
          import json,sys
          ci=json.load(open(sys.argv[1],encoding='utf-8'))
          hopper=json.load(open(sys.argv[2],encoding='utf-8'))
          projection=sys.argv[3]
          active=json.load(open(sys.argv[4],encoding='utf-8'))
          image=json.load(open(sys.argv[5],encoding='utf-8'))
          image_jobs=json.load(open(sys.argv[6],encoding='utf-8'))
          prior=json.load(open(sys.argv[7],encoding='utf-8'))
          vlab=json.load(open(sys.argv[8],encoding='utf-8'))
          vlab_jobs=json.load(open(sys.argv[9],encoding='utf-8'))
          native=json.load(open(sys.argv[10],encoding='utf-8'))
          native_jobs=json.load(open(sys.argv[11],encoding='utf-8'))
          controller=json.load(open(sys.argv[12],encoding='utf-8'))
          prerequisite=json.load(open(sys.argv[13],encoding='utf-8'))
          active_sha='ac6b03819e47e7167ba77b2e3a5846f515a88d72'
          parent_sha='e0fe2aea7cc91829912be2c833ca81f5f9407a5e'

          assert ci.get('id')==33710028758
          assert ci.get('name')=='BoxBrain CI'
          assert ci.get('head_sha')==projection
          assert ci.get('status')=='completed' and ci.get('conclusion')=='success'

          assert hopper.get('schema')=='aurum.hopper.live-status.v2'
          assert hopper.get('endpoint') is None and hopper.get('source_kind') is None
          assert hopper.get('reachable') is False and hopper.get('report') is None
          assert (hopper.get('summary') or {}).get('health')=='no-endpoint-candidate'

          assert active.get('sha')==active_sha
          assert (active.get('parents') or [{}])[0].get('sha')==parent_sha
          assert str(((active.get('commit') or {}).get('message') or '')).startswith('fix(aurum): auto-boot legacy live media')

          assert image.get('id')==33677247135 and image.get('head_sha')==active_sha
          assert image.get('status')=='completed' and image.get('conclusion')=='success'
          image_by_name={j.get('name'):j for j in image_jobs.get('jobs',[])}
          for name in ('validate','build-image','generic-uefi-smoke','hp-twin-smoke','publish-verified-image'):
              assert image_by_name.get(name,{}).get('conclusion')=='success', (name,image_by_name.get(name))
          generic_steps={s.get('name'):s for s in image_by_name['generic-uefi-smoke'].get('steps',[])}
          assert generic_steps.get('Generic low-memory UEFI install reboot and self-build smoke',{}).get('conclusion')=='success'
          assert generic_steps.get('Legacy BIOS install and installed-boot smoke',{}).get('conclusion')=='success'

          assert prior.get('id')==33675680912
          assert prior.get('head_sha')==parent_sha
          assert prior.get('status')=='completed' and prior.get('conclusion')=='failure'

          assert vlab.get('id')==33695190511 and vlab.get('head_sha')==active_sha
          assert vlab.get('status')=='completed' and vlab.get('conclusion')=='success'
          by_name={j.get('name'):j for j in vlab_jobs.get('jobs',[])}
          expected={
              'Docker runtime x86_64':'success',
              'Docker runtime ARM64':'success',
              'QEMU UEFI x86_64 PC':'success',
              'QEMU Raspberry Pi 3B machine/runtime':'success',
              'Same-commit four-target convergence gate':'success',
              'Publish gated Pi3 runtime update':'skipped',
          }
          for name,conclusion in expected.items():
              assert by_name.get(name,{}).get('conclusion')==conclusion, (name,by_name.get(name),conclusion)

          assert native.get('id')==33687947059 and native.get('head_sha')==active_sha
          assert native.get('status')=='completed' and native.get('conclusion')=='failure'
          nmatch=[j for j in native_jobs.get('jobs',[]) if j.get('name')=='Resume verified native growth']
          assert nmatch and nmatch[0].get('conclusion')=='failure'
          nsteps={s.get('name'):s.get('conclusion') for s in nmatch[0].get('steps',[])}
          assert nsteps.get('Verify native self-build contracts')=='failure', nsteps

          assert controller.get('id')==33703121424
          assert controller.get('status')=='completed' and controller.get('conclusion')=='success'
          assert prerequisite.get('id')==33703828433
          assert prerequisite.get('status')=='completed' and prerequisite.get('conclusion')=='success'
          print('GENERATION_LADDER_V122_SOURCE_AND_EVIDENCE_OK')
          PY

          echo "file=$projection" >> "$GITHUB_OUTPUT"
          echo "blob=$blob" >> "$GITHUB_OUTPUT"
          echo "canonical_commit=$canonical_commit" >> "$GITHUB_OUTPUT"
          echo "projection_commit=$projection_commit" >> "$GITHUB_OUTPUT"
          echo "projection_main_commit=$projection_main_commit" >> "$GITHUB_OUTPUT"
          echo "projection_ci_run=$projection_ci_run" >> "$GITHUB_OUTPUT"
          echo "active_trunk_commit=$active_trunk_commit" >> "$GITHUB_OUTPUT"
          echo 'CLUSTERSITES_CANONICAL_PROJECTION_V122_OK'

      - name: Configure Bluehost SSH with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Back up current Command Center
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() { local out="$1"; shift; local n=1 tmp; tmp="$(mktemp)"; while true; do if "$@" > "$tmp"; then mv "$tmp" "$out"; return 0; fi; [ "$n" -ge 5 ] && { rm -f "$tmp"; return 1; }; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/generation-seed-ladder.js' ]; then cp -p '$remote/generation-seed-ladder.js' '$backup/generation-seed-ladder.js'; else touch '$backup/.missing-generation-seed-ladder.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject expandable generation ladder component
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./generation-seed-ladder\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          tag='<script src="./generation-seed-ladder.js?v=122"></script>'
          for pattern in (r'<script src="\./seed-lifecycle\.js(?:\?v=[^"]+)?"></script>',r'<script src="\./recovery-guardian\.js(?:\?v=[^"]+)?"></script>',r'</body>'):
              m=re.search(pattern,text)
              if m:
                  text=text[:m.start()]+tag+'\n'+text[m.start():]
                  break
          else:
              raise SystemExit('dashboard missing generation ladder injection point')
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './generation-seed-ladder.js?v=122' "$RUNNER_TEMP/index.html"

      - name: Publish with bounded retries
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 "$RUNNER_TEMP/index.html" "${{ steps.source.outputs.file }}" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mv '$remote/generation-seed-ladder-projection.js' '$remote/generation-seed-ladder.js'; chmod 644 '$remote/index.html' '$remote/generation-seed-ladder.js'"

      - name: Verify live Command Center
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/live-index.html"; js="$RUNNER_TEMP/live-generation-seed-ladder.js"
          final_url="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/generation-seed-ladder.js?rev=122' -o "$js"
          grep -Fq './generation-seed-ladder.js?v=122' "$page"
          cmp -s "$js" "${{ steps.source.outputs.file }}"
          node --check "$js"
          for token in \
            'AURUM_GENERATION_SEED_LADDER_V1_22_CANONICAL' \
            "componentRevision:'1.22'" \
            "ACTIVE_TRUNK_COMMIT='ac6b03819e47e7167ba77b2e3a5846f515a88d72'" \
            'legacyAutobootIntegratedIntoActiveTrunk:true' \
            'legacyAutobootPhysicalHopperProofProven:false' \
            'currentHeadFourTargetConvergencePassed:true' \
            'currentHeadRuntimePublicationPerformed:false' \
            "currentNativeFailureStep:'Verify native self-build contracts'" \
            "continuousNativeState:'stable:external-evidence-pending'" \
            "continuousLabState:'same-head-terminal-result-already-recorded'" \
            'continuousNativeDispatch:false' \
            'continuousLabDispatch:false' \
            "physicalPrerequisitePublish:'skipped-unchanged'" \
            'guardedInstallHumanApprovalCurrent:false' \
            "hopperStatusCurrentBlocker:'no-valid-endpoint-candidate'" \
            'humanActionInferred:false' \
            'humanActionInference:false' \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:'; do
            grep -Fq "$token" "$js"
          done
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back on verification failure
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/generation-seed-ladder.js' ]; then cp -p '$backup/generation-seed-ladder.js' '$remote/generation-seed-ladder.js'; elif [ -f '$backup/.missing-generation-seed-ladder.js' ]; then rm -f '$remote/generation-seed-ladder.js'; fi"

      - name: Record verified live receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-generation-seed-ladder-live.json <<EOF_RECEIPT
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/generation-seed-ladder-v1.js",
            "canonical_component_commit": "${{ steps.source.outputs.canonical_commit }}",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx/generation-seed-ladder-v1.js",
            "deployment_carrier": "FormatX66/wetbeard-site",
            "component_revision": "1.22",
            "approved_blob": "${{ steps.source.outputs.blob }}",
            "boxbrain_projection_commit": "${{ steps.source.outputs.projection_commit }}",
            "boxbrain_projection_main_commit": "${{ steps.source.outputs.projection_main_commit }}",
            "boxbrain_ci_run": ${{ steps.source.outputs.projection_ci_run }},
            "boxbrain_ci_proven": true,
            "cluster_canonical_commit_pinned": true,
            "active_trunk_commit": "${{ steps.source.outputs.active_trunk_commit }}",
            "legacy_autoboot_integrated_into_active_trunk": true,
            "legacy_autoboot_pc_image_run": 33677247135,
            "legacy_autoboot_prior_failure_run": 33675680912,
            "legacy_autoboot_virtual_lab_run": 33695190511,
            "legacy_autoboot_legacy_bios_install_and_boot_smoke_passed": true,
            "legacy_autoboot_verified_image_published": true,
            "active_trunk_four_target_virtual_convergence": true,
            "active_trunk_runtime_publication_performed": false,
            "legacy_autoboot_physical_hopper_proof": false,
            "native_run": 33687947059,
            "native_run_passed": false,
            "native_failure_step": "Verify native self-build contracts",
            "native_blocker_test": "Projects.Codelation.tests.test_adaptive_shell_gui_deployment.AdaptiveShellGuiDeploymentTests.test_gui_live_trial_preserves_human_constants_and_dialogue_boundary",
            "native_completed_generations": 65,
            "native_external_evidence_reason": "gui-live-trial-evidence-expired",
            "retained_gui_live_trial_evidence_route": "192.168.0.194",
            "current_consumer_required_route": "10.12.194.1",
            "continuous_controller_run": 33703121424,
            "continuous_native_state": "stable:external-evidence-pending",
            "continuous_lab_state": "same-head-terminal-result-already-recorded",
            "continuous_native_dispatch": false,
            "continuous_lab_dispatch": false,
            "physical_prerequisite_watch_run": 33703828433,
            "physical_prerequisite_reason": "physical-presence-not-current-blocker",
            "physical_prerequisite_publish": "skipped-unchanged",
            "guarded_hopper_install_implemented": true,
            "guarded_install_visible_erase_confirmation_required": true,
            "guarded_install_exactly_one_eligible_internal_target_required": true,
            "guarded_install_fresh_target_discovery_before_write": true,
            "guarded_install_physical_execution_proven": false,
            "guarded_install_physical_verification_proven": false,
            "guarded_install_human_approval_current": false,
            "hopper_status_snapshot_commit": "4ac20ff95617698f3a893f01b5d28a6d728562a1",
            "hopper_status_endpoint": null,
            "hopper_status_source_kind": null,
            "hopper_status_current_blocker": "no-valid-endpoint-candidate",
            "hopper_status_power_state_inferred": false,
            "hopper_status_network_state_inferred": false,
            "hopper_status_runtime_state_inferred": false,
            "human_action_inference": false,
            "major_box_added": false,
            "seed_lifecycle_remains_expandable": true,
            "frontiers_advancing_visible": true,
            "needs_work_system_owned": true,
            "needs_work_owner": "aurum-system",
            "backup_before_publish": true,
            "rollback_on_verification_failure": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF_RECEIPT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-generation-seed-ladder-live.json
          git commit -m 'Record Aurum generation seed ladder v1.22 live [skip ci]' || exit 0
