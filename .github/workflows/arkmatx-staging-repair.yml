name: ArkmatX Staging Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/arkmatx-staging-repair.yml
      - sites/arkmatx/**

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build ArkmatX for staging
        id: build
        continue-on-error: true
        working-directory: sites/arkmatx
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npm run build -- --base /staging/
          grep -Eq 'src="/staging/assets/[^\"]+\.js"' dist/index.html
          for i in 0 1 2; do test -s "dist/scenes/workshop-render.part${i}.txt"; done

      - name: Configure Bluehost SSH
        id: ssh
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n '${{ secrets.BLUEHOST_HOST }}'
          test -n '${{ secrets.BLUEHOST_USERNAME }}'
          test -n '${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}'
          install -m 700 -d ~/.ssh
          printf '%s\n' '${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H '${{ secrets.BLUEHOST_HOST }}' >> ~/.ssh/known_hosts
          ssh '${{ secrets.BLUEHOST_USERNAME }}@${{ secrets.BLUEHOST_HOST }}' 'test -d public_html/arkmatx || mkdir -p public_html/arkmatx'

      - name: Deploy ArkmatX staging
        id: deploy
        if: steps.build.outcome == 'success' && steps.ssh.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          DEST='${{ secrets.BLUEHOST_USERNAME }}@${{ secrets.BLUEHOST_HOST }}'
          ssh "$DEST" 'mkdir -p public_html/arkmatx/staging'
          rsync -az --delete --exclude 'data/' --exclude 'generated/' --exclude 'state/*.json' sites/arkmatx/dist/ "$DEST:public_html/arkmatx/staging/"
          ssh "$DEST" 'test -f public_html/arkmatx/staging/index.html && test -d public_html/arkmatx/staging/assets && test -s public_html/arkmatx/staging/scenes/workshop-render.part0.txt && test -s public_html/arkmatx/staging/scenes/workshop-render.part1.txt && test -s public_html/arkmatx/staging/scenes/workshop-render.part2.txt'

      - name: Verify ArkmatX staging HTTP and rendered scene
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base='https://arkmatx.com/staging/'
          code=$(curl -L -sS -o /tmp/index.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$base")
          [[ "$code" =~ ^[23] ]] || { echo "index HTTP $code"; exit 1; }
          grep -Eq 'src="/staging/assets/[^\"]+\.js"' /tmp/index.html
          js_path=$(grep -Eo '/staging/assets/[^\"]+\.js' /tmp/index.html | head -n1)
          test -n "$js_path"
          curl -LfsS -H 'Cache-Control: no-cache' "https://arkmatx.com${js_path}" -o /tmp/app.js
          test -s /tmp/app.js
          : > /tmp/workshop.b64
          for i in 0 1 2; do
            curl -LfsS -H 'Cache-Control: no-cache' "https://arkmatx.com/staging/scenes/workshop-render.part${i}.txt" >> /tmp/workshop.b64
          done
          base64 -d /tmp/workshop.b64 > /tmp/workshop.jpg
          test "$(xxd -p -l 2 /tmp/workshop.jpg)" = 'ffd8'
          test -s /tmp/workshop.jpg
          curl -LfsS -H 'Cache-Control: no-cache' https://arkmatx.com/staging/activity.json -o /tmp/activity.json
          python -m json.tool /tmp/activity.json >/dev/null

      - name: Record ArkmatX staging diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployments
          cat > deployments/arkmatx-staging-diagnostic.json <<JSON
          {
            "source_sha": "${{ github.sha }}",
            "build": "${{ steps.build.outcome }}",
            "ssh": "${{ steps.ssh.outcome }}",
            "deploy": "${{ steps.deploy.outcome }}",
            "verify": "${{ steps.verify.outcome }}",
            "staging_url": "https://arkmatx.com/staging/"
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          git add deployments/arkmatx-staging-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record ArkmatX staging diagnostic [skip ci]'
            for n in 1 2 3; do
              git push origin HEAD:main && break
              git fetch origin main
              git rebase origin/main
              sleep $((n * 2))
            done
          fi

      - name: Fail if staging is not verified
        if: always()
        shell: bash
        run: |
          test '${{ steps.verify.outcome }}' = 'success'
