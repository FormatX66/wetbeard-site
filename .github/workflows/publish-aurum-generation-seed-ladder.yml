name: Publish Aurum Generation Seed Ladder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-generation-seed-ladder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-generation-seed-ladder-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify ClusterSites authority pin, public projection, and approved evidence
        id: source
        shell: bash
        run: |
          set -euo pipefail
          # ClusterSites remains canonical. This public carrier does not attempt
          # unauthenticated reads of the private canonical repository. Publication
          # requires the independently approved canonical merge/blob, a byte-identical
          # public BoxBrain projection, green projection CI, and exact changed evidence.
          canonical_commit='28e8bbb185752375ce24dc841bdaf80134702b96'
          projection_commit='b5622c1a5846c2d1bfcba4bff79d111330731a63'
          projection_main_commit='4bfacbb91c43d48c6b369865de7d2bc3aa1db887'
          expected_blob='550111488201351316d01d3215b6c952230684b6'
          projection_ci_run='33814850630'
          previous_active_trunk='ac6b03819e47e7167ba77b2e3a5846f515a88d72'
          active_trunk_commit='613ce8243c2c3f3dfc744863fc18d10817011435'
          active_parent='d6b70f0f05c734ce2109bd43b0f478c164f8768b'
          active_tree='affb058d0e6400093f90a1cb1ce703fb76803a0d'
          graphical_base_commit='87891997c71f2de2b744930772643e9b229181c2'
          current_pc_run='33802701468'
          current_vhl_run='33806912851'
          current_native_run='33806264677'
          hopper_status_run='33763963007'
          hopper_status_job='100676947868'
          hopper_snapshot_commit='4536fa54181617724956792e71ee0a8d6ed80abc'

          projection="$RUNNER_TEMP/generation-seed-ladder-projection.js"
          projection_main="$RUNNER_TEMP/generation-seed-ladder-projection-main.js"
          api='https://api.github.com/repos/FormatX66/BoxBrain'

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_main_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection_main"
          test -s "$projection"; test -s "$projection_main"
          node --check "$projection"
          cmp -s "$projection" "$projection_main"
          blob="$(git hash-object "$projection")"
          test "$blob" = "$expected_blob"

          for token in \
            'AURUM_GENERATION_SEED_LADDER_V1_29_CANONICAL' \
            "canonicalWebsiteRepo:'FormatX66/ClusterSites'" \
            "componentRevision:'1.29'" \
            "PREVIOUS_ACTIVE_TRUNK_COMMIT='$previous_active_trunk'" \
            "ACTIVE_TRUNK_COMMIT='$active_trunk_commit'" \
            "ACTIVE_TRUNK_PARENT='$active_parent'" \
            "ACTIVE_TRUNK_TREE='$active_tree'" \
            "CURRENT_PC_IMAGE_RUN='$current_pc_run'" \
            "CURRENT_VIRTUAL_LAB_RUN='$current_vhl_run'" \
            "CURRENT_NATIVE_RUN='$current_native_run'" \
            'activeTrunkAdvancedSincePriorDashboardTruth:true' \
            'activeTrunkMatchesGraphicalSetupFallback:true' \
            'graphicalSetupBaseIntegratedIntoActiveTrunk:true' \
            'graphicalSetupFallbackIntegratedIntoActiveTrunk:true' \
            'currentPcImageRunPassed:true' \
            'currentVirtualLabRunPassed:false' \
            'currentVirtualLabDockerX8664Passed:true' \
            'currentVirtualLabNativeArm64Passed:true' \
            'currentVirtualLabPi3Passed:true' \
            'currentVirtualLabPcUefiPassed:false' \
            "currentVirtualLabPcUefiFailureStep:'Boot PC image in QEMU UEFI'" \
            'currentFourTargetConvergencePassed:false' \
            'currentNativeRunPassed:false' \
            "currentNativeFailureStep:'Verify native self-build contracts'" \
            'latestKnownNativeCompletedGenerations:65' \
            "latestKnownNativeExternalEvidenceReason:'gui-live-trial-evidence-expired'" \
            'graphicalSetupExactlyOneSelectedTargetRequired:true' \
            'graphicalSetupOpaqueTargetIdOnly:true' \
            'graphicalSetupRawDevicePathHidden:true' \
            'graphicalSetupEraseCodeHidden:true' \
            'graphicalSetupFreshTargetDiscoveryBeforeWrite:true' \
            'graphicalSetupFreshInstallVisibleEraseConfirmation:true' \
            'graphicalSetupRepairNeverPartitionsOrFormats:true' \
            'graphicalSetupSafePoweroffOnlyAfterVerifiedCompletion:true' \
            "hopperStatusCurrentBlocker:'no-valid-endpoint-candidate'" \
            'hopperStatusEndpoint:null' \
            'hopperStatusSourceKind:null' \
            'hopperStatusHttpStatus:null' \
            'hopperStatusReachable:false' \
            'hopperStatusReport:null' \
            'hopperStatusEquivalentNullSnapshotIsEvidenceHealth:true' \
            'hopperStatusNoChurnUntilMaterialChange:true' \
            'humanActionInference:false' \
            "needsWorkOwner:'aurum-system'" \
            'backupBeforePublishExpected:true' \
            'rollbackOnVerificationFailure:true' \
            'majorBoxAdded:false' \
            'seedLifecycleRemainsExpandable:true' \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:' \
            'None right now.' \
            'this is now active-trunk evidence, not candidate-only evidence.' \
            'do not replay the unchanged head merely for activity.'; do
            grep -Fq "$token" "$projection"
          done

          for pair in \
            "$projection_ci_run projection-ci" \
            "$current_pc_run current-pc" \
            "$current_vhl_run current-vhl" \
            "$current_native_run current-native" \
            "$hopper_status_run hopper-run"; do
            set -- $pair
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/actions/runs/$1" -o "$RUNNER_TEMP/$2.json"
          done
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/actions/runs/$current_pc_run/jobs?per_page=100" -o "$RUNNER_TEMP/current-pc-jobs.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/actions/runs/$current_vhl_run/jobs?per_page=100" -o "$RUNNER_TEMP/current-vhl-jobs.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/actions/runs/$current_native_run/jobs?per_page=100" -o "$RUNNER_TEMP/current-native-jobs.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/actions/runs/$hopper_status_run/jobs?per_page=100" -o "$RUNNER_TEMP/hopper-jobs.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/branches/aurum/trunk-v0.01" -o "$RUNNER_TEMP/active-branch.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/commits/$active_trunk_commit" -o "$RUNNER_TEMP/active-commit.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/compare/$previous_active_trunk...$active_trunk_commit" -o "$RUNNER_TEMP/active-compare.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/compare/$graphical_base_commit...$active_trunk_commit" -o "$RUNNER_TEMP/base-compare.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$active_trunk_commit/Projects/Codelation/autobuild/native_chain_state.json" -o "$RUNNER_TEMP/native-state.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$hopper_snapshot_commit/Web/Aurum-Arkmatx/hopper-status.json" -o "$RUNNER_TEMP/hopper-status.json"

          python3 - "$RUNNER_TEMP" "$projection_commit" "$active_trunk_commit" "$active_parent" "$active_tree" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1]); projection=sys.argv[2]; active=sys.argv[3]; parent=sys.argv[4]; tree=sys.argv[5]
          load=lambda n: json.loads((root/n).read_text(encoding='utf-8'))

          ci=load('projection-ci.json')
          assert ci.get('id')==33814850630 and ci.get('name')=='BoxBrain CI'
          assert ci.get('head_sha')==projection
          assert ci.get('status')=='completed' and ci.get('conclusion')=='success'

          branch=load('active-branch.json')
          assert (branch.get('commit') or {}).get('sha')==active
          commit=load('active-commit.json')
          assert commit.get('sha')==active
          assert ((commit.get('commit') or {}).get('tree') or {}).get('sha')==tree
          assert len(commit.get('parents') or [])==1 and commit['parents'][0].get('sha')==parent
          assert ((commit.get('commit') or {}).get('message'))=='Keep graphical install and Wi-Fi controls usable in fallback display modes'
          changed={f.get('filename') for f in commit.get('files',[])}
          assert 'Projects/AurumPC/aurum_setup_gui.py' in changed
          assert 'Projects/AurumPC/tests/test_aurum_setup_gui.py' in changed
          old=load('active-compare.json')
          assert old.get('status')=='ahead' and old.get('ahead_by')==5 and old.get('behind_by')==0
          base=load('base-compare.json')
          assert base.get('status')=='ahead' and base.get('ahead_by')==4 and base.get('behind_by')==0

          pc=load('current-pc.json'); jobs=load('current-pc-jobs.json').get('jobs',[])
          assert pc.get('id')==33802701468 and pc.get('head_sha')==active
          assert pc.get('status')=='completed' and pc.get('conclusion')=='success'
          by={j.get('name'):j for j in jobs}
          for name in ('validate','build-image','generic-uefi-smoke','hp-twin-smoke','publish-verified-image'):
              assert by.get(name,{}).get('conclusion')=='success', name
          generic={s.get('name'):s.get('conclusion') for s in by['generic-uefi-smoke'].get('steps',[])}
          assert generic.get('Generic low-memory UEFI install reboot and self-build smoke')=='success'
          assert generic.get('Legacy BIOS install and installed-boot smoke')=='success'
          hp={s.get('name'):s.get('conclusion') for s in by['hp-twin-smoke'].get('steps',[])}
          assert hp.get('Hopper HP topology and offline-recovery twin')=='success'

          vhl=load('current-vhl.json'); vjobs=load('current-vhl-jobs.json').get('jobs',[])
          assert vhl.get('id')==33806912851 and vhl.get('head_sha')==active
          assert vhl.get('status')=='completed' and vhl.get('conclusion')=='failure'
          vb={j.get('name'):j for j in vjobs}
          assert vb['Docker runtime x86_64']['conclusion']=='success'
          assert vb['Docker runtime ARM64']['conclusion']=='success'
          assert vb['QEMU Raspberry Pi 3B machine/runtime']['conclusion']=='success'
          assert vb['QEMU UEFI x86_64 PC']['conclusion']=='failure'
          pcsteps={s.get('name'):s.get('conclusion') for s in vb['QEMU UEFI x86_64 PC'].get('steps',[])}
          assert pcsteps.get('Check out exact lab commit')=='success'
          assert pcsteps.get('Install QEMU and UEFI firmware')=='success'
          assert pcsteps.get('Build PC ISO')=='success'
          assert pcsteps.get('Boot PC image in QEMU UEFI')=='failure'
          assert vb['Same-commit four-target convergence gate']['conclusion']=='skipped'

          native=load('current-native.json'); njobs=load('current-native-jobs.json').get('jobs',[])
          assert native.get('id')==33806264677 and native.get('head_sha')==active and native.get('conclusion')=='failure'
          resume=[j for j in njobs if j.get('name')=='Resume verified native growth']
          assert len(resume)==1 and resume[0].get('conclusion')=='failure'
          nsteps={s.get('name'):s.get('conclusion') for s in resume[0].get('steps',[])}
          assert nsteps.get('Verify native self-build contracts')=='failure'
          state=load('native-state.json')
          assert state.get('completed_generations')==65
          assert state.get('blocked_reason')=='external-prerequisite-blocked'
          assert (state.get('external_evidence') or {}).get('applied') is False
          assert (state.get('external_evidence') or {}).get('reason')=='gui-live-trial-evidence-expired'

          hopper=load('hopper-run.json'); hjobs=load('hopper-jobs.json').get('jobs',[])
          assert hopper.get('id')==33763963007 and hopper.get('event')=='schedule' and hopper.get('conclusion')=='success'
          match=[j for j in hjobs if j.get('id')==100676947868]
          assert len(match)==1 and match[0].get('runner_id')==23 and match[0].get('runner_name')=='AURUM-HOPPER-STATUS-WSL'
          status=load('hopper-status.json')
          assert status.get('endpoint') is None and status.get('source_kind') is None
          assert status.get('http_status') is None and status.get('reachable') is False and status.get('report') is None
          assert (status.get('summary') or {}).get('health')=='no-endpoint-candidate'
          print('GENERATION_LADDER_V129_SOURCE_AND_EVIDENCE_OK')
          PY

          echo "file=$projection" >> "$GITHUB_OUTPUT"
          echo "blob=$blob" >> "$GITHUB_OUTPUT"
          echo "canonical_commit=$canonical_commit" >> "$GITHUB_OUTPUT"
          echo "projection_commit=$projection_commit" >> "$GITHUB_OUTPUT"
          echo "projection_main_commit=$projection_main_commit" >> "$GITHUB_OUTPUT"
          echo "projection_ci_run=$projection_ci_run" >> "$GITHUB_OUTPUT"
          echo "previous_active_trunk=$previous_active_trunk" >> "$GITHUB_OUTPUT"
          echo "active_trunk_commit=$active_trunk_commit" >> "$GITHUB_OUTPUT"
          echo "current_pc_run=$current_pc_run" >> "$GITHUB_OUTPUT"
          echo "current_vhl_run=$current_vhl_run" >> "$GITHUB_OUTPUT"
          echo "current_native_run=$current_native_run" >> "$GITHUB_OUTPUT"
          echo "hopper_status_run=$hopper_status_run" >> "$GITHUB_OUTPUT"
          echo "hopper_status_job=$hopper_status_job" >> "$GITHUB_OUTPUT"
          echo "hopper_snapshot_commit=$hopper_snapshot_commit" >> "$GITHUB_OUTPUT"
          echo 'CLUSTERSITES_CANONICAL_PROJECTION_V129_OK'

      - name: Configure Bluehost SSH with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Back up current Command Center
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() { local out="$1"; shift; local n=1 tmp; tmp="$(mktemp)"; while true; do if "$@" > "$tmp"; then mv "$tmp" "$out"; return 0; fi; [ "$n" -ge 5 ] && { rm -f "$tmp"; return 1; }; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/generation-seed-ladder.js' ]; then cp -p '$remote/generation-seed-ladder.js' '$backup/generation-seed-ladder.js'; else touch '$backup/.missing-generation-seed-ladder.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject expandable generation ladder component
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./generation-seed-ladder\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          tag='<script src="./generation-seed-ladder.js?v=129"></script>'
          for pattern in (r'<script src="\./seed-lifecycle\.js(?:\?v=[^"]+)?"></script>',r'<script src="\./recovery-guardian\.js(?:\?v=[^"]+)?"></script>',r'</body>'):
              m=re.search(pattern,text)
              if m:
                  text=text[:m.start()]+tag+'\n'+text[m.start():]
                  break
          else:
              raise SystemExit('dashboard missing generation ladder injection point')
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './generation-seed-ladder.js?v=129' "$RUNNER_TEMP/index.html"

      - name: Publish with bounded retries
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 "$RUNNER_TEMP/index.html" "${{ steps.source.outputs.file }}" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mv '$remote/generation-seed-ladder-projection.js' '$remote/generation-seed-ladder.js'; chmod 644 '$remote/index.html' '$remote/generation-seed-ladder.js'"

      - name: Verify live Command Center
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/live-index.html"; js="$RUNNER_TEMP/live-generation-seed-ladder.js"
          final_url="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/generation-seed-ladder.js?rev=129' -o "$js"
          grep -Fq './generation-seed-ladder.js?v=129' "$page"
          cmp -s "$js" "${{ steps.source.outputs.file }}"
          node --check "$js"
          for token in \
            'AURUM_GENERATION_SEED_LADDER_V1_29_CANONICAL' \
            "componentRevision:'1.29'" \
            "ACTIVE_TRUNK_COMMIT='613ce8243c2c3f3dfc744863fc18d10817011435'" \
            'activeTrunkAdvancedSincePriorDashboardTruth:true' \
            'activeTrunkMatchesGraphicalSetupFallback:true' \
            'currentPcImageRunPassed:true' \
            'currentVirtualLabRunPassed:false' \
            'currentVirtualLabDockerX8664Passed:true' \
            'currentVirtualLabNativeArm64Passed:true' \
            'currentVirtualLabPi3Passed:true' \
            'currentVirtualLabPcUefiPassed:false' \
            "currentVirtualLabPcUefiFailureStep:'Boot PC image in QEMU UEFI'" \
            'currentNativeRunPassed:false' \
            "currentNativeFailureStep:'Verify native self-build contracts'" \
            "hopperStatusCurrentBlocker:'no-valid-endpoint-candidate'" \
            'hopperStatusEndpoint:null' \
            'hopperStatusEquivalentNullSnapshotIsEvidenceHealth:true' \
            'humanActionInference:false' \
            'majorBoxAdded:false' \
            'seedLifecycleRemainsExpandable:true' \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:' \
            'None right now.'; do
            grep -Fq "$token" "$js"
          done
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back on verification failure
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/generation-seed-ladder.js' ]; then cp -p '$backup/generation-seed-ladder.js' '$remote/generation-seed-ladder.js'; elif [ -f '$backup/.missing-generation-seed-ladder.js' ]; then rm -f '$remote/generation-seed-ladder.js'; fi"

      - name: Record verified live receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-generation-seed-ladder-live.json <<EOF_RECEIPT
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/generation-seed-ladder-v1.js",
            "canonical_component_commit": "${{ steps.source.outputs.canonical_commit }}",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx/generation-seed-ladder-v1.js",
            "deployment_carrier": "FormatX66/wetbeard-site",
            "component_revision": "1.29",
            "approved_blob": "${{ steps.source.outputs.blob }}",
            "boxbrain_projection_commit": "${{ steps.source.outputs.projection_commit }}",
            "boxbrain_projection_main_commit": "${{ steps.source.outputs.projection_main_commit }}",
            "boxbrain_ci_run": ${{ steps.source.outputs.projection_ci_run }},
            "boxbrain_ci_proven": true,
            "cluster_canonical_commit_pinned": true,
            "canonical_direct_fetch_required": false,
            "previous_active_trunk_commit": "${{ steps.source.outputs.previous_active_trunk }}",
            "active_trunk_commit": "${{ steps.source.outputs.active_trunk_commit }}",
            "active_trunk_advanced_since_prior_dashboard_truth": true,
            "active_trunk_matches_graphical_setup_fallback": true,
            "graphical_setup_base_integrated_into_active_trunk": true,
            "graphical_setup_fallback_integrated_into_active_trunk": true,
            "current_pc_image_run": ${{ steps.source.outputs.current_pc_run }},
            "current_pc_image_run_passed": true,
            "current_vhl_run": ${{ steps.source.outputs.current_vhl_run }},
            "current_vhl_passed": false,
            "current_vhl_docker_x86_64_passed": true,
            "current_vhl_native_arm64_passed": true,
            "current_vhl_pi3_passed": true,
            "current_vhl_pc_uefi_passed": false,
            "current_vhl_pc_uefi_failure_step": "Boot PC image in QEMU UEFI",
            "current_four_target_convergence_passed": false,
            "current_native_run": ${{ steps.source.outputs.current_native_run }},
            "current_native_run_passed": false,
            "current_native_failure_step": "Verify native self-build contracts",
            "current_native_completed_generations": 65,
            "current_native_external_evidence_reason": "gui-live-trial-evidence-expired",
