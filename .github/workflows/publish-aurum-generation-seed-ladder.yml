name: Publish Aurum Generation Seed Ladder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-generation-seed-ladder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-generation-seed-ladder-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify ClusterSites-canonical projection and approved blob
        id: source
        shell: bash
        run: |
          set -euo pipefail
          canonical_commit='b00857e6819481224f6960a346dc562a80782b9a'
          projection_commit='e5690c1d88b2459028b7b7464bcf673399b4554b'
          projection_main_commit='6c6a68ef460b2f0ed398ae50991a5fd37684f1d9'
          expected_blob='99b7630784980b7f66c8c4a9168b56b8f17df809'
          projection="$RUNNER_TEMP/generation-seed-ladder-canonical.js"
          current="$RUNNER_TEMP/generation-seed-ladder-current.js"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_main_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$current"
          test -s "$projection"; test -s "$current"
          node --check "$projection"
          cmp -s "$projection" "$current"
          blob="$(git hash-object "$projection")"
          test "$blob" = "$expected_blob"
          for token in \
            'AURUM_GENERATION_SEED_LADDER_V1_CANONICAL' \
            'AURUM_GENERATION_SEED_LADDER_V1_16_CANONICAL' \
            "canonicalWebsiteRepo:'FormatX66/ClusterSites'" \
            "componentRevision:'1.16'" \
            "ACTIVE_TRUNK_COMMIT='a0780429b8a1a0372b76d1c19fe98096e5de8a30'" \
            'latestKnownNativeCompletedGenerations:65' \
            "latestKnownNativeExternalEvidenceReason:'gui-live-trial-evidence-expired'" \
            'guiLiveTrialEvidenceExpired:true' \
            'routeContractRegressionStillActive:true' \
            'physicalPresenceCurrentBlocker:null' \
            'openCoreDedicatedListenerImplemented:true' \
            'openCorePort:8767' \
            'hopperGuiLoopbackPort:8765' \
            'legacyCoreShareDefaultPortFormRecognized:true' \
            'legacyCoreShareEqualsPortFormRecognized:true' \
            'guiBindLegacyHandoffRetryCount:1' \
            'unknownGuiPortListenerSignalled:false' \
            'currentPcImageValidationPassed:true' \
            'currentVerifiedPcImagePublished:true' \
            'currentPi3ImageWorkflowPassed:true' \
            'retainedParentFourTargetConvergencePassed:true' \
            "currentVirtualLabRunId:CURRENT_VIRTUAL_LAB_RUN" \
            "currentHeadVirtualLabStatus:'passed'" \
            'currentHeadFourTargetConvergencePassed:true' \
            'currentHeadRuntimePublicationPerformed:false' \
            'currentExactHeadAutobuildPassed:false' \
            "currentExactHeadBlocker:'gui-live-trial-route-contract-test-failure'" \
            "currentExactHeadEvidenceApplicationReason:'gui-live-trial-node-binding-invalid'" \
            'currentPrerequisiteWatchConfirmsPhysicalPresenceNotBlocker:true' \
            'hopperStatusSnapshotCommit:HOPPER_STATUS_SNAPSHOT_COMMIT' \
            'hopperStatusFreshAtInspection:false' \
            'hopperStatusLastSuccessfulRefreshRunId:LAST_SUCCESSFUL_HOPPER_STATUS_RUN' \
            "hopperStatusLatestRefreshStatus:'pending'" \
            "hopperStatusLatestRefreshJobStatus:'queued'" \
            'hopperStatusLatestRefreshRunnerAssigned:false' \
            'hopperStatusLatestRefreshRunnerId:0' \
            'hopperStatusLatestRefreshStepsStarted:false' \
            "hopperStatusCurrentBlocker:'no-eligible-runner-assigned'" \
            'hopperStatusSchedulerDispatchObserved:true' \
            'hopperStatusConsecutiveScheduledCancellations:2' \
            'hopperStatusFreshMachineEvidenceAvailable:false' \
            'hopperStatusEndpointResolved:false' \
            'hopperStatusPowerStateInferred:false' \
            'humanActionInferred:false' \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:'; do
            grep -Fq "$token" "$projection"
          done
          echo "file=$projection" >> "$GITHUB_OUTPUT"
          echo "blob=$blob" >> "$GITHUB_OUTPUT"
          echo "canonical_commit=$canonical_commit" >> "$GITHUB_OUTPUT"
          echo "projection_commit=$projection_commit" >> "$GITHUB_OUTPUT"
          echo "projection_main_commit=$projection_main_commit" >> "$GITHUB_OUTPUT"
          echo 'CLUSTERSITES_CANONICAL_PROJECTION_V116_OK'

      - name: Verify exact projection CI and current Aurum evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          projection='e5690c1d88b2459028b7b7464bcf673399b4554b'
          ci_run='33534708730'
          active='a0780429b8a1a0372b76d1c19fe98096e5de8a30'
          parent='ad1b618ce0cc1cbc1d09b1881663fa6fbef8a59f'
          route_fix='6c9baefd9de4583976d99b3a90ac6a28114986bb'
          pc_run='33398872010'
          pi3_run='33398872028'
          autobuild_run='33400052429'
          parent_virtual_run='33283128632'
          current_virtual_run='33418433996'
          prerequisite_watch_run='33455559358'
          cancelled_hopper_status_run_1='33454951504'
          cancelled_hopper_status_run_2='33474010603'
          current_hopper_status_run='33523121813'
          last_successful_hopper_status_run='33438851817'
          hopper_snapshot='31b248305dc0e35eee0ee4a1f5893775777366fd'
          api='https://api.github.com/repos/FormatX66/BoxBrain'
          raw="https://raw.githubusercontent.com/FormatX66/BoxBrain/$active"
          curl -fsSL "$api/actions/runs/$ci_run" -o "$RUNNER_TEMP/ci.json"
          curl -fsSL "$api/branches/aurum%2Ftrunk-v0.01" -o "$RUNNER_TEMP/branch.json"
          curl -fsSL "$api/actions/runs/$pc_run" -o "$RUNNER_TEMP/pc.json"
          curl -fsSL "$api/actions/runs/$pi3_run" -o "$RUNNER_TEMP/pi3.json"
          curl -fsSL "$api/actions/runs/$autobuild_run" -o "$RUNNER_TEMP/autobuild.json"
          curl -fsSL "$api/actions/runs/$parent_virtual_run" -o "$RUNNER_TEMP/parent-virtual.json"
          curl -fsSL "$api/actions/runs/$current_virtual_run" -o "$RUNNER_TEMP/current-virtual.json"
          curl -fsSL "$api/actions/runs/$current_virtual_run/jobs?per_page=100" -o "$RUNNER_TEMP/current-virtual-jobs.json"
          curl -fsSL "$api/actions/runs/$prerequisite_watch_run" -o "$RUNNER_TEMP/prerequisite-watch.json"
          curl -fsSL "$api/actions/runs/$cancelled_hopper_status_run_1" -o "$RUNNER_TEMP/cancelled-hopper-1.json"
          curl -fsSL "$api/actions/runs/$cancelled_hopper_status_run_1/jobs?per_page=100" -o "$RUNNER_TEMP/cancelled-hopper-1-jobs.json"
          curl -fsSL "$api/actions/runs/$cancelled_hopper_status_run_2" -o "$RUNNER_TEMP/cancelled-hopper-2.json"
          curl -fsSL "$api/actions/runs/$cancelled_hopper_status_run_2/jobs?per_page=100" -o "$RUNNER_TEMP/cancelled-hopper-2-jobs.json"
          curl -fsSL "$api/actions/runs/$current_hopper_status_run" -o "$RUNNER_TEMP/current-hopper.json"
          curl -fsSL "$api/actions/runs/$current_hopper_status_run/jobs?per_page=100" -o "$RUNNER_TEMP/current-hopper-jobs.json"
          curl -fsSL "$api/actions/runs/$last_successful_hopper_status_run" -o "$RUNNER_TEMP/last-hopper.json"
          curl -fsSL "$api/actions/runs/$last_successful_hopper_status_run/jobs?per_page=100" -o "$RUNNER_TEMP/last-hopper-jobs.json"
          curl -fsSL "$api/commits/$active/status" -o "$RUNNER_TEMP/status.json"
          curl -fsSL "$api/compare/$route_fix...$active" -o "$RUNNER_TEMP/compare.json"
          curl -fsSL "$raw/Projects/Codelation/autobuild/native_chain_state.json" -o "$RUNNER_TEMP/native.json"
          curl -fsSL "$raw/Projects/Codelation/autobuild/external_evidence/adaptive_shell_gui_live_trial.json" -o "$RUNNER_TEMP/gui.json"
          curl -fsSL "$raw/Projects/Codelation/field/external_prerequisite_evidence.py" -o "$RUNNER_TEMP/consumer.py"
          curl -fsSL "https://raw.githubusercontent.com/FormatX66/BoxBrain/$route_fix/Projects/Codelation/field/external_prerequisite_evidence.py" -o "$RUNNER_TEMP/historical-consumer.py"
          curl -fsSL "https://raw.githubusercontent.com/FormatX66/BoxBrain/$hopper_snapshot/Web/Aurum-Arkmatx/hopper-status.json" -o "$RUNNER_TEMP/hopper.json"
          grep -Fq 'USB_SSH_ROUTE = "10.12.194.1"' "$RUNNER_TEMP/consumer.py"
          ! grep -Fq 'GUI_LIVE_TRIAL_APPROVED_ROUTES' "$RUNNER_TEMP/consumer.py"
          grep -Fq 'GUI_LIVE_TRIAL_APPROVED_ROUTES' "$RUNNER_TEMP/historical-consumer.py"
          grep -Fq '"invocation_output": "blocked-candidate-verified"' "$RUNNER_TEMP/native.json"
          python3 - "$RUNNER_TEMP/ci.json" "$RUNNER_TEMP/branch.json" "$RUNNER_TEMP/pc.json" "$RUNNER_TEMP/pi3.json" "$RUNNER_TEMP/autobuild.json" "$RUNNER_TEMP/parent-virtual.json" "$RUNNER_TEMP/current-virtual.json" "$RUNNER_TEMP/current-virtual-jobs.json" "$RUNNER_TEMP/prerequisite-watch.json" "$RUNNER_TEMP/cancelled-hopper-1.json" "$RUNNER_TEMP/cancelled-hopper-1-jobs.json" "$RUNNER_TEMP/cancelled-hopper-2.json" "$RUNNER_TEMP/cancelled-hopper-2-jobs.json" "$RUNNER_TEMP/current-hopper.json" "$RUNNER_TEMP/current-hopper-jobs.json" "$RUNNER_TEMP/last-hopper.json" "$RUNNER_TEMP/last-hopper-jobs.json" "$RUNNER_TEMP/status.json" "$RUNNER_TEMP/compare.json" "$RUNNER_TEMP/native.json" "$RUNNER_TEMP/gui.json" "$RUNNER_TEMP/hopper.json" "$projection" "$active" "$parent" <<'PY'
          import datetime,json,sys,time
          paths=sys.argv[1:23]
          (ci,branch,pc,pi3,autobuild,parent_virtual,current_virtual,current_virtual_jobs,watch,cancel1,cancel1_jobs,cancel2,cancel2_jobs,current_hopper,current_hopper_jobs,last_hopper,last_hopper_jobs,status,compare,native,gui,hopper)=[json.load(open(p,encoding='utf-8')) for p in paths]
          projection,active,parent=sys.argv[23:26]
          assert ci.get('name')=='BoxBrain CI' and ci.get('head_sha')==projection
          assert ci.get('status')=='completed' and ci.get('conclusion')=='success'
          assert branch.get('commit',{}).get('sha')==active
          assert pc.get('head_sha')==active and pc.get('conclusion')=='success'
          assert pi3.get('head_sha')==active and pi3.get('conclusion')=='success'
          assert autobuild.get('head_sha')==active and autobuild.get('conclusion')=='failure'
          assert parent_virtual.get('head_sha')==parent and parent_virtual.get('conclusion')=='success'
          assert current_virtual.get('id')==33418433996 and current_virtual.get('head_sha')==active
          assert current_virtual.get('status')=='completed' and current_virtual.get('conclusion')=='success'
          jobs={j.get('name'):j for j in current_virtual_jobs.get('jobs',[])}
          for name in ('Docker runtime x86_64','Docker runtime ARM64','QEMU Raspberry Pi 3B machine/runtime','QEMU UEFI x86_64 PC','Same-commit four-target convergence gate'):
              assert jobs.get(name,{}).get('conclusion')=='success', (name,jobs.get(name))
          assert jobs.get('Publish gated Pi3 runtime update',{}).get('conclusion')=='skipped'
          assert watch.get('id')==33455559358 and watch.get('status')=='completed' and watch.get('conclusion')=='success'
          for run,jobs_doc,run_id in ((cancel1,cancel1_jobs,33454951504),(cancel2,cancel2_jobs,33474010603)):
              assert run.get('id')==run_id and run.get('status')=='completed' and run.get('conclusion')=='cancelled'
              job_list=jobs_doc.get('jobs',[])
              assert len(job_list)==1
              job=job_list[0]
              assert job.get('status')=='completed' and job.get('conclusion')=='cancelled'
              assert {'self-hosted','Linux','hopper-status'} <= set(job.get('labels') or [])
              assert job.get('steps') in (None,[])
          assert current_hopper.get('id')==33523121813
          assert current_hopper.get('event')=='schedule'
          assert current_hopper.get('status')=='pending' and current_hopper.get('conclusion') is None
          current_jobs=current_hopper_jobs.get('jobs',[])
          assert len(current_jobs)==1
          current_job=current_jobs[0]
          assert current_job.get('id')==99907075063
          assert current_job.get('status')=='queued' and current_job.get('conclusion') is None
          assert current_job.get('labels')==['self-hosted','Linux','hopper-status']
          assert int(current_job.get('runner_id') or 0)==0
          assert (current_job.get('runner_name') or '')==''
          assert current_job.get('steps') in (None,[])
          assert last_hopper.get('id')==33438851817 and last_hopper.get('status')=='completed' and last_hopper.get('conclusion')=='success'
          last_jobs=last_hopper_jobs.get('jobs',[])
          assert len(last_jobs)==1
          last_job=last_jobs[0]
          assert last_job.get('status')=='completed' and last_job.get('conclusion')=='success'
          assert int(last_job.get('runner_id') or 0)==23 and last_job.get('runner_name')=='AURUM-HOPPER-STATUS-WSL'
          statuses={s.get('context'):s.get('state') for s in status.get('statuses',[])}
          assert statuses.get('ci/circleci: independent-verifier')=='success'
          assert compare.get('status')=='ahead' and compare.get('behind_by')==0
          assert compare.get('merge_base_commit',{}).get('sha')=='6c9baefd9de4583976d99b3a90ac6a28114986bb'
          gens={g.get('generation'):g for g in native.get('generations',[])}
          assert native.get('latest_completed_gap')=='adaptive_shell_gui_live_trial'
          assert native.get('next_gap')=='adaptive_shell_gui_live_trial'
          assert native.get('resumed_from_generations')==65
          assert gens[63]['invocation_output']=='ready-for-bounded-iteration-observation'
          assert gens[63]['external_evidence']['route']=='10.12.194.1'
          assert gens[64]['invocation_output']=='bounded-iteration-observation-complete'
          assert gens[64]['external_evidence']['route']=='10.12.194.1'
          assert gens[65]['invocation_output']=='blocked-candidate-verified'
          assert gens[65]['external_evidence'] is None
          assert gui.get('verified') is True and gui.get('route')=='192.168.0.194'
          assert int(gui.get('expires_at',0)) < int(time.time())
          assert gui.get('authority_granted') is False
          assert hopper.get('schema')=='aurum.hopper.live-status.v2'
          assert hopper.get('observed_at')=='2026-08-31T21:13:51Z'
          assert hopper.get('runner_host')=='LAPTOP-EBD8CG8P'
          assert hopper.get('endpoint') is None and hopper.get('source_kind') is None
          assert hopper.get('reachable') is False
          observed=datetime.datetime.fromisoformat(hopper['observed_at'].replace('Z','+00:00')).timestamp()
          assert int(time.time())-int(observed) > 3600
          print('GENERATION_LADDER_V116_EVIDENCE_OK')
          PY

      - name: Configure Bluehost SSH with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Back up current Command Center
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() { local out="$1"; shift; local n=1 tmp; tmp="$(mktemp)"; while true; do if "$@" > "$tmp"; then mv "$tmp" "$out"; return 0; fi; [ "$n" -ge 5 ] && { rm -f "$tmp"; return 1; }; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/generation-seed-ladder.js' ]; then cp -p '$remote/generation-seed-ladder.js' '$backup/generation-seed-ladder.js'; else touch '$backup/.missing-generation-seed-ladder.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject expandable generation ladder component
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./generation-seed-ladder\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          tag='<script src="./generation-seed-ladder.js?v=116"></script>'
          for pattern in (r'<script src="\./seed-lifecycle\.js(?:\?v=[^"]+)?"></script>',r'<script src="\./recovery-guardian\.js(?:\?v=[^"]+)?"></script>',r'</body>'):
              m=re.search(pattern,text)
              if m:
                  text=text[:m.start()]+tag+'\n'+text[m.start():]
                  break
          else:
              raise SystemExit('dashboard missing generation ladder injection point')
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './generation-seed-ladder.js?v=116' "$RUNNER_TEMP/index.html"

      - name: Publish with bounded retries
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 "$RUNNER_TEMP/index.html" "${{ steps.source.outputs.file }}" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mv '$remote/generation-seed-ladder-canonical.js' '$remote/generation-seed-ladder.js'; chmod 644 '$remote/index.html' '$remote/generation-seed-ladder.js'"

      - name: Verify live Command Center
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/live-index.html"; js="$RUNNER_TEMP/live-generation-seed-ladder.js"
          final_url="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/generation-seed-ladder.js?rev=116' -o "$js"
          grep -Fq './generation-seed-ladder.js?v=116' "$page"
          cmp -s "${{ steps.source.outputs.file }}" "$js"
          for token in \
            "componentRevision:'1.16'" \
            'routeContractRegressionStillActive:true' \
            'physicalPresenceCurrentBlocker:null' \
            'currentPrerequisiteWatchConfirmsPhysicalPresenceNotBlocker:true' \
            'currentPcImageValidationPassed:true' \
            'currentVerifiedPcImagePublished:true' \
            'currentPi3ImageWorkflowPassed:true' \
            'retainedParentFourTargetConvergencePassed:true' \
            "currentVirtualLabRunId:CURRENT_VIRTUAL_LAB_RUN" \
            "currentHeadVirtualLabStatus:'passed'" \
            'currentHeadFourTargetConvergencePassed:true' \
            'currentHeadRuntimePublicationPerformed:false' \
            "currentExactHeadBlocker:'gui-live-trial-route-contract-test-failure'" \
            "hopperStatusLatestRefreshStatus:'pending'" \
            "hopperStatusLatestRefreshJobStatus:'queued'" \
            'hopperStatusLatestRefreshRunnerAssigned:false' \
            'hopperStatusLatestRefreshRunnerId:0' \
            'hopperStatusLatestRefreshStepsStarted:false' \
            "hopperStatusCurrentBlocker:'no-eligible-runner-assigned'" \
            'hopperStatusSchedulerDispatchObserved:true' \
            'hopperStatusConsecutiveScheduledCancellations:2' \
            'hopperStatusFreshMachineEvidenceAvailable:false' \
            'hopperStatusFreshAtInspection:false' \
            'hopperStatusEndpointResolved:false' \
            'hopperStatusPowerStateInferred:false' \
            'humanActionInferred:false' \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:'; do grep -Fq "$token" "$js"; done
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back on verification failure
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/generation-seed-ladder.js' ]; then cp -p '$backup/generation-seed-ladder.js' '$remote/generation-seed-ladder.js'; elif [ -f '$backup/.missing-generation-seed-ladder.js' ]; then rm -f '$remote/generation-seed-ladder.js'; fi"

      - name: Record verified live receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-generation-seed-ladder-live.json <<EOF_RECEIPT
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/generation-seed-ladder-v1.js",
            "canonical_component_commit": "${{ steps.source.outputs.canonical_commit }}",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx/generation-seed-ladder-v1.js",
            "deployment_carrier": "FormatX66/wetbeard-site",
