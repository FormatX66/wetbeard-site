name: Publish Aurum Generation Seed Ladder

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-generation-seed-ladder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-generation-seed-ladder-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify ClusterSites authority pin, public projection, and approved evidence
        id: source
        shell: bash
        run: |
          set -euo pipefail
          # ClusterSites is canonical. The carrier accepts only the independently
          # approved canonical blob after an exact BoxBrain projection and green CI.
          canonical_commit='c450180782e574937fa29d4e91c918f6bd7c694b'
          projection_commit='d67427ead8c223afa0d8e4cede9f3ad08d6c0b35'
          projection_main_commit='e676c284492eacc161daa696964d727cf72955d0'
          expected_blob='f266327c1bb9d5be379bcb6f100148256eb003fa'
          projection_ci_run='33781927579'
          hopper_status_run='33763963007'
          hopper_status_job='100676947868'
          hopper_snapshot_commit='4536fa54181617724956792e71ee0a8d6ed80abc'
          hopper_pre_recovery_run='33740884687'
          active_trunk_commit='ac6b03819e47e7167ba77b2e3a5846f515a88d72'
          active_trunk_parent='e0fe2aea7cc91829912be2c833ca81f5f9407a5e'
          pc_image_run='33677247135'
          prior_pc_failure_run='33675680912'
          virtual_lab_run='33695190511'
          native_run='33687947059'
          controller_run='33703121424'
          prerequisite_run='33703828433'

          projection="$RUNNER_TEMP/generation-seed-ladder-projection.js"
          projection_main="$RUNNER_TEMP/generation-seed-ladder-projection-main.js"
          api='https://api.github.com/repos/FormatX66/BoxBrain'

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$projection_main_commit/Web/Aurum-Arkmatx/generation-seed-ladder-v1.js" -o "$projection_main"
          test -s "$projection"; test -s "$projection_main"
          node --check "$projection"
          cmp -s "$projection" "$projection_main"
          blob="$(git hash-object "$projection")"
          test "$blob" = "$expected_blob"

          for token in \
            'AURUM_GENERATION_SEED_LADDER_V1_25_CANONICAL' \
            "canonicalWebsiteRepo:'FormatX66/ClusterSites'" \
            "componentRevision:'1.25'" \
            "ACTIVE_TRUNK_COMMIT='ac6b03819e47e7167ba77b2e3a5846f515a88d72'" \
            'legacyAutobootIntegratedIntoActiveTrunk:true' \
            'legacyAutobootPhysicalHopperProofProven:false' \
            'currentPcImageValidationPassed:true' \
            'currentLegacyBiosInstallAndBootSmokePassed:true' \
            'currentHeadFourTargetConvergencePassed:true' \
            'currentHeadRuntimePublicationPerformed:false' \
            "currentNativeFailureStep:'Verify native self-build contracts'" \
            "latestKnownNativeExternalEvidenceReason:'gui-live-trial-evidence-expired'" \
            'continuousNativeDispatch:false' \
            'continuousLabDispatch:false' \
            "physicalPrerequisitePublish:'skipped-unchanged'" \
            'guardedInstallPhysicalExecutionProven:false' \
            'guardedInstallPhysicalVerificationProven:false' \
            'guardedInstallHumanApprovalCurrent:false' \
            'hopperStatusRunnerExecutionRecovered:true' \
            'hopperStatusCurrentRunnerAssigned:true' \
            'hopperStatusCurrentRunnerId:23' \
            "hopperStatusCurrentRunnerName:'AURUM-HOPPER-STATUS-WSL'" \
            "hopperStatusCurrentRunnerHost:'LAPTOP-EBD8CG8P'" \
            "hopperStatusCurrentBlocker:'no-valid-endpoint-candidate'" \
            'hopperStatusEndpoint:null' \
            'hopperStatusSourceKind:null' \
            'hopperStatusHttpStatus:null' \
            'hopperStatusReachable:false' \
            'hopperStatusReport:null' \
            'hopperStatusAssignmentBlockerPersistent:false' \
            'hopperStatusHistoricalAssignmentBlockerClosed:true' \
            'hopperStatusFreshHopperEndpointEvidenceAvailable:false' \
            'hopperStatusNoChurnUntilMaterialChange:true' \
            'humanActionInference:false' \
            "needsWorkOwner:'aurum-system'" \
            'backupBeforePublishExpected:true' \
            'rollbackOnVerificationFailure:true' \
            'majorBoxAdded:false' \
            'seedLifecycleRemainsExpandable:true' \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:' \
            'This closes the runner-assignment blocker; it does not prove Hopper endpoint health.' \
            'further successful snapshots with the same null endpoint/source/report are evidence health only and do not justify another dashboard publication.'; do
            grep -Fq "$token" "$projection"
          done

          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/actions/runs/$projection_ci_run" -o "$RUNNER_TEMP/projection-ci.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/actions/runs/$hopper_status_run" -o "$RUNNER_TEMP/hopper-run.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/actions/runs/$hopper_status_run/jobs?per_page=100" -o "$RUNNER_TEMP/hopper-jobs.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/actions/runs/$hopper_pre_recovery_run" -o "$RUNNER_TEMP/hopper-prior.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/commits/$hopper_snapshot_commit" -o "$RUNNER_TEMP/hopper-snapshot-commit.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            "https://raw.githubusercontent.com/FormatX66/BoxBrain/$hopper_snapshot_commit/Web/Aurum-Arkmatx/hopper-status.json" -o "$RUNNER_TEMP/hopper-status.json"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/commits/$active_trunk_commit" -o "$RUNNER_TEMP/active-trunk.json"
          for pair in \
            "$pc_image_run pc-image" \
            "$prior_pc_failure_run prior-pc" \
            "$virtual_lab_run vlab" \
            "$native_run native" \
            "$controller_run controller" \
            "$prerequisite_run prerequisite"; do
            set -- $pair
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/actions/runs/$1" -o "$RUNNER_TEMP/$2.json"
          done
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "$api/actions/runs/$native_run/jobs?per_page=100" -o "$RUNNER_TEMP/native-jobs.json"

          python3 - "$RUNNER_TEMP" "$projection_commit" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1]); projection=sys.argv[2]
          load=lambda n: json.loads((root/n).read_text(encoding='utf-8'))
          ci=load('projection-ci.json')
          assert ci.get('id')==33781927579 and ci.get('name')=='BoxBrain CI'
          assert ci.get('head_sha')==projection
          assert ci.get('status')=='completed' and ci.get('conclusion')=='success'

          run=load('hopper-run.json'); jobs=load('hopper-jobs.json'); prior=load('hopper-prior.json')
          assert run.get('id')==33763963007 and run.get('event')=='schedule'
          assert run.get('status')=='completed' and run.get('conclusion')=='success'
          match=[j for j in jobs.get('jobs',[]) if j.get('id')==100676947868]
          assert len(match)==1
          job=match[0]
          assert job.get('name')=='Mirror Hopper read-only status'
          assert set(job.get('labels') or [])=={'self-hosted','Linux','hopper-status'}
          assert job.get('runner_id')==23 and job.get('runner_name')=='AURUM-HOPPER-STATUS-WSL'
          steps={s.get('name'):s.get('conclusion') for s in job.get('steps',[])}
          assert steps.get('Read Hopper health endpoint')=='success'
          assert steps.get('Commit live status snapshot when changed')=='success'
          assert prior.get('id')==33740884687 and prior.get('event')=='schedule'
          assert prior.get('status')=='completed' and prior.get('conclusion')=='cancelled'

          snap=load('hopper-snapshot-commit.json'); status=load('hopper-status.json')
          assert snap.get('sha')=='4536fa54181617724956792e71ee0a8d6ed80abc'
          assert ((snap.get('commit') or {}).get('message'))=='Update Hopper live status [skip ci]'
          assert {f.get('filename') for f in snap.get('files',[])}=={'Web/Aurum-Arkmatx/hopper-status.json'}
          assert status.get('schema')=='aurum.hopper.live-status.v2'
          assert status.get('observed_at')=='2026-09-03T16:41:11Z'
          assert status.get('runner_host')=='LAPTOP-EBD8CG8P'
          assert status.get('endpoint') is None and status.get('source_kind') is None
          assert status.get('http_status') is None and status.get('reachable') is False and status.get('report') is None
          assert (status.get('summary') or {}).get('health')=='no-endpoint-candidate'

          active=load('active-trunk.json')
          assert active.get('sha')=='ac6b03819e47e7167ba77b2e3a5846f515a88d72'
          assert (active.get('parents') or [{}])[0].get('sha')=='e0fe2aea7cc91829912be2c833ca81f5f9407a5e'
          expected={
            'pc-image.json':('success','ac6b03819e47e7167ba77b2e3a5846f515a88d72'),
            'prior-pc.json':('failure','e0fe2aea7cc91829912be2c833ca81f5f9407a5e'),
            'vlab.json':('success','ac6b03819e47e7167ba77b2e3a5846f515a88d72'),
            'native.json':('failure','ac6b03819e47e7167ba77b2e3a5846f515a88d72'),
            'controller.json':('success',None),
            'prerequisite.json':('success',None),
          }
          for name,(conclusion,head) in expected.items():
            data=load(name)
            assert data.get('status')=='completed' and data.get('conclusion')==conclusion, (name,data.get('conclusion'))
            if head: assert data.get('head_sha')==head, (name,data.get('head_sha'))
          native_jobs=load('native-jobs.json')
          native=[j for j in native_jobs.get('jobs',[]) if j.get('name')=='Resume verified native growth']
          assert native and native[0].get('conclusion')=='failure'
          nsteps={s.get('name'):s.get('conclusion') for s in native[0].get('steps',[])}
          assert nsteps.get('Verify native self-build contracts')=='failure'
          print('GENERATION_LADDER_V125_SOURCE_AND_EVIDENCE_OK')
          PY

          echo "file=$projection" >> "$GITHUB_OUTPUT"
          echo "blob=$blob" >> "$GITHUB_OUTPUT"
          echo "canonical_commit=$canonical_commit" >> "$GITHUB_OUTPUT"
          echo "projection_commit=$projection_commit" >> "$GITHUB_OUTPUT"
          echo "projection_main_commit=$projection_main_commit" >> "$GITHUB_OUTPUT"
          echo "projection_ci_run=$projection_ci_run" >> "$GITHUB_OUTPUT"
          echo "active_trunk_commit=$active_trunk_commit" >> "$GITHUB_OUTPUT"
          echo "hopper_status_run=$hopper_status_run" >> "$GITHUB_OUTPUT"
          echo "hopper_status_job=$hopper_status_job" >> "$GITHUB_OUTPUT"
          echo "hopper_snapshot_commit=$hopper_snapshot_commit" >> "$GITHUB_OUTPUT"
          echo 'CLUSTERSITES_CANONICAL_PROJECTION_V125_OK'

      - name: Configure Bluehost SSH with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then exit 0; fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt * 5))
          done

      - name: Back up current Command Center
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry_capture() { local out="$1"; shift; local n=1 tmp; tmp="$(mktemp)"; while true; do if "$@" > "$tmp"; then mv "$tmp" "$out"; return 0; fi; [ "$n" -ge 5 ] && { rm -f "$tmp"; return 1; }; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry_capture "$RUNNER_TEMP/index.html" ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/generation-seed-ladder.js' ]; then cp -p '$remote/generation-seed-ladder.js' '$backup/generation-seed-ladder.js'; else touch '$backup/.missing-generation-seed-ladder.js'; fi; cat '$remote/index.html'"
          test -s "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject expandable generation ladder component
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./generation-seed-ladder\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          tag='<script src="./generation-seed-ladder.js?v=125"></script>'
          for pattern in (r'<script src="\./seed-lifecycle\.js(?:\?v=[^"]+)?"></script>',r'<script src="\./recovery-guardian\.js(?:\?v=[^"]+)?"></script>',r'</body>'):
              m=re.search(pattern,text)
              if m:
                  text=text[:m.start()]+tag+'\n'+text[m.start():]
                  break
          else:
              raise SystemExit('dashboard missing generation ladder injection point')
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './generation-seed-ladder.js?v=125' "$RUNNER_TEMP/index.html"

      - name: Publish with bounded retries
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 "$RUNNER_TEMP/index.html" "${{ steps.source.outputs.file }}" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mv '$remote/generation-seed-ladder-projection.js' '$remote/generation-seed-ladder.js'; chmod 644 '$remote/index.html' '$remote/generation-seed-ladder.js'"

      - name: Verify live Command Center
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$RUNNER_TEMP/live-index.html"; js="$RUNNER_TEMP/live-generation-seed-ladder.js"
          final_url="$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/generation-seed-ladder.js?rev=125' -o "$js"
          grep -Fq './generation-seed-ladder.js?v=125' "$page"
          cmp -s "$js" "${{ steps.source.outputs.file }}"
          node --check "$js"
          for token in \
            'AURUM_GENERATION_SEED_LADDER_V1_25_CANONICAL' \
            "componentRevision:'1.25'" \
            'hopperStatusRunnerExecutionRecovered:true' \
            'hopperStatusCurrentRunnerAssigned:true' \
            'hopperStatusCurrentRunnerId:23' \
            "hopperStatusCurrentBlocker:'no-valid-endpoint-candidate'" \
            'hopperStatusEndpoint:null' \
            'hopperStatusSourceKind:null' \
            'hopperStatusHttpStatus:null' \
            'hopperStatusReachable:false' \
            'hopperStatusReport:null' \
            'hopperStatusAssignmentBlockerPersistent:false' \
            'hopperStatusNoChurnUntilMaterialChange:true' \
            'humanActionInference:false' \
            'majorBoxAdded:false' \
            'seedLifecycleRemainsExpandable:true' \
            'Frontiers Advancing:' \
            'Needs Work → Aurum/System:' \
            'Your Actions:'; do
            grep -Fq "$token" "$js"
          done
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back on verification failure
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; while true; do "$@" && return 0; [ "$n" -ge 5 ] && return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'; backup=".aurum-dashboard-backups/generation-seed-ladder-$GITHUB_RUN_ID"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/generation-seed-ladder.js' ]; then cp -p '$backup/generation-seed-ladder.js' '$remote/generation-seed-ladder.js'; elif [ -f '$backup/.missing-generation-seed-ladder.js' ]; then rm -f '$remote/generation-seed-ladder.js'; fi"

      - name: Record verified live receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-generation-seed-ladder-live.json <<EOF_RECEIPT
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/generation-seed-ladder-v1.js",
            "canonical_component_commit": "${{ steps.source.outputs.canonical_commit }}",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx/generation-seed-ladder-v1.js",
            "deployment_carrier": "FormatX66/wetbeard-site",
            "component_revision": "1.25",
            "approved_blob": "${{ steps.source.outputs.blob }}",
            "boxbrain_projection_commit": "${{ steps.source.outputs.projection_commit }}",
            "boxbrain_projection_main_commit": "${{ steps.source.outputs.projection_main_commit }}",
            "boxbrain_ci_run": ${{ steps.source.outputs.projection_ci_run }},
            "boxbrain_ci_proven": true,
            "cluster_canonical_commit_pinned": true,
            "active_trunk_commit": "${{ steps.source.outputs.active_trunk_commit }}",
            "legacy_autoboot_integrated_into_active_trunk": true,
            "legacy_autoboot_physical_hopper_proof": false,
            "native_run": 33687947059,
            "native_run_passed": false,
            "native_failure_step": "Verify native self-build contracts",
            "native_external_evidence_reason": "gui-live-trial-evidence-expired",
            "continuous_controller_run": 33703121424,
            "continuous_native_dispatch": false,
            "continuous_lab_dispatch": false,
            "physical_prerequisite_watch_run": 33703828433,
            "physical_prerequisite_publish": "skipped-unchanged",
            "guarded_hopper_install_implemented": true,
            "guarded_install_physical_execution_proven": false,
            "guarded_install_physical_verification_proven": false,
            "guarded_install_human_approval_current": false,
            "hopper_status_run": ${{ steps.source.outputs.hopper_status_run }},
            "hopper_status_job": ${{ steps.source.outputs.hopper_status_job }},
            "hopper_status_snapshot_commit": "${{ steps.source.outputs.hopper_snapshot_commit }}",
            "hopper_status_runner_execution_recovered": true,
            "hopper_status_runner_assigned": true,
            "hopper_status_runner_id": 23,
            "hopper_status_runner_name": "AURUM-HOPPER-STATUS-WSL",
            "hopper_status_runner_host": "LAPTOP-EBD8CG8P",
            "hopper_status_assignment_blocker_persistent": false,
            "hopper_status_current_blocker": "no-valid-endpoint-candidate",
            "hopper_status_endpoint": null,
            "hopper_status_source_kind": null,
            "hopper_status_http_status": null,
            "hopper_status_reachable": false,
            "hopper_status_report": null,
            "hopper_status_no_churn_until_material_change": true,
            "hopper_status_power_state_inferred": false,
            "hopper_status_network_state_inferred": false,
            "hopper_status_runtime_state_inferred": false,
            "hopper_status_service_state_inferred": false,
            "human_action_inference": false,
            "major_box_added": false,
            "seed_lifecycle_remains_expandable": true,
            "frontiers_advancing_visible": true,
            "needs_work_system_owned": true,
            "needs_work_owner": "aurum-system",
            "backup_before_publish": true,
            "rollback_on_verification_failure": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF_RECEIPT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-generation-seed-ladder-live.json
          git commit -m 'Record Aurum generation seed ladder v1.25 live [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
