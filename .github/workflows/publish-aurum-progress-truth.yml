name: Publish Aurum Progress Truth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-progress-truth.yml'
  workflow_run:
    workflows:
      - Publish ClusterSites Aurum Dashboard
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-progress-truth-production
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Fetch validated public projection
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            'https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/progress-truth-v1.js' \
            -o "$RUNNER_TEMP/progress-truth.js"
          test -s "$RUNNER_TEMP/progress-truth.js"
          grep -Fq 'AURUM_PROGRESS_TRUTH_V1_CANONICAL' "$RUNNER_TEMP/progress-truth.js"
          grep -Fq 'Stable idempotent confirmations remain healthy proof but are not counted as frontier movement.' "$RUNNER_TEMP/progress-truth.js"
          grep -Fq 'verified stable · no new frontier movement' "$RUNNER_TEMP/progress-truth.js"

      - name: Configure existing Bluehost SSH carrier
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"
          test -n "$BLUEHOST_USERNAME"
          test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          for attempt in 1 2 3 4; do
            if ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'Could not establish Bluehost host key after bounded retries.' >&2
          exit 1

      - name: Back up, inject, and publish progress truth
        id: publish
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/progress-truth-$GITHUB_RUN_ID"
          key="$HOME/.ssh/bluehost_deploy"
          ssh_retry() {
            local n=0
            until ssh -o ConnectTimeout=12 -o ServerAliveInterval=10 -i "$key" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" "$@"; do
              n=$((n+1)); [ "$n" -ge 4 ] && return 1; sleep $((n*4))
            done
          }
          scp_retry() {
            local n=0
            until scp -o ConnectTimeout=12 -i "$key" -P 22 "$@"; do
              n=$((n+1)); [ "$n" -ge 4 ] && return 1; sleep $((n*4))
            done
          }
          ssh_retry "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/progress-truth.js' ]; then cp -p '$remote/progress-truth.js' '$backup/progress-truth.js'; else touch '$backup/.missing-progress-truth.js'; fi"
          scp_retry "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/index.html" "$RUNNER_TEMP/index.html"
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          text=p.read_text(encoding='utf-8')
          tag='<script src="./progress-truth.js?v=1"></script>'
          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('dashboard has no body close')
              text=text.replace('</body>',tag+'\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './progress-truth.js?v=1' "$RUNNER_TEMP/index.html"
          scp_retry "$RUNNER_TEMP/index.html" "$RUNNER_TEMP/progress-truth.js" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          ssh_retry "chmod 644 '$remote/index.html' '$remote/progress-truth.js'"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Verify live semantic-progress surface
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"
          component="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' \
            'https://arkmatx.com/aurum/dashboard/progress-truth.js?rev=1' -o "$component"
          grep -Fq './progress-truth.js?v=1' "$page"
          grep -Fq 'AURUM_PROGRESS_TRUTH_V1_CANONICAL' "$component"
          grep -Fq 'Stable idempotent confirmations remain healthy proof but are not counted as frontier movement.' "$component"
          grep -Fq 'verified stable · no new frontier movement' "$component"
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back if verification fails
        if: ${{ failure() && steps.publish.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/progress-truth-$GITHUB_RUN_ID"
          key="$HOME/.ssh/bluehost_deploy"
          for attempt in 1 2 3 4; do
            if ssh -o ConnectTimeout=12 -i "$key" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
              "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/progress-truth.js' ]; then cp -p '$backup/progress-truth.js' '$remote/progress-truth.js'; elif [ -f '$backup/.missing-progress-truth.js' ]; then rm -f '$remote/progress-truth.js'; fi"; then
              exit 0
            fi
            sleep $((attempt*4))
          done
          exit 1

      - name: Record verified semantic-progress receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-progress-truth-live.json <<EOF
          {
            "site": "aurum-command-center-progress-truth",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/progress-truth-v1.js",
            "public_projection_repo": "FormatX66/BoxBrain",
            "stable_runtime_asset": "progress-truth.js",
            "stable_proof_is_healthy": true,
            "stable_proof_is_frontier_movement": false,
            "stable_proof_is_needs_work": false,
            "stable_proof_is_human_action": false,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-progress-truth-live.json
          git commit -m 'Record Aurum semantic progress truth live [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
