name: Publish Aurum Chat Process Tree

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-chat-process-tree.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurum-chat-process-tree-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Fetch exact approved ClusterSites projection
        id: source
        shell: bash
        run: |
          set -euo pipefail
          src='https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/chat-process-tree-v1.js'
          out="$RUNNER_TEMP/chat-process-tree-v1.js"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 "$src" -o "$out"
          test -s "$out"
          node --check "$out"
          require_marker() { grep -Fq "$1" "$out" || { echo "Missing approved Chat Process Tree marker: $1" >&2; exit 1; }; }
          require_marker 'AURUM_CHAT_PROCESS_TREE_V1_CANONICAL'
          require_marker 'Canonical website owner: FormatX66/ClusterSites.'
          require_marker 'Frontiers Advancing:'
          require_marker 'Needs Work → Aurum/System:'
          require_marker 'Your Actions:'
          require_marker "schema:'aurum-command-center-chat-process-tree-v1.0'"
          require_marker "componentRevision:'1.4'"
          require_marker 'farmerActuatorEndToEndDispatchProven:farmerE2E'
          require_marker 'farmerDispatchReceiptPresent:farmerE2E'
          require_marker 'farmerZeroUnresolvedWork:farmerE2E&&farmerProof.zeroUnresolved'
          require_marker 'farmerCompletionRequiresExactLkg:true'
          require_marker 'farmerActuatorGrantsArbitraryExecutionAuthority:false'
          require_marker 'farmerActuatorGrantsDestructiveAuthority:false'
          require_marker 'farmerActuatorGrantsPhysicalAuthority:false'
          require_marker 'farmerActuatorGrantsTrustBroadeningAuthority:false'
          require_marker 'farmerActuatorGrantsLkgMutation:false'
          require_marker 'farmerRuntimeHealthy:'
          require_marker 'treeResolvesPhysicalBoundaries:false'
          require_marker "needsWorkOwner:'aurum-system'"
          require_marker 'farmerActuatorCreatesHumanAction:false'
          require_marker 'humanActionInference:false'
          require_marker "fixedRepository:'FormatX66/Chat-to-Git-Pipeline'"
          require_marker "fixedEventType:'aurum_farmer_event'"
          require_marker "tool:'dispatch_farmer_objective'"
          actual_blob="$(git hash-object "$out")"
          expected_blob='46ab4d93ac0e2439ac24bfe40eb27b936769160d'
          test "$actual_blob" = "$expected_blob" || { echo "Refusing unapproved projection: expected $expected_blob got $actual_blob" >&2; exit 1; }
          echo "blob=$actual_blob" >> "$GITHUB_OUTPUT"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Configure existing Bluehost SSH carrier with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"; test -n "$BLUEHOST_USERNAME"; test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          : > "$HOME/.ssh/known_hosts"
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null && exit 0
            test "$attempt" -lt 5 || { echo 'Bluehost SSH keyscan unavailable after bounded attempts' >&2; exit 1; }
            sleep $((attempt * 5))
          done

      - name: Back up current live surface before publish
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/chat-process-tree-$GITHUB_RUN_ID"
          ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/chat-process-tree.js' ]; then cp -p '$remote/chat-process-tree.js' '$backup/chat-process-tree.js'; else touch '$backup/.missing-chat-process-tree.js'; fi; cat '$remote/index.html'" > "$RUNNER_TEMP/index.html"
          test -s "$RUNNER_TEMP/index.html"
          grep -Fq 'Progress is proof, not activity.' "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Preserve expandable surface and inject v1.4 cache revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re, sys
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./chat-process-tree\.js(?:\?v=[^"]+)?"></script>\s*','',text)
          if '</body>' not in text: raise SystemExit('dashboard missing body close')
          text=text.replace('</body>','<script src="./chat-process-tree.js?v=5"></script>\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './chat-process-tree.js?v=5' "$RUNNER_TEMP/index.html"

      - name: Publish approved component with bounded retry
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          retry() { local n=1; until "$@"; do test "$n" -lt 5 || return 1; sleep $((n * 5)); n=$((n+1)); done; }
          remote='public_html/arkmatx/aurum/dashboard'
          stage="$RUNNER_TEMP/publish"; mkdir -p "$stage"
          cp "$RUNNER_TEMP/index.html" "$stage/index.html"
          cp "${{ steps.source.outputs.file }}" "$stage/chat-process-tree.js"
          retry scp -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -P 22 "$stage/index.html" "$stage/chat-process-tree.js" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/"
          retry ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" "chmod 644 '$remote/index.html' '$remote/chat-process-tree.js'"

      - name: Verify live v1.4 surface byte-for-byte
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"; component="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/chat-process-tree.js?rev=5' -o "$component"
          grep -Fq 'Progress is proof, not activity.' "$page"
          grep -Fq './chat-process-tree.js?v=5' "$page"
          grep -Fq "componentRevision:'1.4'" "$component"
          grep -Fq 'Frontiers Advancing:' "$component"
          grep -Fq 'Needs Work → Aurum/System:' "$component"
          grep -Fq 'Your Actions:' "$component"
          grep -Fq 'farmerActuatorEndToEndDispatchProven:farmerE2E' "$component"
          grep -Fq 'farmerDispatchReceiptPresent:farmerE2E' "$component"
          grep -Fq 'farmerZeroUnresolvedWork:farmerE2E&&farmerProof.zeroUnresolved' "$component"
          grep -Fq 'farmerCompletionRequiresExactLkg:true' "$component"
          grep -Fq 'farmerActuatorGrantsDestructiveAuthority:false' "$component"
          grep -Fq 'humanActionInference:false' "$component"
          live_blob="$(git hash-object "$component")"
          test "$live_blob" = '${{ steps.source.outputs.blob }}' || { echo 'Live component does not match approved source blob' >&2; exit 1; }
          echo "url=$final_url" >> "$GITHUB_OUTPUT"
          echo "blob=$live_blob" >> "$GITHUB_OUTPUT"

      - name: Roll back if any post-backup step fails
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/chat-process-tree-$GITHUB_RUN_ID"
          ssh -o ConnectTimeout=12 -o ConnectionAttempts=1 -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/chat-process-tree.js' ]; then cp -p '$backup/chat-process-tree.js' '$remote/chat-process-tree.js'; elif [ -f '$backup/.missing-chat-process-tree.js' ]; then rm -f '$remote/chat-process-tree.js'; fi"

      - name: Record verified v1.4 live receipt
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-chat-process-tree-live.json <<EOF
          {
            "site": "aurum-command-center",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/chat-process-tree-v1.js",
            "public_projection": "FormatX66/BoxBrain:Web/Aurum-Arkmatx/chat-process-tree-v1.js",
            "deployment_carrier": "FormatX66/wetbeard-site",
            "chat_process_tree_revision": "1.4",
            "approved_component_blob": "${{ steps.source.outputs.blob }}",
            "live_component_blob": "${{ steps.verify.outputs.blob }}",
            "expandable": true,
            "frontiers_advancing_visible": true,
            "needs_work_system_owned": true,
            "farmer_actuator_end_to_end_dispatch_evidence_gated": true,
            "farmer_completion_requires_terminal_verified_completion": true,
            "farmer_completion_requires_zero_unresolved_work": true,
            "farmer_completion_requires_exact_lkg": true,
            "farmer_actuator_arbitrary_execution_authority": false,
            "farmer_actuator_destructive_authority": false,
            "farmer_actuator_physical_authority": false,
            "farmer_actuator_lkg_mutation": false,
            "human_action_inference": false,
            "backup_before_publish": true,
            "rollback_on_verify_failure": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-chat-process-tree-live.json
          git commit -m 'Record Aurum Chat Process Tree v1.4 live [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
