name: Publish ClusterSites Aurum Dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-clustersites-aurum-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clustersites-aurum-dashboard-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish arkmatx.com/aurum/dashboard
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out deployment carrier
        uses: actions/checkout@v4

      - name: Prepare public Aurum dashboard projection
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_url='https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/dashboard.html'
          source_api='https://api.github.com/repos/FormatX66/BoxBrain/commits/main'
          target="$RUNNER_TEMP/aurum-dashboard.html"
          curl --fail-with-body --silent --show-error --location "$source_url" -o "$target"
          source_json="$(curl --fail-with-body --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' "$source_api")"
          source_sha="$(printf '%s' "$source_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')"
          python3 - "$target" "$source_sha" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          sha = sys.argv[2]
          text = path.read_text(encoding='utf-8')
          text = text.replace('<head>', f'<head>\n<!-- DEPLOYMENT PROJECTION: canonical website ownership remains FormatX66/ClusterSites; public dashboard projection source FormatX66/BoxBrain@{sha} -->', 1)
          text = text.replace('href="./">Aurum portal', 'href="/aurum/">Aurum portal', 1)
          text, count = re.subn(
              r"function rel\(path\)\{return directoryBase\(\)\+path\.replace\(/\^\\//,''\)\}",
              "function rel(path){const p=path.replace(/^\\//,'');return p==='status'?'/aurum/index.php':`/aurum/index.php/${p}`}",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not patch Aurum edge route helper in dashboard projection')
          path.write_text(text, encoding='utf-8')
          PY
          test -s "$target"
          grep -Fq 'Aurum Command Center' "$target"
          grep -Fq '/aurum/index.php' "$target"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "file=$target" >> "$GITHUB_OUTPUT"

      - name: Configure existing Bluehost SSH carrier
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"
          test -n "$BLUEHOST_USERNAME"
          test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          ssh-keyscan -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Back up current dashboard target
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$remote' '$backup'; if [ -f '$remote/index.html' ]; then cp -p '$remote/index.html' '$backup/index.html'; else touch '$backup/.missing-index.html'; fi"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Publish dashboard projection
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard/index.html'
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 \
            "${{ steps.source.outputs.file }}" \
            "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "chmod 644 '$remote'"

      - name: Verify public dashboard and Aurum edge
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --header 'Cache-Control: no-cache' \
            --output "$body" \
            --write-out '%{url_effective}' \
            'https://arkmatx.com/aurum/dashboard')"
          grep -Fq 'Aurum Command Center' "$body"
          grep -Fq '/aurum/index.php' "$body"
          status="$(curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            'https://arkmatx.com/aurum/index.php')"
          printf '%s' "$status" | grep -Fq 'Aurum-Arkmatx'
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back dashboard if verification fails
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard/index.html'
          backup=".aurum-dashboard-backups/$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; if [ -f '$backup/index.html' ]; then cp -p '$backup/index.html' '$remote'; elif [ -f '$backup/.missing-index.html' ]; then rm -f '$remote'; fi"

      - name: Record verified deployment receipt
        if: ${{ success() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-dashboard-live.json <<EOF
          {
            "site": "arkmatx-aurum-dashboard",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "public_projection_repo": "FormatX66/BoxBrain",
            "projection_sha": "${{ steps.source.outputs.sha }}",
            "credential_carrier_repo": "FormatX66/wetbeard-site",
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-dashboard-live.json
          git commit -m 'Record Aurum dashboard live deployment [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
