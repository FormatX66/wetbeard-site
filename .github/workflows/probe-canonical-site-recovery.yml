name: Probe Canonical Site Recovery Copies

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/probe-canonical-site-recovery.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Bluehost SSH
        shell: bash
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"
          test -n "$BLUEHOST_USERNAME"
          test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Inventory Xander recovery variants
        shell: bash
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        run: |
          set -euo pipefail
          ssh "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'bash -s' <<'REMOTE'
          set -eu
          root="$HOME/public_html/xanderzombie"
          echo '=== XANDER INDEX CANDIDATES ==='
          find "$HOME" -maxdepth 8 -type f -path '*xander*' -name 'index.html' 2>/dev/null | sort | while read -r f; do
            rel="${f#$HOME/}"
            size="$(wc -c < "$f" | tr -d ' ')"
            hash="$(sha256sum "$f" | awk '{print $1}')"
            printf '%s bytes=%s sha=%s ' "$rel" "$size" "$hash"
            if grep -Fq 'scene-bg' "$f"; then printf 'scene-bg '; fi
            if grep -Fq 'NEXT PANEL' "$f"; then printf 'page-reader '; fi
            if grep -Fq 'episode-art' "$f"; then printf 'episode-art '; fi
            if grep -Fq 'scenes/cemetery.svg' "$f"; then printf 'svg-scenes '; fi
            if grep -Eqi '\.(png|jpg|jpeg|webp)' "$f"; then printf 'raster-ref '; fi
            printf '\n'
          done
          echo '=== XANDER PREVIEW TREE ==='
          find "$root/preview" -maxdepth 3 -type f 2>/dev/null | sed "s#^$HOME/##" | sort | head -n 120 || true
          echo '=== XANDER OTHER RECOVERY DIRS ==='
          find "$HOME" -maxdepth 7 -type d \( -iname '*xander*repair*' -o -iname '*xander*backup*' -o -iname '*xander*preview*' \) -print 2>/dev/null | sed "s#^$HOME/##" | sort | head -n 80 || true
          echo '=== LIVE INDEX HEAD ==='
          sed -n '1,6p' "$root/index.html"
          REMOTE
