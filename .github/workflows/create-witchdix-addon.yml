name: Create Witchdix Addon Domain

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-witchdix-addon.yml

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.BLUEHOST_HOST }}" >> ~/.ssh/known_hosts
      - name: Create or verify Witchdix addon domain
        id: create
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p deployments
          USERNAME="${{ secrets.BLUEHOST_USERNAME }}"
          HOST="${{ secrets.BLUEHOST_HOST }}"
          ssh "$USERNAME@$HOST" "mkdir -p \"\$HOME/public_html/witchdix\"" >/tmp/witch-mkdir.out 2>/tmp/witch-mkdir.err
          BEFORE=$(ssh "$USERNAME@$HOST" "/usr/local/cpanel/bin/uapi --output=json DomainInfo single_domain_data domain='witchdix.com'" 2>/tmp/witch-before.err)
          HAS=$(printf '%s' "$BEFORE" | python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result',{}); x=r.get('data') or {}; print(1 if r.get('status')==1 and (x.get('documentroot') or x.get('document_root')) else 0)" 2>/dev/null || echo 0)
          CREATED=0
          CREATE_CODE=0
          if [ "$HAS" != "1" ]; then
            ssh "$USERNAME@$HOST" "/usr/local/cpanel/bin/cpapi2 --user='$USERNAME' --output=json AddonDomain addaddondomain dir=public_html%2Fwitchdix newdomain=witchdix.com subdomain=witchdix ftp_is_optional=1" > /tmp/witch-create.json 2>/tmp/witch-create.err
            CREATE_CODE=$?
            CREATED=1
          fi
          AFTER=$(ssh "$USERNAME@$HOST" "/usr/local/cpanel/bin/uapi --output=json DomainInfo single_domain_data domain='witchdix.com'" 2>/tmp/witch-after.err)
          printf '%s' "$AFTER" > /tmp/witch-after.json
          CREATED="$CREATED" CREATE_CODE="$CREATE_CODE" python3 - <<'PY'
          import json, os
          from pathlib import Path
          out={'domain':'witchdix.com','status':'unresolved','remotePath':None,'method':'cpanel-addon-domain','created_now':os.environ.get('CREATED')=='1','create_exit_code':int(os.environ.get('CREATE_CODE','0'))}
          try:
              d=json.loads(Path('/tmp/witch-after.json').read_text())
              r=d.get('result',{}); info=r.get('data') or {}
              root=info.get('documentroot') or info.get('document_root')
              if r.get('status') == 1 and root:
                  safe='public_html'+root.split('/public_html',1)[1] if '/public_html' in root else root.rstrip('/').split('/')[-1]
                  if safe and '..' not in safe and not safe.startswith('/'):
                      out.update(status='verified',remotePath=safe)
          except Exception:
              pass
          if out['status'] != 'verified':
              # Keep only a short cPanel reason; never commit account paths or SSH output.
              reason=''
              try:
                  c=json.loads(Path('/tmp/witch-create.json').read_text())
                  cr=c.get('cpanelresult',{})
                  ev=cr.get('event') or {}
                  reason=str(ev.get('reason') or cr.get('error') or '')[:240]
              except Exception:
                  pass
              out['reason']=reason or 'cPanel did not verify the domain after the create attempt'
          Path('deployments/witchdix-host.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          test "$(jq -r '.status' deployments/witchdix-host.json)" = verified
      - name: Commit host result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f deployments/witchdix-host.json || echo '{"domain":"witchdix.com","status":"probe-failed"}' > deployments/witchdix-host.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/witchdix-host.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Witchdix host [skip ci]"
          git push origin HEAD:main
