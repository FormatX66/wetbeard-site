name: Publish Aurum Operator Commands

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-aurum-operator-commands.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish ClusterSites Aurum Dashboard
    types: [completed]

permissions:
  contents: write

concurrency:
  group: aurum-operator-commands-production
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Publish operator command registry
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Fetch verified public projection
        id: source
        shell: bash
        run: |
          set -euo pipefail
          url='https://raw.githubusercontent.com/FormatX66/BoxBrain/main/Web/Aurum-Arkmatx/operator-commands-v1.js'
          out="$RUNNER_TEMP/operator-commands.js"
          curl --fail-with-body --silent --show-error --location "$url" -o "$out"
          test -s "$out"
          grep -Fq 'AURUM_OPERATOR_COMMANDS_V1_CANONICAL' "$out"
          grep -Fq 'Proposed commands are never presented as runnable' "$out"
          grep -Fq 'Parses the live registry by table headers' "$out"
          grep -Fq 'Hopper-proven' "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - name: Configure existing Bluehost SSH carrier
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"
          test -n "$BLUEHOST_USERNAME"
          test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          ssh-keyscan -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Back up current command center
        id: backup
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/operator-commands-$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; mkdir -p '$backup'; cp -p '$remote/index.html' '$backup/index.html'; if [ -f '$remote/operator-commands.js' ]; then cp -p '$remote/operator-commands.js' '$backup/operator-commands.js'; else touch '$backup/.missing-operator-commands.js'; fi"
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/index.html" "$RUNNER_TEMP/index.html"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Inject expandable operator command surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/index.html" <<'PY'
          from pathlib import Path
          import re
          import sys
          p=Path(sys.argv[1])
          text=p.read_text(encoding='utf-8')
          text=re.sub(r'<script src="\./operator-commands\.js\?v=\d+"></script>\s*', '', text)
          tag='<script src="./operator-commands.js?v=2"></script>'
          if '</body>' not in text:
              raise SystemExit('dashboard body close missing')
          text=text.replace('</body>',tag+'\n</body>',1)
          p.write_text(text,encoding='utf-8')
          PY
          grep -Fq './operator-commands.js?v=2' "$RUNNER_TEMP/index.html"

      - name: Publish operator command surface
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 "$RUNNER_TEMP/index.html" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/index.html"
          scp -i "$HOME/.ssh/bluehost_deploy" -P 22 "${{ steps.source.outputs.file }}" "$BLUEHOST_USERNAME@$BLUEHOST_HOST:$remote/operator-commands.js"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" "chmod 644 '$remote/index.html' '$remote/operator-commands.js'"

      - name: Verify live operator commands and canonical registry
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          page="$(mktemp)"
          asset="$(mktemp)"
          registry="$(mktemp)"
          final_url="$(curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' -o "$page" -w '%{url_effective}' 'https://arkmatx.com/aurum/dashboard/')"
          curl --fail-with-body --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 2 -H 'Cache-Control: no-cache' 'https://arkmatx.com/aurum/dashboard/operator-commands.js?rev=2' -o "$asset"
          curl --fail-with-body --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 'https://raw.githubusercontent.com/FormatX66/BoxBrain/main/docs/AURUM_COMMANDS.md' -o "$registry"
          grep -Fq './operator-commands.js?v=2' "$page"
          grep -Fq 'AURUM_OPERATOR_COMMANDS_V1_CANONICAL' "$asset"
          grep -Fq 'Parses the live registry by table headers' "$asset"
          grep -Fq 'Hopper-proven' "$asset"
          grep -Fq '| `status` | Physical |' "$registry"
          grep -Fq '| `input-status` | Implemented |' "$registry"
          grep -Fq '| `RUN` | Approval-gated fixed read-only diagnostics | Documented |' "$registry"
          echo "url=$final_url" >> "$GITHUB_OUTPUT"

      - name: Roll back if verification fails
        if: ${{ failure() && steps.backup.outputs.ready == 'true' }}
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          remote='public_html/arkmatx/aurum/dashboard'
          backup=".aurum-dashboard-backups/operator-commands-$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            "set -eu; cp -p '$backup/index.html' '$remote/index.html'; if [ -f '$backup/operator-commands.js' ]; then cp -p '$backup/operator-commands.js' '$remote/operator-commands.js'; elif [ -f '$backup/.missing-operator-commands.js' ]; then rm -f '$remote/operator-commands.js'; fi"

      - name: Record verified operator-command receipt
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          mkdir -p deployments
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > deployments/aurum-operator-commands-live.json <<EOF
          {
            "site": "arkmatx-aurum-dashboard",
            "url": "${{ steps.verify.outputs.url }}",
            "canonical_website_repo": "FormatX66/ClusterSites",
            "canonical_component": "services/aurum-arkmatx/operator-commands-v1.js",
            "runtime_projection_repo": "FormatX66/BoxBrain",
            "runtime_projection_component": "Web/Aurum-Arkmatx/operator-commands-v1.js",
            "credential_carrier_repo": "FormatX66/wetbeard-site",
            "operator_command_registry": "FormatX66/BoxBrain/docs/AURUM_COMMANDS.md",
            "header_aware_registry_parser": true,
            "hopper_physical_command_maturity": true,
            "proposed_commands_are_not_runnable": true,
            "expandable": true,
            "status": "verified-live",
            "verified_at_utc": "$verified_at"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deployments/aurum-operator-commands-live.json
          git commit -m 'Record Aurum operator commands live deployment [skip ci]' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
