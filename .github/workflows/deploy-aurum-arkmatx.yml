name: Deploy Aurum Arkmatx

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-aurum-arkmatx.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aurum-arkmatx-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish Aurum-Arkmatx
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out carrier repo
        uses: actions/checkout@v4

      - name: Fetch Aurum controller and portal from BoxBrain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/FormatX66/BoxBrain.git "$RUNNER_TEMP/BoxBrain"
          git -C "$RUNNER_TEMP/BoxBrain" sparse-checkout set Web/Aurum-Arkmatx
          php -l "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/index.php"
          test -s "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/portal.html"
          test -s "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/bootstrap.sh"
          test -s "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx/bootstrap.ps1"

      - name: Configure existing Bluehost SSH carrier
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
          BLUEHOST_SSH_PRIVATE_KEY: ${{ secrets.BLUEHOST_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BLUEHOST_HOST"
          test -n "$BLUEHOST_USERNAME"
          test -n "$BLUEHOST_SSH_PRIVATE_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$BLUEHOST_SSH_PRIVATE_KEY" > "$HOME/.ssh/bluehost_deploy"
          chmod 600 "$HOME/.ssh/bluehost_deploy"
          ssh-keyscan -p 22 -H "$BLUEHOST_HOST" >> "$HOME/.ssh/known_hosts"

      - name: Ensure aurum.arkmatx.com exists in cPanel
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" 'set -e
            mkdir -p public_html/arkmatx/aurum/state/inbox public_html/arkmatx/aurum/state/outbox public_html/arkmatx/aurum/state/nodes
            current="$(/usr/local/cpanel/bin/uapi --output=json DomainInfo single_domain_data domain=aurum.arkmatx.com 2>/dev/null || true)"
            if printf "%s" "$current" | grep -Eq "\"status\"[[:space:]]*:[[:space:]]*1"; then
              echo "aurum.arkmatx.com already registered"
            else
              created="$(/usr/local/cpanel/bin/uapi --output=json SubDomain addsubdomain domain=aurum rootdomain=arkmatx.com dir=public_html/arkmatx/aurum)"
              printf "%s\n" "$created"
              printf "%s" "$created" | grep -Eq "\"status\"[[:space:]]*:[[:space:]]*1"
            fi
            chmod 755 public_html/arkmatx/aurum
            chmod 700 public_html/arkmatx/aurum/state public_html/arkmatx/aurum/state/inbox public_html/arkmatx/aurum/state/outbox public_html/arkmatx/aurum/state/nodes
            rm -f public_html/arkmatx/aurum/.htaccess
            php -v | head -n 2 || true'

      - name: Deploy Aurum controller portal and bootstraps
        env:
          BLUEHOST_HOST: ${{ secrets.BLUEHOST_HOST }}
          BLUEHOST_USERNAME: ${{ secrets.BLUEHOST_USERNAME }}
        shell: bash
        run: |
          set -euo pipefail
          tar -C "$RUNNER_TEMP/BoxBrain/Web/Aurum-Arkmatx" -czf - index.php portal.html bootstrap.sh bootstrap.ps1 | \
          ssh -i "$HOME/.ssh/bluehost_deploy" -p 22 "$BLUEHOST_USERNAME@$BLUEHOST_HOST" \
            'set -e; tar -xzf - -C public_html/arkmatx/aurum; chmod 644 public_html/arkmatx/aurum/index.php public_html/arkmatx/aurum/portal.html public_html/arkmatx/aurum/bootstrap.sh public_html/arkmatx/aurum/bootstrap.ps1; php -l public_html/arkmatx/aurum/index.php'

      - name: Verify machine controller and outbound heartbeat
        shell: bash
        run: |
          set -euo pipefail
          api='https://arkmatx.com/aurum/index.php'
          body="$(mktemp)"
          curl --fail-with-body --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 \
            --header 'Cache-Control: no-cache' --output "$body" "$api"
          python3 - "$body" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          assert data.get('node') == 'Aurum-Arkmatx', data
          assert data.get('status') == 'active-edge-web-node', data
          assert data.get('schema') == 'aurum.uaf.v0', data
          assert 'node_enroll' in data.get('capabilities',[]), data
          assert 'node_heartbeat' in data.get('capabilities',[]), data
          PY
          now="$(date +%s)"
          cat > /tmp/aurum-enroll.json <<JSON
          {"schema":"aurum.uaf.v0","frame_id":"deploy-enroll-$now","origin":"Aurum-Deploy-Verifier","target":"Aurum-Arkmatx","intent":"node_enroll","state_delta":{"node_id":"aurum-deploy-verifier","name":"Aurum Deploy Verifier","os":"github-linux","arch":"x64","carrier":"https-outbound"},"provenance":{"node":"Aurum-Deploy-Verifier","created":$now},"verification":{"content_addressed":true,"reversible":true}}
          JSON
          curl --fail-with-body --silent --show-error -H 'Content-Type: application/json' --data-binary @/tmp/aurum-enroll.json "$api" > /tmp/aurum-enroll-response.json
          now="$(date +%s)"
          cat > /tmp/aurum-heartbeat.json <<JSON
          {"schema":"aurum.uaf.v0","frame_id":"deploy-heartbeat-$now","origin":"Aurum-Deploy-Verifier","target":"Aurum-Arkmatx","intent":"node_heartbeat","state_delta":{"node_id":"aurum-deploy-verifier","carrier":"https-outbound"},"provenance":{"node":"Aurum-Deploy-Verifier","created":$now},"verification":{"content_addressed":true,"reversible":true}}
          JSON
          curl --fail-with-body --silent --show-error -H 'Content-Type: application/json' --data-binary @/tmp/aurum-heartbeat.json "$api" > /tmp/aurum-heartbeat-response.json
          python3 - <<'PY'
          import json
          enroll=json.load(open('/tmp/aurum-enroll-response.json'))
          heartbeat=json.load(open('/tmp/aurum-heartbeat-response.json'))
          assert enroll.get('status')=='merged', enroll
          assert heartbeat.get('status')=='merged', heartbeat
          assert (heartbeat.get('receipt') or {}).get('state_delta',{}).get('intent')=='node_heartbeat', heartbeat
          PY

      - name: Verify aurum subdomain portal when DNS is ready
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 3 4 5 6; do
            code="$(curl --silent --show-error --location --output /tmp/aurum-portal.html --write-out '%{http_code}' --header 'Cache-Control: no-cache' 'https://aurum.arkmatx.com/' || true)"
            if [ "$code" = '200' ] && grep -q 'ArkmatX hive portal' /tmp/aurum-portal.html; then break; fi
            sleep 5
          done
          test "${code:-}" = '200'
          grep -q 'ArkmatX hive portal' /tmp/aurum-portal.html
          curl --fail-with-body --silent --show-error 'https://aurum.arkmatx.com/bootstrap.sh' | grep -q 'Aurum node enrolled'
          curl --fail-with-body --silent --show-error 'https://aurum.arkmatx.com/bootstrap.ps1' | grep -q 'Aurum node enrolled'
